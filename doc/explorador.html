<style>
/* Mismo sistema visual que el dossier: papel de ingenieria en claro,
   instrumento en oscuro. Esto no es un documento, es una herramienta: se
   escanea y se opera, asi que la jerarquia la lleva la informacion, no la
   tipografia. */
:root {
  --paper:#F1F3F2; --paper-2:#E7EAE9; --card:#FBFCFB;
  --ink:#141C1F; --ink-2:#56666C; --ink-3:#7E8D92;
  --rule:#D2D9D7; --rule-2:#BFC8C6;
  --signal:#B4560A; --signal-soft:#F5EBDF;
  --teal:#0E6560; --teal-soft:#E0EDEB;
  --ok:#17714A; --ok-soft:#E2EFE8;
  --warn:#A9660A;
  --code-bg:#F6F8F7;
  --f-disp:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --rail:282px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:#0F1417; --paper-2:#0A0E10; --card:#151C20;
    --ink:#E6EDEB; --ink-2:#9AA9AF; --ink-3:#71828A;
    --rule:#25323A; --rule-2:#33434B;
    --signal:#F0A050; --signal-soft:#2A1D10;
    --teal:#4FBDB2; --teal-soft:#0D2523;
    --ok:#4FBE86; --ok-soft:#10241B;
    --warn:#E0A03C;
    --code-bg:#111719;
  }
}
:root[data-theme="dark"] {
  --paper:#0F1417; --paper-2:#0A0E10; --card:#151C20;
  --ink:#E6EDEB; --ink-2:#9AA9AF; --ink-3:#71828A;
  --rule:#25323A; --rule-2:#33434B;
  --signal:#F0A050; --signal-soft:#2A1D10;
  --teal:#4FBDB2; --teal-soft:#0D2523;
  --ok:#4FBE86; --ok-soft:#10241B;
  --warn:#E0A03C;
  --code-bg:#111719;
}

* { box-sizing:border-box; }
body { background:var(--paper); color:var(--ink); font-family:var(--f-disp);
       font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased; }
:focus-visible { outline:2px solid var(--signal); outline-offset:2px; }

.app { display:grid; grid-template-columns:var(--rail) minmax(0,1fr); height:100vh; }

/* ---- rail ---------------------------------------------------------------- */
.rail { border-right:1px solid var(--rule); display:flex; flex-direction:column;
        min-height:0; background:var(--paper-2); }
.marca { padding:16px 18px 12px; border-bottom:1px solid var(--rule); }
.marca .fila-marca { display:flex; align-items:center; gap:9px; }
.marca .logo { width:22px; height:22px; flex:0 0 auto; border-radius:2px; }
.marca { --mark-cut:var(--paper-2); }
.marca b { font-size:.8rem; font-weight:800; letter-spacing:.1em; color:var(--ink); }
.marca span { font-family:var(--f-mono); font-size:.62rem; color:var(--ink-3);
              letter-spacing:.06em; display:block; margin-top:4px; }
.buscar { padding:10px 14px; border-bottom:1px solid var(--rule); }
.buscar input { width:100%; font-family:var(--f-mono); font-size:.72rem;
  padding:6px 9px; border:1px solid var(--rule-2); border-radius:2px;
  background:var(--card); color:var(--ink); }
.buscar input::placeholder { color:var(--ink-3); }
.arbol { overflow-y:auto; flex:1; padding:8px 0 24px; min-height:0; }
.grupo { font-family:var(--f-mono); font-size:.6rem; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); padding:14px 18px 5px;
  display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
.grupo em { font-style:normal; color:var(--rule-2); }
.fila { display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center;
  width:100%; text-align:left; background:none; border:0; cursor:pointer;
  font-family:var(--f-mono); font-size:.72rem; color:var(--ink-2);
  padding:4px 16px 4px 26px; border-left:2px solid transparent; }
.fila:hover { color:var(--ink); background:var(--card); }
.fila[aria-current="true"] { color:var(--ink); border-left-color:var(--signal);
  background:var(--card); font-weight:600; }
.fila .n { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.fila .b { font-size:.58rem; letter-spacing:.06em; padding:1px 5px; border-radius:2px;
  white-space:nowrap; border:1px solid currentColor; }
.b--ok { color:var(--ok); }
.b--teal { color:var(--teal); }
.b--warn { color:var(--warn); }

/* ---- visor --------------------------------------------------------------- */
.visor { overflow-y:auto; min-width:0; }
.cab { position:sticky; top:0; z-index:5; background:var(--paper);
  border-bottom:1px solid var(--rule); padding:14px clamp(18px,3vw,38px) 12px; }
.cab .ruta { font-family:var(--f-mono); font-size:.78rem; font-weight:600; }
.cab .ruta em { font-style:normal; color:var(--ink-3); font-weight:400; }
.cab .para { font-size:.84rem; color:var(--ink-2); margin-top:5px; max-width:80ch; }
.cab .meta { font-family:var(--f-mono); font-size:.62rem; color:var(--ink-3);
  letter-spacing:.06em; margin-top:6px; display:flex; gap:14px; flex-wrap:wrap; }
.cuerpo { padding:22px clamp(18px,3vw,38px) 90px; }

/* prosa de los .md */
.md { font-family:var(--f-body); font-size:16.5px; line-height:1.62; max-width:70ch; }
.md h1 { font-family:var(--f-disp); font-size:1.75rem; font-weight:700; letter-spacing:-.02em;
  margin:0 0 16px; text-wrap:balance; }
.md h2 { font-family:var(--f-disp); font-size:1.28rem; font-weight:700; letter-spacing:-.015em;
  margin:34px 0 10px; text-wrap:balance; }
.md h3 { font-family:var(--f-disp); font-size:1rem; font-weight:700; margin:26px 0 6px; }
.md p { margin:0 0 14px; }
.md ul, .md ol { margin:0 0 14px; padding-left:22px; }
.md li { margin-bottom:6px; }
.md strong { font-weight:600; }
.md a { color:var(--signal); }
.md hr { border:0; border-top:1px solid var(--rule); margin:30px 0; }
.md blockquote { border-left:3px solid var(--signal); background:var(--signal-soft);
  margin:20px 0; padding:12px 16px; }
.md blockquote p:last-child { margin:0; }
.md code { font-family:var(--f-mono); font-size:.85em; background:var(--code-bg);
  border:1px solid var(--rule); border-radius:2px; padding:.05em .32em; }
.md pre { background:var(--code-bg); border:1px solid var(--rule);
  border-left:3px solid var(--teal); border-radius:2px; padding:14px 16px;
  overflow-x:auto; margin:18px 0; max-width:none; }
.md pre code { background:none; border:0; padding:0; font-size:.78rem; line-height:1.6;
  color:var(--ink-2); }
.md table { border-collapse:collapse; width:100%; font-family:var(--f-disp);
  font-size:.82rem; }
.md .tw { overflow-x:auto; border:1px solid var(--rule); border-radius:2px; margin:18px 0;
  max-width:none; }
.md th, .md td { text-align:left; padding:8px 12px; border-bottom:1px solid var(--rule);
  vertical-align:top; }
.md thead th { font-family:var(--f-mono); font-size:.6rem; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3); background:var(--paper-2); white-space:nowrap; }
.md tbody tr:last-child td { border-bottom:0; }

/* codigo con numeros de linea */
.codigo { display:grid; grid-template-columns:auto minmax(0,1fr); font-family:var(--f-mono);
  font-size:12.5px; line-height:1.62; border:1px solid var(--rule); border-radius:2px;
  background:var(--code-bg); overflow-x:auto; }
.codigo .ln { text-align:right; padding:14px 10px 14px 14px; color:var(--ink-3);
  border-right:1px solid var(--rule); user-select:none; font-variant-numeric:tabular-nums;
  white-space:pre; background:var(--paper-2); }
.codigo pre { margin:0; padding:14px 16px; white-space:pre; }
.codigo code { font-family:inherit; }

/* Tema propio para highlight.js: su hoja de estilos no se puede cargar desde
   CDN (la CSP solo admite scripts), asi que los colores van aqui. */
.hljs-comment { color:var(--ink-3); font-style:italic; }
.hljs-keyword, .hljs-built_in { color:var(--signal); }
.hljs-string, .hljs-number { color:var(--teal); }
.hljs-title, .hljs-title\.function_, .hljs-attr, .hljs-attribute { color:var(--ink); font-weight:600; }
.hljs-type, .hljs-literal { color:var(--warn); }

/* resumen */
.resumen { max-width:78ch; }
.tarjetas { display:grid; grid-template-columns:repeat(auto-fit,minmax(158px,1fr));
  gap:1px; background:var(--rule); border:1px solid var(--rule); margin:20px 0; }
.tj { background:var(--card); padding:14px 16px; }
.tj .k { font-family:var(--f-mono); font-size:.58rem; letter-spacing:.11em;
  text-transform:uppercase; color:var(--ink-3); margin-bottom:6px; }
.tj .v { font-size:1.5rem; font-weight:800; letter-spacing:-.03em;
  font-variant-numeric:tabular-nums; line-height:1; }
.tj .d { font-family:var(--f-mono); font-size:.63rem; color:var(--ink-2); margin-top:5px; }
.tj .v.ok { color:var(--ok); }

.aviso { border-left:3px solid var(--signal); background:var(--signal-soft);
  padding:13px 16px; margin:20px 0; font-size:.88rem; max-width:76ch; }
.aviso b { display:block; font-family:var(--f-mono); font-size:.6rem; letter-spacing:.13em;
  text-transform:uppercase; color:var(--signal); margin-bottom:5px; }

@media (max-width:820px) {
  .app { grid-template-columns:1fr; height:auto; }
  .rail { border-right:0; border-bottom:1px solid var(--rule); max-height:44vh; }
  .visor { overflow:visible; }
  .cab { position:static; }
}

<script>window.__FR__={"sello":"fases A · B · C · 9 sep 2026","grupos":[{"nombre":"Empezar por aquí","ficheros":["@resumen","README.md","CLAUDE.md"]},{"nombre":"Fase A · definición","ficheros":["doc/00-producto.md","doc/01-modulos.md","doc/02-arquitectura.md","doc/03-modelo-datos.md","doc/04-pantallas.md","doc/05-integraciones.md","doc/06-inteligencia.md","doc/07-seguridad.md","doc/08-mvp-roadmap.md","doc/09-comercial.md","doc/10-decisiones.md","doc/11-api.md","doc/12-demo.md","doc/13-marca.md","doc/marca.svg"]},{"nombre":"Fase B · base de datos","ficheros":["db/01-extensiones.sql","db/02-organizacion.sql","db/03-planta.sql","db/04-contexto.sql","db/05-series.sql","db/06-eventos.sql","db/07-calculo.sql","db/08-inteligencia.sql","db/09-rls.sql","db/10-vistas.sql","db/pruebas/fugas.sql","db/pruebas/semilla-fugas.sql"]},{"nombre":"Fase B · backend","ficheros":["src/api/contexto.ts","src/api/rutas/activos.ts","src/api/rutas/alertas.ts","src/api/rutas/copilot.ts","src/api/rutas/estado.ts","src/api/rutas/ingesta.ts","src/api/rutas/salud.ts","src/api/servidor.ts","src/config.ts","src/db.ts","src/dominio/impacto.ts","src/dominio/microparadas.ts","src/dominio/oee.ts","src/dominio/severidad.ts","src/ia/consultas.ts","src/ia/proveedor.ts","src/motor/calcular.ts","src/motor/detectar.ts"]},{"nombre":"Fase B · pruebas","ficheros":["tests/api.test.ts","tests/dominio.test.ts"]},{"nombre":"Fase C · demo factory","ficheros":["doc/12-demo.md","scripts/demo-factory.mjs","scripts/demo-motor.mjs","scripts/exportar-demo.mjs","scripts/construir-demo.mjs","scripts/demo.plantilla.html"]},{"nombre":"Fase B · panel","ficheros":["panel/README.md","panel/src/componentes/ChipSeveridad.tsx","panel/src/componentes/Cifra.tsx","panel/src/componentes/CuentaAbierta.tsx","panel/src/estilo/tokens.css"]},{"nombre":"Fase B · conector edge","ficheros":["edge/README.md","edge/src/buffer.ts","edge/src/fuentes/tipos.ts"]},{"nombre":"Fase C · web comercial","ficheros":["web/index.html"]},{"nombre":"Marca","ficheros":["doc/13-marca.md","doc/marca.svg"]},{"nombre":"Herramientas","ficheros":["scripts/construir-demo.mjs","scripts/construir-explorador.mjs","scripts/construir-sitio.mjs","scripts/demo-factory.mjs","scripts/demo-motor.mjs","scripts/demo.plantilla.html","scripts/explorador.plantilla.html","scripts/exportar-demo.mjs","scripts/migrar.mjs","scripts/pruebas-fugas.mjs","scripts/publicar-sitio.sh"]},{"nombre":"Configuración","ficheros":["package.json",".env.example",".gitignore"]}],"ficheros":{"README.md":{"texto":"# RADACTORY\n\n**Tu fábrica ya genera los datos. Nosotros te decimos qué significan.**\n\nUna capa de inteligencia que se conecta a los sistemas que la fábrica ya tiene\n—ERP, MES, SCADA, PLC, sensores, bases de datos, Excel— y convierte el dato\ndisperso en una lista corta de cosas que hacer hoy, ordenadas por euros.\n\nNo es otro cuadro de mando. Un cuadro de mando te da 50 gráficas y te deja el\ntrabajo de interpretar. RADACTORY te da cinco líneas y el dinero que hay\ndetrás de cada una.\n\n---\n\n## Qué se ha decidido y qué no\n\nEste repositorio contiene, ahora mismo, la **FASE A: la definición del\nproducto**. No hay código de aplicación todavía, y es deliberado: en software\nindustrial, el 80% de los proyectos que fracasan lo hacen por un modelo de datos\ny un alcance mal decididos, no por el framework.\n\n| Fase | Qué es | Estado |\n|---|---|---|\n| **A** | Producto, arquitectura, modelo de datos, pantallas, MVP, comercial | **hecha** — `doc/` |\n| **B** | Estructura real: esquema SQL, dominio, API, conector, panel | **hecha** — `db/` `src/` `edge/` `panel/` |\n| **C** | DEMO FACTORY navegable y convincente | **hecha** — `scripts/demo-*.mjs`, `doc/demo.html` |\n| **D** | MVP funcional sobre datos reales | pendiente |\n| **E** | Primer piloto industrial (6 semanas) | pendiente |\n\n---\n\n## Cómo se lee esta carpeta\n\nPor orden. Cada documento depende del anterior.\n\n| | |\n|---|---|\n| [`doc/00-producto.md`](doc/00-producto.md) | Qué vendemos, a quién, contra quién, y por qué nos comprarían |\n| [`doc/01-modulos.md`](doc/01-modulos.md) | Los ocho módulos, cada uno con su problema, su dinero y su usuario |\n| [`doc/02-arquitectura.md`](doc/02-arquitectura.md) | Arquitectura funcional y técnica, stack, Edge Connector |\n| [`doc/03-modelo-datos.md`](doc/03-modelo-datos.md) | Entidades, relaciones y las decisiones que las explican |\n| [`doc/04-pantallas.md`](doc/04-pantallas.md) | Sitemap, flujos, wireframes, sistema visual |\n| [`doc/05-integraciones.md`](doc/05-integraciones.md) | La escalera de ingesta: de Excel a OPC UA |\n| [`doc/06-inteligencia.md`](doc/06-inteligencia.md) | Motor de eventos, scoring, Copilot, Factory Brain, RAG |\n| [`doc/07-seguridad.md`](doc/07-seguridad.md) | Segmentación OT/IT, multitenant, IEC 62443 / ISO 27001 / NIS2 |\n| [`doc/08-mvp-roadmap.md`](doc/08-mvp-roadmap.md) | MVP, priorización, backlog, roadmap 0–24 meses |\n| [`doc/09-comercial.md`](doc/09-comercial.md) | Precio, web pública, metodología de piloto, KPIs |\n| [`doc/10-decisiones.md`](doc/10-decisiones.md) | Registro de decisiones: qué se eligió, contra qué, y por qué |\n| [`doc/11-api.md`](doc/11-api.md) | Contrato de la API: endpoints, autenticación, ingesta |\n| [`doc/12-demo.md`](doc/12-demo.md) | La DEMO FACTORY: qué simula, qué problemas planta y cómo se regenera |\n| [`doc/13-marca.md`](doc/13-marca.md) | El nombre, los colores, el símbolo y la regla que separa marca de estado |\n| [`web/index.html`](web/index.html) | La web comercial, con las cifras reales de la demo |\n\n---\n\n## La regla que manda sobre todas\n\nNinguna funcionalidad entra en el backlog sin responder a las cuatro preguntas:\n\n1. **¿Qué problema industrial resuelve?**\n2. **¿Cuánto dinero o tiempo ahorra?**\n3. **¿Quién la utiliza?** (con nombre de cargo, no \"el usuario\")\n4. **¿Qué decisión facilita?**\n\nSi una funcionalidad no contesta a las cuatro, no se construye. Queda escrita en\n[`doc/08-mvp-roadmap.md`](doc/08-mvp-roadmap.md), en la sección de descartes, con\nel motivo. Los descartes también son producto.\n\n\n---\n\n## Cómo se levanta\n\n```bash\ncp .env.example .env          # y rellenar DATABASE_URL y DATABASE_URL_JOBS\nnpm install\nnpm run migrar                # aplica db/*.sql en orden; es idempotente\nnpm test                      # 17 pruebas de dominio, sin base\nnpm run api\n```\n\nHace falta **PostgreSQL 16 con TimescaleDB y pgvector**. En local:\n\n```bash\ndocker run -d --name fr -e POSTGRES_PASSWORD=fr -e POSTGRES_DB=factory_radar \\\n  -p 5432:5432 timescale/timescaledb-ha:pg16\n```\n\n### La batería de fugas\n\nEs la barrera 3 del aislamiento multiempresa y corre **como `fr_app`**, no como\nsuperusuario: ejecutarla como superusuario no prueba nada, porque el\nsuperusuario salta RLS.\n\n```bash\npsql -U postgres -d factory_radar -f db/pruebas/semilla-fugas.sql\npsql -U fr_app   -d factory_radar -f db/pruebas/fugas.sql\n```\n\nPlanta dos empresas rivales y comprueba que no se ven entre ellas: por listado,\npor id directo, por escritura cruzada, sin contexto de inquilino, y a través de\nla puerta al dato crudo. **Once pruebas. Si alguna falla, no se despliega.**\n","bytes":4604,"lineas":103,"lenguaje":null,"para":"La puerta de entrada: qué es el producto, en qué fase está y cómo se levanta en local.","chip":null,"chipTono":null,"estado":null},"CLAUDE.md":{"texto":"# RADACTORY — instrucciones\n\nPlataforma de inteligencia industrial. El repositorio contiene la **FASE A**\n(definición, en `doc/`), la **FASE B** (estructura real: `db/`, `src/`, `edge/`,\n`panel/`) y la **FASE C** (DEMO FACTORY navegable: `scripts/demo-*`, `doc/demo.html`).\n\n## Antes de escribir nada\n\nLee [`doc/10-decisiones.md`](doc/10-decisiones.md). Son 38 decisiones ya tomadas\ncon su alternativa descartada — 22 de la fase A y 16 que salieron de construir.\nSi vas a contradecir una, di cuál y por qué; no la deshagas de pasada.\n\n## La regla que manda\n\nNinguna funcionalidad entra sin responder a las cuatro preguntas: qué problema\nindustrial resuelve, cuánto dinero o tiempo ahorra, quién la usa (con cargo, no\n\"el usuario\") y qué decisión facilita. Lo que no las conteste va a la sección de\ndescartes de `doc/08-mvp-roadmap.md`, con el motivo.\n\n## Cosas que no se hacen en este producto\n\n- **No se escribe nunca en un sistema OT.** No es una opción desactivada: no se\n  implementa. El conector no debe contener código capaz de escribir en un PLC.\n- **No se interpola un hueco de dato.** El hueco se pinta como hueco. Un dato\n  inventado en industria es un diagnóstico equivocado.\n- **No se muestra una puntuación sin poder abrir su fórmula** con los valores\n  reales de ese activo.\n- **No se inserta una alerta sin `impact_basis` ni `evidence`.** Es restricción de\n  esquema, no buena intención.\n- **El LLM no detecta anomalías.** Detectan las reglas y la estadística sobre el\n  dato; el LLM explica lo detectado.\n- **El Copilot no escribe SQL.** Consultas parametrizadas de catálogo, siempre.\n- **La IA no responde sin citar fuente.** Y si no sabe, lo dice.\n\n## Dónde va cada cosa\n\n| | |\n|---|---|\n| Qué vendemos y a quién | `doc/00-producto.md` |\n| Qué hace cada módulo | `doc/01-modulos.md` |\n| Stack y por qué ese | `doc/02-arquitectura.md` |\n| Entidades y esquema | `doc/03-modelo-datos.md` |\n| Pantallas y sistema visual | `doc/04-pantallas.md` |\n| Decisiones ya tomadas | `doc/10-decisiones.md` — **léelo antes de cambiar arquitectura** |\n| Contrato de la API | `doc/11-api.md` |\n| Esquema, en orden | `db/01-…` a `db/10-…`, idempotentes |\n| Aislamiento multiempresa | `db/09-rls.sql` + `db/pruebas/fugas.sql` |\n| Lógica de producto | `src/dominio/` — OEE, microparadas, impacto, severidad |\n| Cliente del panel | `panel/src/` (estructura; se llena en FASE D) |\n| Motor de cálculo y detección | `src/motor/` |\n| La demo y sus 4 problemas | `doc/12-demo.md` · `scripts/demo-factory.mjs` |\n\n## Cómo se toca la base\n\n**Nunca** se exporta un `query` suelto. Para leer o escribir hay que pasar por\n`conInquilino(tenantId, fn)` de `src/db.ts`, que abre transacción y fija el\ncontexto. Es la barrera 2 de 3 del aislamiento: hace que escribir una consulta\nsin inquilino sea imposible, no solo desaconsejado.\n\n`comoSuperadminSinAislamiento()` existe, tiene ese nombre incómodo a propósito y\nexige un motivo. Si aparece en un diff, hay que mirarlo.\n\nDespués de tocar el esquema, `npm run pruebas-fugas`. Once pruebas que corren\ncomo `fr_app`. Si alguna falla, no se despliega.\n\n## Estilo\n\nEspañol. Los comentarios del código, **sin tildes**. Los comentarios explican\n**por qué**, no qué: los que documentan un fallo real que costó una tarde no se\nborran al refactorizar.\n\n## Este repositorio va solo\n\nRADACTORY no depende de ningún otro proyecto ni lo menciona. Si algo de aquí\nte recuerda a otro producto, no lo enlaces: no se comparten commits, ni código\nsin revisar, ni números de un cliente a otro.\n","bytes":3563,"lineas":77,"lenguaje":null,"para":"Las reglas de la casa. Lo que no se hace en este producto, y por qué.","chip":null,"chipTono":null,"estado":null},"doc/00-producto.md":{"texto":"# 00 · Producto\n\n## 1. El problema real, dicho sin marketing\n\nUna fábrica mediana española de 2026 no tiene un problema de falta de datos.\nTiene tres problemas distintos que se confunden entre sí:\n\n**El dato existe pero está preso.** El SCADA sabe cuándo paró la línea. El ERP\nsabe cuánto costó el material. El parte de mantenimiento sabe quién fue a\narreglarlo. Los tres datos existen y ninguno se habla con los otros, porque\njuntarlos nunca ha sido responsabilidad de nadie. El director de planta hace la\nunión a mano, en un Excel, los lunes por la mañana.\n\n**El dato que falta es siempre el mismo: la causa.** Casi todas las plantas\nregistran *que* hubo una parada. Muy pocas registran *por qué*. El campo de\nmotivo de parada, si existe, tiene tres valores en la práctica: \"avería\", \"otros\"\ny en blanco. Esto es el hecho más importante de todo el proyecto y volveremos a\nél en el modelo de datos, en el MVP y en la metodología de piloto.\n\n**Nadie tiene tiempo de mirar.** El responsable de producción no abre un cuadro\nde mando de 50 gráficas. Lo abrió las tres primeras semanas después de la\nimplantación y luego dejó de hacerlo. Esto le ha pasado ya a casi todos nuestros\nclientes potenciales, con un producto anterior, y explica por qué reciben con\nfrialdad la palabra \"dashboard\".\n\n> **Consecuencia de producto.** No competimos por tener más gráficas. Competimos\n> por ser lo único que el director de planta abre a las 7:40 de la mañana,\n> porque en 30 segundos le dice si tiene un problema y cuánto le cuesta.\n\n---\n\n## 2. Qué es RADACTORY\n\nUna capa de inteligencia industrial, en la nube, que se conecta a lo que la\nfábrica ya tiene y produce **una lista corta de decisiones**, no un repositorio\nde métricas.\n\nLa cadena completa, y ningún eslabón es opcional:\n\n```\nDATO  →  CONTEXTO  →  ANOMALÍA  →  DIAGNÓSTICO  →  IMPACTO EN €  →  ACCIÓN\n```\n\nLa mayoría de las plataformas del mercado llegan hasta `CONTEXTO` (te pintan la\nserie) o hasta `ANOMALÍA` (te disparan una alarma). El producto empieza a valer\ndinero en `IMPACTO EN €` y se vuelve difícil de sustituir en `ACCIÓN`, porque\npara entonces la orden de trabajo ya nace dentro de la plataforma.\n\n**La frase interna que decide los empates de diseño:**\n*si la pantalla no termina en un euro o en una acción, sobra.*\n\n---\n\n## 3. A quién se lo vendemos — el cliente cabeza de playa\n\nNo somos horizontales. Un producto industrial horizontal es un producto que no\nconvence a nadie en la primera reunión.\n\n### Perfil objetivo (ICP)\n\n| | |\n|---|---|\n| **Tamaño** | 50–300 empleados · 10–80 M€ de facturación |\n| **Activos** | 20–150 máquinas relevantes · 1–3 plantas |\n| **Sistemas** | **Tiene ERP. No tiene MES.** SCADA parcial. Excel por todas partes |\n| **Equipo IT** | 0,5 a 2 personas. No hay data scientist y no lo va a haber |\n| **Sectores** | Transformación metálica, alimentación y bebidas, plástico y caucho, químico de segunda transformación |\n| **Geografía inicial** | Cantabria, País Vasco, Navarra, La Rioja, Castilla y León — radio de coche desde Torrelavega |\n\n### Por qué exactamente ese perfil\n\nEs el hueco real del mercado. Por debajo, la fábrica de 20 personas se apaña con\nExcel y no paga suscripción. Por encima, la planta de 800 personas ya tiene MES\ny compra Siemens, AVEVA o PTC porque necesita que le firmen un SLA global.\n\nEl cliente de 50–300 empleados **está demasiado creciente para el Excel y\ndemasiado pequeño para el proyecto de 300.000 € a 18 meses**. Ese es el hueco, y\nes grande: en España hay alrededor de 12.000 plantas en esa franja.\n\nLa geografía no es un capricho. En industria, la primera venta se cierra pisando\nla planta. El radio de coche es una ventaja competitiva frente a un SaaS de\nMúnich, y deja de serlo a partir del cliente 30 — para entonces el producto ya\nse vende solo o no se venderá nunca.\n\n### Quién firma y quién usa\n\n| Rol | Qué le quita el sueño | Qué le damos |\n|---|---|---|\n| **Director de planta / Gerente** | El coste por unidad sube y no sabe por dónde | La pantalla de 30 segundos y el € |\n| **Responsable de producción** | La línea 3 va mal y solo lo nota al cierre del mes | La alerta el mismo día, con la estación señalada |\n| **Responsable de mantenimiento** | Apaga fuegos, no previene | El Asset Health Score y el aviso antes del fallo |\n| **Responsable de calidad** | Sabe el porcentaje de rechazo, no la causa | La correlación lote–proveedor–turno |\n| **Responsable de energía / RSC** | Le piden reportar y no tiene por máquina | Consumo por unidad producida y CSRD |\n| **IT** | Que le abran un puerto a la red OT | Conector **solo salida**, sin puertos entrantes |\n\n**Quien firma es el director de planta o el gerente.** IT tiene derecho de veto,\nnunca derecho de compra. De ahí se deriva media arquitectura de seguridad: el\nproducto se diseña para que IT no pueda decir que no.\n\n---\n\n## 4. Contra quién competimos, en serio\n\nDecirlo con precisión es lo que evita construir contra un rival imaginario.\n\n| Competidor | Qué hace bien | Dónde le ganamos |\n|---|---|---|\n| **Excel + el lunes por la mañana** | Gratis, flexible, ya está | Es el rival de verdad. Le ganamos en tiempo, no en potencia |\n| **Siemens Insights Hub, PTC ThingWorx, AVEVA** | Potentes, certificados, globales | Ciclo de venta de 9 meses y coste de implantación de seis cifras |\n| **Ignition, Node-RED, Grafana** | Baratos y muy capaces | Son herramientas, no producto: alguien tiene que construirlo y mantenerlo |\n| **MES clásico (a medida o de nicho)** | Control fino de planta | Exige cambiar cómo trabaja la planta. Nosotros no tocamos nada |\n| **Augury, Samotics, Falkonry** | Predictivo de verdad sobre vibración | Resuelven un activo, no la fábrica. Convivimos: son una fuente más |\n| **Integrador local** | Confianza y cercanía | Es socio, no rival. Le damos producto en vez de horas |\n\n**El posicionamiento de una frase:**\n*el 80% del valor de un MES, en seis semanas, sin tocar la planta y por\nsuscripción.*\n\nY la promesa que no hacemos: no prometemos sustituir al MES ni controlar la\nmáquina. Prometerlo hace que la primera reunión técnica se vuelva en contra.\n\n---\n\n## 5. La propuesta de valor, en el orden en que se cuenta\n\n1. **No cambies tu fábrica.** Nos conectamos a lo que ya tienes. Si lo único que\n   hay es un Excel, empezamos por el Excel.\n2. **Sin obra en la red.** El conector sale hacia fuera; no abre ningún puerto.\n   IT lo aprueba en una reunión, no en un comité.\n3. **Cuatro semanas hasta la primera alerta útil.** No 18 meses.\n4. **Te decimos el euro.** Cada anomalía trae su impacto estimado y cómo se ha\n   calculado.\n5. **Pregunta en castellano.** \"¿Por qué bajó el OEE esta semana?\" y la respuesta\n   cita el dato del que sale.\n6. **Empieza por una línea.** El piloto es una línea, no la planta entera.\n\n---\n\n## 6. Lo que no vamos a hacer (y hay que decirlo pronto)\n\nUn producto se define tanto por sus fronteras como por sus funciones. Estas\nfronteras son de diseño, no de falta de tiempo:\n\n- **No escribimos en el PLC.** Ni en el MVP ni en la versión 3. Escribir en\n  planta es otro producto, con otra certificación, otro seguro y otro nivel de\n  responsabilidad civil. Se dice en la primera reunión y tranquiliza a IT.\n- **No somos un sistema de seguridad funcional.** Nada de lo que hacemos puede\n  estar en la cadena de un enclavamiento o de una parada de emergencia.\n- **No sustituimos al GMAO** si el cliente tiene uno bueno. Lo leemos y le\n  devolvemos órdenes.\n- **No inventamos el dato que no existe.** Si no hay causas de parada, lo\n  decimos, no lo estimamos con IA y lo pintamos como si fuera cierto.\n- **No vendemos \"IA\".** Vendemos paradas evitadas y scrap reducido. La IA es\n  cómo, no qué.\n\n---\n\n## 7. Nombre: hay una colisión que arreglar ahora\n\nEl planteamiento inicial llama **RADACTORY** a la vez a la plataforma\ncompleta y al primer módulo (el de producción). Eso rompe en cuanto se dibuja el\nmenú lateral: no puede haber un \"Radactory\" dentro de \"Radactory\".\n\n**Decisión.** La plataforma es **RADACTORY**. El módulo de producción pasa a\nllamarse **PRODUCTION RADAR**. La familia queda:\n\n```\nRADACTORY  (la plataforma)\n├── PRODUCTION RADAR    producción y OEE\n├── MAINTENANCE RADAR   activos y salud\n├── ENERGY RADAR        consumo y coste energético\n├── QUALITY RADAR       defectos y correlaciones\n├── SUPPLIER RADAR      proveedores y suministro\n├── FACTORY BRAIN       conocimiento de la planta (RAG)\n├── BACK OFFICE AI      documentos y descuadres\n└── OPERATIONS AGENT    acciones con autorización\n```\n\nEl patrón es **un motor, muchos radares**: una sola capa de ingesta, contexto y\ndetección, y encima tantos radares como dominios tenga la planta. Añadir uno\nnuevo no toca el motor.\n\n> **Pendiente comercial, no técnico:** comprobar disponibilidad de marca y\n> dominio antes de imprimir nada. `factoryradar.com` es probable que esté\n> cogido; `factoryradar.io`, `factoryradar.es` y la marca mixta con Índole son\n> las alternativas a verificar.\n\n---\n\n## 8. Cómo sabremos que el producto funciona\n\nNo por usuarios registrados. Por estas cinco:\n\n| Métrica | Umbral de \"esto funciona\" |\n|---|---|\n| **Apertura matinal** | ≥ 60% de los usuarios de planta abren antes de las 9:00, tres meses después del alta |\n| **Alertas accionadas** | ≥ 40% de las alertas críticas terminan en una acción registrada |\n| **Falsos positivos** | ≤ 20% de alertas marcadas como \"no era nada\" |\n| **Euros defendibles** | Cada cliente tiene al menos un ahorro que él mismo cuenta a un tercero |\n| **Renovación a 12 meses** | ≥ 85% |\n\nLa segunda es la que de verdad importa. Una alerta que nadie acciona es una\ngráfica más, y ya hemos dicho que de eso no vivimos.\n","bytes":9846,"lineas":204,"lenguaje":null,"para":"Qué vendemos, a quién, contra quién, y las fronteras que no cruzamos.","chip":null,"chipTono":null,"estado":null},"doc/01-modulos.md":{"texto":"# 01 · Los ocho módulos\n\nCada módulo pasa por la regla fundamental antes de existir. Si una ficha no\npuede rellenar las cuatro casillas, el módulo se aplaza.\n\n---\n\n## PRODUCTION RADAR — producción y OEE\n\n| | |\n|---|---|\n| **Problema** | La planta sabe cuánto produjo, no dónde perdió. La pérdida se descubre al cierre de mes, cuando ya no se puede recuperar |\n| **Dinero** | Un punto de OEE en una línea de 3 M€/año son 30.000 €. Las microparadas se llevan entre 3 y 8 puntos y casi nunca se miden |\n| **Usuario** | Responsable de producción (diario) · Director de planta (semanal) |\n| **Decisión** | Dónde meto hoy al técnico y qué línea reviso antes de que acabe el turno |\n\n**Qué calcula.** Producción real contra objetivo; OEE con sus tres factores por\nseparado (disponibilidad, rendimiento, calidad) y siempre desglosados, nunca\nsolo el número compuesto; tiempo de ciclo real contra nominal; microparadas\n—paradas por debajo del umbral de registro, que es donde vive la pérdida\ninvisible—; paradas con causa; scrap y rechazo; comparación entre turnos, líneas,\nproductos y contra el propio histórico.\n\n**Qué aporta la capa de inteligencia.** No \"detecta anomalías\". Contesta cuatro\npreguntas concretas, en este orden y en esta forma:\n\n```\nQUÉ CAMBIÓ    el rendimiento de la Línea 3 cayó del 88% al 74%\nCUÁNDO        desde el martes 2, turno de mañana\nPOR QUÉ       microparadas en la estación P4: 47 paradas de 40–90 s por turno,\n              antes eran 6. Coincide con el cambio a producto REF-2210\nIMPACTO       -1.240 unidades/semana ≈ 8.900 €/semana de margen\nQUÉ REVISAR   ajuste del alimentador de P4 en el cambio de formato\n```\n\n**Decisión de diseño: el OEE se muestra desglosado o no se muestra.** Un OEE del\n78% no dice nada. Un 78% que es 95% × 86% × 96% dice que el problema es\nrendimiento y que hay que mirar tiempos de ciclo, no averías. Enseñar el número\ncompuesto solo es el error clásico de este tipo de producto.\n\n**Requisito mínimo de dato.** Contador de piezas + señal de máquina en marcha.\nCon eso hay disponibilidad y rendimiento. Sin causas de parada hay OEE pero no\ndiagnóstico, y la plataforma **lo dice en pantalla** en vez de disimularlo.\n\n---\n\n## MAINTENANCE RADAR — activos y salud\n\n| | |\n|---|---|\n| **Problema** | Mantenimiento es correctivo con un plan preventivo que se cumple a medias. La avería llega sin aviso y para la línea |\n| **Dinero** | Una hora de parada no planificada en una línea principal cuesta entre 1.500 y 12.000 €. Evitar dos al año paga la suscripción con holgura |\n| **Usuario** | Responsable de mantenimiento (diario) · Técnicos (en máquina) |\n| **Decisión** | Qué reviso esta semana con el poco tiempo que tengo |\n\n**Qué integra.** Horas de máquina, ciclos, alarmas del PLC/SCADA, averías,\nintervenciones, repuestos consumidos, coste, técnico, tiempos de reparación,\nMTBF, MTTR, y el plan preventivo (venga del GMAO o de un Excel).\n\n**ASSET HEALTH SCORE (0–100).** Un número por activo, con cuatro componentes que\n**siempre se muestran abiertos**:\n\n```\nSALUD DEL ACTIVO  =  0,35 · Fiabilidad     (MTBF frente a su propio histórico)\n                  +  0,25 · Comportamiento (desviación de consumo, ciclo, alarmas)\n                  +  0,20 · Mantenimiento  (cumplimiento del plan preventivo)\n                  +  0,20 · Criticidad     (impacto de su parada en la línea)\n```\n\nCon el detalle de por qué baja: *\"Compresor 02 · 61/100 · −14 en 30 días · el\nconsumo específico sube un 18% y hay 3 alarmas de presión nuevas\"*.\n\n**Decisión de diseño: el predictivo de verdad no entra en el MVP.** Predecir\nfallo con vibración exige acelerómetros, muestreo alto y meses de historial con\nfallos etiquetados. Lo que sí entra desde el día 1 es la **detección de deriva**:\nun activo cuyo consumo, tiempo de ciclo o tasa de alarmas se aleja de su propia\nlínea base. Eso no es machine learning avanzado y es el 70% del valor. Prometer\npredictivo el primer mes es la forma más rápida de quemar un piloto.\n\n---\n\n## ENERGY RADAR — consumo y coste\n\n| | |\n|---|---|\n| **Problema** | La factura eléctrica se mira a nivel de planta. Nadie sabe qué máquina se la come, ni cuánto se gasta con la planta parada |\n| **Dinero** | El consumo fuera de horario productivo es entre el 8% y el 20% del total en plantas sin gestión. Es dinero que se recupera con un temporizador |\n| **Usuario** | Responsable de energía o de mantenimiento · Dirección (para CSRD) |\n| **Decisión** | Qué apago, qué reviso y qué justifico en el informe de sostenibilidad |\n\n**La métrica que manda: consumo por unidad producida (kWh/ud).** El consumo\nabsoluto sube y baja con la producción y no dice nada. El consumo específico es\ncomparable entre turnos, entre meses y contra uno mismo, y es el que detecta la\nmáquina que se está degradando.\n\n**Qué detecta la inteligencia.** Consumo con la planta parada (el hallazgo más\nrentable y el más fácil); picos que rozan la potencia contratada; máquinas cuyo\nkWh/ud se degrada; desviación por turno con el mismo producto —que casi siempre\nes una diferencia de método, no de máquina.\n\n**Todo se traduce a €/año** con el precio real del contrato del cliente, no con\nun precio de mercado. Y se muestra la cuenta:\n\n```\nCompresor 02 · consumo fuera de horario\n  38 kW × 62 h/semana × 48 semanas × 0,142 €/kWh  =  16.055 €/año\n  Acción: programar parada automática. Coste estimado: 400 €\n```\n\n---\n\n## QUALITY RADAR — defectos y correlaciones\n\n| | |\n|---|---|\n| **Problema** | Calidad conoce el porcentaje de rechazo. No conoce su causa, porque la causa está en el cruce de lote, turno, máquina y proveedor, y ese cruce nadie lo hace |\n| **Dinero** | Un punto de scrap en una planta de 20 M€ con 40% de coste de material son 80.000 €/año. Y la reclamación de cliente cuesta el triple que el rechazo interno |\n| **Usuario** | Responsable de calidad · Producción |\n| **Decisión** | Qué lote bloqueo, a qué proveedor llamo y qué turno necesita formación |\n\n**El corazón del módulo es la correlación**, no el gráfico de Pareto que ya\ntienen. Cruzar cada rechazo con: producto, lote, materia prima, proveedor,\nmáquina, línea, turno, operario y condiciones de proceso.\n\n```\nEl 63% de los rechazos de PROD-X en las últimas tres semanas\ncorresponden al lote L-4471 del proveedor ZETA.\nConfianza: alta (n=284, p\u003c0,01) · Impacto: 11.400 €\nFuentes: partes de calidad 2026-08-14 a 2026-09-04, albarán ZETA-88213\n```\n\n**Decisión de diseño: la correlación se presenta como correlación.** Nunca\n\"causa\". El sistema aporta la evidencia y la fuerza estadística; quien decide que\nes causa es el responsable de calidad. Confundir las dos cosas destruye la\nconfianza en cuanto haya una coincidencia falsa, y la habrá.\n\n**Guardarraíl obligatorio.** Con `n` pequeño no se afirma nada. Por debajo de un\nmínimo de muestras la correlación se muestra como \"señal débil, seguir\nobservando\", no como hallazgo.\n\n---\n\n## SUPPLIER RADAR — proveedores y suministro\n\n| | |\n|---|---|\n| **Problema** | El proveedor se evalúa por precio en la negociación anual. El coste real de su falta de calidad y de sus retrasos no se mide y no llega a la mesa |\n| **Dinero** | El coste oculto de un mal proveedor (rechazo, reproceso, parada por falta de material, urgencias) suele ser de 3 a 8 veces el ahorro por el que se le eligió |\n| **Usuario** | Compras · Calidad · Dirección |\n| **Decisión** | Con quién renegocio, a quién audito y de quién tengo que dejar de depender |\n\n**SUPPLIER SCORE (0–100)**, abierto en cinco componentes: calidad (% de rechazo\nimputable), puntualidad (desviación sobre fecha comprometida), precio (evolución\ncontra la cesta y contra el IPC sectorial), respuesta (tiempo hasta resolver una\nincidencia) y cumplimiento (documentación, certificados, no conformidades).\n\n**Lo que de verdad se vende aquí es la tendencia, no el nivel.** Un proveedor con\n82 puntos que hace seis meses tenía 91 es una llamada de teléfono esta semana. Un\nproveedor con 74 estable es un hecho conocido, y probablemente ya\npresupuestado. **La señal es la derivada, no el nivel.**\n\nDetecta además **dependencia excesiva** —un material crítico con proveedor\núnico— que es un riesgo de continuidad que nadie mira hasta que llega el\ndesabastecimiento.\n\n---\n\n## FACTORY BRAIN — el conocimiento de la planta\n\n| | |\n|---|---|\n| **Problema** | El saber de la planta está en la cabeza de tres personas y en 4.000 PDFs que nadie abre. Cuando uno se jubila o está de vacaciones, la avería tarda cuatro horas más |\n| **Dinero** | Reducir el tiempo de diagnóstico de una avería frecuente de 45 a 10 minutos, veinte veces al mes, son 230 horas de técnico al año |\n| **Usuario** | Técnico de mantenimiento (en máquina, con el móvil) · Operario · Jefe de turno |\n| **Decisión** | Qué compruebo ahora mismo, delante de esta máquina parada |\n\n**Qué ingiere.** Manuales de fabricante, esquemas eléctricos y neumáticos,\ninstrucciones de trabajo, procedimientos, partes históricos de intervención,\nincidencias resueltas, fotografías, vídeos con transcripción, fichas técnicas.\n\n**Cómo responde.** Primero con el conocimiento **de esta fábrica**; el manual del\nfabricante es el segundo recurso, no el primero, porque el histórico de partes de\nesta planta suele valer más que el manual genérico.\n\n```\nEl error E42 en la EMBOTELLADORA 2 aparece 14 veces en el histórico.\nEn 11 de ellas la causa fue el sensor de nivel S3 sucio.\n\nQué comprobar, en orden:\n1. Limpieza del sensor S3 (11 casos · 12 min de media)\n2. Presión de la línea de aire, mínimo 5,5 bar (2 casos)\n3. Tarjeta de entradas analógicas (1 caso · requiere electricista)\n\nFuentes: partes 2024-1187, 2025-0342, 2025-0871 y 8 más ·\nManual KRONES p. 212 · Procedimiento PR-MTO-14\n```\n\n**Las tres reglas innegociables del Factory Brain:**\n\n1. **Siempre cita la fuente**, con documento y página o número de parte. Una\n   respuesta sin fuente no se muestra.\n2. **Si no sabe, lo dice.** *\"No hay nada sobre el error E42 en esta máquina.\n   Lo más parecido es el E41 en la línea 1.\"* La respuesta inventada sobre un\n   procedimiento de seguridad no es un error de producto, es un accidente.\n3. **Nunca da instrucciones de intervención sobre equipos energizados** sin\n   remitir al procedimiento de consignación (LOTO) de la planta.\n\n---\n\n## BACK OFFICE AI — documentos y descuadres\n\n| | |\n|---|---|\n| **Problema** | Administración teclea albaranes y factura contra pedido a ojo. Los descuadres pequeños pasan; los grandes se descubren tarde |\n| **Dinero** | Entre el 1% y el 3% del gasto en compras se pierde en descuadres no detectados, más el tiempo de tecleo |\n| **Usuario** | Administración · Compras |\n| **Decisión** | Qué factura no apruebo y a quién reclamo |\n\nLee pedidos, albaranes, facturas, órdenes de compra, presupuestos y tarifas —PDF,\nemail o escaneo— extrae las líneas y las **casa a tres bandas: pedido, albarán,\nfactura**. Lo que no cuadra sube.\n\n```\nFACTURA ZETA-2026-4411\nPedido PC-8821 ......... 6.980,00 €\nFactura ................ 7.340,00 €\nDESCUADRE .............. +360,00 €\n\nLínea 3: precio unitario 4,90 € facturado / 4,65 € pactado en tarifa vigente\nNo aprobar hasta aclarar.\n```\n\n**Decisión de alcance: no es un OCR genérico.** Solo cubre los seis tipos de\ndocumento de arriba y solo para proveedores ya dados de alta. Un extractor\nuniversal es un producto entero y no es este.\n\n---\n\n## OPERATIONS AGENT — acciones con autorización\n\n| | |\n|---|---|\n| **Problema** | Detectar sin actuar deja el trabajo a medias. La alerta llega y alguien tiene que abrir otro sistema y teclearlo otra vez |\n| **Dinero** | Cierra el bucle: sin acción, todo lo anterior es información. Es lo que convierte la herramienta en el sitio donde se trabaja |\n| **Usuario** | Todos, según permisos |\n| **Decisión** | Ninguna nueva: ejecuta la que ya se ha tomado, sin cambiar de aplicación |\n\n**Qué puede hacer.** Crear una orden de mantenimiento (propia o en el GMAO del\ncliente), avisar a un responsable, solicitar un repuesto, generar un parte, abrir\nuna incidencia de calidad, enviar un informe, crear una tarea, escalar, redactar\nun correo, registrar un evento.\n\n**El modelo de autorización, que es lo único importante de este módulo:**\n\n| Nivel | Qué es | Cómo se ejecuta |\n|---|---|---|\n| **0 · Informativo** | Notificar, redactar borrador | Automático |\n| **1 · Reversible interno** | Crear tarea, abrir incidencia, generar parte | Automático, con registro y deshacer |\n| **2 · Sale de la empresa o cuesta dinero** | Correo a proveedor, pedido de repuesto, orden en el GMAO | **Confirmación humana explícita, siempre** |\n| **3 · Toca planta** | Cualquier escritura en sistema OT | **No existe.** Fuera del alcance del producto |\n\nToda acción queda en el registro de auditoría con quién la propuso (persona o\nIA), quién la autorizó, cuándo y sobre qué evidencia. Sin excepción y sin modo\n\"confía en mí\": una IA que actúa sin traza es un problema legal antes que\ntécnico.\n\n---\n\n## Orden de construcción y por qué\n\n```\nMVP    PRODUCTION RADAR + alertas + Copilot + ingesta         el dolor más caro y más medible\nFASE 2 MAINTENANCE RADAR · ENERGY RADAR · FACTORY BRAIN       usan el mismo dato ya ingerido\nFASE 3 QUALITY RADAR · SUPPLIER RADAR                         necesitan dato de calidad y compras,\n                                                              que casi nunca está limpio el día 1\nFASE 4 BACK OFFICE AI · OPERATIONS AGENT                      cierran el bucle cuando ya hay confianza\n```\n\n**Production Radar va primero** porque es donde el dolor es más caro, el dato más\ndisponible y el resultado más fácil de defender delante del gerente en la reunión\nde la semana 6. **Operations Agent va el último** a propósito: nadie deja actuar\na un sistema en el que todavía no confía, y la confianza se gana acertando en las\nalertas durante unos meses.\n","bytes":14064,"lineas":284,"lenguaje":null,"para":"Los ocho radares. Cada uno con su problema, su dinero, su usuario y su decisión.","chip":null,"chipTono":null,"estado":null},"doc/02-arquitectura.md":{"texto":"# 02 · Arquitectura\n\n## 1. Arquitectura funcional: las seis capas\n\n```\n┌─────────────────────────────────────────────────────────────────────┐\n│  6 · ACCIÓN          Operations Agent · órdenes · avisos · informes  │\n├─────────────────────────────────────────────────────────────────────┤\n│  5 · PRESENTACIÓN    Panel · Copilot · alertas · API pública         │\n├─────────────────────────────────────────────────────────────────────┤\n│  4 · INTELIGENCIA    Motor de eventos · scoring · RAG · LLM          │\n├─────────────────────────────────────────────────────────────────────┤\n│  3 · CONTEXTO        Modelo unificado de planta · jerarquía · cálculo│\n├─────────────────────────────────────────────────────────────────────┤\n│  2 · NORMALIZACIÓN   Mapeo · unidades · husos · calidad del dato     │\n├─────────────────────────────────────────────────────────────────────┤\n│  1 · INGESTA         Edge Connector · APIs · SQL · ficheros          │\n└─────────────────────────────────────────────────────────────────────┘\n        ▲\n        │  RED OT — el dato solo sube. Nunca baja.\n```\n\n**La capa 3 es el producto.** Ingerir sabe hacerlo cualquiera y un LLM lo compra\ncualquiera. Lo difícil y lo defendible es el modelo de contexto: saber que este\ncontador de piezas pertenece a esta máquina, que está en esta línea, que ahora\nmismo fabrica este producto en este turno, y que su ciclo nominal es 4,2 s. Sin\nese contexto, un dato de producción es un número sin significado y ninguna\ninteligencia posterior puede rescatarlo.\n\n---\n\n## 2. Arquitectura técnica\n\n```\n        PLANTA (red OT)                    │            CLOUD\n                                           │\n  PLC ──┐                                  │      ┌──────────────────────┐\n  SCADA ─┤                                 │      │   INGRESS / WAF      │\n  MES ───┼──► RADACTORY EDGE ──────┼─────►│   mTLS + token       │\n  Sensor ┤    · lee (solo lectura)         │      └──────────┬───────────┘\n  SQL ───┘    · normaliza                  │                 │\n              · almacena 7 días (buffer)   │      ┌──────────▼───────────┐\n              · comprime y firma           │      │   API  (Fastify/TS)  │\n              · sale por 443, mTLS         │      │   multitenant, RBAC  │\n              · NO abre puertos entrantes  │      └──────────┬───────────┘\n                                           │                 │\n  ERP ────────── API / SQL de solo lectura ┼────►  ┌──────────▼───────────┐\n  Excel ──────── subida manual o SFTP ─────┼────►  │  COLA (pg-boss)      │\n                                           │       │  normaliza · calcula │\n                                           │       │  detecta · puntúa    │\n                                           │       └──────────┬───────────┘\n                                           │                  │\n                                           │       ┌──────────▼───────────┐\n                                           │       │  POSTGRESQL 16       │\n                                           │       │  + TimescaleDB       │\n                                           │       │  + pgvector          │\n                                           │       └──────────┬───────────┘\n                                           │                  │\n                                           │       ┌──────────▼───────────┐\n                                           │       │  CAPA IA (abstracta) │\n                                           │       │  Claude · local · …  │\n                                           │       └──────────────────────┘\n```\n\n---\n\n## 3. El stack, con el porqué de cada elección\n\n| Capa | Elección | Por qué esta y no otra |\n|---|---|---|\n| **Base de datos** | **PostgreSQL 16 + TimescaleDB + pgvector** | Una sola base cubre relacional, serie temporal y vectorial. La alternativa real era Postgres + InfluxDB + Pinecone: tres sistemas que respaldar, tres que asegurar y tres facturas, para un volumen que Timescale aguanta sobradamente. Se separa el día que un cliente pase de 50.000 señales/s, no antes |\n| **Backend** | **Node 22 + TypeScript + Fastify** | Mismo lenguaje que el panel y que el conector: un solo equipo mantiene los tres, y una persona sola puede seguir la traza de una alerta desde la señal hasta la pantalla |\n| **Acceso a datos** | **SQL a pelo con `pg`** | Sin ORM. Las consultas de este producto son agregaciones temporales pesadas; un ORM las escribe mal y luego hay que reescribirlas a mano igualmente. Convención ya asentada en la casa |\n| **Colas y jobs** | **pg-boss** (sobre la misma Postgres) | Evita meter Redis y su respaldo hasta que haga falta de verdad. Transaccional con los datos, que es justo lo que quieres en un cálculo de OEE |\n| **Panel** | **React + TypeScript + Vite** · SPA | El panel es una aplicación de estado, no un sitio de contenido. SSR aquí solo añade complejidad |\n| **Gráficas** | **uPlot** para series, **visx/D3** para lo demás | uPlot dibuja 100.000 puntos sin despeinarse. Las librerías cómodas se ahogan justo en el caso industrial |\n| **Estilos** | **CSS con variables de tema** | Sin framework de utilidades. El sistema visual es pequeño y propio, y tiene que verse en un panel de taller a 3 metros |\n| **Web pública** | **CMS Vertary** | Ya es la herramienta de la casa para sitios. No se inventa nada nuevo |\n| **Edge Connector** | **Node 22 empaquetado** · Docker o binario | Mismo lenguaje. Se despliega en un mini PC industrial o en una VM del cliente |\n| **IA** | **Capa de abstracción propia** | Ver más abajo. Ningún proveedor entra en el código de negocio |\n| **Infraestructura** | **Hetzner** (como radarindole.com) | Dato en la UE, coste predecible, ya hay operativa montada. Se revisará cuando entre el primer cliente que exija certificación |\n| **Observabilidad** | **OpenTelemetry → Grafana/Loki** | Estándar abierto, sin quedarse atado a un proveedor de APM |\n\n### Lo que deliberadamente NO se mete todavía\n\nKubernetes, microservicios, Kafka, data lake, feature store, MLOps. Todo eso\nresuelve problemas de escala que aún no tenemos, y cada pieza añade una\nsuperficie que hay que asegurar y explicar en la auditoría del cliente. **Un\nmonolito modular bien separado por dominios** llega tranquilamente a 50 plantas.\nEl día que no llegue, los módulos ya están separados por sus fronteras y el corte\nes mecánico.\n\n---\n\n## 4. RADACTORY EDGE\n\nEl componente que decide si IT aprueba el proyecto. Todo su diseño obedece a una\nsola frase: **el dato sube, nunca baja**.\n\n### Principios\n\n1. **Solo lectura.** No tiene código capaz de escribir en un PLC. No es una\n   opción desactivada: no está implementado. Se puede enseñar el repositorio.\n2. **Solo salida.** Abre él la conexión, TLS mutuo contra `ingest.\u003cdominio>` por\n   el 443. **No escucha en ningún puerto.** El cortafuegos del cliente no necesita\n   ninguna regla de entrada.\n3. **Aguanta sin línea.** Buffer local de 7 días en SQLite. Si cae internet sigue\n   recogiendo y al volver reenvía en orden, sin duplicar y sin perder.\n4. **No decide nada.** Lee, normaliza, comprime, firma y envía. Toda la lógica\n   está en el cloud, así que actualizar el algoritmo no obliga a tocar la planta.\n5. **Se ve desde dentro.** Estado, latencia y última lectura por señal, visibles\n   tanto en el panel del cliente como en el panel de superadmin.\n6. **Se cae solo hacia el lado seguro.** Si no puede leer una fuente, lo marca\n   como hueco de dato. Nunca interpola en silencio.\n\n### Protocolos, por orden de implantación\n\n| Prioridad | Protocolo | Cuándo se usa | Fase |\n|---|---|---|---|\n| 1 | **SQL de solo lectura** | El historiador del SCADA o el ERP tienen base propia. Es el camino más rápido a dato real | MVP |\n| 2 | **CSV / Excel** (carpeta, SFTP o subida) | Casi siempre es lo único que hay el primer día. No es un plan B, es el plan A de la semana 1 | MVP |\n| 3 | **REST / API** | ERP moderno, GMAO en la nube, básculas y equipos con API | MVP |\n| 4 | **MQTT** | Sensórica IoT nueva, la que instalemos nosotros | Fase 2 |\n| 5 | **OPC UA** | El estándar del SCADA moderno. Es el destino natural, no el punto de partida | Fase 2 |\n| 6 | **Modbus TCP** | Máquina antigua sin nada por encima. Último recurso: hay que declarar registros a mano | Fase 3 |\n\n**Por qué OPC UA no está en el MVP, aunque sea \"lo correcto\".** Un servidor OPC UA\ndel cliente exige certificados, permisos, un espacio de nombres que alguien tiene\nque mapear y, a menudo, una licencia del fabricante del SCADA. Son entre dos y\nseis semanas de coordinación. Empezar por SQL y CSV da dato real en tres días y\npermite enseñar valor mientras se tramita el OPC UA. **Ese orden es una decisión\ncomercial disfrazada de decisión técnica, y es a propósito.**\n\n### La escalera de ingesta\n\nEs la herramienta de venta más eficaz que tiene el producto, porque elimina la\nexcusa de \"es que nosotros no tenemos datos\":\n\n```\nNIVEL 0   Excel que ya rellenan a mano      →  valor en 3 días\nNIVEL 1   Consulta SQL al historiador       →  valor en 1 semana\nNIVEL 2   API del ERP / GMAO                →  valor en 2 semanas\nNIVEL 3   OPC UA / MQTT en tiempo real      →  valor continuo\nNIVEL 4   Sensórica añadida donde falta     →  proyecto aparte, se factura\n```\n\nSe empieza siempre por el nivel que la planta ya tiene, aunque sea el 0. Subir de\nnivel es una conversación posterior, con el cliente ya convencido.\n\n---\n\n## 5. Capa de abstracción de IA\n\nNingún proveedor de LLM aparece en el código de negocio. Todo pasa por una\ninterfaz con cuatro operaciones —completar, completar estructurado, generar\nembedding y clasificar— y una implementación por proveedor.\n\n**Por qué es innegociable:**\n- **Precio y modelos se mueven cada trimestre.** Quedarse atado sale caro.\n- **Habrá clientes que exijan que el dato no salga de su infraestructura.** La\n  misma interfaz debe poder apuntar a un modelo local, aunque rinda peor.\n- **El coste hay que medirlo por inquilino.** Si el proveedor está incrustado en\n  el código, no se puede repercutir ni limitar.\n\n**Enrutado por tarea, no un modelo para todo:** un modelo capaz para el\ndiagnóstico y el Copilot, uno rápido y barato para clasificar y resumir, y\nembeddings del proveedor que mejor funcione en español técnico. El modelo por\ndefecto para razonamiento es la familia Claude más capaz disponible; la elección\nse revisa cada trimestre y vive en configuración, no en el código.\n\n**Cada llamada se registra entera**: prompt, contexto recuperado, respuesta,\nfuentes citadas, modelo, tokens, coste y latencia. Sin ese registro no se puede\ndepurar una respuesta mala, ni facturar el consumo, ni defenderse si un cliente\npregunta por qué la IA dijo lo que dijo.\n\n---\n\n## 6. Flujo del dato, de la señal a la acción\n\n```\n 1  El conector lee el contador de la Línea 3        cada 5 s\n 2  Lo normaliza y lo firma                          en planta\n 3  Lo envía por lotes, comprimido                   cada 30 s\n 4  Ingesta valida, deduplica y escribe              hypertable de Timescale\n 5  Agregación continua                              minuto → hora → turno → día\n 6  Cálculo de OEE con contexto de producto y turno  al cerrar cada ventana\n 7  El motor de eventos compara con la línea base    cada 15 min\n 8  Encuentra desviación de rendimiento              severidad, confianza\n 9  Estima impacto en euros                          con datos del propio cliente\n10  Genera diagnóstico con el LLM                    sobre el dato, nunca sin él\n11  Crea la alerta con su acción recomendada         y entra en \"ATENCIÓN HOY\"\n12  Notifica según reglas del usuario                panel · email · Teams\n13  El responsable acciona                           orden creada, alerta cerrada\n14  El resultado realimenta                          si fue falso positivo, ajusta\n```\n\nEl paso 14 es el que separa un producto vivo de una demo. Cada alerta cerrada\ncomo \"no era nada\" ajusta el umbral de esa señal en esa planta. Sin él, a los tres\nmeses el usuario ignora las alertas y ya no vuelve.\n","bytes":13871,"lineas":200,"lenguaje":null,"para":"Las seis capas, el stack con el porqué de cada elección, y el Edge Connector.","chip":null,"chipTono":null,"estado":null},"doc/03-modelo-datos.md":{"texto":"# 03 · Modelo de datos\n\n## 1. Las cuatro decisiones que gobiernan todo el esquema\n\n**1 · `tenant_id` en todas las tablas de negocio, y aislamiento por RLS.**\n**El dato de una fábrica no puede tocar el de otra jamás.** En otros productos\ntiene sentido un pozo de datos común, para que un cliente nuevo herede el\nhistórico y sea útil desde el primer día. Aquí no: esto es dato de proceso, de\ncoste y de personal, y dos clientes pueden ser competidores directos. Es dato de proceso, de coste y de\npersonal. El aislamiento se hace con Row Level Security de Postgres, no\núnicamente con un `WHERE` en el código: un `WHERE` olvidado en una consulta es una\nfuga de datos entre competidores del mismo sector. Una base por cliente se\nreserva para Enterprise, cuando el contrato lo exija.\n\n**2 · La jerarquía de planta es un árbol, no cinco tablas rígidas.**\nNinguna fábrica encaja en `Planta → Área → Línea → Máquina`. Hay celdas, hay\nnaves, hay centros de trabajo, hay máquinas que son varias líneas a la vez. Se\nmodela como un árbol con tipo de nodo (`asset_node`, con `parent_id` y `path`\nmaterializado). Forzar cinco niveles fijos obliga a reformar el esquema en el\ntercer cliente — es de los errores más caros y más comunes del sector.\n\n**3 · Las medidas se separan de los eventos, y las dos son inmutables.**\n`measurement` es serie temporal densa (contadores, temperatura, kW): hypertable\nde Timescale, append-only, comprimida a partir de 7 días. `event` es discreto y\nescaso (parada, alarma, cambio de formato, rechazo): tabla normal con índices\ndistintos. Meter las dos cosas en una misma tabla es el error clásico y arruina\ntanto las consultas de serie como las de evento.\n\n**4 · Nada calculado se guarda sin su explicación.**\nToda fila de OEE, de score o de impacto en euros guarda **con qué entradas y con\nqué versión de fórmula** se calculó. Cuando el director de planta discuta un\nnúmero —y lo hará, en la reunión de la semana 3— hay que poder abrirlo hasta el\ndato crudo. Un número que no se puede defender destruye la confianza en toda la\nplataforma, no solo en ese número.\n\n---\n\n## 2. Entidades\n\n### Organización y acceso\n\n```\ncompany            el cliente. Raíz del aislamiento\n └─ site           centro / planta física (dirección, huso, calendario, tarifa)\n     └─ asset_node árbol: área · línea · celda · máquina · activo auxiliar\n         └─ signal  una señal medible de un nodo (contador, kW, temperatura…)\n\nuser               persona. Puede pertenecer a varias companies\nmembership         user × company × rol\nrole               superadmin · company_admin · plant_manager ·\n                   maintenance · production · quality · energy · viewer\naudit_log          quién hizo qué, cuándo, desde dónde. Inmutable\n```\n\n### Contexto productivo — la capa que da significado al dato\n\n```\nproduct            lo que se fabrica. Ciclo nominal, unidad, margen unitario\nproduction_order   orden: producto × cantidad × fechas × destino\nbatch              lote fabricado. Enlaza con calidad y con trazabilidad\nshift              definición del turno (patrón y calendario)\nshift_instance     un turno concreto en una fecha, con su plantilla\noperator           persona de planta. Seudonimizable (ver más abajo)\nmaterial           materia prima o componente\nsupplier           proveedor\ndelivery           entrega: proveedor × material × lote × fecha × cantidad\n```\n\n### Dato crudo\n\n```\nmeasurement        HYPERTABLE · (tenant_id, signal_id, ts, value, quality)\n                   quality: good · uncertain · bad · substituted\n                   Nunca se interpola en silencio: el hueco es un hueco\n\nevent              (tenant_id, asset_node_id, ts_start, ts_end, type,\n                    reason_code, source, payload)\n                   type: stop · microstop · alarm · changeover · reject ·\n                         setup · speed_loss · manual_note\n\nreason_code        catálogo de causas POR CLIENTE, jerárquico.\n                   Es el activo más valioso que construye el piloto\n```\n\n### Cálculo y derivados\n\n```\nproduction_metric  ventana × nodo × producto: piezas ok, nok, tiempo,\n                   disponibilidad, rendimiento, calidad, oee, calc_version\nenergy_reading     consumo por señal y ventana, con kWh/ud y coste\nquality_incident   defecto: producto, lote, causa, cantidad, coste\nmaintenance_order   preventiva · correctiva · predictiva. Estado, coste, horas\nasset_score        salud del activo por día, con sus cuatro componentes abiertos\nsupplier_score     score del proveedor por mes, con sus cinco componentes\n```\n\n### Inteligencia\n\n```\nbaseline           comportamiento normal aprendido: señal × contexto × ventana\n                   (media, desviación, p05, p95, muestras, calculado_en)\nanomaly            desviación detectada, antes de convertirse en alerta\nalert              lo que el usuario ve. Severidad, confianza, impacto,\n                   acción recomendada, estado, feedback\nrecommendation     acción propuesta, con su ahorro estimado y su coste\nai_analysis        registro de cada llamada al LLM: prompt, contexto, fuentes,\n                   modelo, tokens, coste, latencia, respuesta\ndocument           PDF, manual, esquema, foto. Con su origen y su versión\ndoc_chunk          fragmento + embedding (pgvector) + metadatos de filtrado\naction             lo ejecutado por Operations Agent: quién, qué, autorizado por\n```\n\n---\n\n## 3. Relaciones que conviene ver dibujadas\n\n```\ncompany ──\u003c site ──\u003c asset_node ──\u003c signal ──\u003c measurement\n                          │                      \n                          ├──\u003c event >── reason_code\n                          ├──\u003c production_metric >── product\n                          ├──\u003c asset_score\n                          ├──\u003c energy_reading\n                          └──\u003c maintenance_order\n\nproduct ──\u003c production_order ──\u003c batch ──\u003c quality_incident\n                                    │\nsupplier ──\u003c delivery ──\u003c material ─┘        (la cadena que permite la\n   └──\u003c supplier_score                        correlación defecto ↔ lote\n                                              ↔ proveedor de QUALITY RADAR)\n\nbaseline ──> anomaly ──> alert ──> recommendation ──> action\n                            └──> ai_analysis (el diagnóstico y sus fuentes)\n\ndocument ──\u003c doc_chunk   filtrable por site, asset_node, fabricante, modelo\n```\n\n---\n\n## 4. Las tres tablas que hay que hacer bien a la primera\n\n### `measurement` — la hypertable\n\n```sql\ncreate table measurement (\n  tenant_id   uuid        not null,\n  signal_id   uuid        not null,\n  ts          timestamptz not null,\n  value       double precision,\n  quality     smallint    not null default 0,  -- 0 good 1 uncertain 2 bad 3 sustituido\n  primary key (tenant_id, signal_id, ts)\n);\nselect create_hypertable('measurement', 'ts', chunk_time_interval => interval '1 day');\n```\n\nCon agregaciones continuas encadenadas a minuto, hora y turno. **Ninguna consulta\ndel panel toca la tabla cruda**: siempre lee del agregado del nivel adecuado. Es\nla diferencia entre un panel que abre en 200 ms y uno que tarda 9 s, y esa\ndiferencia decide si el usuario vuelve mañana.\n\n`quality` no es decorativo. Un valor `bad` o sustituido no puede entrar en un\ncálculo de OEE como si fuera bueno; se excluye y **el porcentaje de cobertura del\ndato se muestra al lado del número**.\n\n### `event` — donde vive la verdad de la parada\n\n```sql\ncreate table event (\n  id             bigserial primary key,\n  tenant_id      uuid        not null,\n  asset_node_id  uuid        not null,\n  type           text        not null,\n  ts_start       timestamptz not null,\n  ts_end         timestamptz,\n  duration_s     integer generated always as\n                   (extract(epoch from (ts_end - ts_start))::int) stored,\n  reason_code_id uuid,                    -- casi siempre NULL al principio\n  source         text        not null,    -- plc · scada · mes · manual · derivado\n  confidence     smallint    not null default 100,\n  payload        jsonb       not null default '{}'\n);\n```\n\n`reason_code_id` nace nulo en casi todas las plantas y **eso es información, no\nun fallo**. El porcentaje de paradas sin causa es la primera métrica que enseña\nla auditoría de datos de la semana 1, y suele estar entre el 60% y el 90%.\nBajarlo del 80% al 30% es, en sí mismo, un resultado vendible del piloto: sin\ncausa no hay diagnóstico posible, ni con IA ni sin ella.\n\n**Las microparadas casi nunca vienen dadas.** Se derivan: si el contador de\npiezas no avanza durante más de `N` segundos con la máquina en marcha, es una\nmicroparada. `source = 'derivado'` y `confidence` por debajo de 100. Ese cálculo\nderivado es una de las cosas que más sorprende al cliente en la demo, porque es\npérdida que él sabe que existe y nunca ha podido medir.\n\n### `alert` — el producto, en una tabla\n\n```sql\ncreate table alert (\n  id                uuid primary key default gen_random_uuid(),\n  tenant_id         uuid        not null,\n  site_id           uuid        not null,\n  asset_node_id     uuid,\n  module            text        not null,  -- production · maintenance · energy · …\n  severity          text        not null,  -- critica · alta · media · baja\n  confidence        smallint    not null,  -- 0-100, y se muestra\n  title             text        not null,  -- una línea, sin jerga\n  what_changed      text        not null,\n  why               text,                  -- causa probable, puede ser NULL\n  impact_eur_year   numeric(12,2),\n  impact_basis      jsonb       not null,  -- la cuenta, abierta\n  recommended_action text,\n  evidence          jsonb       not null,  -- señales, ventanas, documentos\n  status            text        not null default 'abierta',\n  feedback          text,                  -- util · no_era_nada · ya_lo_sabia\n  detected_at       timestamptz not null default now(),\n  ...\n);\n```\n\n`impact_basis` y `evidence` son obligatorios y no aceptan `{}`. **Una alerta sin\nla cuenta abierta y sin sus fuentes no se inserta.** Es una restricción del\nesquema, no una buena intención del equipo de frontend.\n\n`feedback` es lo que cierra el bucle de aprendizaje del punto 14 del flujo de\ndatos. Sin esa columna no hay forma de reducir los falsos positivos, y los falsos\npositivos son la causa número uno de abandono de este tipo de producto.\n\n---\n\n## 5. Dos asuntos legales que son decisiones de esquema\n\n**Operarios y RGPD.** `operator` identifica a una persona trabajadora, y cruzar\nproductividad con nombre y apellidos es tratamiento de datos personales en\ncontexto laboral: en España entra en el ámbito del Estatuto de los Trabajadores y\nexige informar a la representación legal. **Decisión:** el rendimiento por\noperario se guarda seudonimizado por defecto, la reidentificación es un permiso\naparte y queda registrada en auditoría. Se ofrece un modo agregado —solo por\nturno o por equipo— que es el que se activa de fábrica. Y el contrato incluye el\nanexo de encargado del tratamiento.\n\n**Retención.** El dato crudo de alta frecuencia se comprime a los 7 días y se\nreduce a los 90 (se conservan agregados de minuto, no muestras de 5 s). Los\neventos, las alertas y las órdenes se guardan 5 años, porque son la trazabilidad\nque el cliente puede necesitar en una auditoría o una reclamación. Guardar\nmuestras de 5 segundos durante tres años multiplica el coste de almacenamiento\nsin que nadie las mire jamás.\n","bytes":11623,"lineas":248,"lenguaje":null,"para":"Entidades y relaciones, y las cuatro decisiones que gobiernan el esquema.","chip":null,"chipTono":null,"estado":null},"doc/04-pantallas.md":{"texto":"# 04 · Pantallas\n\n## 1. La regla de los 30 segundos\n\nEl director de planta abre la aplicación a las 7:40, con el café en la mano y de\npie. Tiene que salir de ahí sabiendo tres cosas: **si hay problema, dónde, y\ncuánto cuesta.** Todo lo demás de la aplicación existe para cuando alguien decide\nprofundizar, y ese alguien es minoría.\n\nDe ahí tres reglas de diseño que no se negocian pantalla a pantalla:\n\n- **Un número que no se puede accionar no ocupa espacio destacado.**\n- **Nunca más de cinco elementos en \"Atención hoy\".** Si hay quince problemas,\n  el trabajo del producto es decidir cuáles son los cinco que importan. Una lista\n  de quince es una lista que no se lee.\n- **Todo número es pinchable hasta el dato crudo.** Sin excepción y sin\n  callejones sin salida.\n\n---\n\n## 2. Sitemap\n\n```\n/                          ESTADO DE PLANTA        ← la pantalla de los 30 s\n/alertas                   todas, con filtros e histórico\n/alertas/:id               ficha: qué, por qué, cuánto, qué hacer\n/copilot                   conversación a pantalla completa\n\n/produccion                PRODUCTION RADAR\n  /produccion/lineas       comparativa entre líneas\n  /produccion/turnos       comparativa entre turnos\n  /produccion/oee          OEE desglosado y sus pérdidas\n  /produccion/paradas      análisis de paradas y microparadas\n\n/mantenimiento             MAINTENANCE RADAR\n  /mantenimiento/activos   listado con Asset Health Score\n  /mantenimiento/ordenes   órdenes de trabajo\n/energia                   ENERGY RADAR\n/calidad                   QUALITY RADAR\n/proveedores               SUPPLIER RADAR\n/conocimiento              FACTORY BRAIN — buscar y preguntar\n\n/activos/:id               FICHA DE ACTIVO — el hub de una máquina\n/informes                  informes programados y descargas\n\n/ajustes/planta            jerarquía, líneas, máquinas, señales\n/ajustes/turnos            calendario y patrones\n/ajustes/productos         productos, ciclos nominales, márgenes\n/ajustes/causas            catálogo de causas de parada\n/ajustes/conectores        estado de las fuentes de dato\n/ajustes/alertas           umbrales, destinatarios, horarios, escalado\n/ajustes/usuarios          usuarios, roles y permisos\n/ajustes/integraciones     ERP, GMAO, Teams, correo\n\n/admin                     SUPERADMIN (fuera del inquilino)\n  /admin/clientes          altas, licencias, plantas\n  /admin/conectores        salud de todos los conectores\n  /admin/ia                consumo, coste y latencia por cliente\n  /admin/errores           incidencias de la plataforma\n```\n\n---\n\n## 3. La pantalla principal\n\n```\n┌──────────────────────────────────────────────────────────────────────────┐\n│  RADACTORY      Planta Torrelavega ▾        [Pregunta a tu fábrica]  │\n├──────────────────────────────────────────────────────────────────────────┤\n│                                                                          │\n│  ESTADO DE PLANTA                        martes 9 · 07:41 · turno mañana │\n│                                                                          │\n│  ┌─────────┐ ┌─────────┐ ┌─────────┐ ┌─────────┐ ┌─────────┐ ┌────────┐ │\n│  │PRODUCCIÓN││   OEE   ││ CALIDAD ││ RECHAZOS││ENERGÍA/UD││CRÍTICAS│ │\n│  │  92%    ││  78%    ││ 96,2%   ││  3,8%   ││  +11%   ││   2    │ │\n│  │ objetivo││   ▼ −4  ││  ▲ +0,3 ││  ▲ +0,9 ││   ▼     ││ máquinas│ │\n│  └─────────┘ └─────────┘ └─────────┘ └─────────┘ └─────────┘ └────────┘ │\n│                                                                          │\n│  ATENCIÓN HOY                                            5 de 12  ver →  │\n│                                                                          │\n│  ┌──────────────────────────────────────────────────────────────────┐   │\n│  │ ● CRÍTICA   LÍNEA 3 · rendimiento −14%                            │   │\n│  │             Microparadas recurrentes en la estación P4 desde el   │   │\n│  │             martes. 47 por turno frente a 6 habituales.           │   │\n│  │             ≈ 8.900 €/semana        Revisar alimentador de P4  →  │   │\n│  ├──────────────────────────────────────────────────────────────────┤   │\n│  │ ● ALTA      COMPRESOR 02 · consumo +18% sobre media de 30 días    │   │\n│  │             Consume 38 kW con la planta parada.                   │   │\n│  │             ≈ 16.055 €/año          Programar parada nocturna  →  │   │\n│  ├──────────────────────────────────────────────────────────────────┤   │\n│  │ ● ALTA      PROVEEDOR ZETA · 61% de los defectos de la semana     │   │\n│  │             Concentrados en el lote L-4471.                       │   │\n│  │             ≈ 11.400 €             Bloquear lote y reclamar    →  │   │\n│  ├──────────────────────────────────────────────────────────────────┤   │\n│  │ ● MEDIA     EMBOTELLADORA 2 · salud 61/100 (−14 en 30 días)       │   │\n│  │ ● MEDIA     TURNO NOCHE · 8% menos de rendimiento en PROD-X       │   │\n│  └──────────────────────────────────────────────────────────────────┘   │\n│                                                                          │\n│  IMPACTO ACUMULADO DETECTADO ESTE MES              47.300 €     ver →    │\n└──────────────────────────────────────────────────────────────────────────┘\n```\n\n**Lo que hace que esta pantalla funcione:**\n\n- **Seis indicadores, ni uno más.** Cada uno con su flecha de tendencia, porque\n  el nivel sin tendencia no es accionable.\n- **Cada alerta cabe en tres líneas** y termina en un euro y en un verbo.\n- **\"Impacto acumulado detectado este mes\"** es el marcador de la renovación. Es\n  el número que el director de planta le enseña a su gerente, y el que hace que\n  no se cuestione la factura.\n- **Sin gráficas.** Las gráficas están un clic más adentro. Una gráfica en la\n  pantalla de los 30 segundos es una invitación a interpretar, y interpretar es\n  justo el trabajo que le estamos quitando.\n\n---\n\n## 4. Ficha de alerta\n\n```\n┌──────────────────────────────────────────────────────────────────────────┐\n│  ← Atención hoy                                       ● CRÍTICA · abierta │\n│                                                                          │\n│  LÍNEA 3 · el rendimiento cayó del 88% al 74%                            │\n│  Detectado el 9 sep 07:15 · confianza 87%                                │\n│                                                                          │\n│  QUÉ HA CAMBIADO                                                         │\n│  ┌────────────────────────────────────────────────────────────────────┐ │\n│  │  100% ┤                                                             │ │\n│  │       │ ▁▂▃▂▃▂▃▂▃▂▃▂▃▂  línea base 88%                             │ │\n│  │   75% ┤                ╲▁▁▂▁▁▂▁                                     │ │\n│  │       └──────────────────┬─────────────────────                     │ │\n│  │       26 ago          2 sep ▲ cambio a REF-2210        9 sep        │ │\n│  └────────────────────────────────────────────────────────────────────┘ │\n│                                                                          │\n│  POR QUÉ (causa probable)                                                │\n│  47 microparadas por turno en la estación P4, frente a 6 de media.       │\n│  Duración de 40 a 90 s. Empiezan el 2 de septiembre, coincidiendo con    │\n│  el cambio a REF-2210. La misma referencia no dio problema en la línea 1.│\n│                                                                          │\n│  CUÁNTO CUESTA                                    8.900 €/semana         │\n│  ┌────────────────────────────────────────────────────────────────────┐ │\n│  │  1.240 uds/semana perdidas × 7,18 € de margen unitario = 8.903 €   │ │\n│  │  Unidades perdidas = (88% − 74%) × 4.430 uds de capacidad semanal  │ │\n│  │  Margen unitario: ficha de PROD-X · actualizado 1 sep         ver →│ │\n│  └────────────────────────────────────────────────────────────────────┘ │\n│                                                                          │\n│  QUÉ HACER                                                               │\n│  1. Revisar el ajuste del alimentador de P4 para el formato REF-2210     │\n│  2. Comparar parámetros con la línea 1, que fabrica lo mismo sin fallo   │\n│  3. Comprobar el parte 2025-0871, con un síntoma parecido en 2025        │\n│                                                                          │\n│  [ Crear orden de mantenimiento ]  [ Avisar a producción ]  [ Descartar ]│\n│                                                                          │\n│  FUENTES  contador L3-P4 · eventos 2–9 sep · ficha PROD-X · parte 2025-0871│\n│  ¿Ha sido útil?   [ Sí ]  [ No era nada ]  [ Ya lo sabía ]               │\n└──────────────────────────────────────────────────────────────────────────┘\n```\n\nEsta es la pantalla más importante del producto entero. **Es la que demuestra\nque no somos un cuadro de mando**: qué cambió, por qué, cuánto cuesta con la\ncuenta abierta, qué hacer, de dónde sale, y un botón que ejecuta.\n\nLos tres botones de feedback del pie parecen un detalle y no lo son: son el único\nmecanismo que tiene el sistema para dejar de equivocarse.\n\n---\n\n## 5. Ficha de activo\n\nEl hub de una máquina. Todo lo que la plataforma sabe de ella, en un sitio:\n\n```\n┌──────────────────────────────────────────────────────────────────────────┐\n│  EMBOTELLADORA 2          Línea 3 · KRONES · Contiform 3        ● en marcha│\n│                                                                          │\n│  SALUD 61/100  ▼ −14 en 30 días        [ Producción ][ Mantenimiento ]   │\n│  ┌──────────────────────────────────┐  [ Energía ][ Alarmas ][ Docs ]    │\n│  │ Fiabilidad     72  ▬▬▬▬▬▬▬░░░    │                                    │\n│  │ Comportamiento 44  ▬▬▬▬░░░░░░    │  OEE 30 días        74%            │\n│  │ Mantenimiento  81  ▬▬▬▬▬▬▬▬░░    │  MTBF               186 h  ▼       │\n│  │ Criticidad     55  ▬▬▬▬▬░░░░░    │  MTTR               2,4 h          │\n│  └──────────────────────────────────┘  Coste parada/h     3.200 €        │\n│  Baja por comportamiento: el consumo específico sube un 18% y hay        │\n│  3 alarmas de presión nuevas este mes.                        ¿cómo? →   │\n└──────────────────────────────────────────────────────────────────────────┘\n```\n\nEl enlace **\"¿cómo?\"** al l
