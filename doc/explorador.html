ado de cada puntuación abre la fórmula con los valores\nde esta máquina. Aparece siempre, en todas las puntuaciones de la plataforma.\n*Nunca se muestra un score sin explicar cómo se calcula* — es regla de producto,\nno una mejora futura.\n\n---\n\n## 6. AI Copilot\n\nPresente en toda la aplicación como campo persistente arriba: **\"Pregunta a tu\nfábrica\"**. Se abre en panel lateral sin perder el contexto de la pantalla, y esa\npantalla forma parte del contexto de la pregunta: preguntar \"¿y la semana\npasada?\" estando en la Línea 3 tiene que funcionar.\n\n```\n┌─────────────────────────────────────────────────┐\n│  ¿Por qué ha bajado el OEE esta semana?         │\n├─────────────────────────────────────────────────┤\n│  El OEE de la planta bajó del 82% al 78%        │\n│  (−4 puntos) entre el 2 y el 8 de septiembre.   │\n│                                                 │\n│  El 74% de la caída viene de la Línea 3:        │\n│  microparadas en P4 desde el cambio a REF-2210. │\n│  El resto se reparte entre una avería del       │\n│  compresor el jueves (−0,7) y un arranque lento │\n│  del turno de noche (−0,3).                     │\n│                                                 │\n│  ┌───────────────────────────────────────────┐  │\n│  │ OEE por línea · 2–8 sep                   │  │\n│  │ L1 ▬▬▬▬▬▬▬▬▬ 84%                          │  │\n│  │ L2 ▬▬▬▬▬▬▬▬  81%                          │  │\n│  │ L3 ▬▬▬▬▬▬    74%  ▼                       │  │\n│  └───────────────────────────────────────────┘  │\n│                                                 │\n│  Fuentes: métricas 2–8 sep · eventos L3 ·       │\n│  alerta #4471                          ver →    │\n│                                                 │\n│  ¿Quieres que abra una orden para P4?           │\n└─────────────────────────────────────────────────┘\n```\n\n**Las reglas del Copilot:**\n- Consulta el dato real. **No estima nunca.** Si no puede consultarlo, lo dice.\n- Cita siempre las fuentes internas, pinchables.\n- Devuelve el gráfico junto al texto cuando ayuda, no en lugar del texto.\n- Puede proponer una acción; ejecutarla exige confirmación explícita.\n- Si la pregunta no se puede contestar con los datos que hay, **explica qué dato\n  falta**. Esa respuesta es comercialmente valiosa: es la que justifica subir un\n  peldaño en la escalera de ingesta.\n\n---\n\n## 7. Estados vacíos, de error y de dato insuficiente\n\nEs la parte que casi siempre se deja para el final y la que decide la confianza\nen las primeras dos semanas — que son justo las semanas en que el cliente decide\nsi esto va a funcionar.\n\n| Situación | Qué se muestra |\n|---|---|\n| **Planta recién creada** | Asistente de 4 pasos: jerarquía → señales → turnos → productos. Con barra de progreso y datos de ejemplo hasta que llegue el real |\n| **Sin dato todavía** | *\"Aún no hay lecturas de esta máquina. El conector se dio de alta hace 2 h; la primera lectura suele tardar.\"* Con estado del conector, no un gráfico vacío |\n| **Dato con huecos** | El gráfico dibuja el hueco **como hueco**, con una franja gris y \"sin dato\". Jamás se une la línea por encima de un vacío |\n| **Cobertura insuficiente** | *\"OEE calculado sobre el 62% del turno. Faltan datos de 06:00 a 09:10.\"* El número se muestra atenuado |\n| **Sin causas de parada** | *\"El 84% de las paradas no tienen causa registrada. Sin causa no podemos diagnosticar.\"* Con enlace a cómo empezar a registrarlas |\n| **Muestra pequeña** | La correlación se marca como \"señal débil\" y no genera alerta |\n| **Conector caído** | Aviso en la cabecera, no enterrado en ajustes. Con desde cuándo y qué se ve afectado |\n| **La IA no sabe** | *\"No tengo información suficiente para responder.\"* Nunca se rellena el hueco con verosimilitud |\n| **Sin permiso** | Se explica qué rol hace falta y a quién pedirlo. No un 403 seco |\n\n---\n\n## 8. Sistema visual\n\n**El contexto manda.** Esto se mira en una oficina de planta con luz de nave, a\nveces en una tablet con guantes, a veces en una pantalla de 55\" colgada en el\ntaller y vista a tres metros. Nada de gris claro sobre blanco.\n\n```\nFONDO         #0E1116  oscuro por defecto — pantalla de taller, turno de noche\n              claro disponible, mismo contraste\nTEXTO         #E8EDF2 principal · #93A1B0 secundario\n\nCRÍTICA       #E5484D    ALTA      #F5A524\nMEDIA         #3E9EFF    BAJA      #7C8794\nBIEN          #46C68A    NEUTRO    #93A1B0\n\nDATO          #FFFFFF sobre fondo oscuro, siempre el elemento de más contraste\nLÍNEA BASE    #93A1B0 discontinua\nHUECO         franja rayada, nunca interpolada\n```\n\n**Tipografía.** Una sola familia con buena caja de números. Los números tabulares\nson obligatorios en tablas: si las cifras bailan al actualizarse, la tabla se\nvuelve ilegible. Números grandes y con peso: la cifra es el contenido, la\netiqueta es el marco.\n\n**Reglas de gráfica.** Máximo cuatro series por gráfica. La línea base siempre\npresente, discontinua. El eje Y no empieza en cero solo cuando se está mirando\nuna desviación, y entonces se dice. Nada de gradientes, sombras ni 3D.\n\n**Accesibilidad.** El color nunca es el único portador de significado: la\nseveridad lleva color, forma e icono. Contraste mínimo AA. Es un requisito real:\nen industria hay bastantes daltónicos y el 8% de la población masculina es mucha\ngente en una plantilla de planta.\n\n**Responsive, con dos usos distintos.** El escritorio es para analizar. El móvil\nes para el técnico delante de la máquina: en móvil manda \"Atención hoy\", la ficha\nde activo y el Factory Brain, y las comparativas amplias se degradan a tabla.\n","bytes":20060,"lineas":297,"lenguaje":null,"para":"Sitemap, wireframes, estados vacíos y el sistema visual del panel.","chip":null,"chipTono":null,"estado":null},"doc/05-integraciones.md":{"texto":"# 05 · Integraciones\n\n## 1. El principio: nos adaptamos nosotros\n\nLa frase que abre la web pública —**\"No cambies tu fábrica\"**— es una promesa\ntécnica, no un eslogan. Significa que el coste de adaptación lo pagamos nosotros:\nsi el cliente lleva ocho años apuntando la producción en un Excel con una\nestructura rara, leemos ese Excel con su estructura rara.\n\nCorolario incómodo, y hay que asumirlo: **cada cliente trae entre 2 y 5 días de\ntrabajo de mapeo que no se automatiza.** Eso no es deuda técnica, es el servicio,\ny por eso la implantación se factura aparte (ver `09-comercial.md`). Fingir que\nla integración es \"de un clic\" es la mentira que hunde los pilotos industriales.\n\n---\n\n## 2. Qué se conecta y con qué prioridad\n\n| Sistema | Qué aporta | Cómo se lee | Fase |\n|---|---|---|---|\n| **Excel / CSV** | Producción, partes, consumos, calidad. Lo único que hay el día 1 | Carpeta vigilada, SFTP o subida al panel | MVP |\n| **Historiador / SCADA (SQL)** | Contadores, estados, alarmas, analógicas | Usuario de **solo lectura** sobre su base | MVP |\n| **ERP** (SAP B1, Sage, Odoo, Navision, a medida) | Órdenes, productos, costes, compras, proveedores | API si la tiene; si no, vista SQL o exportación programada | MVP |\n| **GMAO** (Prisma, Fracttal, Rosmiman, Excel) | Órdenes, preventivo, repuestos, horas | API o exportación | Fase 2 |\n| **MES**, si existe | Producción con contexto y causas. La mejor fuente | API o base | Fase 2 |\n| **Sensórica IoT** | Lo que no está medido: energía, vibración, temperatura | MQTT | Fase 2 |\n| **PLC / OPC UA** | Tiempo real de verdad | OPC UA, suscripción de solo lectura | Fase 2 |\n| **Analizadores de red** | Energía por cuadro y por máquina | Modbus TCP o MQTT | Fase 2 |\n| **LIMS / calidad** | Ensayos y resultados | API o exportación | Fase 3 |\n| **WMS / TMS** | Stock, expediciones, transporte | API | Fase 3 |\n| **CRM** | Reclamaciones de cliente ligadas a lote | API | Fase 3 |\n| **Correo del proveedor** | Albaranes y facturas en PDF | Buzón dedicado | Fase 4 |\n| **PLC directo (Modbus)** | Máquina antigua sin nada encima | Modbus TCP, registros declarados a mano | Fase 3 |\n\n**Modbus el último, a pesar de ser el más fácil de hablar.** Es fácil de leer y\ndifícil de interpretar: un registro es un número sin nombre ni unidad, y alguien\ntiene que declarar a mano qué significa cada uno, máquina a máquina. Coste alto y\npoco reutilizable entre clientes.\n\n---\n\n## 3. Cómo se mapea una fuente\n\nCuatro pasos, siempre los mismos, y los tres primeros los hace la plataforma:\n\n```\n1  DESCUBRIR    se lee una muestra y se propone la estructura detectada\n2  MAPEAR       cada columna o tag → señal, unidad, activo, contexto\n3  VALIDAR      contra dato conocido: \"esto dice 1.240 uds, ¿tu parte también?\"\n4  VIGILAR      si la fuente cambia de forma, salta aviso; no se ingiere basura\n```\n\nEl paso 3 es el que casi nadie hace y el que evita el desastre clásico: llevar\ntres semanas ingiriendo un contador acumulativo tratándolo como incremental.\n**Ningún mapeo se da por bueno sin cuadrar contra un dato que el cliente ya\nconoce y da por cierto.**\n\nEl paso 4 tampoco es opcional. Las fuentes de una fábrica cambian sin avisar:\nalguien añade una columna al Excel, el SCADA se actualiza y renombra un tag. Si\nel sistema no lo detecta, sigue calculando con datos mal alineados y nadie se\nentera hasta que el número es absurdo.\n\n---\n\n## 4. Contrato de ingesta\n\nToda fuente, venga de donde venga, entrega el mismo sobre:\n\n```json\n{\n  \"connector_id\": \"uuid\",\n  \"sent_at\": \"2026-09-09T07:41:22Z\",\n  \"batch_id\": \"uuid\",\n  \"signature\": \"sha256...\",\n  \"measurements\": [\n    { \"signal\": \"L3.P4.contador\", \"ts\": \"...\", \"value\": 14820, \"q\": 0 }\n  ],\n  \"events\": [\n    { \"asset\": \"L3.P4\", \"type\": \"stop\", \"ts_start\": \"...\",\n      \"ts_end\": \"...\", \"reason\": null, \"source\": \"scada\" }\n  ]\n}\n```\n\n- **Idempotente por `batch_id`.** El conector puede reenviar sin miedo tras un\n  corte; el duplicado se descarta en el servidor, no en el conector.\n- **`q` viaja siempre.** La calidad del dato es parte del dato.\n- **`reason` puede ser nulo** y no invalida el evento. Es la realidad de la\n  planta, no un error de formato.\n- **Firmado.** Si no valida la firma, el lote se rechaza entero y se registra.\n\n## 5. API pública\n\nREST sobre HTTPS, autenticación por token de servicio con alcance por planta.\nSirve para tres cosas: que el cliente meta su dato sin conector (`POST\n/v1/measurements`), que lo saque para su propio BI (`GET /v1/metrics`) y que un\nsistema suyo reciba nuestras alertas (webhook firmado sobre `alert.created`).\n\nVersionada desde el primer día en `/v1/`. Cambiar de forma una respuesta que un\ncliente ya consume es una llamada de teléfono desagradable que se evita con un\nprefijo de ruta.\n","bytes":4796,"lineas":102,"lenguaje":null,"para":"La escalera de ingesta: del Excel al OPC UA, y cómo se mapea una fuente.","chip":null,"chipTono":null,"estado":null},"doc/06-inteligencia.md":{"texto":"# 06 · Inteligencia\n\n## 1. Tres capas, y solo la tercera es un LLM\n\nLa confusión más cara de este mercado es llamar \"IA\" a todo. Aquí son tres cosas\ndistintas, con costes y fiabilidades distintas:\n\n```\nCAPA 1 · REGLAS Y ESTADÍSTICA     el 70% del valor. Barata, explicable, instantánea\nCAPA 2 · MODELOS                  deriva, correlación, previsión. Cara en dato, no en cómputo\nCAPA 3 · LENGUAJE (LLM)           explicar, redactar, conversar, leer documentos\n```\n\n**La capa 3 nunca detecta.** El LLM no decide que hay una anomalía: la anomalía la\nencuentran las capas 1 y 2 sobre el dato, y el LLM la **explica en castellano**.\nAl revés —pedirle a un modelo de lenguaje que vigile una serie temporal— es caro,\nlento y produce alucinaciones sobre datos numéricos. Esta separación es la\ndecisión de arquitectura de IA más importante del producto.\n\n---\n\n## 2. Motor de eventos\n\nCorre en ciclos de 15 minutos sobre las agregaciones ya calculadas. Seis\ndetectores, del más simple al más costoso:\n\n| Detector | Qué busca | Capa |\n|---|---|---|\n| **Umbral** | Cruce de un límite absoluto configurado | 1 |\n| **Desviación** | Alejamiento de la línea base propia, por contexto | 1 |\n| **Tendencia** | Deriva sostenida (Mann-Kendall sobre ventana móvil) | 1 |\n| **Cambio de régimen** | Un antes y un después (CUSUM / detección de punto de cambio) | 2 |\n| **Correlación** | Coincidencia entre dimensiones: lote, turno, proveedor | 2 |\n| **Repetición** | El mismo patrón que ya salió N veces | 1 |\n\n**La línea base es por contexto, no global.** El consumo de la Línea 3 fabricando\nPROD-X en el turno de mañana no es comparable con esa misma línea fabricando\nPROD-Y de noche. Una línea base global genera falsos positivos en cada cambio de\nformato, y a las dos semanas nadie mira las alertas. Por eso la clave de\n`baseline` es `(señal, producto, turno, ventana)` y hace falta un mínimo de\nmuestras por combinación antes de detectar nada.\n\n**Cada evento nace con seis campos obligatorios:**\n\n```\nsource              de qué dato sale\ntimestamp           cuándo se detecta y qué ventana cubre\nasset               qué nodo de la planta\nseverity            crítica · alta · media · baja\nconfidence          0-100, y se muestra al usuario\nimpact              euros, con la cuenta abierta en impact_basis\nrecommended_action  qué hacer, en imperativo\n```\n\n### Cómo se decide la severidad\n\nNo por lo grande que sea la desviación estadística, sino por dinero y por\nurgencia. Un 40% de desviación en una máquina auxiliar parada es menos grave que\nun 6% en la línea principal.\n\n```\nseveridad = f(impacto en €, criticidad del activo, velocidad de la deriva,\n              reversibilidad, confianza)\n```\n\n**Y hay tope duro de volumen: como máximo 5 críticas por planta y semana.** Si el\nmotor genera más, es que el umbral está mal calibrado, y el sistema lo señala\ncomo problema de configuración en vez de inundar al usuario. Una bandeja con 40\nalertas críticas es una bandeja cerrada.\n\n---\n\n## 3. Puntuaciones\n\nCinco puntuaciones, todas de 0 a 100, todas con la misma regla:\n**nunca se muestra una sin poder abrir la fórmula con los valores reales.**\n\n```\nFACTORY HEALTH SCORE    0,30 producción + 0,25 calidad\n                      + 0,20 activos    + 0,15 energía + 0,10 suministro\nMACHINE HEALTH SCORE    0,35 fiabilidad + 0,25 comportamiento\n                      + 0,20 mantenimiento + 0,20 criticidad\nENERGY EFFICIENCY       kWh/ud contra la mejor marca propia, no contra el sector\nQUALITY SCORE           0,40 primera pasada + 0,30 scrap\n                      + 0,20 reclamaciones + 0,10 tendencia\nSUPPLIER SCORE          0,30 calidad + 0,25 puntualidad + 0,20 precio\n                      + 0,15 respuesta + 0,10 cumplimiento\n```\n\n**Contra sí mismo, no contra el sector.** No tenemos una referencia sectorial\nhonesta y fabricar una sería mentir. El mejor comparador de una planta es su\npropio mejor mes, y además es el que no admite discusión en la reunión.\n\n**Los pesos son configurables por cliente** —una planta con un cuello de botella\nenergético querrá más peso en energía— pero se muestran siempre y el cambio queda\nen auditoría. Un score que se puede ajustar en secreto no vale nada.\n\n---\n\n## 4. AI Copilot\n\nUn patrón de recuperación sobre el dato estructurado, no un modelo suelto:\n\n```\n1  Se interpreta la pregunta            intención + entidades + ventana temporal\n2  Se traduce a consultas               plantillas parametrizadas, NUNCA SQL libre\n3  Se ejecutan sobre el inquilino       con el rol del usuario que pregunta\n4  Se compone la respuesta              con los resultados reales en el contexto\n5  Se citan las fuentes                 obligatorio, pinchable\n6  Se registra todo                     en ai_analysis\n```\n\n**El paso 2 es de seguridad, no de comodidad.** Dejar que un LLM escriba SQL libre\ncontra la base de un cliente industrial es inaceptable: por inyección, por fugas\nentre inquilinos y por consultas que tumban la base. Se usa un catálogo de\nconsultas parametrizadas —al arrancar, unas 40 plantillas cubren la práctica\ntotalidad de lo que se pregunta— y lo que no encaja en ninguna se responde con\n*\"no sé contestar a eso todavía\"*, quedando registrado como hueco. Ese registro es\nel backlog del Copilot, escrito por los propios usuarios.\n\n**Y el rol del usuario se aplica en la consulta.** Un operario no puede\npreguntarle al Copilot algo que no vería en pantalla. La IA no es una puerta\ntrasera a los permisos.\n\n---\n\n## 5. Factory Brain (RAG)\n\n**Ingesta.** Documento → extracción (texto, tablas, OCR si es escaneo) →\ntroceado por secciones con solapamiento → embedding → `doc_chunk`. Los esquemas y\nlas fotos se describen con un modelo de visión y se indexa esa descripción junto\nal original.\n\n**Metadatos de filtrado**, que en industria importan más que la propia búsqueda\nsemántica:\n\n```\nsite · asset_node · fabricante · modelo · tipo_documento · versión ·\nidioma · vigente_desde · vigente_hasta\n```\n\n**Por qué la versión es crítica.** Si el manual tiene tres revisiones, responder\ncon la vigente y no con la de 2011 puede ser la diferencia entre una reparación y\nun accidente. La revisión obsoleta se conserva —hace falta para leer partes\nantiguos— pero se marca y **nunca se cita como vigente**.\n\n**Recuperación híbrida**, y las dos mitades hacen falta: semántica con pgvector\npara el lenguaje del técnico, y léxica exacta para los códigos —`E42`, `S3`,\n`REF-2210`— que un embedding tiende a difuminar. Después se reordena y se filtra\npor planta y activo.\n\n**Prioridad de fuentes**, en este orden:\n\n```\n1  Partes históricos de ESTA máquina en ESTA planta      lo que ya funcionó aquí\n2  Procedimientos propios de la planta                   cómo se hace aquí\n3  Manual del fabricante de ESTE modelo                  la referencia\n4  Partes de máquinas equivalentes en otras plantas del mismo cliente\n5  Conocimiento general del modelo                       siempre marcado como tal\n```\n\n**Los tres guardarraíles.** Sin fuente no hay respuesta. Si no hay contexto\nsuficiente, se dice explícitamente y se ofrece lo más parecido. Y cualquier\ninstrucción que implique intervenir sobre un equipo remite al procedimiento de\nconsignación de la planta, sin excepción.\n\n---\n\n## 6. Coste y control de la IA\n\nCada llamada se registra con su coste. Sin esto no hay negocio: un cliente que\nusa el Copilot cien veces al día puede costar más de lo que paga.\n\n- **Presupuesto por inquilino y mes**, con aviso al 80% y degradación elegante\n  —modelo más barato— antes que corte seco.\n- **Caché de respuestas** para preguntas repetidas sobre la misma ventana de\n  datos. En la práctica, media planta pregunta lo mismo cada lunes.\n- **Enrutado por tarea**: clasificar y resumir con el modelo barato; diagnosticar\n  y conversar con el capaz.\n- **Los diagnósticos se generan una vez por alerta**, no cada vez que alguien la\n  abre.\n- **El panel de superadmin muestra coste por cliente**, para que la conversación\n  de precio se tenga con datos.\n","bytes":8117,"lineas":184,"lenguaje":null,"para":"Motor de eventos, puntuaciones, Copilot y Factory Brain. Qué hace el LLM y qué no.","chip":null,"chipTono":null,"estado":null},"doc/07-seguridad.md":{"texto":"# 07 · Seguridad\n\n## 1. Por qué esto va antes que las funcionalidades\n\nEn un proyecto industrial, el responsable de IT no compra: **veta**. Y veta en la\nsegunda reunión, cuando aparece la palabra \"nube\" junto a la palabra \"PLC\". Si la\nrespuesta a \"¿qué puertos hay que abrir?\" no es *\"ninguno\"*, el proyecto muere\nahí, por bueno que sea el producto.\n\nAdemás, desde la transposición de **NIS2**, buena parte de la industria\nmanufacturera de cierto tamaño —y toda la que suministra a sectores esenciales—\ntiene obligaciones formales de gestión del riesgo de sus proveedores digitales.\nNuestro cliente tendrá que justificarnos ante su propio auditor. La seguridad no\nes un coste: es lo que hace que nos puedan comprar.\n\n---\n\n## 2. La frontera OT/IT\n\n**La regla, en una frase: el dato sube y nunca baja.**\n\n```\n   RED OT (planta)          │        DMZ            │       CLOUD\n                            │                       │\n   PLC · SCADA · sensores   │  EDGE CONNECTOR       │   INGESTA\n                            │                       │\n   ── lectura ─────────────►│                       │\n                            │  ── TLS mutuo ───────►│   443 saliente\n                            │                       │\n   ◄── NADA ────────────────│◄── NADA ──────────────│\n```\n\nLo que esto obliga en el diseño:\n\n1. **El conector vive en la DMZ industrial**, no en la red OT plana, y **nunca**\n   con doble tarjeta hacia OT y hacia internet a la vez sin cortafuegos entre\n   medias. Si el cliente no tiene DMZ, forma parte del alcance de la implantación\n   crear una: es una hora de trabajo en el cortafuegos y cambia la conversación\n   con IT por completo.\n2. **Cero puertos entrantes.** El conector inicia siempre él la conexión. No hay\n   VPN entrante, ni túnel inverso permanente, ni escritorio remoto para\n   soportarlo. El mantenimiento remoto se hace con una sesión que **abre el\n   cliente**, con caducidad.\n3. **Cuentas de solo lectura** en todo lo que se lee: SQL, OPC UA, API. Se pide\n   así por escrito y se comprueba.\n4. **El conector no tiene código de escritura.** Auditable en el repositorio.\n5. **Se cae hacia el lado seguro.** Ante la duda, deja de leer; nunca reintenta\n   de forma agresiva contra un equipo de planta, porque saturar un PLC antiguo\n   con peticiones puede afectar al ciclo de scan. Cadencia de lectura conservadora\n   y configurable a la baja.\n\n---\n\n## 3. Aislamiento multiinquilino\n\nTres barreras, porque la primera se olvida algún día:\n\n| Barrera | Qué hace |\n|---|---|\n| **1 · RLS de Postgres** | Cada sesión fija su `tenant_id`. La base no devuelve filas de otro inquilino aunque la consulta esté mal escrita |\n| **2 · Alcance en la aplicación** | Toda consulta pasa por un repositorio que exige contexto de inquilino. Sin él, no compila |\n| **3 · Pruebas automáticas** | Batería de fugas en CI: cada endpoint se prueba con el token del inquilino A pidiendo un identificador del B. Debe devolver 404, nunca 403 — un 403 confirma que el recurso existe |\n\nEl almacenamiento de documentos va por prefijo de inquilino con URLs firmadas y\ncaducas. Los embeddings llevan `tenant_id` y **se filtra antes de la búsqueda\nvectorial, no después**: filtrar después es una fuga esperando su turno.\n\n**Enterprise puede exigir base dedicada.** Está previsto en el modelo de\ndespliegue, y se cobra.\n\n---\n\n## 4. Identidad, accesos y trazabilidad\n\n- **MFA obligatorio** para `company_admin` y `superadmin`. Recomendado para el\n  resto; exigible por política del cliente.\n- **SSO (SAML / OIDC)** en el plan Enterprise. Es requisito de compra habitual a\n  partir de cierto tamaño.\n- **RBAC con ocho roles** (ver `04-pantallas.md`), con permisos por planta: un\n  jefe de línea de Torrelavega no ve Reinosa.\n- **Auditoría inmutable**: acceso, cambio de configuración, cambio de umbral,\n  acción ejecutada, reidentificación de un operario, consulta al Copilot. Con\n  quién, cuándo, desde dónde y sobre qué. En tabla append-only.\n- **Cuentas de taller.** Realidad de planta: en el turno de noche hay un PC\n  compartido. En vez de fingir que no pasa, se ofrece un modo quiosco de solo\n  lectura sin datos de coste ni de personal, y las acciones exigen identificarse.\n\n## 5. Cifrado, secretos y respaldo\n\nTodo cifrado en tránsito (TLS 1.3, mTLS para el conector) y en reposo (disco\ncifrado, y cifrado por columna en lo sensible: credenciales de fuentes de datos y\nreidentificación de operarios). Los secretos nunca en el código ni en variables\nde entorno del contenedor de aplicación: gestor de secretos, con rotación\ntrimestral y rotación inmediata ante sospecha.\n\nRespaldo diario cifrado con **restauración probada mensualmente**. Un respaldo que\nno se ha restaurado nunca no es un respaldo. Objetivos: RPO 24 h, RTO 4 h para el\npanel; la ingesta aguanta sola 7 días gracias al buffer del conector, que es\njustamente para lo que está.\n\n---\n\n## 6. Marcos normativos: qué se hace ahora y qué después\n\n| Marco | Qué exige de nosotros | Cuándo |\n|---|---|---|\n| **RGPD / LOPDGDD** | Encargado del tratamiento, seudonimización de operarios, retención, derechos | **Desde el día 1.** No es opcional ni aplazable |\n| **NIS2** | Nuestro cliente debe poder evaluarnos como proveedor: inventario, gestión de vulnerabilidades, notificación de incidentes | **Preparado desde el MVP**, formalizado antes del cliente 5 |\n| **IEC 62443** | Segmentación, zonas y conductos, componente seguro por diseño | **Arquitectura conforme desde el día 1.** Certificación de componente (62443-4-2) cuando la pida un cliente y la pague |\n| **ISO 27001** | SGSI, políticas, riesgos, auditoría | **Prácticas desde el principio**, certificación en el mes 12–18 |\n| **CSRD / huella** | Que el dato energético sea auditable y trazable | Es una funcionalidad vendible de Energy Radar |\n\n**La decisión.** Se diseña conforme desde el principio, porque reformar\narquitectura para certificar cuesta diez veces más que hacerla bien. Pero **no se\ncertifica antes de tener clientes**: una ISO 27001 sin producto vendido son\n30.000 € y seis meses gastados en el orden equivocado. Se certifica cuando el\nprimer cliente grande lo ponga como condición — y para entonces ya lo paga él.\n\n**Lo que sí se hace desde el mes 1** porque es barato y se pide siempre: política\nde seguridad escrita, inventario de activos y proveedores, gestión de\nvulnerabilidades de dependencias en CI, plan de respuesta a incidentes con\nteléfonos, y un documento de dos páginas de arquitectura de seguridad para\nentregar a IT en la segunda reunión. Ese documento cierra más ventas que\ncualquier funcionalidad.\n","bytes":6816,"lineas":125,"lenguaje":null,"para":"La frontera OT/IT, el aislamiento multiempresa y los marcos normativos.","chip":null,"chipTono":null,"estado":null},"doc/08-mvp-roadmap.md":{"texto":"# 08 · MVP, priorización y roadmap\n\n## 1. El MVP, recortado\n\nEl planteamiento inicial proponía nueve piezas. Como equipo, recortamos a **siete\ny media**, y explicamos qué se cae y por qué. Un MVP que tarda ocho meses no es\nun MVP: es un producto sin clientes.\n\n### Qué entra\n\n| # | Pieza | Por qué es imprescindible |\n|---|---|---|\n| 1 | **Empresa · planta · usuarios · roles** | Sin multiinquilino no hay segundo cliente, y meterlo después obliga a tocar todas las consultas |\n| 2 | **Jerarquía de planta y señales** | Es la capa de contexto: sin ella el dato no significa nada |\n| 3 | **Ingesta por CSV/Excel, SQL y API** | Las tres formas que cubren el 95% de las plantas el primer día |\n| 4 | **PRODUCTION RADAR** | OEE desglosado, paradas, microparadas derivadas, comparativas |\n| 5 | **Motor de eventos, capa 1** | Umbral, desviación sobre línea base, tendencia y repetición. Sin modelos todavía |\n| 6 | **Alertas + \"Atención hoy\" + impacto en €** | Es el producto. Lo demás es el andamio |\n| 7 | **AI Copilot con consultas parametrizadas** | Es lo que hace que la demo se recuerde, y lo que separa de un Grafana |\n| ½ | **DEMO FACTORY** | No es una funcionalidad, es la herramienta de venta. Va primero (fase C) |\n\n### Qué se cae del MVP propuesto, y por qué\n\n| Se cae | Motivo | Vuelve en |\n|---|---|---|\n| **Detección de anomalías \"avanzada\"** | Los modelos de la capa 2 necesitan meses de historial que el cliente nuevo no tiene. Con la capa 1 sobre línea base propia se acierta lo suficiente para el piloto | Fase 2 |\n| **Maintenance y Energy Radar** | Aportan mucho, pero cada uno duplica el alcance de ingesta. Production Radar valida el modelo entero con un solo dominio de dato | Fase 2 |\n| **Factory Brain** | Es el módulo que más impresiona en demo y **el más peligroso de lanzar pronto**: una respuesta inventada sobre un procedimiento de seguridad quema la confianza para siempre. Necesita el RAG bien hecho | Fase 2 |\n| **Notificaciones por WhatsApp y SMS** | Coste, alta y verificación de plantilla, sin valor diferencial. Correo y Teams cubren el MVP | Fase 2 |\n\n**El criterio del recorte:** el MVP tiene que poder **defender un euro ahorrado\nen la reunión de la semana 6 del piloto**. Todo lo que no contribuya a ese\nmomento, espera.\n\n---\n\n## 2. Matriz de priorización\n\nCada elemento del backlog puntúa de 1 a 5 en seis ejes:\n\n```\nPRIORIDAD = (Impacto × 2 + Valor económico × 2 + Facilidad)\n            ─────────────────────────────────────────────\n                    (Riesgo + Dependencias)\n```\n\nImpacto y valor económico pesan doble a propósito: en un producto joven, el error\ncaro es construir bien lo que no importa. El riesgo divide en lugar de restar\nporque una funcionalidad muy arriesgada tiene que ser **mucho** mejor que las\ndemás para justificar el turno.\n\n| Elemento | Imp | €€ | Fácil | Riesgo | Dep | **P** |\n|---|---|---|---|---|---|---|\n| Ingesta CSV/Excel | 5 | 4 | 5 | 1 | 1 | **11,5** |\n| Alertas con impacto en € | 5 | 5 | 4 | 2 | 2 | **6,0** |\n| OEE desglosado | 5 | 5 | 3 | 2 | 2 | **5,8** |\n| Microparadas derivadas | 4 | 5 | 3 | 2 | 2 | **5,3** |\n| Demo Factory | 4 | 5 | 4 | 1 | 1 | **11,0** |\n| Copilot con plantillas | 4 | 3 | 3 | 3 | 3 | **2,8** |\n| Ingesta SQL | 5 | 4 | 4 | 2 | 2 | **5,5** |\n| Asset Health Score | 4 | 4 | 3 | 2 | 3 | **3,8** |\n| Energy Radar | 4 | 5 | 3 | 2 | 3 | **4,2** |\n| Factory Brain | 5 | 3 | 2 | 5 | 3 | **2,3** |\n| OPC UA | 3 | 3 | 2 | 3 | 2 | **2,8** |\n| Operations Agent | 3 | 4 | 2 | 5 | 5 | **1,6** |\n| Predictivo por vibración | 5 | 5 | 1 | 5 | 5 | **2,1** |\n\nEl resultado confirma el orden: **ingesta sencilla y demo primero**, Factory Brain\ny predictivo al final pese a puntuar altísimo en impacto, porque su riesgo y sus\ndependencias los hacen malos candidatos para un equipo que aún no tiene clientes.\n\n---\n\n## 3. Fases de desarrollo\n\n```\nFASE A   Definición completa                          ← hecha (este repositorio)\nFASE B   Estructura real: esquema, rutas, endpoints, componentes, semillas\nFASE C   DEMO FACTORY navegable y convincente\nFASE D   MVP funcional sobre dato real\nFASE E   Primer piloto industrial (6 semanas)\nFASE F   Producto SaaS: alta autónoma, facturación, superadmin completo\nFASE G   Escalado: fase 2 de módulos, integraciones, certificaciones\n```\n\n**Ninguna fase avanza** hasta que la anterior tiene: coherencia funcional, datos,\nestados vacíos, estados de error, permisos aplicados, responsive, seguridad\nbásica y su documentación. Es la regla que evita el producto de 40 pantallas a\nmedias, que es el estado natural al que tiende este tipo de proyecto.\n\n---\n\n## 4. DEMO FACTORY\n\nFábrica ficticia, coherente y con problemas plantados. **Es el activo comercial\nmás importante de los próximos tres meses**: sin clientes, la demo *es* el\nproducto.\n\n```\nDEMO FACTORY · Planta de Torrelavega\n  3 líneas · 15 máquinas · 3 turnos · 5 productos · 90 días de histórico\n```\n\nCuatro problemas plantados, que el usuario tiene que poder descubrir navegando:\n\n| # | Problema | Dónde se ve | Qué demuestra |\n|---|---|---|---|\n| 1 | **Compresor 02** con vibración y consumo crecientes durante 6 semanas | Maintenance + Energy | Detección de deriva antes del fallo |\n| 2 | **Línea 3** con microparadas en P4 desde un cambio de formato | Production | Pérdida invisible que el cliente sabe que tiene |\n| 3 | **Proveedor ZETA**, lote L-4471, concentra el 63% de los defectos | Quality + Supplier | Correlación entre dominios |\n| 4 | **Consumo nocturno** con la planta parada | Energy | El hallazgo fácil de 16.000 €/año |\n\n**Los datos tienen que ser consistentes de verdad**, no aleatorios: si la Línea 3\npierde rendimiento, su producción baja, su consumo por unidad sube, el turno de\nnoche lo acusa más y las cuentas cuadran entre módulos. Un director de planta\ndetecta un dato falso en veinte segundos —lo lleva viendo veinte años— y una demo\nincoherente destruye la credibilidad de toda la reunión.\n\n**Modo demo público**, sin registro, desde la web comercial. Es la mejor máquina\nde generar reuniones que puede tener este producto.\n\n---\n\n## 5. Roadmap\n\n### 0–3 meses · que exista y se pueda enseñar\nFases B y C completas. Demo Factory navegable y pública. Web comercial en marcha.\nDocumento de arquitectura de seguridad listo para IT. **Objetivo: 10 reuniones\ncon plantas del perfil objetivo y 2 cartas de intención de piloto.**\n\n### 3–6 meses · que funcione con dato real\nMVP funcional. Conector Edge con SQL, CSV y API. **Primer piloto pagado de 6\nsemanas.** Cierre del bucle de feedback de alertas. Objetivo: 2 pilotos\nterminados y **un ahorro que el propio cliente cuente a un tercero**.\n\n### 6–12 meses · que se pueda vender repetido\nMaintenance y Energy Radar. Factory Brain con RAG. OPC UA y MQTT. Notificaciones\ncompletas. Superadmin y facturación. Alta guiada que no exija que estemos\ndelante. Objetivo: **8–12 clientes de pago y una implantación reproducible en dos\nsemanas.**\n\n### 12–24 meses · que aguante el crecimiento\nQuality y Supplier Radar. Back Office AI. Operations Agent con su modelo de\nautorización. Predictivo real donde haya historial. ISO 27001. Canal de\nintegradores. Segundo mercado: **Portugal y sur de Francia**, mismo perfil de\nplanta, misma propuesta.\n\n---\n\n## 6. Los cuatro riesgos que pueden matar esto\n\nConviene tenerlos escritos, porque los tres primeros ya han matado productos\nparecidos:\n\n| Riesgo | Cómo se mitiga |\n|---|---|\n| **El dato del cliente es peor de lo que dijo** | La semana 1 del piloto es auditoría de datos, y el contrato lo contempla. Si no hay dato, se dice y se cobra igual el diagnóstico |\n| **Falsos positivos y abandono** | Tope de 5 críticas por semana, línea base por contexto, botón de feedback y revisión de calibración en la semana 4 |\n| **La venta industrial es lenta** | Piloto pagado y corto como producto de entrada, en vez de suscripción anual a puerta fría |\n| **Dependencia de un LLM** | Capa de abstracción desde la primera línea, presupuesto por inquilino, y todo lo que detecta funciona sin LLM |\n\n---\n\n## 7. Descartes\n\nIdeas evaluadas y rechazadas. Se apuntan para no volver a discutirlas cada tres\nmeses:\n\n| Descartado | Motivo |\n|---|---|\n| Control o escritura sobre PLC | Otro producto, otra responsabilidad civil, otra certificación |\n| App móvil nativa | La web responsive cubre el caso del técnico. Nativa cuando haya escaneo de QR y trabajo sin cobertura |\n| Gemelo digital | Suena muy bien en un folleto y no responde a ninguna de las cuatro preguntas de la regla fundamental |\n| Marketplace de modelos | Problema de un producto con 200 clientes, no de uno con 0 |\n| Blockchain para trazabilidad | No resuelve ningún problema que el cliente tenga |\n| Visión artificial para calidad | Proyecto entero, con hardware y ciclo de venta propios. Se integra como fuente, no se construye |\n","bytes":8987,"lineas":177,"lenguaje":null,"para":"El MVP recortado, la matriz de priorización, la Demo Factory y el roadmap.","chip":null,"chipTono":null,"estado":null},"doc/09-comercial.md":{"texto":"# 09 · Comercial\n\n## 1. Precio\n\nDos conceptos separados, y separarlos es lo que hace vendible el producto:\n**implantación** (proyecto, se factura una vez) y **suscripción** (mensual).\n\nMeterlo todo en la cuota mensual obliga a un compromiso de 24 meses que un\ndirector de planta no firma en la primera compra. Cobrar la implantación aparte\npermite empezar con un piloto pequeño, y además cubre los 2–5 días reales de\nmapeo que cada cliente trae.\n\n### Planes\n\n| | **STARTER** | **PRO** | **ENTERPRISE** |\n|---|---|---|---|\n| Plantas | 1 | 1 | multi-planta |\n| Activos | hasta 20 | hasta 100 | sin límite |\n| Módulos | Production | + Maintenance, Energy | todos |\n| Ingesta | CSV, Excel, API | + SQL, MQTT, OPC UA | + integración a medida |\n| IA | Copilot básico | Copilot + diagnósticos | + Factory Brain, modelo propio |\n| Usuarios | 5 | 20 | sin límite |\n| Alertas | panel, correo | + Teams, Slack, WhatsApp | + webhook y escalado |\n| SSO / SLA | — | — | SAML/OIDC · SLA 99,5% |\n| Edge Connector | — | 1 | los que hagan falta |\n| **Mensual** | **390 €** | **890 €** | **desde 2.400 €** |\n| **Implantación** | **2.500 €** | **6.500 €** | **desde 15.000 €** |\n\n**Cómo se defiende el precio.** No por funcionalidades: por retorno. Un PRO\ncuesta 17.180 € el primer año. Una sola parada no planificada evitada en una\nlínea principal ronda los 10.000 €. **Si en el piloto no aparecen 30.000 € de\nmejora identificada, el producto no vale para esa planta y hay que decírselo.**\n\n**Añadidos que se facturan aparte:** planta adicional (+60% del plan), sensórica\ninstalada (proyecto), formación en planta, informes a medida, y consumo de IA por\nencima del incluido —con el aviso al 80%, nunca una factura sorpresa.\n\n### PILOTO — el producto de entrada\n\n```\nDIAGNÓSTICO DE PLANTA · 6 semanas · 4.900 €\nUna línea. Auditoría de datos, conexión, panel, alertas y IA.\nEntregable: informe de oportunidades cuantificadas en euros.\nSi se contrata la plataforma, los 4.900 € se descuentan de la implantación.\n```\n\nEs el mejor instrumento comercial que tiene este producto. Convierte una decisión\nde 17.000 € y 12 meses en una de 4.900 € y 6 semanas, que un director de planta\npuede aprobar solo. Y cobrarlo filtra al curioso: un piloto gratis no lo mira\nnadie.\n\n---\n\n## 2. Metodología del piloto\n\n| Semana | Qué se hace | Entregable |\n|---|---|---|\n| **1** | **Auditoría de datos.** Qué hay, qué falta, qué calidad tiene | Mapa de fuentes y su nivel en la escalera de ingesta |\n| **2** | **Conexión.** Conector, mapeo, validación contra dato conocido | Dato real entrando y cuadrado |\n| **3** | **Contexto y panel.** Jerarquía, turnos, productos, ciclos, márgenes | Panel con la producción real de la línea |\n| **4** | **Alertas.** Línea base aprendida, umbrales, destinatarios | Primeras alertas con impacto en euros |\n| **5** | **IA y ajuste.** Copilot, calibración con el feedback de la semana 4 | Copilot contestando sobre sus datos |\n| **6** | **Impacto.** Cuantificación y presentación a dirección | **Informe de oportunidades en euros** |\n\n**La semana 1 es la más importante y la que más sorprende al cliente.** Casi\nsiempre descubre que su MES no registra causas de parada, o que el contador de\nuna máquina lleva meses mal. Ese hallazgo, por sí solo, ya justifica el piloto — y\nconviene decírselo de antemano para que sea una victoria y no una decepción.\n\n**La semana 6 se presenta a dirección, no al departamento.** Quien firma la\nsuscripción es quien ve el informe.\n\n### KPIs del piloto\n\n| KPI | Objetivo a 6 semanas |\n|---|---|\n| Cobertura de dato | ≥ 80% del tiempo productivo de la línea |\n| Causas de parada registradas | del ~15% inicial al ≥ 50% |\n| Alertas útiles | ≥ 70% marcadas como útiles |\n| Oportunidades cuantificadas | ≥ 30.000 €/año identificados |\n| Tiempo de análisis semanal | de 4 h a menos de 1 h |\n| Uso | ≥ 3 usuarios entran ≥ 3 días por semana |\n\nLos dos últimos son los que predicen la renovación. Los cuatro primeros son los\nque la justifican en la reunión.\n\n---\n\n## 3. Web comercial\n\n### Hero\n\n```\n        TU FÁBRICA YA GENERA LOS DATOS.\n        NOSOTROS TE DECIMOS QUÉ SIGNIFICAN.\n\n  RADACTORY conecta producción, mantenimiento, energía y calidad\n  para detectar pérdidas, anomalías y riesgos antes de que se\n  conviertan en problemas.\n\n     [ SOLICITAR ANÁLISIS DE PLANTA ]    [ VER CÓMO FUNCIONA ]\n```\n\n### Secciones, en orden\n\n**1 · ¿QUÉ NECESITAS SABER HOY?**\nAlertas reales, con su euro. Sin explicar nada todavía: se enseña el producto\nfuncionando. Es la sección que hace bajar el dedo a la rueda del ratón.\n\n**2 · NO CAMBIES TU FÁBRICA**\nLos logos de lo que conectamos: ERP, MES, SCADA, PLC, sensores, bases de datos,\nExcel. Va la segunda, no la sexta, porque es la primera objeción real de todo el\nque entra.\n\n**3 · DE DATOS A DECISIONES**\n`Datos → Contexto → Alerta → Explicación → Acción`. La cadena, con un ejemplo\nrecorriéndola entera.\n\n**4 · LOS RADARES**\nProducción · Mantenimiento · Energía · Calidad · Proveedores · Conocimiento.\nCada uno con su pregunta de negocio, no con su lista de funcionalidades.\n\n**5 · INDUSTRIAL AI COPILOT**\n\n```\n  Tú:  ¿Por qué ha bajado la producción?\n\n  FR:  El 74% de la caída corresponde a microparadas\n       de la Línea 2 entre las 06:00 y las 09:00.\n       Fuentes: contador L2-P3, eventos 2–8 sep →\n```\n\n**6 · ROI**\nMenos paradas · menos scrap · menos consumo · menos tiempo analizando · más\nproducción. Con cifras de rango honestas, no con un \"hasta un 40%\".\n\n**7 · SEGURIDAD**\n*\"Ningún puerto abierto. Solo lectura. El dato sube, nunca baja.\"* Sección corta\ny técnica, pensada para que el director se la reenvíe a IT. Convierte más de lo\nque parece.\n\n**8 · CÓMO EMPEZAMOS**\nEl piloto de 6 semanas, con su precio a la vista. El precio visible filtra y\nacelera.\n\n**9 · CTA final** + demo pública sin registro.\n\n### Construida\n\nVive en [`web/index.html`](../web/index.html). Diez secciones en el orden de arriba, con\n**las cifras reales de la DEMO FACTORY**, no ilustrativas: los 129.218 €/año de la Estación\nP4, el 67% de rechazos del lote de ZETA y los 14.662 €/año del compresor salen del motor,\nno de un folleto. Si un cliente pide la cuenta, se le puede abrir.\n\nLa decisión visual: **hormigón y ámbar de señalización**, con el producto apareciendo dentro\nen oscuro. Esa tensión es el argumento — no cambiamos la fábrica, ponemos una capa encima.\nNada de fondo blanco con degradado azul, que es lo que hace que estas páginas se confundan\nentre sí.\n\n### Lo que NO va en la web\n\nNada de \"transformamos la industria con IA\", ni \"Industria 4.0\", ni \"revolución\ndigital\". Un director de planta lleva diez años oyendo eso y su efecto medible ya\nes negativo. Tampoco fotos de archivo de robots azules brillantes: la planta de\nnuestro cliente no se parece a eso y lo nota.\n\n**El tono es el del producto:** frases cortas, cifras concretas, cero adjetivos.\nSe habla de paradas, de scrap, de kilovatios y de euros.\n\n---\n\n## 4. Cómo se llega al cliente\n\nPor orden de eficacia esperada para este perfil:\n\n1. **Visita directa en un radio de 150 km.** Es industria: se cierra pisando la\n   planta. La demo con la fábrica ficticia funciona en un portátil sobre una mesa\n   de reuniones.\n2. **Asociaciones y clústeres sectoriales.** En Cantabria y País Vasco tienen\n   peso real y organizan jornadas donde está exactamente nuestro comprador.\n3. **Integradores e ingenierías locales** como canal: llevan años entrando en\n   estas plantas y venden horas. Les damos producto y margen recurrente.\n4. **Contenido técnico corto y honesto**, del tipo *\"cómo calcular tu OEE real\n   cuando no registras causas de parada\"*. Marketing industrial que sirve de algo\n   se comparte entre responsables de planta.\n5. **Ayudas públicas.** Kit Digital, Kit Consulting y los programas autonómicos de\n   digitalización industrial cubren buena parte de la implantación. **Saber\n   tramitarlo es en sí mismo un argumento de venta** y conviene tenerlo resuelto\n   antes de la primera reunión.\n","bytes":8147,"lineas":190,"lenguaje":null,"para":"Precios, el piloto de seis semanas, la web pública y cómo se llega al cliente.","chip":null,"chipTono":null,"estado":null},"doc/10-decisiones.md":{"texto":"# 10 · Registro de decisiones\n\nLas decisiones de la FASE A que no eran obvias, con la alternativa que se\ndescartó. Sirve para no volver a discutirlas y para que quien entre nuevo entienda\nel porqué antes de proponer el cambio.\n\n| # | Decisión | Alternativa descartada | Por qué |\n|---|---|---|---|\n| 1 | La plataforma es RADACTORY; el módulo 1 pasa a **PRODUCTION RADAR** | Que ambos se llamaran igual | Colisiona en el menú lateral. Se ve en cuanto se dibuja la pantalla |\n| 2 | **Una sola Postgres** con TimescaleDB y pgvector | Postgres + InfluxDB + Pinecone | Tres sistemas que respaldar, asegurar y pagar para un volumen que Timescale aguanta de sobra |\n| 3 | **Monolito modular**, sin Kubernetes | Microservicios desde el principio | Resuelve una escala que no tenemos y añade superficie que auditar. Los módulos ya están separados por dominio |\n| 4 | **RLS de Postgres** para el aislamiento | Solo `WHERE tenant_id` en el código | Un `WHERE` olvidado es una fuga entre competidores del mismo sector |\n| 5 | **Árbol de activos**, no cinco niveles fijos | `Planta → Área → Línea → Máquina` | Ninguna fábrica encaja. Se rompe en el tercer cliente y obliga a migrar |\n| 6 | **CSV y SQL antes que OPC UA** | Empezar por el protocolo \"correcto\" | OPC UA son de 2 a 6 semanas de trámite. CSV da dato real en 3 días y valor que enseñar |\n| 7 | El **LLM explica, no detecta** | Pasarle series temporales al modelo | Caro, lento y alucina con números. Las capas 1 y 2 detectan sobre el dato |\n| 8 | **Consultas parametrizadas** en el Copilot, nunca SQL libre | Texto a SQL | Inyección, fuga entre inquilinos y consultas que tumban la base |\n| 9 | **Línea base por contexto** (señal × producto × turno) | Línea base global por señal | Una global dispara falsos positivos en cada cambio de formato |\n| 10 | **Tope de 5 alertas críticas** por planta y semana | Alertar de todo lo detectado | Una bandeja con 40 críticas es una bandeja cerrada |\n| 11 | **Ningún score sin su fórmula abierta** | Mostrar el número y ya | Un número indefendible destruye la confianza en toda la plataforma |\n| 12 | **Solo lectura, cero puertos entrantes** | VPN o túnel para mantenimiento cómodo | IT veta el proyecto en la segunda reunión. Es la decisión que permite vender |\n| 13 | **Operarios seudonimizados** por defecto | Rendimiento con nombre y apellidos | Tratamiento de datos personales en contexto laboral. Riesgo legal y sindical real |\n| 14 | **El hueco de dato se pinta como hueco** | Interpolar para que el gráfico quede bonito | Un dato inventado en industria es un diagnóstico equivocado |\n| 15 | **Implantación y suscripción separadas** | Todo en la cuota mensual | Obliga a compromiso de 24 meses que no se firma en la primera compra |\n| 16 | **Piloto pagado**, no gratuito | Piloto gratis para entrar | El piloto gratis no lo mira nadie. Cobrarlo filtra y compromete |\n| 17 | **Factory Brain en fase 2**, pese a ser el que más impresiona | Meterlo en el MVP para la demo | Una respuesta inventada sobre un procedimiento de seguridad quema la confianza para siempre |\n| 18 | **Predictivo por vibración fuera del MVP** | Prometer predictivo desde el día 1 | Exige sensórica, muestreo alto y fallos etiquetados. La deriva da el 70% del valor sin nada de eso |\n| 19 | **Nunca se escribe en OT.** Ni ahora ni después | Dejar la puerta abierta \"para más adelante\" | Otro producto, otra certificación y otro seguro. Decirlo pronto tranquiliza a IT |\n| 20 | **Cabeza de playa geográfica y sectorial** | Producto horizontal para toda la industria | Un producto industrial horizontal no convence a nadie en la primera reunión |\n| 21 | **Conforme desde el día 1, certificado cuando lo pidan** | Certificar ISO 27001 antes de vender | 30.000 € y seis meses gastados en el orden equivocado |\n| 22 | **Feedback de alerta en el esquema**, no en el backlog | Añadirlo cuando haya quejas | Sin él no bajan los falsos positivos, y son la causa nº 1 de abandono |\n\n---\n\n## Decisiones de la FASE B\n\nSalieron de construir de verdad, no de diseñar. La 23 es de las que solo\naparecen cuando el esquema se ejecuta contra el motor real.\n\n| # | Decisión | Alternativa descartada | Por qué |\n|---|---|---|---|\n| 23 | **`measurement` va comprimida y SIN RLS; `measurement_rollup` va con RLS y sin comprimir** | Aplicar la decisión 04 también a la tabla cruda | **TimescaleDB no admite las dos cosas a la vez.** Comprobado en las dos direcciones (ver abajo). El volumen está en la cruda —unos 39 GB por planta y 90 días sin comprimir, unos 4 con compresión— y las lecturas están en el rollup. El aislamiento del dato crudo no se pierde: se mueve a `fr_measurements()`, y `fr_app` no tiene ningún permiso sobre la tabla |\n| 24 | **Las políticas RLS se aplican en bucle sobre las tablas con `tenant_id`** | Escribirlas a mano, tabla por tabla | El fallo real de este patrón nunca es una política mal escrita: es una tabla nueva a la que se olvidaron de ponérsela |\n| 25 | **`FORCE ROW LEVEL SECURITY` en todas** | Solo `ENABLE` | Sin `FORCE`, el propietario de la tabla salta las políticas. Algún script de mantenimiento acabará conectándose como propietario, y el aislamiento desaparecería en silencio |\n| 26 | **Dos conexiones distintas: `fr_app` y la de trabajos** | Una sola cadena de conexión | La API no debe poder llamar a `fr_rollup()`, que es `SECURITY DEFINER` y lee todos los inquilinos. Separarlas es lo que evita que una inyección en la API alcance el dato crudo de todas las fábricas |\n| 27 | **El rendimiento se acota a 1 y se avisa** | Dejar salir un 118% | Un OEE del 112% en pantalla destruye la credibilidad de la herramienta entera en la primera reunión. No es que la máquina supere su física: es que el ciclo nominal está mal dado de alta |\n| 28 | **El umbral de microparada se deriva del ciclo, no es fijo** | Un umbral de 30 s para todo | En una línea de 4 s de ciclo, 30 s son siete piezas perdidas; en una de 90 s, es un ciclo que aún no ha terminado. Un umbral fijo inunda de falsos positivos las líneas lentas |\n| 29 | **Toda ruta con `:siteId` resuelve la planta dentro del inquilino, no solo comprueba el alcance** | Fiarse de `alcanzaSite()` | Lo encontró una prueba, no una revisión. Con `sites: []` —el caso normal, «todas las plantas de mi empresa»— `alcanzaSite()` decía que sí a cualquier UUID. No había fuga, porque la RLS devolvía cero filas, pero el endpoint contestaba **200 con todo a `null`** para la planta de otra empresa: distinguía por código de respuesta lo que no debe distinguirse, y un 200 vacío se confunde con «esta planta no ha producido hoy» |\n\n### El hallazgo del RLS, con la comprobación\n\nNo se dedujo del manual: se ejecutó.\n\n```\nalter table measurement enable row level security;\n  ERROR: operation not supported on hypertables that have columnstore enabled\n\n-- y al revés, con RLS ya activo:\nalter table t set (timescaledb.compress, ...);\n  ERROR: columnstore cannot be used on table with row security\n```\n\nSon mutuamente excluyentes. Es exactamente el tipo de restricción que no aparece\nen una fase de diseño y que, descubierta seis meses después con datos de tres\nclientes dentro, obliga a una migración de la tabla más grande del sistema.\n\n**El aislamiento sigue probado**: `db/pruebas/fugas.sql` son once pruebas que\ncorren como `fr_app` —no como superusuario, que saltaría RLS— y comprueban entre\notras cosas que la tabla cruda no es legible por la API y que\n`fr_measurements()` devuelve cero filas para una señal ajena.\n\n\n### Por qué las pruebas están escritas así\n\nLas once de `db/pruebas/fugas.sql` y las once de `tests/api.test.ts` comprueban\n**el efecto, no la respuesta**. No preguntan si la función devolvió lo que dice\nsu firma: plantan dos empresas rivales y comprueban que una no alcanza a la\notra, ni por listado, ni por id, ni por escritura, ni por el hueco entre el\ncódigo de respuesta y los datos.\n\nLa decisión 29 salió de ahí. Una revisión de código no la habría visto: el\ncódigo *parecía* correcto, y de hecho no filtraba ni un dato.\n\n\n---\n\n## Decisiones de la FASE C\n\nTodas salieron de que la DEMO FACTORY no funcionaba. Los cuatro problemas\nplantados no estaban marcados en la base: si el motor no los encontraba solo,\nel motor estaba mal. Las tres primeras son defectos de producto que ninguna\nrevisión de código habría visto.\n\n| # | Decisión | Alternativa descartada | Por qué |\n|---|---|---|---|\n| 30 | **Las microparadas son pérdida de RENDIMIENTO, no de disponibilidad** | Restarlas del tiempo de marcha | Es la imputación correcta en las seis grandes pérdidas del OEE: la máquina figura en marcha y produce menos. Restándolas, el rendimiento salía intacto y **la Estación P4, con 92 microparadas al día, era invisible** — el síntoma más caro de la planta, indetectable por un error de imputación |\n| 31 | **Línea base genérica (nodo × turno) cuando el producto es demasiado nuevo** | Exigir siempre línea base del producto | Un formato estrenado hace seis días no tiene línea base propia, así que **una caída justo después de un cambio de formato era indetectable** — y el cambio de formato es la causa más frecuente de una caída. Se puede comparar entre productos porque el rendimiento ya va normalizado al ciclo nominal; se usa solo como respaldo, bajando la confianza y diciéndolo en la alerta |\n| 32 | **La línea se mide en su cuello de botella** | Promediar sus máquinas | Una línea para cuando para cualquiera de sus estaciones. Promediar da un número optimista que no se parece a lo que sale por el final. Sin esto, además, **las líneas no tenían ninguna métrica** y la pantalla de estado salía vacía: el cálculo solo cubre nodos con contador, y los contadores están en las máquinas |\n| 33 | **Si una línea y su máquina avisan de lo mismo, se queda la máquina** | Emitir las dos | Son el mismo problema: una lo nombra y la otra no. La que sirve es la que dice dónde poner el destornillador |\n| 34 | **Un problema atado a un lote NO se anualiza** | Multiplicar por 365/ventana | Daba 686.000 €/año por tres semanas de un lote. Una cifra absurda destruye la credibilidad más rápido que no dar cifra. Se informa el coste ya incurrido, y por diseño **eso no puede llegar a crítica**: lo que interrumpe al director de planta es lo que sigue sangrando |\n| 35 | **Mínimo de turnos también en la ventana de evaluación** | Exigir muestras solo en la línea base | Un único turno malo generaba una crítica de 180.000 €/año |\n| 36 | **La ventana de correlación es más larga que el problema** | Ajustarla al periodo del lote sospechoso | Con la ventana ajustada, el lote sale al 100% de los rechazos… porque es el único lote dentro. Un 100% no es una correlación, es un artefacto, y el responsable de calidad lo huele enseguida. Con 45 días y cuatro lotes, sale 67% y ya significa algo |\n| 37 | **La economía de la demo tiene que ser plausible, no solo coherente** | Números redondos elegidos por comodidad | Un envase de 4,2 s de ciclo con 7,18 € de margen implica 38 M€ en una sola línea, para una planta que factura entre 10 y 80. La alerta salía a 2.095.337 €/año y un director de planta la descarta de un vistazo — y con ella, la herramienta |\n| 38 | **`09-rls.sql` tenía que ser idempotente y no lo era** | Confiar en que «los ficheros son idempotentes» | Un `create policy` sin su `drop policy if exists` rompía la segunda migración, y las políticas de las tablas posteriores se quedaban sin aplicar **sin que nada lo dijera**. La prueba de idempotencia es lanzar la migración dos veces seguidas, y ahora se hace |\n\n### Dos lecciones de método\n\n**No mandar la salida a `/dev/null` mientras se verifica.** El motor estuvo dos\nejecuciones fallando por un error de sintaxis y los números que se estaban\nrevisando eran los de la pasada anterior. Un fallo silencioso en el paso de\nverificación es peor que no verificar, porque produce confianza injustificada.\n\n**Un comentario SQL con acentos graves dentro de una plantilla de JavaScript la\ncierra antes de tiempo.** El error que da Node —`Expected ',', got 'ident'`— no\nseñala la línea. Se localizó troceando el fichero por funciones y parseando cada\ntrozo por separado.\n","bytes":12309,"lineas":116,"lenguaje":null,"para":"Las 29 decisiones tomadas, cada una con la alternativa descartada.","chip":"38","chipTono":"teal","estado":null},"doc/11-api.md":{"texto":"# 11 · API\n\nVersionada desde el primer día en `/v1/`. Cambiar de forma una respuesta que un\ncliente ya consume es una llamada de teléfono desagradable que se evita con un\nprefijo de ruta.\n\n## Reglas que se aplican a todos los endpoints\n\n| Regla | Por qué |\n|---|---|\n| **Un recurso de otro inquilino devuelve 404, nunca 403** | Un 403 confirma que el recurso existe. Eso ya es información que no le corresponde |\n| **Toda cifra en euros viaja con su cuenta abierta** | `impacto_base` es obligatorio en el esquema. El panel la pinta tal cual |\n| **Toda puntuación viaja con sus componentes y sus pesos** | El panel enseña un «¿cómo?» al lado y tiene que rellenarlo sin recalcular |\n| **Un hueco de dato se devuelve como hueco** | Nunca se interpola. Un dato inventado en industria es un diagnóstico equivocado |\n| **Los errores 5xx no devuelven la traza** | Revela nombres de tabla y versión de motor: reconocimiento gratis |\n| **Toda escritura relevante deja fila en `audit_log`** | Quién, cuándo, desde dónde y sobre qué evidencia |\n\n## Autenticación\n\nDos credenciales distintas, a propósito:\n\n- **Sesión de usuario** — `Authorization: Bearer \u003ctoken>`, HMAC firmado, 12 h.\n  Lleva `userId`, `tenantId`, `rol` y las plantas alcanzables.\n- **Token de conector** — para `/v1/ingesta`. Al otro lado hay una máquina en\n  una nave, no una persona. Se guarda solo como hash: si se filtra la base, no\n  se puede suplantar a ningún conector con lo que hay dentro.\n\n## Endpoints\n\n### Estado\n\n```\nGET  /salud                                  → sin sesión; comprueba que la base responde\nGET  /v1/plantas/:siteId/estado              → la pantalla de los 30 segundos, en una sola petición\n```\n\nDevuelve los seis indicadores, las cinco alertas de «Atención hoy», el impacto\nacumulado del mes y —siempre, aunque sea malo— el porcentaje de paradas sin\ncausa registrada. Va en un único endpoint porque seis peticiones en paralelo\npara pintar seis cifras es lo que hace que el panel tarde en abrir.\n\n### Alertas\n\n```\nGET  /v1/alertas?siteId&estado&modulo&limite → bandeja, ordenada por severidad e impacto\nGET  /v1/alertas/:id                         → ficha completa: cuenta abierta, fuentes, diagnóstico\nPOST /v1/alertas/:id/feedback                → { feedback: util | no_era_nada | ya_lo_sabia }\n```\n\nEl diagnóstico se generó **una vez**, al crear la alerta, y se sirve desde\n`ai_analysis`. No se vuelve a pedir al LLM cada vez que alguien abre la ficha:\neso multiplicaría el coste de IA por el número de curiosos.\n\n`POST /feedback` es lo único que permite al sistema dejar de equivocarse. Un\n`no_era_nada` cierra la alerta y ajusta el umbral de esa señal en esa planta.\n\n### Planta y activos\n\n```\nGET  /v1/plantas/:siteId/activos             → el árbol plano, con `ruta` de ancestros\nGET  /v1/activos/:id                         → ficha de activo: salud abierta, señales, alertas\nGET  /v1/senales/:id/muestras?desde&hasta    → dato crudo, vía fr_measurements()\n```\n\nEl árbol se devuelve plano y lo monta el panel: mandar un árbol anidado por JSON\nobliga a rehacer la petición cada vez que cambia un filtro.\n\n`/muestras` es la puerta controlada al dato crudo. `measurement` no lleva RLS\n—TimescaleDB no admite RLS y compresión a la vez— así que el filtro de inquilino\nlo aplica la función. Existe porque el producto lo exige: toda cifra es\npinchable hasta el fondo, sin callejones sin salida.\n\n### Ingesta\n\n```\nPOST /v1/ingesta                             → token de conector; un sobre con medidas y eventos\n```\n\n```json\n{\n  \"connector_id\": \"uuid\",\n  \"batch_id\": \"uuid\",\n  \"sent_at\": \"2026-09-09T07:41:22Z\",\n  \"measurements\": [{ \"signal\": \"L3.P4.contador\", \"ts\": \"…\", \"value\": 14820, \"q\": 0 }],\n  \"events\": [{ \"asset\": \"L3.P4\", \"type\": \"stop\", \"ts_start\": \"…\", \"ts_end\": \"…\", \"reason\": null }]\n}\n```\n\n**Idempotente por `batch_id`.** El conector reenvía sin miedo tras un corte; el\nduplicado se descarta en el servidor, no en el conector, porque el conector\npuede haberse reiniciado y haber perdido la memoria de lo que ya mandó.\n\nLa respuesta devuelve `sinMapear`: las señales que llegaron y no están dadas de\nalta. Es la alarma de que **la fuente ha cambiado de forma** —alguien añadió una\ncolumna al Excel, el SCADA renombró un tag— y hay que revisar el mapeo antes de\nseguir calculando con datos mal alineados.\n\n### Copilot\n\n```\nPOST /v1/copilot                             → { pregunta, siteId, desde?, hasta? }\n```\n\nSeis pasos, y el segundo es de seguridad: el modelo **elige una plantilla del\ncatálogo**, nunca escribe SQL. El catálogo que ve está ya filtrado por el rol de\nquien pregunta — la IA no es una puerta trasera a los permisos.\n\nLo que no encaja en ninguna plantilla se responde con *«no sé contestar a eso\ntodavía»* y se registra en `ai_analysis` con `respuesta = null`. **Esa tabla es\nel backlog del Copilot, escrito por los propios usuarios.**\n\n### Pendientes de FASE D\n\n```\nPOST /v1/auth/login · POST /v1/auth/mfa\nGET  /v1/produccion/oee · /paradas · /turnos\nGET  /v1/energia · /calidad · /proveedores\nPOST /v1/acciones                             → Operations Agent, con su nivel de autorización\nGET  /v1/conocimiento/preguntar               → Factory Brain\nGET  /admin/*                                 → superadmin, fuera del inquilino\n```\n\n## Webhook saliente\n\nUn sistema del cliente puede recibir nuestras alertas: `alert.created` firmado\ncon HMAC compartido. Es lo que permite que la alerta entre en su GMAO sin que\ntengamos que integrarnos con él.\n","bytes":5577,"lineas":128,"lenguaje":null,"para":"Contrato de la API: endpoints, autenticación e ingesta.","chip":null,"chipTono":null,"estado":null},"doc/12-demo.md":{"texto":"# 12 · DEMO FACTORY\n\n**Planta de Torrelavega** · 3 líneas · 15 máquinas · 3 turnos · 5 productos ·\n90 días de histórico · 342.000 medidas · 10.000 eventos.\n\nSin clientes, la demo *es* el producto. Es el activo comercial de los próximos\ntres meses y, a la vez, **la prueba del motor de detección**: los cuatro\nproblemas no están marcados en ninguna parte de la base. Si el motor no los\nencuentra solo, el motor está mal.\n\n## Cómo se regenera\n\n```bash\nnpm run migrar        # esquema\nnpm run demo          # estructura, series y eventos      (~12 s)\nnpm run demo-motor    # métricas, líneas base y alertas   (~20 s)\nnpm run demo-exportar # instantánea a var/demo.json\nnpm run demo-panel    # panel navegable a doc/demo.html\n```\n\n**El generador es determinista.** La semilla es fija: una demo comercial que sale\ndistinta cada vez no se puede ensayar, y no se puede depurar cuando alguien dice\n«ayer salía otro número».\n\n## Los cuatro problemas plantados\n\n| # | Qué se plantó | Cómo aparece | Dónde se ve |\n|---|---|---|---|\n| 1 | Deriva de consumo del **COMP-02** durante 6 semanas, con alarmas de presión crecientes | Salud **74**, era 82 hace 30 días · consumo específico +14,6% · 3 alarmas. Sin una sola avería: no aparecería en un GMAO | Mantenimiento |\n| 2 | **Microparadas en la Estación P4** desde el cambio a REF-2210 hace 7 días | Alerta **crítica**: rendimiento del 87% al 75%, 92 microparadas/día frente a 9 · **129.218 €/año** | Estado · Producción |\n| 3 | El **lote L-4471 de ZETA** concentra los rechazos de REF-1140 | **67% de los rechazos** sobre 4 lotes en la ventana · 23.695 € ya incurridos | Calidad |\n| 4 | **COMP-02 y la enfriadora no paran** al acabar el último turno | 44 kW con la planta parada · **14.662 €/año**. COMP-01 sí para: es el contraste que lo hace evidente | Energía |\n\n## Por qué los datos cuadran entre módulos\n\nTodo se deriva del mismo turno simulado. Si la Línea 3 pierde rendimiento, su\ncontador sube menos, su consumo por unidad sube y el turno de noche lo acusa más.\n\nGenerar cada serie por separado con ruido independiente produce demos que no se\nsostienen: **un director de planta detecta un dato falso en veinte segundos**\n—lleva veinte años viéndolos— y una demo incoherente destruye la credibilidad de\ntoda la reunión.\n\nCifras de la planta simulada, todas comprobables en el panel:\n\n```\nOEE           71,0%  =  91% disponibilidad × 82% rendimiento × 95,3% calidad\nParadas sin causa registrada .... 72,9%\nMargen anual de la planta ....... ~5 M€ sobre tres líneas\n```\n\nEl **72,9% de paradas sin causa** no es un defecto del generador: es lo que se\nencuentra en una planta con ERP y sin MES, y es la cifra que abre la\nconversación comercial de la semana 1 del piloto.\n\n## El panel de demo no es el panel de producción\n\n`doc/demo.html` se lleva a una reunión en un portátil: funciona sin cobertura y\nse ve igual el martes que el jueves. Por eso lee una instantánea congelada\n(`var/demo.json`, 71 KB) en vez de hablar con la API.\n\nEl panel de producción vive en [`panel/`](../panel/) y lee la API de verdad. Son\ndos cosas distintas a propósito.\n","bytes":3164,"lineas":64,"lenguaje":null,"para":"Qué simula la DEMO FACTORY, qué cuatro problemas planta y cómo se regenera.","chip":null,"chipTono":null,"estado":null},"doc/13-marca.md":{"texto":"# 13 · Marca\n\n## El nombre\n\n**RADACTORY** — RADAR + FACTORY. Dice lo que hace sin tener que explicarlo, y\nresuelve de paso la colisión que arrastrábamos: la plataforma ya no comparte\nnombre con su primer módulo.\n\n```\nRADACTORY               la plataforma\n├── PRODUCTION RADAR    producción y OEE\n├── MAINTENANCE RADAR   activos y salud\n├── ENERGY RADAR        consumo y coste\n├── QUALITY RADAR       defectos y correlaciones\n├── SUPPLIER RADAR      proveedores y suministro\n├── FACTORY BRAIN       conocimiento de la planta\n├── BACK OFFICE AI      documentos y descuadres\n├── OPERATIONS AGENT    acciones con autorización\n└── RADACTORY EDGE      el conector que va dentro de la planta\n```\n\nLos módulos conservan «RADAR» porque el patrón sigue siendo el mismo: **un\nmotor, muchos radares**. Bajo RADACTORY no hay ambigüedad posible.\n\n## El símbolo va en monocromo\n\nEl logotipo se usa **sin color**: el cuadro toma la tinta del entorno y el\nmonograma se cala con el color del fondo.\n\n```\nsobre fondo claro    cuadro en tinta      monograma calado en claro\nsobre fondo oscuro   cuadro en claro      monograma calado en oscuro\n```\n\nEn el código es un único SVG, no dos versiones. El cuadro va en `currentColor`\ny el monograma en `var(--mark-cut)`, que cada contexto define con su propio\nfondo. Cambiar el logotipo de un sitio a otro es cambiar una variable.\n\n**Por qué monocromo, más allá del gusto.** En el panel el color *es*\ninformación —crítica, alta, media— y un logotipo con dos colores propios\ncompite con esa lectura justo donde no debe. Fuera del panel, un símbolo\nmonocromo aguanta el fax, el grabado, el bordado, la serigrafía a una tinta y\nel sello de la caja. Un logotipo que solo existe a dos colores es un logotipo a\nmedias.\n\n## Colores\n\nLos de marca siguen existiendo, pero ya no están en el símbolo: se usan en la\ninterfaz.\n\n| | | |\n|---|---|---|\n| **Rosa RADACTORY** | `#E0115F` | Acento de marca: botones, cifras grandes, marcadores |\n| Rosa de texto | `#A80B47` | Para texto pequeño, donde el de marca no llega a 4,5:1 |\n| **Naranja RADACTORY** | `#F59B00` | Secundario. Sobre fondo oscuro y en las ilustraciones |\n| Tinta | `#151815` | Texto principal |\n| Papel | `#F5F4EF` | Fondo claro |\n\n> **Pendiente de confirmar.** Estos dos hexadecimales están sacados a ojo del\n> logotipo en pantalla. Cuando haya el fichero vectorial original, se sustituyen\n> aquí y se propagan solos: todo lo demás los lee de estos tokens.\n\n## La regla que evita el desastre\n\n**El color de marca NO se usa para estado.** El rosa está peligrosamente cerca\ndel rojo de «crítica», y un panel donde el color corporativo se confunde con una\nalarma es un panel que se lee mal justo cuando importa.\n\n```\nMARCA        rosa · naranja        logotipo, enlaces, marcadores de sección\nESTADO       rojo · ámbar · azul   crítica · alta · media          RESERVADOS\nSERIES       azul · verde · violeta  identidad de una línea en una gráfica\n```\n\nTres escalas, tres trabajos, sin solaparse. En el panel, el rosa aparece **solo\nen el logotipo**.\n\n## El símbolo\n\nCuadro naranja con el monograma en rosa. En las páginas va como SVG en línea\n—[`marca.svg`](marca.svg)— para que escale, cambie de tamaño sin\npixelarse y no dependa de ninguna descarga.\n\n> **También pendiente.** El símbolo que hay en las páginas es un **redibujo\n> aproximado** hecho a partir de la imagen. Hay que sustituirlo por el vectorial\n> original antes de enseñárselo a un cliente.\n\n## Tipografía\n\nEl logotipo usa una display ancha y geométrica, con los remates cortados en\ndiagonal. En web se aproxima con **Michroma** para el logotipo y titulares\ncortos, y **Archivo** para el resto. Ninguna de las dos es la del logotipo: si\nexiste la original con licencia web, se cambia aquí.\n","bytes":3847,"lineas":94,"lenguaje":null,"para":"El nombre, los colores y la regla que impide que el rosa de marca se confunda con una alarma.","chip":null,"chipTono":null,"estado":null},"doc/marca.svg":{"texto":"\u003c!-- Simbolo de RADACTORY, monocromo. Version positiva: cuadro en tinta y\n     monograma calado en blanco. Para fondo oscuro se invierten los dos.\n     Redibujo aproximado, pendiente del vectorial original. -->\n\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 100 100\" role=\"img\" aria-label=\"RADACTORY\">\n  \u003crect width=\"100\" height=\"100\" fill=\"#151815\"/>\n  \u003cpath fill=\"#FFFFFF\" d=\"M8 20 H86 V42 H30 V84 H8 Z\"/>\n  \u003cpath fill=\"#FFFFFF\" d=\"M46 42 H68 L88 84 H64 Z\"/>\n\u003c/svg>\n","bytes":474,"lineas":9,"lenguaje":"xml","para":"El símbolo, en vectorial. Redibujo aproximado hasta que llegue el original.","chip":null,"chipTono":null,"estado":null},"db/01-extensiones.sql":{"texto":"-- ---------------------------------------------------------------------------\n-- RADACTORY :: 01 · extensiones y rol de aplicacion\n--\n-- Una sola base cubre relacional, serie temporal y vectorial (decision 02).\n-- Si algun dia hay que separar, el corte esta en las tablas de 05-series.sql.\n-- ---------------------------------------------------------------------------\n\ncreate extension if not exists timescaledb;\ncreate extension if not exists vector;\n\n-- gen_random_uuid() es nativo desde Postgres 13; no hace falta pgcrypto.\n\n-- ---------------------------------------------------------------------------\n-- El rol con el que se conecta la API.\n--\n-- IMPORTANTE: no es el propietario de las tablas, y no es superusuario. El\n-- propietario SALTA las politicas RLS salvo que se declare FORCE ROW LEVEL\n-- SECURITY, y un superusuario las salta siempre. Conectarse como propietario\n-- es la forma mas silenciosa de anular todo el aislamiento multiempresa.\n-- ---------------------------------------------------------------------------\ndo $$\nbegin\n  if not exists (select 1 from pg_roles where rolname = 'fr_app') then\n    create role fr_app login password 'cambiame';\n  end if;\nend\n$$;\n\n-- ---------------------------------------------------------------------------\n-- El inquilino activo viaja en una variable de sesion, no en cada WHERE.\n--\n-- La API hace `select fr_set_tenant($1)` al principio de cada transaccion. Si\n-- no se ha fijado, la funcion de lectura devuelve NULL y las politicas RLS no\n-- casan con ninguna fila: sin contexto no se ve NADA, que es el fallo seguro.\n-- ---------------------------------------------------------------------------\ncreate or replace function fr_set_tenant(p_tenant uuid)\nreturns void\nlanguage sql\nas $$\n  select set_config('fr.tenant_id', p_tenant::text, true);\n$$;\n\ncreate or replace function fr_tenant()\nreturns uuid\nlanguage sql\nstable\nas $$\n  select nullif(current_setting('fr.tenant_id', true), '')::uuid;\n$$;\n\n-- El superadmin de la plataforma opera fuera del inquilino. Es un interruptor\n-- aparte y a proposito: asi \"ver todo\" nunca es el estado por defecto de una\n-- conexion, sino una decision explicita que queda en el log de auditoria.\ncreate or replace function fr_es_superadmin()\nreturns boolean\nlanguage sql\nstable\nas $$\n  select coalesce(current_setting('fr.superadmin', true) = 'on', false);\n$$;\n","bytes":2358,"lineas":61,"lenguaje":"sql","para":"TimescaleDB, pgvector y el rol de aplicación. Aquí vive fr_set_tenant().","chip":"aplica","chipTono":"ok","estado":"aplicado contra TimescaleDB pg16"},"db/02-organizacion.sql":{"texto":"-- ---------------------------------------------------------------------------\n-- RADACTORY :: 02 · organizacion, acceso y auditoria\n-- ---------------------------------------------------------------------------\n\n-- La empresa cliente. Es la raiz del aislamiento: todo lo demas cuelga de aqui\n-- y todas las tablas de negocio llevan su tenant_id, que ES este id.\ncreate table if not exists company (\n  id            uuid primary key default gen_random_uuid(),\n  nombre        text        not null,\n  cif           text,\n  plan          text        not null default 'starter',  -- starter | pro | enterprise\n  activo        boolean     not null default true,\n\n  -- Presupuesto mensual de IA en euros. Sin esto no hay negocio: un cliente que\n  -- usa el Copilot cien veces al dia puede costar mas de lo que paga.\n  presupuesto_ia_eur numeric(10,2) not null default 30,\n\n  creado_en     timestamptz not null default now()\n);\n\n-- Centro fisico. El huso y el calendario viven aqui porque un turno de noche\n-- cruza la medianoche y el cambio de hora de octubre duplica una hora real de\n-- produccion: calcular en UTC y presentar en local es la unica forma de que el\n-- parte del turno cuadre con lo que vio el jefe de linea.\ncreate table if not exists site (\n  id            uuid primary key default gen_random_uuid(),\n  tenant_id     uuid        not null references company(id) on delete cascade,\n  nombre        text        not null,\n  direccion     text,\n  huso          text        not null default 'Europe/Madrid',\n\n  -- Precio real del contrato electrico del cliente, no un precio de mercado.\n  -- Todo el ahorro de ENERGY RADAR se calcula con este numero y hay que poder\n  -- enseñarlo cuando el cliente discuta la cifra.\n  precio_kwh    numeric(8,5),\n  moneda        text        not null default 'EUR',\n\n  creado_en     timestamptz not null default now(),\n  unique (tenant_id, nombre)\n);\n\n-- Persona. Puede pertenecer a varias empresas (un consultor, o nosotros\n-- mismos), por eso el usuario no lleva tenant_id: lo lleva su membresia.\ncreate table if not exists app_user (\n  id            uuid primary key default gen_random_uuid(),\n  email         text        not null unique,\n  nombre        text        not null,\n  clave_hash    text,\n  mfa_secreto   text,\n  mfa_activo    boolean     not null default false,\n  superadmin    boolean     not null default false,\n  ultimo_acceso timestamptz,\n  creado_en     timestamptz not null default now()\n);\n\ncreate table if not exists membership (\n  id            uuid primary key default gen_random_uuid(),\n  tenant_id     uuid        not null references company(id) on delete cascade,\n  user_id       uuid        not null references app_user(id) on delete cascade,\n  rol           text        not null,   -- ver CHECK abajo\n\n  -- Permisos por planta. Vacio = todas las plantas de la empresa. Un jefe de\n  -- linea de Torrelavega no tiene por que ver Reinosa.\n  sites         uuid[]      not null default '{}',\n\n  creado_en     timestamptz not null default now(),\n  unique (tenant_id, user_id),\n  constraint membership_rol_valido check (rol in (\n    'company_admin', 'plant_manager', 'maintenance',\n    'production', 'quality', 'energy', 'viewer'\n  ))\n);\n\n-- Registro de auditoria. Append-only: no hay UPDATE ni DELETE sobre esta tabla\n-- y la politica RLS de 09 no los concede. Una IA que actua sin traza es un\n-- problema legal antes que tecnico.\ncreate table if not exists audit_log (\n  id            bigserial primary key,\n  tenant_id     uuid,\n  user_id       uuid,\n  accion        text        not null,   -- login · alerta.descartada · operario.reidentificado · ...\n  objeto        text,\n  objeto_id     text,\n  detalle       jsonb       not null default '{}',\n  ip            inet,\n  ts            timestamptz not null default now()\n);\ncreate index if not exists audit_log_tenant_ts on audit_log (tenant_id, ts desc);\n","bytes":3874,"lineas":89,"lenguaje":"sql","para":"Empresa, planta, usuarios, membresías y el log de auditoría.","chip":"aplica","chipTono":"ok","estado":"aplicado contra TimescaleDB pg16"},"db/03-planta.sql":{"texto":"-- ---------------------------------------------------------------------------\n-- RADACTORY :: 03 · jerarquia de planta, señales y conectores\n-- ---------------------------------------------------------------------------\n\n-- ARBOL, no cinco niveles fijos (decision 05).\n--\n-- Ninguna fabrica encaja en Planta > Area > Linea > Maquina. Hay celdas, hay\n-- naves, hay centros de trabajo y hay maquinas que sirven a dos lineas a la\n-- vez. Forzar niveles obliga a reformar el esquema en el tercer cliente.\n--\n-- `ruta` es el camino materializado de ancestros (sin incluirse a si mismo).\n-- Lo mantiene un trigger: consultar descendientes es `where id_padre = any(ruta)`\n-- con indice GIN, en vez de un CTE recursivo en cada pantalla del panel.\ncreate table if not exists asset_node (\n  id            uuid primary key default gen_random_uuid(),\n  tenant_id     uuid        not null references company(id) on delete cascade,\n  site_id       uuid        not null references site(id) on delete cascade,\n  parent_id     uuid        references asset_node(id) on delete cascade,\n  ruta          uuid[]      not null default '{}',\n\n  tipo          text        not null,   -- area | linea | celda | maquina | auxiliar\n  codigo        text        not null,   -- 'L3', 'L3.P4', 'COMP-02'\n  nombre        text        not null,\n  fabricante    text,\n  modelo        text,\n  numero_serie  text,\n\n  -- Criticidad 1-5. Entra en el ASSET HEALTH SCORE y en el calculo de severidad:\n  -- un 40% de desviacion en una maquina auxiliar parada importa menos que un 6%\n  -- en la linea principal.\n  criticidad    smallint    not null default 3,\n\n  -- Coste de una hora de parada de este nodo, en euros. Es el numero que\n  -- convierte una anomalia en un impacto defendible. Se rellena en la semana 3\n  -- del piloto, con el cliente delante.\n  coste_parada_hora numeric(10,2),\n\n  -- Ciclo nominal por defecto, en segundos. El del producto manda si existe.\n  ciclo_nominal_s numeric(10,3),\n\n  activo        boolean     not null default true,\n  creado_en     timestamptz not null default now(),\n\n  unique (tenant_id, site_id, codigo),\n  constraint asset_node_tipo_valido check (tipo in ('area','linea','celda','maquina','auxiliar')),\n  constraint asset_node_criticidad check (criticidad between 1 and 5)\n);\ncreate index if not exists asset_node_ruta on asset_node using gin (ruta);\ncreate index if not exists asset_node_site on asset_node (tenant_id, site_id);\n\n-- Mantiene `ruta` al insertar y al mover un nodo de sitio. Se hace en la base y\n-- no en la aplicacion porque un nodo movido desde un script suelto tambien\n-- tiene que dejar el arbol coherente.\ncreate or replace function fr_asset_node_ruta()\nreturns trigger\nlanguage plpgsql\nas $$\ndeclare\n  v_ruta uuid[];\nbegin\n  if new.parent_id is null then\n    new.ruta := '{}';\n  else\n    select a.ruta || a.id into v_ruta from asset_node a where a.id = new.parent_id;\n    if v_ruta is null then\n      raise exception 'El padre % no existe', new.parent_id;\n    end if;\n    if new.id = any(v_ruta) then\n      raise exception 'Ciclo en la jerarquia de activos';\n    end if;\n    new.ruta := v_r
