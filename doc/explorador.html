font-family:var(--serif); font-size:clamp(2.9rem,5.4vw,4.4rem);\n  font-weight:400; line-height:.98; letter-spacing:-.04em; color:var(--brand);\n  font-variant-numeric:tabular-nums; }\n.cifra p { margin:var(--s-4) 0 0; color:var(--text-secondary); font-size:.98rem; }\n.bg-dark .cifra .n { color:var(--brand-accent); }\n\n/* --- bloques de contenido sin tarjeta ----------------------------------- */\n.bloques { display:grid; gap:clamp(36px,4.4vw,64px);\n           margin-top:clamp(var(--s-8),6vw,var(--s-10)); }\n.bloques.c2 { grid-template-columns:repeat(auto-fit,minmax(330px,1fr)); }\n.bloques.c3 { grid-template-columns:repeat(auto-fit,minmax(270px,1fr)); }\n.bloque .label { margin-bottom:var(--s-3); }\n.bloque p { margin:0; color:var(--text-secondary); font-size:1rem; }\n.bloque p + p { margin-top:var(--s-4); }\n\n/* --- planes: tarjeta solo donde tiene sentido --------------------------- */\n.planes { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr));\n          gap:var(--s-5); margin-top:clamp(var(--s-8),5vw,var(--s-9)); }\n.plan { border:1px solid var(--border-light); border-radius:var(--radius-md);\n        padding:var(--s-6) var(--s-6) var(--s-7); background:var(--bg-white);\n        transition:border-color .3s var(--ease); }\n.bg-white .plan { background:var(--bg-primary); }\n.plan:hover { border-color:var(--border-mid); }\n.plan.destacado { background:var(--bg-dark); border-color:var(--bg-dark);\n                  color:var(--text-inverse); }\n.plan .label { margin-bottom:var(--s-4); }\n.plan.destacado .label { color:var(--brand-accent); }\n.precio { font-family:var(--serif); font-size:2.7rem; font-weight:400;\n          letter-spacing:-.038em; line-height:1; margin-bottom:6px; }\n.precio small { font-family:var(--sans); font-size:.86rem; color:var(--text-tertiary);\n                letter-spacing:0; }\n.plan.destacado .precio small { color:var(--text-inverse-2); }\n.plan .imp { font-family:var(--mono); font-size:.8rem; color:var(--text-secondary); }\n.plan.destacado .imp { color:var(--text-inverse-2); }\n.plan ul { list-style:none; padding:0; margin:var(--s-5) 0 0; font-size:.97rem;\n           color:var(--text-secondary); }\n.plan.destacado ul { color:var(--text-inverse-2); }\n.plan li { padding-block:10px; border-top:1px solid var(--border-light); }\n.plan.destacado li { border-color:var(--border-dark); }\n\n/* --- pantalla del producto ---------------------------------------------- */\n.screen { border-radius:var(--radius-lg); overflow:hidden; background:#0E1116;\n          border:1px solid rgba(0,0,0,.08); }\n.screen-bar { display:flex; align-items:center; gap:8px; padding:14px 20px;\n  background:#1A2126; border-bottom:1px solid #27333A; }\n.screen-bar i { width:9px; height:9px; border-radius:50%; background:#39434B; }\n.screen-bar .u { flex:1; text-align:center; font-family:var(--mono); font-size:.7rem;\n                 color:#93A1B0; }\n.screen-h { display:flex; justify-content:space-between; gap:12px; padding:16px 24px;\n  background:#161D22; border-bottom:1px solid #27333A; font-family:var(--mono);\n  font-size:.7rem; letter-spacing:.12em; text-transform:uppercase; color:#93A1B0; }\n.screen-h b { color:#E8EDF2; font-weight:500; }\n.screen-b { padding:var(--s-5) 24px; }\n.al { display:grid; grid-template-columns:3px minmax(0,1fr) auto; gap:0 20px;\n      align-items:start; padding-block:18px; border-top:1px solid #27333A;\n      opacity:0; transform:translateY(16px); }\n.al:first-child { border-top:0; padding-top:4px; }\n.screen.on .al { animation:reveal .8s var(--ease) forwards; }\n@keyframes reveal { to { opacity:1; transform:none; } }\n.al .bar { align-self:stretch; border-radius:2px; }\n.al.c1 .bar{background:#E5484D} .al.c2 .bar{background:#F5A524} .al.c3 .bar{background:#3E9EFF}\n.al .sev { font-family:var(--mono); font-size:.62rem; letter-spacing:.1em;\n           text-transform:uppercase; margin-bottom:7px; }\n.al.c1 .sev{color:#E5484D} .al.c2 .sev{color:#F5A524} .al.c3 .sev{color:  c3\">\u003cspan class=\"bar\">\u003c/span>\n          \u003cdiv>\u003cdiv class=\"sev\">Media\u003c/div>\n            \u003cdiv class=\"t\">Compresor 02 · 44 kW con la planta parada\u003c/div>\n            \u003cdiv class=\"d\">No se detiene al acabar el último turno. El compresor 01 sí.\u003c/div>\u003c/div>\n          \u003cdiv class=\"e\" data-count=\"14662\">0 €\u003cspan>al año\u003c/span>\u003c/div>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"screen-f\">\u003cspan>Impacto detectado este mes\u003c/span>\u003cb data-count=\"45669\">0 €\u003c/b>\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- LA PRUEBA · gráfica ===================================================== -->\n\u003csection id=\"prueba\">\n  \u003cdiv class=\"wrap split\">\n    \u003cdiv class=\"col-txt\">\n      \u003cp class=\"label marca\">La prueba\u003c/p>\n      \u003ch2>Esta es la alerta, dibujada\u003c/h2>\n      \u003cp class=\"lead\">El rendimiento de la Estación P4 se movía en torno a su línea base durante\n      semanas. El martes se cambió de formato y cayó once puntos — y siguió cayendo sin que\n      saltara ninguna avería, porque no hubo ninguna avería.\u003c/p>\n      \u003cp>Lo que hubo fueron \u003cstrong>92 microparadas al día\u003c/strong> de entre 40 y 90 segundos.\n      Ninguna llega al registro del SCADA. Todas juntas cuestan\n      \u003cstrong>129.218 € al año\u003c/strong>.\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"chart rise\" id=\"chart\">\n      \u003csvg viewBox=\"0 0 620 320\" role=\"img\"\n           aria-label=\"El rendimiento diario de la estación P4 se mantiene sobre el 87% durante tres semanas y cae al 75% tras el cambio de formato.\">\n        \u003cg stroke=\"rgba(21,24,21,.10)\" stroke-width=\"1\">\n          \u003cline x1=\"52\" y1=\"44\" x2=\"600\" y2=\"44\"/>\u003cline x1=\"52\" y1=\"108\" x2=\"600\" y2=\"108\"/>\n          \u003cline x1=\"52\" y1=\"172\" x2=\"600\" y2=\"172\"/>\u003cline x1=\"52\" y1=\"236\" x2=\"60 s=\"n\">67%\u003c/div>\n        \u003cp>de los rechazos de una referencia, concentrados en un único lote\u003c/p>\u003c/div>\n      \u003cdiv class=\"cifra\">\u003cdiv class=\"n\">14.662 €\u003c/div>\n        \u003cp>al año de un compresor que no se apaga cuando la planta para\u003c/p>\u003c/div>\n      \u003cdiv class=\"cifra\">\u003cdiv class=\"n\">72,9%\u003c/div>\n        \u003cp>de las paradas sin causa registrada. Eso también te lo decimos\u003c/p>\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- MANTENIMIENTO =========================================================== -->\n\u003csection>\n  \u003cdiv class=\"wrap split flip\">\n    \u003cdiv class=\"col-txt\">\n      \u003cp class=\"label marca\">Mantenimiento\u003c/p>\n      \u003ch2>El aviso llega antes que la avería\u003c/h2>\n      \u003cp class=\"lead\">El compresor 02 bajó de 82 a 74 puntos de salud en treinta días. Su\n      consumo específico sube un 14,6% y acumula tres alarmas de presión.\u003c/p>\n      \u003cp>\u003cstrong>No ha dado ni una avería todavía\u003c/strong>, así que no aparecería en ningún\n      GMAO. Cuando la dé será un jueves por la tarde, y parará la línea.\u003c/p>\n      \u003cdiv class=\"acciones\">\u003ca class=\"btn ghost\" href=\"#radares\">Ver los radares\u003c/a>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"img\" data-img>\n      \u003csvg viewBox=\"0 0 620 520\" role=\"img\"\n           aria-label=\"Un técnico de mantenimiento con casco y protección auditiva consulta su móvil delante del cuadro de control de una máquina.\">\n        \u003cdefs>\n          \u003clinearGradient id=\"pared2\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\n            \u003cstop offset=\"0\" stop-color=\"#F0F3F2\"/>\u003cstop offset=\"1\" stop-color=\"#E0E6E5\"/>\u003c/linearGradient>\n          \u003clinearGradient id=\"maq2\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"0\">\n            \u003cstop offset=\"0\" stop-color=\"#8D99A1\"/>\u003cstop offset=\"1\" stop-color=\"#75818A\"/>
