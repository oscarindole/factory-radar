         \u003cpath d=\"M166 336 q28 22 20 58 l-28 -5 q7 -26 -7 -41 z\" fill=\"#DE8B00\"/>\n          \u003crect x=\"150\" y=\"386\" width=\"26\" height=\"19\" rx=\"9\" fill=\"#B4763F\"/>\n          \u003cg transform=\"rotate(-15 170 380)\">\n            \u003crect x=\"152\" y=\"348\" width=\"38\" height=\"58\" rx=\"7\" fill=\"#1B1D22\"/>\n            \u003crect x=\"158\" y=\"355\" width=\"26\" height=\"44\" rx=\"3\" fill=\"#0E1116\"/>\n            \u003cpath d=\"M162 386 L170 377 L178 384\" stroke=\"#E0115F\" stroke-width=\"3\" fill=\"none\"/>\n            \u003crect x=\"162\" y=\"364\" width=\"16\" height=\"4\" rx=\"2\" fill=\"#4E5A62\"/>\u003c/g>\n          \u003cpath d=\"M92 336 q-26 24 -14 58 l26 -7 q-9 -26 4 -39 z\" fill=\"#DE8B00\"/>\n          \u003crect x=\"76\" y=\"386\" width=\"26\" height=\"19\" rx=\"9\" fill=\"#B4763F\"/>\n          \u003ccircle cx=\"128\" cy=\"282\" r=\"28\" fill=\"#C68B58\"/>\n          \u003cpath d=\"M102 276 q4 -28 28 -28 q26 0 26 28 z\" fill=\"#33281F\"/>\n          \u003cpath d=\"M96 270 a32 32 0 0 1 64 0 z\" fill=\"#F59B00\"/>\n          \u003cpath d=\"M96 270 a32 32 0 0 1 64 0 l-8 0 a24 24 0 0 0 -48 0 z\" fill=\"#FFB22E\"/>\n          \u003crect x=\"89\" y=\"266\" width=\"78\" height=\"11\" rx=\"5.5\" fill=\"#DE8B00\"/>\n          \u003cg>\u003crect x=\"94\" y=\"270\" width=\"9\" height=\"24\" rx=\"4\" fill=\"#2F3941\"/>\n            \u003ccircle cx=\"104\" cy=\"288\" r=\"11\" fill=\"#E0115F\"/>\n            \u003ccircle cx=\"104\" cy=\"288\" r=\"5\" fill=\"#B00C4A\"/>\u003c/g>\u003c/g>\n      \u003c/svg>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- NO CAMBIES TU FÁBRICA =================================================== -->\n\u003csection class=\"bg-white\">\n  \u003cdiv class=\"wrap\">\n    \u003cp class=\"label\">No cambies tu fábrica\u003c/p>\n    \u003cp class=\"frase\" style=\"max-width:17ch\">Si lo único que hay es un Excel, empezamos por ese Excel.\u003c/p>\n    \u003cp class=\"lead text\">Nos adaptamos nosotros. Los tres primeros peldaños de la escalera no\n    tocan absolutamente nada de tu red.\u003c/p>\n    \u003cdiv class=\"tw\">\u003ctable class=\"tabla\">\n      \u003cthead>\u003ctr>\u003cth>Peldaño\u003c/th>\u003cth>De dónde sale el dato\u003c/th>\u003cth style=\"text-align:right\">Valor en\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \u003ctr>\u003ctd class=\"idx\">00\u003c/td>\u003ctd class=\"destacado\">El Excel que ya rellenan a mano\u003c/td>\u003ctd class=\"dato\">3 días\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd class=\"idx\">01\u003c/td>\u003ctd class=\"destacado\">Consulta de solo lectura al historiador\u003c/td>\u003ctd class=\"dato\">1 semana\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd class=\"idx\">02\u003c/td>\u003ctd class=\"destacado\">API del ERP o del GMAO\u003c/td>\u003ctd class=\"dato\">2 semanas\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd class=\"idx\">03\u003c/td>\u003ctd class=\"destacado\">OPC UA o MQTT en tiempo real\u003c/td>\u003ctd class=\"dato\">continuo\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd class=\"idx\">04\u003c/td>\u003ctd class=\"destacado\">Sensórica añadida donde falta\u003c/td>\u003ctd class=\"dato\">proyecto aparte\u003c/td>\u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- CÓMO FUNCIONA · secuencia narrativa ===================================== -->\n\u003csection id=\"como\">\n  \u003cdiv class=\"wrap\">\n    \u003cdiv class=\"text\">\n      \u003cp class=\"label marca\">Cómo funciona\u003c/p>\n      \u003ch2>De datos a decisiones\u003c/h2>\n      \u003cp class=\"lead\">La mayoría del mercado llega hasta el segundo eslabón —te pinta la serie—\n      o hasta el tercero —te dispara una alarma. RADACTORY empieza a valer dinero en el quinto.\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"seq\" id=\"seq\">\n      \u003cdiv class=\"seq-item rise\">\u003cdiv class=\"seq-num\">01\u003c/div>\n        \u003cdiv class=\"seq-body\">\u003ch3>Dato\u003c/h3>\u003cp>Contador de la línea 3, cada cinco minutos.\u003c/p>\u003c/div>\u003c/div>\n      \u003cdiv class=\"seq-item rise\">\u003cdiv class=\"seq-num\">02\u003c/div>\n        \u003cdiv class=\"seq-body\">\u003ch3>Contexto\u003c/h3>\u003cp>Esa máquina, esa línea, ese producto, ese turno,\n          ciclo nominal 13 s.\u003c/p>\u003c/div>\u003c/div>\n      \u003cdiv class=\"seq-item rise\">\u003cdiv class=\"seq-num\">03\u003c/div>\n        \u003cdiv class=\"seq-body\">\u003ch3>Anomalía\u003c/h3>\u003cp>Rendimiento 11 puntos por debajo de su propia\n          línea base.\u003c/p>\u003c/div>\u003c/div>\n      \u003cdiv class=\"seq-item rise\">\u003cdiv class=\"seq-num\">04\u003c/div>\n        \u003cdiv class=\"seq-body\">\u003ch3>Diagnóstico\u003c/h3>\u003cp>92 microparadas al día en P4 desde el cambio\n          de formato.\u003c/p>\u003c/div>\u003c/div>\n      \u003cdiv class=\"seq-item hot rise\">\u003cdiv class=\"seq-num\">05\u003c/div>\n        \u003cdiv class=\"seq-body\">\u003ch3>Impacto\u003c/h3>\u003cp>2.575 uds/semana × 1,25 € de margen ×\n          48 semanas.\u003c/p>\u003c/div>\u003c/div>\n      \u003cdiv class=\"seq-item hot rise\">\u003cdiv class=\"seq-num\">06\u003c/div>\n        \u003cdiv class=\"seq-body\">\u003ch3>Acción\u003c/h3>\u003cp>Orden de trabajo para revisar el alimentador de\n          P4.\u003c/p>\u003c/div>\u003c/div>\n    \u003c/div>\n    \u003cp class=\"nota\">Si la pantalla no termina en un euro o en una acción, sobra.\u003c/p>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- RADARES ================================================================= -->\n\u003csection class=\"bg-soft\" id=\"radares\">\n  \u003cdiv class=\"wrap\">\n    \u003cdiv class=\"text\">\n      \u003cp class=\"label\">Módulos\u003c/p>\n      \u003ch2>Seis radares, seis preguntas\u003c/h2>\n      \u003cp class=\"lead\">Cada uno existe porque contesta una pregunta de negocio, no porque quede\n      bien en un folleto.\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"bloques c3\">\n      \u003cdiv class=\"bloque rise\">\u003cp class=\"label\">Production Radar\u003c/p>\n        \u003ch3>¿Dónde estoy perdiendo?\u003c/h3>\n        \u003cp>OEE desglosado en sus tres factores, microparadas derivadas, paradas con causa y\n        comparativa entre turnos y líneas.\u003c/p>\u003c/div>\n      \u003cdiv class=\"bloque rise\">\u003cp class=\"label\">Maintenance Radar\u003c/p>\n        \u003ch3>¿Qué reviso esta semana?\u003c/h3>\n        \u003cp>Salud de 0 a 100 por activo, con sus cuatro componentes abiertos. Ordenado por caída,\n        no por nivel: la señal es la derivada.\u003c/p>\u003c/div>\n      \u003cdiv class=\"bloque rise\">\u003cp class=\"label\">Energy Radar\u003c/p>\n        \u003ch3>¿Qué puedo apagar?\u003c/h3>\n        \u003cp>Consumo por unidad producida, no absoluto. Y lo que se gasta con la planta parada,\n        que suele ser entre el 8% y el 20% de la factura.\u003c/p>\u003c/div>\n      \u003cdiv class=\"bloque rise\">\u003cp class=\"label\">Quality Radar\u003c/p>\n        \u003ch3>¿A quién llamo?\u003c/h3>\n        \u003cp>Cruce de cada rechazo con lote, materia prima, proveedor, máquina, turno y operario.\n        Correlación con su fuerza estadística, nunca causa.\u003c/p>\u003c/div>\n      \u003cdiv class=\"bloque rise\">\u003cp class=\"label\">Supplier Radar\u003c/p>\n        \u003ch3>¿Con quién renegocio?\u003c/h3>\n        \u003cp>Score de proveedor abierto en cinco componentes, y aviso cuando uno se deteriora\n        aunque siga siendo aceptable.\u003c/p>\u003c/div>\n      \u003cdiv class=\"bloque rise\">\u003cp class=\"label\">Factory Brain\u003c/p>\n        \u003ch3>¿Qué compruebo ahora?\u003c/h3>\n        \u003cp>Los manuales, los esquemas y los cuatro mil partes históricos, respondiendo en\n        castellano con la fuente citada. Y si no sabe, lo dice.\u003c/p>\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- COPILOT ================================================================= -->\n\u003csection>\n  \u003cdiv class=\"wrap\">\n    \u003cdiv class=\"text\">\n      \u003cp class=\"label marca\">Industrial AI Copilot\u003c/p>\n      \u003ch2>Pregunta a tu fábrica\u003c/h2>\n      \u003cp class=\"lead\">Consulta el dato real. No estima nunca. Y cita siempre de dónde sale, para\n      que puedas comprobarlo.\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"seq\">\n      \u003cdiv class=\"seq-item rise\">\u003cdiv class=\"seq-num\">Tú\u003c/div>\n        \u003cdiv class=\"seq-body\">\u003ch3>¿Qué máquina debería revisar mantenimiento?\u003c/h3>\n          \u003cp>En castellano, sin filtros ni menús desplegables.\u003c/p>\u003c/div>\u003c/div>\n      \u003cdiv class=\"seq-item rise\">\u003cdiv class=\"seq-num\">RDC\u003c/div>\n        \u003cdiv class=\"seq-body\">\n          \u003ch3>Compresor 02. Ha bajado de 82 a 74 puntos de salud en treinta días.\u003c/h3>\n          \u003cdiv>\u003cp>Su consumo específico sube un 14,6% y acumula tres alarmas de presión este\n            mes. No ha dado ninguna avería todavía, y por eso no aparecería en tu GMAO.\u003c/p>\n            \u003cp class=\"mono\" style=\"font-size:.78rem;color:var(--text-tertiary)\">FUENTES ·\n              salud del activo 9 sep y 10 ago · consumo diario · alarmas del PLC\u003c/p>\u003c/div>\u003c/div>\u003c/div>\n    \u003c/div>\n    \u003cp class=\"nota\">No escribe consultas contra tu base: elige una plantilla del catálogo y se\n      ejecuta con los permisos de quien pregunta. \u003cstrong>La IA no es una puerta trasera a los\n      permisos.\u003c/strong>\u003c/p>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- RETORNO ================================================================= -->\n\u003csection class=\"bg-white\">\n  \u003cdiv class=\"wrap\">\n    \u003cdiv class=\"text\">\n      \u003cp class=\"label\">Retorno\u003c/p>\n      \u003ch2>Lo que se recupera, con rangos honestos\u003c/h2>\n      \u003cp class=\"lead\">No decimos «hasta un 40%». Estas son las horquillas que se ven en plantas\n      del tamaño de la tuya, y en el piloto medimos las tuyas.\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"tw\">\u003ctable class=\"tabla\">\n      \u003cthead>\u003ctr>\u003cth>Dónde\u003c/th>\u003cth>Por qué se recupera\u003c/th>\u003cth style=\"text-align:right\">Horquilla\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \u003ctr>\u003ctd class=\"destacado\">Paradas no planificadas\u003c/td>\n          \u003ctd>Se detecta la deriva antes del fallo. Una hora de parada en línea principal cuesta\n            entre 1.500 y 12.000 €\u003c/td>\u003ctd class=\"dato\">2–6 evitadas/año\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd class=\"destacado\">Microparadas\u003c/td>\n          \u003ctd>Se miden por primera vez, y lo que se mide se corrige\u003c/td>\n          \u003ctd class=\"dato\">3–8 puntos de OEE\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd class=\"destacado\">Scrap\u003c/td>\n          \u003ctd>La causa aparece en el cruce lote–proveedor–turno, no en el Pareto\u003c/td>\n          \u003ctd class=\"dato\">0,5–2 puntos\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd class=\"destacado\">Energía fuera de horario\u003c/td>\n          \u003ctd>Es una resta, no un modelo. Se corrige con un temporizador\u003c/td>\n          \u003ctd class=\"dato\">8–20% del consumo\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd class=\"destacado\">Tiempo de análisis\u003c/td>\n          \u003ctd>El Excel del lunes por la mañana deja de existir\u003c/td>\n          \u003ctd class=\"dato\">4 h → menos de 1 h\u003c/td>\u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\u003c/div>\n    \u003cp class=\"nota\">\u003cstrong>Si en el piloto no aparecen 30.000 € de mejora identificada, el\n      producto no vale para tu planta y te lo decimos.\u003c/strong>\u003c/p>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- SEGURIDAD =============================================================== -->\n\u003csection id=\"seguridad\">\n  \u003cdiv class=\"wrap\">\n    \u003cdiv class=\"text\">\n      \u003cp class=\"label\">Para reenviar a tu responsable de IT\u003c/p>\n      \u003ch2>El dato sube. Nunca baja.\u003c/h2>\n      \u003cp class=\"lead\">Sabemos que esto no lo decides tú solo.\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"bloques c2\">\n      \u003cdiv class=\"bloque rise\">\u003ch3>Ningún puerto abierto\u003c/h3>\n        \u003cp>El conector abre él la conexión, TLS mutuo por el 443 de salida. No escucha en ningún\n        puerto: tu cortafuegos no necesita ninguna regla de entrada. Sin VPN entrante, sin túnel\n        inverso, sin escritorio remoto.\u003c/p>\u003c/div>\n      \u003cdiv class=\"bloque rise\">\u003ch3>Solo lectura, y no es una opción\u003c/h3>\n        \u003cp>No hay código capaz de escribir en un PLC. No está desactivado: no está implementado,\n        y te enseñamos el repositorio. Nunca escribiremos en un sistema OT — eso es otro\n        producto, con otra certificación y otro seguro.\u003c/p>\u003c/div>\n      \u003cdiv class=\"bloque rise\">\u003ch3>Aguanta sin línea\u003c/h3>\n        \u003cp>Siete días de memoria local. Si cae internet sigue recogiendo, y al volver reenvía en\n        orden, sin duplicar y sin perder. Tampoco insiste contra un PLC antiguo: saturarlo puede\n        afectar a su ciclo de scan.\u003c/p>\u003c/div>\n      \u003cdiv class=\"bloque rise\">\u003ch3>Tu dato es solo tuyo\u003c/h3>\n        \u003cp>Aislamiento en el propio motor de base de datos, no solo en el código. Servidores en\n        la Unión Europea. Arquitectura conforme a IEC 62443 e ISO 27001, y contrato de encargado\n        del tratamiento desde el primer día.\u003c/p>\u003c/div>\n    \u003c/div>\n    \u003cp class=\"nota\">Los operarios van seudonimizados por defecto. Cruzar productividad con\n      nombre y apellidos es tratamiento de datos personales en contexto laboral.\u003c/p>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- EL PILOTO =============================================================== -->\n\u003csection class=\"bg-soft\" id=\"empezar\">\n  \u003cdiv class=\"wrap\">\n    \u003cp class=\"label marca\">Cómo empezamos\u003c/p>\n    \u003cp class=\"frase\" style=\"max-width:14ch\">Seis semanas. Una línea. 4.900 €.\u003c/p>\n    \u003cp class=\"lead text\">No te pedimos que te comprometas con la planta entera ni con doce meses.\n    En la semana seis presentamos a dirección lo que hemos encontrado, en euros.\u003c/p>\n    \u003cdiv class=\"seq\">\n      \u003cdiv class=\"seq-item rise\">\u003cdiv class=\"seq-num\">01\u003c/div>\n        \u003cdiv class=\"seq-body\">\u003ch3>Auditoría de datos\u003c/h3>\n          \u003cp>Qué hay, qué falta y qué calidad tiene. Te llevas el mapa de tus fuentes y en qué\n          peldaño estás.\u003c/p>\u003c/div>\u003c/div>\n      \u003cdiv class=\"seq-item rise\">\u003cdiv class=\"seq-num\">02\u003c/div>\n        \u003cdiv class=\"seq-body\">\u003ch3>Conexión\u003c/h3>\n          \u003cp>Validada contra un dato que ya conoces: dato real entrando, y cuadrado con tu\n          parte.\u003c/p>\u003c/div>\u003c/div>\n      \u003cdiv class=\"seq-item rise\">\u003cdiv class=\"seq-num\">03\u003c/div>\n        \u003cdiv class=\"seq-body\">\u003ch3>Contexto\u003c/h3>\n          \u003cp>Jerarquía, turnos, productos, ciclos y márgenes. El panel con la producción real de\n          la línea.\u003c/p>\u003c/div>\u003c/div>\n      \u003cdiv class=\"seq-item rise\">\u003cdiv class=\"seq-num\">04\u003c/div>\n        \u003cdiv class=\"seq-body\">\u003ch3>Alertas\u003c/h3>\n          \u003cp>Línea base aprendida, umbrales y destinatarios. Las primeras alertas, con su\n          impacto en euros.\u003c/p>\u003c/div>\u003c/div>\n      \u003cdiv class=\"seq-item rise\">\u003cdiv class=\"seq-num\">05\u003c/div>\n        \u003cdiv class=\"seq-body\">\u003ch3>Copilot\u003c/h3>\n          \u003cp>Recalibración con tu feedback, y preguntar en castellano sobre tus propios\n          datos.\u003c/p>\u003c/div>\u003c/div>\n      \u003cdiv class=\"seq-item hot rise\">\u003cdiv class=\"seq-num\">06\u003c/div>\n        \u003cdiv class=\"seq-body\">\u003ch3>Impacto\u003c/h3>\n          \u003cp>Cuantificación y presentación a dirección: informe de oportunidades en euros.\u003c/p>\u003c/div>\u003c/div>\n    \u003c/div>\n    \u003cp class=\"nota\">Los 4.900 € se descuentan de la implantación si sigues adelante.\u003c/p>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- PRECIO ================================================================== -->\n\u003csection id=\"precio\">\n  \u003cdiv class=\"wrap\">\n    \u003cdiv class=\"text\">\n      \u003cp class=\"label\">Precio\u003c/p>\n      \u003ch2>Suscripción, con la implantación aparte\u003c/h2>\n      \u003cp class=\"lead\">Separadas a propósito: meterlo todo en la cuota mensual obliga a un\n      compromiso de veinticuatro meses que nadie firma en la primera compra.\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"planes\">\n      \u003cdiv class=\"plan\">\u003cp class=\"label\">Starter\u003c/p>\n        \u003cdiv class=\"precio\">390 €\u003csmall> /mes\u003c/small>\u003c/div>\n        \u003cdiv class=\"imp\">implantación 2.500 €\u003c/div>\n        \u003cul>\u003cli>1 planta · hasta 20 activos\u003c/li>\u003cli>Producción\u003c/li>\n          \u003cli>Excel, CSV y API\u003c/li>\u003cli>5 usuarios · panel y correo\u003c/li>\u003c/ul>\u003c/div>\n      \u003cdiv class=\"plan destacado\">\u003cp class=\"label\">Pro\u003c/p>\n        \u003cdiv class=\"precio\">890 €\u003csmall> /mes\u003c/small>\u003c/div>\n        \u003cdiv class=\"imp\">implantación 6.500 €\u003c/div>\n        \u003cul>\u003cli>1 planta · hasta 100 activos\u003c/li>\u003cli>+ Mantenimiento y Energía\u003c/li>\n          \u003cli>+ SQL, MQTT y OPC UA\u003c/li>\u003cli>20 usuarios · Teams y Slack\u003c/li>\n          \u003cli>Conector Edge incluido\u003c/li>\u003c/ul>\u003c/div>\n      \u003cdiv class=\"plan\">\u003cp class=\"label\">Enterprise\u003c/p>\n        \u003cdiv class=\"precio\">2.400 €\u003csmall> /mes desde\u003c/small>\u003c/div>\n        \u003cdiv class=\"imp\">implantación desde 15.000 €\u003c/div>\n        \u003cul>\u003cli>Multi-planta · sin límite\u003c/li>\u003cli>Todos los radares\u003c/li>\n          \u003cli>Integración a medida\u003c/li>\u003cli>SSO · SLA 99,5%\u003c/li>\n          \u003cli>Factory Brain · modelo propio\u003c/li>\u003c/ul>\u003c/div>\n    \u003c/div>\n    \u003cp class=\"nota\">Un PRO son 17.180 € el primer año. Una sola parada no planificada evitada en\n      una línea principal ronda los 10.000 €.\u003c/p>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- CTA FINAL =============================================================== -->\n\u003csection class=\"bg-dark\">\n  \u003cdiv class=\"wrap\">\n    \u003cp class=\"label\">Empieza por una línea\u003c/p>\n    \u003cp class=\"frase\" style=\"max-width:15ch;color:var(--text-inverse)\">Abre tu fábrica cada mañana\n      y sabe qué mirar.\u003c/p>\n    \u003cp class=\"lead\" style=\"max-width:48ch\">Treinta segundos, cinco líneas y un euro detrás de\n    cada una. Eso es todo lo que pedimos que pruebes.\u003c/p>\n    \u003cdiv class=\"acciones\">\n      \u003ca class=\"btn inv\" href=\"#empezar\">Solicitar análisis de planta \u003cspan class=\"arrow\">→\u003c/span>\u003c/a>\n      \u003ca class=\"btn ghost\" href=\"demo.html\" style=\"color:var(--text-inverse);border-color:var(--border-dark)\">Entrar en la demo\u003c/a>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003cfooter class=\"footer\">\n  \u003cdiv class=\"wrap\">\n    \u003cdiv class=\"footer-top\">\n      \u003cdiv>\n        \u003ca class=\"logo\" href=\"#\">\n          \u003csvg class=\"mark\" viewBox=\"0 0 100 100\" role=\"img\" aria-label=\"RADACTORY\">\n            \u003crect width=\"100\" height=\"100\" fill=\"currentColor\"/>\n            \u003cpath fill=\"var(--mark-cut,#FFFFFF)\" d=\"M8 20 H86 V42 H30 V84 H8 Z\"/>\n            \u003cpath fill=\"var(--mark-cut,#FFFFFF)\" d=\"M46 42 H68 L88 84 H64 Z\"/>\n          \u003c/svg>\u003cb>RADACTORY\u003c/b>\u003c/a>\n        \u003cp class=\"frase\" style=\"font-size:clamp(1.7rem,3.4vw,2.6rem);max-width:16ch\">Una capa de\n          inteligencia sobre lo que tu fábrica ya tiene.\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"footer-cols\">\n        \u003cdiv>\u003ch4>Producto\u003c/h4>\n          \u003ca href=\"#radares\">Radares\u003c/a>\u003ca href=\"#como\">Cómo funciona\u003c/a>\n          \u003ca href=\"#prueba\">La prueba\u003c/a>\u003ca href=\"demo.html\">Demo\u003c/a>\u003c/div>\n        \u003cdiv>\u003ch4>Empresa\u003c/h4>\n          \u003ca href=\"#seguridad\">Seguridad\u003c/a>\u003ca href=\"#precio\">Precio\u003c/a>\n          \u003ca href=\"#empezar\">Empezar\u003c/a>\u003c/div>\n        \u003cdiv>\u003ch4>Contacto\u003c/h4>\n          \u003cp>Índole Data Technology\u003c/p>\u003cp>Torrelavega, Cantabria\u003c/p>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"footer-bottom\">\n      \u003cspan>© 2026 Índole Data Technology\u003c/span>\n      \u003cspan>Cifras de la planta de demostración · ilustraciones propias\u003c/span>\n    \u003c/div>\n  \u003c/div>\n\u003c/footer>\n\n\u003cscript>\n(function () {\n  \"use strict\";\n  var quieto = matchMedia('(prefers-reduced-motion: reduce)').matches;\n\n  // cabecera: transicion muy suave al hacer scroll\n  var h = document.getElementById('header');\n  var alScroll = function () { h.classList.toggle('scrolled', scrollY > 8); };\n  addEventListener('scroll', alScroll, { passive:true }); alScroll();\n\n  function cuenta(el) {\n    var fin = parseFloat(el.dataset.count);\n    var resto = el.innerHTML.replace(/^[^\u003c]*/, '');\n    var pinta = function (n) {\n      el.innerHTML = Math.round(n).toLocaleString('es-ES') + ' €' + resto; };\n    if (quieto) { pinta(fin); return; }\n    var t0 = null;\n    (function paso(t) {\n      if (t0 === null) t0 = t;\n      var p = Math.min((t - t0) / 1400, 1);\n      pinta(fin * (1 - Math.pow(1 - p, 3)));\n      if (p \u003c 1) requestAnimationFrame(paso);\n    })(performance.now());\n  }\n\n  if (quieto || !('IntersectionObserver' in window)) {\n    document.querySelectorAll('.rise,.img,.chart,.screen')\n      .forEach(function (n) { n.classList.add('on'); });\n    document.querySelectorAll('[data-count]').forEach(cuenta);\n    return;\n  }\n\n  // reveal con stagger de 90 ms dentro de cada grupo\n  var obs = new IntersectionObserver(function (es) {\n    es.forEach(function (e, i) {\n      if (!e.isIntersecting) return;\n      e.target.style.transitionDelay = (i * 90) + 'ms';\n      e.target.classList.add('on');\n      obs.unobserve(e.target);\n    });\n  }, { threshold:.16, rootMargin:'0px 0px -8% 0px' });\n  document.querySelectorAll('.rise').forEach(function (n) { obs.observe(n); });\n\n  // imagenes: escala 1.03 -> 1 y opacidad .82 -> 1, muy lento\n  var obsImg = new IntersectionObserver(function (es) {\n    es.forEach(function (e) {\n      if (!e.isIntersecting) return;\n      e.target.classList.add('on'); obsImg.unobserve(e.target);\n    });\n  }, { threshold:.18 });\n  document.querySelectorAll('[data-img]').forEach(function (n) { obsImg.observe(n); });\n\n  var pantalla = document.getElementById('screen');\n  if (pantalla) {\n    pantalla.querySelectorAll('.al').forEach(function (a, i) {\n      a.style.animationDelay = (260 + i * 140) + 'ms'; });\n    new IntersectionObserver(function (es, o) {\n      es.forEach(function (e) {\n        if (!e.isIntersecting) return;\n        e.target.classList.add('on');\n        e.target.querySelectorAll('[data-count]').forEach(cuenta);\n        o.unobserve(e.target);\n      });\n    }, { threshold:.28 }).observe(pantalla);\n  }\n\n  var chart = document.getElementById('chart');\n  if (chart) new IntersectionObserver(function (es, o) {\n    es.forEach(function (e) {\n      if (!e.isIntersecting) return;\n      e.target.classList.add('on'); o.unobserve(e.target);\n    });\n  }, { threshold:.32 }).observe(chart);\n})();\n\u003c/script>\n","bytes":63166,"lineas":1109,"lenguaje":"xml","para":"La web comercial: diez secciones, cifras reales de la demo y la sección de seguridad escrita para reenviar a IT.","chip":null,"chipTono":null,"estado":null},"scripts/construir-explorador.mjs":{"texto":"#!/usr/bin/env node\n// ---------------------------------------------------------------------------\n// Construye doc/explorador.html: el proyecto entero, navegable en una pagina.\n//\n// Se regenera cuando cambia el codigo. La plantilla es\n// scripts/explorador.plantilla.html y aqui solo se inyectan los datos, para que\n// tocar el diseño no obligue a tocar este fichero ni al reves.\n//\n// Lo que hace que esto sea un explorador y no un volcado de ficheros son las\n// anotaciones de abajo: cada fichero dice PARA QUE sirve. Un arbol de 57\n// ficheros sin eso no se lee, se hojea.\n// ---------------------------------------------------------------------------\nimport { readFileSync, writeFileSync, readdirSync, statSync } from 'node:fs';\nimport { join, dirname, relative, extname } from 'node:path';\nimport { fileURLToPath } from 'node:url';\n\nconst raiz = join(dirname(fileURLToPath(import.meta.url)), '..');\n\nconst SELLO = 'fases A · B · C · 9 sep 2026';\n\n// Grupos en el orden en que tiene sentido leerlos, no en orden alfabetico.\nconst GRUPOS = [\n  { nombre: 'Empezar por aquí', rutas: ['@resumen', 'README.md', 'CLAUDE.md'] },\n  { nombre: 'Fase A · definición', dir: 'doc' },\n  { nombre: 'Fase B · base de datos', dir: 'db' },\n  { nombre: 'Fase B · backend', dir: 'src' },\n  { nombre: 'Fase B · pruebas', dir: 'tests' },\n  { nombre: 'Fase C · demo factory', rutas: [\n      'doc/12-demo.md', 'scripts/demo-factory.mjs', 'scripts/demo-motor.mjs',\n      'scripts/exportar-demo.mjs', 'scripts/construir-demo.mjs',\n      'scripts/demo.plantilla.html'] },\n  { nombre: 'Fase B · panel', dir: 'panel' },\n  { nombre: 'Fase B · conector edge', dir: 'edge' },\n  { nombre: 'Fase C · web comercial', dir: 'web' },\n  { nombre: 'Marca', rutas: ['doc/13-marca.md', 'doc/marca.svg'] },\n  { nombre: 'Herramientas', dir: 'scripts' },\n  { nombre: 'Configuración', rutas: ['package.json', '.env.example', '.gitignore'] },\n];\n\n// Para qué sirve cada fichero. Sin esto el árbol no se lee.\nconst PARA = {\n  'README.md': 'La puerta de entrada: qué es el producto, en qué fase está y cómo se levanta en local.',\n  'CLAUDE.md': 'Las reglas de la casa. Lo que no se hace en este producto, y por qué.',\n  'doc/00-producto.md': 'Qué vendemos, a quién, contra quién, y las fronteras que no cruzamos.',\n  'doc/01-modulos.md': 'Los ocho radares. Cada uno con su problema, su dinero, su usuario y su decisión.',\n  'doc/02-arquitectura.md': 'Las seis capas, el stack con el porqué de cada elección, y el Edge Connector.',\n  'doc/03-modelo-datos.md': 'Entidades y relaciones, y las cuatro decisiones que gobiernan el esquema.',\n  'doc/04-pantallas.md': 'Sitemap, wireframes, estados vacíos y el sistema visual del panel.',\n  'doc/05-integraciones.md': 'La escalera de ingesta: del Excel al OPC UA, y cómo se mapea una fuente.',\n  'doc/06-inteligencia.md': 'Motor de eventos, puntuaciones, Copilot y Factory Brain. Qué hace el LLM y qué no.',\n  'doc/07-seguridad.md': 'La frontera OT/IT, el aislamiento multiempresa y los marcos normativos.',\n  'doc/08-mvp-roadmap.md': 'El MVP recortado, la matriz de priorización, la Demo Factory y el roadmap.',\n  'doc/09-comercial.md': 'Precios, el piloto de seis semanas, la web pública y cómo se llega al cliente.',\n  'doc/10-decisiones.md': 'Las 29 decisiones tomadas, cada una con la alternativa descartada.',\n  'doc/11-api.md': 'Contrato de la API: endpoints, autenticación e ingesta.',\n  'db/01-extensiones.sql': 'TimescaleDB, pgvector y el rol de aplicación. Aquí vive fr_set_tenant().',\n  'db/02-organizacion.sql': 'Empresa, planta, usuarios, membresías y el log de auditoría.',\n  'db/03-planta.sql': 'El árbol de activos con su trigger de ruta, las señales y los conectores.',\n  'db/04-contexto.sql': 'Productos, órdenes, lotes, turnos, operarios y proveedores. La capa que da significado al dato.',\n  'db/05-series.sql': 'La hypertable de medidas, el rollup propio y la puerta controlada al dato crudo.',\n  'db/06-eventos.sql': 'Paradas, alarmas y el catálogo de causas. La columna que más dice de una planta.',\n  'db/07-calculo.sql': 'OEE, energía, calidad, mantenimiento y puntuaciones. Nada se guarda sin su explicación.',\n  'db/08-inteligencia.sql': 'Línea base, anomalías, alertas, registro de IA y el índice vectorial.',\n  'db/09-rls.sql': 'El aislamiento multiempresa, aplicado en bucle para que no se olvide ninguna tabla.',\n  'db/10-vistas.sql': 'Las vistas que lee el panel. Ninguna consulta toca la tabla cruda.',\n  'db/pruebas/semilla-fugas.sql': 'Planta dos empresas rivales, para después comprobar que no se ven.',\n  'db/pruebas/fugas.sql': 'Once pruebas de fuga entre inquilinos. Corren como el rol de la API, no como superusuario.',\n  'src/config.ts': 'Configuración congelada al arrancar, con lector de .env sin dependencias.',\n  'src/db.ts': 'Barrera 2 de 3: no se exporta ningún query suelto. Todo pasa por conInquilino().',\n  'src/api/servidor.ts': 'Fastify, registro de rutas y el gancho que exige sesión en todo lo que no es público.',\n  'src/api/contexto.ts': 'Sesión, permisos por rol, auditoría y resolverSite() — el arreglo de la decisión 29.',\n  'src/api/rutas/salud.ts': 'Comprueba que la base responde, no que el proceso sigue vivo.',\n  'src/api/rutas/estado.ts': 'La pantalla de los 30 segundos, en una sola petición.',\n  'src/api/rutas/alertas.ts': 'Bandeja, ficha con la cuenta abierta, y el feedback que cierra el bucle.',\n  'src/api/rutas/activos.ts': 'El árbol de planta, la ficha de máquina y el acceso controlado al dato crudo.',\n  'src/api/rutas/ingesta.ts': 'El sobre único de ingesta, idempotente por lote y con el token del conector.',\n  'src/api/rutas/copilot.ts': '\"Pregunta a tu fábrica\": seis pasos, y el segundo es de seguridad.',\n  'src/dominio/oee.ts': 'OEE siempre desglosado. No existe una función que devuelva solo el compuesto.',\n  'src/dominio/microparadas.ts': 'Deriva la pérdida invisible del hueco en el contador. Con umbral adaptado al ciclo.',\n  'src/dominio/impacto.ts': 'La traducción a euros, con la cuenta abierta. Si falta un dato, no se estima.',\n  'src/dominio/severidad.ts': 'La severidad se decide por dinero y urgencia, no por desviación estadística.',\n  'src/ia/proveedor.ts': 'La capa que impide que ningún proveedor de LLM entre en el código de negocio.',\n  'src/motor/calcular.ts': 'Del dato crudo a las métricas con contexto: OEE por turno, línea en su cuello de botella, energía y líneas base.',\n  'src/motor/detectar.ts': 'De la métrica a la alerta: detectores, impacto en euros, severidad y salud del activo.',\n  'doc/12-demo.md': 'Qué simula la DEMO FACTORY, qué cuatro problemas planta y cómo se regenera.',\n  'scripts/demo-factory.mjs': 'Genera 90 días de planta con semilla fija. Los cuatro problemas no van marcados en ninguna parte.',\n  'scripts/demo-motor.mjs': 'Pasa el motor completo sobre la demo. Es también la prueba del motor.',\n  'scripts/exportar-demo.mjs': 'Congela la demo en un JSON de 71 KB para el panel que se lleva a una reunión.',\n  'scripts/construir-demo.mjs': 'Inyecta la instantánea en la plantilla del panel de demo.',\n  'scripts/demo.plantilla.html': 'El panel navegable: nueve pantallas, gráficas con hover y la paleta validada.',\n  'doc/13-marca.md': 'El nombre, los colores y la regla que impide que el rosa de marca se confunda con una alarma.',\n  'doc/marca.svg': 'El símbolo, en vectorial. Redibujo aproximado hasta que llegue el original.',\n  'scripts/construir-sitio.mjs': 'Arma docs/, que es lo que sirve GitHub Pages, y reescribe el enlace de la demo a relativo.',\n  'scripts/publicar-sitio.sh': 'npm run publicar: arma el sitio y lo empuja a gh-pages desde un árbol de trabajo aparte.',\n  'web/index.html': 'La web comercial: diez secciones, cifras reales de la demo y la sección de seguridad escrita para reenviar a IT.',\n  'src/ia/consultas.ts': 'El catálogo de consultas del Copilot. El modelo elige plantilla; nunca escribe SQL.',\n  'tests/dominio.test.ts': '17 pruebas de la lógica de producto. No necesitan base de datos.',\n  'tests/api.test.ts': '11 pruebas contra base real. Comprueban el efecto, no la respuesta.',\n  'panel/README.md': 'Estructura del panel y las reglas que no se negocian pantalla a pantalla.',\n  'panel/src/estilo/tokens.css': 'El sistema visual entero. Oscuro por defecto: se mira en una nave.',\n  'panel/src/componentes/ChipSeveridad.tsx': 'Color, forma e icono. El color nunca va solo.',\n  'panel/src/componentes/Cifra.tsx': 'Un número con su tendencia y su cobertura. Sin dato no pinta un cero.',\n  'panel/src/componentes/CuentaAbierta.tsx': 'La fórmula con los valores reales. Se renderiza siempre que hay un euro.',\n  'edge/README.md': 'Las seis reglas que definen el conector. La primera desbloquea el proyecto con IT.',\n  'edge/src/buffer.ts': 'Los siete días de buffer que convierten un corte de línea en un retraso.',\n  'edge/src/fuentes/tipos.ts': 'El contrato de una fuente. Añadir OPC UA no toca nada más que ese directorio.',\n  'scripts/migrar.mjs': 'Aplica db/*.sql en orden. Idempotente: se puede relanzar sobre una base montada.',\n  'scripts/pruebas-fugas.mjs': 'Lanza la batería como fr_app, y se niega a correr si le das el rol equivocado.',\n  'scripts/construir-explorador.mjs': 'Genera esta misma página. Se muerde la cola a propósito.',\n  'scripts/explorador.plantilla.html': 'El diseño de esta página, separado de sus datos.',\n  'package.json': 'Dos dependencias: fastify y pg. Nada más entra sin discutirlo.',\n  '.env.example': 'Dos cadenas de conexión distintas, y el porqué de que sean dos.',\n  '.gitignore': 'Lo que nunca sale de esta máquina.',\n};\n\n// Estado de verificación. Solo lo comprobado de verdad lleva chip.\nconst CHIPS = {\n  'db/pruebas/fugas.sql': { chip: '11/11', tono: 'ok', estado: 'batería superada como fr_app' },\n  'tests/dominio.test.ts': { chip: '17/17', tono: 'ok', estado: 'pasa sin base de datos' },\n  'tests/api.test.ts': { chip: '11/11', tono: 'ok', estado: 'pasa contra PostgreSQL real' },\n  'doc/10-decisiones.md': { chip: '38', tono: 'teal' },\n  'scripts/demo-factory.mjs': { chip: '342k', tono: 'ok', estado: '342.528 medidas en 12 s' },\n  'scripts/demo-motor.mjs': { chip: '8 alertas', tono: 'ok', estado: 'los 4 problemas salen solos' },\n};\nfor (const f of ['01-extensiones','02-organizacion','03-planta','04-contexto','05-series',\n                 '06-eventos','07-calculo','08-inteligencia','09-rls','10-vistas']) {\n  CHIPS[`db/${f}.sql`] = { chip: 'aplica', tono: 'ok', estado: 'aplicado contra TimescaleDB pg16' };\n}\n\nconst LENG = { '.sql':'sql', '.ts':'typescript', '.tsx':'typescript', '.mjs':'javascript',\n               '.js':'javascript', '.css':'css', '.json':'json', '.html':'xml',\n               '.svg':'xml', '.sh':'bash' };\n\nconst GENERADOS = new Set(['dossier.html', 'explorador.html', 'demo.html']);\n\nfunction listar(dir) {\n  const salida = [];\n  for (const e of readdirSync(join(raiz, dir), { withFileTypes: true })) {\n    const r = `${dir}/${e.name}`;\n    if (e.isDirectory()) salida.push(...listar(r));\n    // Las paginas generadas no se embeben a si mismas: doc/demo.html son 118 KB\n    // de datos ya congelados y doblarian el peso de este explorador.\n    else if (!e.name.startsWith('.') && !GENERADOS.has(e.name)) {\n      salida.push(r);\n    }\n  }\n  return salida.sort();\n}\n\nconst ficheros = {};\nconst grupos = [];\n\nfor (const g of GRUPOS) {\n  const rutas = g.rutas ?? listar(g.dir);\n  const dentro = [];\n  for (const r of rutas) {\n    if (r === '@resumen') { dentro.push(r); continue; }\n    let texto;\n    try { texto = readFileSync(join(raiz, r), 'utf8'); } catch { continue; }\n    const c = CHIPS[r] ?? {};\n    ficheros[r] = {\n      texto,\n      bytes: Buffer.byteLength(texto),\n      lineas: texto.split('\\n').length,\n      lenguaje: LENG[extname(r)] ?? null,\n      para: PARA[r] ?? '',\n      chip: c.chip ?? null,\n      chipTono: c.tono ?? null,\n      estado: c.estado ?? null,\n    };\n    dentro.push(r);\n  }\n  if (dentro.length) grupos.push({ nombre: g.nombre, ficheros: dentro });\n}\n\nconst nFicheros = Object.keys(ficheros).length;\nconst nBytes = Object.values(ficheros).reduce((a, f) => a + (f.bytes ?? 0), 0);\nconst nLineas = Object.values(ficheros).reduce((a, f) => a + (f.lineas ?? 0), 0);\n\nficheros['@resumen'] = {\n  texto: '', para: 'Todo lo que hay construido, y qué está comprobado de verdad.',\n  bytes: 0, lineas: 0, chip: null, estado: null, lenguaje: null,\n};\n\nconst resumen = `\n\u003cdiv class=\"resumen\">\n  \u003cdiv class=\"md\">\n    \u003ch1>Radactory, de un vistazo\u003c/h1>\n    \u003cp>Capa de inteligencia industrial sobre los sistemas que la fábrica ya tiene.\n    Este explorador contiene el proyecto entero: la definición (fase A) y la\n    estructura real (fase B), fichero a fichero.\u003c/p>\n  \u003c/div>\n\n  \u003cdiv class=\"tarjetas\">\n    \u003cdiv class=\"tj\">\u003cdiv class=\"k\">Ficheros\u003c/div>\u003cdiv class=\"v\">${nFicheros}\u003c/div>\u003cdiv class=\"d\">sin dependencias\u003c/div>\u003c/div>\n    \u003cdiv class=\"tj\">\u003cdiv class=\"k\">Líneas\u003c/div>\u003cdiv class=\"v\">${nLineas.toLocaleString('es-ES')}\u003c/div>\u003cdiv class=\"d\">${(nBytes/1024).toFixed(0)} KB\u003c/div>\u003c/div>\n    \u003cdiv class=\"tj\">\u003cdiv class=\"k\">Esquema\u003c/div>\u003cdiv class=\"v ok\">10/10\u003c/div>\u003cdiv class=\"d\">aplican limpios\u003c/div>\u003c/div>\n    \u003cdiv class=\"tj\">\u003cdiv class=\"k\">Fugas\u003c/div>\u003cdiv class=\"v ok\">11/11\u003c/div>\u003cdiv class=\"d\">entre inquilinos\u003c/div>\u003c/div>\n    \u003cdiv class=\"tj\">\u003cdiv class=\"k\">Dominio\u003c/div>\u003cdiv class=\"v ok\">17/17\u003c/div>\u003cdiv class=\"d\">OEE, impacto…\u003c/div>\u003c/div>\n    \u003cdiv class=\"tj\">\u003cdiv class=\"k\">API\u003c/div>\u003cdiv class=\"v ok\">11/11\u003c/div>\u003cdiv class=\"d\">base real\u003c/div>\u003c/div>\n    \u003cdiv class=\"tj\">\u003cdiv class=\"k\">Demo\u003c/div>\u003cdiv class=\"v ok\">4/4\u003c/div>\u003cdiv class=\"d\">problemas detectados\u003c/div>\u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"aviso\">\n    \u003cb>Qué está comprobado y qué no\u003c/b>\n    Lo que lleva chip verde se ha ejecutado: el esquema contra PostgreSQL 16 con\n    TimescaleDB y pgvector, y las 39 pruebas contra esa misma base. El resto\n    —panel, conector, rutas de energía y calidad— es estructura y contrato, todavía\n    sin implementar. Está dicho fichero a fichero para que nadie confunda una cosa\n    con la otra.\n  \u003c/div>\n\n  \u003cdiv class=\"md\">\n    \u003ch2>Por dónde entrar\u003c/h2>\n    \u003cul>\n      \u003cli>\u003cstrong>Si vienes a entender el producto\u003c/strong> — \u003ccode>doc/00-producto.md\u003c/code>,\n      y luego \u003ccode>doc/01-modulos.md\u003c/code>.\u003c/li>\n      \u003cli>\u003cstrong>Si vienes a discutir una decisión\u003c/strong> — \u003ccode>doc/10-decisiones.md\u003c/code>.\n      Están las 29, cada una con la alternativa descartada.\u003c/li>\n      \u003cli>\u003cstrong>Si vienes a mirar el código\u003c/strong> — \u003ccode>db/09-rls.sql\u003c/code> y\n      \u003ccode>src/db.ts\u003c/code> primero: ahí está el aislamiento multiempresa, que es lo que\n      condiciona todo lo demás.\u003c/li>\n      \u003cli>\u003cstrong>Si vienes a vender\u003c/strong> — \u003ccode>doc/09-comercial.md\u003c/code>.\u003c/li>\n    \u003c/ul>\n\n    \u003ch2>Lo que aún no existe\u003c/h2>\n    \u003cp>La \u003cstrong>web comercial\u003c/strong> está definida en \u003ccode>doc/09-comercial.md\u003c/code>\n    pero no construida, y el \u003cstrong>panel\u003c/strong> tiene sistema visual y estructura pero\n    no pantallas: se llenan en la fase C, junto con la Demo Factory, que es cuando habrá\n    datos que enseñar.\u003c/p>\n  \u003c/div>\n\u003c/div>`.trim();\n\n// Se escapan '\u003c' y los separadores de linea Unicode: dentro de un \u003cscript>,\n// un '\u003c/script>' en cualquier fichero del repositorio cerraria la etiqueta, y\n// U+2028/U+2029 son saltos de linea validos para el parser de JavaScript.\nconst datos = 'window.__FR__=' + JSON.stringify({ sello: SELLO, grupos, ficheros, resumen })\n  .replace(/\u003c/g, '\\\\u003c')\n  .replace(/\\u2028/g, '\\\\u2028')\n  .replace(/\\u2029/g, '\\\\u2029') + ';';\n\nconst plantilla = readFileSync(join(raiz, 'scripts', 'explorador.plantilla.html'), 'utf8');\nconst salida = plantilla.replace('/*__DATOS__*/', () => datos);\nwriteFileSync(join(raiz, 'doc', 'explorador.html'), salida);\n\nconsole.log(`doc/explorador.html · ${nFicheros} ficheros · ${(Buffer.byteLength(salida)/1024).toFixed(0)} KB`);\n","bytes":15894,"lineas":247,"lenguaje":"javascript","para":"Genera esta misma página. Se muerde la cola a propósito.","chip":null,"chipTono":null,"estado":null},"scripts/construir-sitio.mjs":{"texto":"#!/usr/bin/env node\n// ---------------------------------------------------------------------------\n// Arma docs/, que es lo que sirve GitHub Pages (\"Deploy from a branch:\n// main /docs\"). Se llama docs/ porque es la convencion de Pages, y no hay que\n// confundirlo con doc/, que es la documentacion del proyecto.\n//\n// Aqui no se escribe contenido: se copia lo ya generado y se le pone un\n// indice. Si hay que cambiar algo, se cambia en su origen y se vuelve a armar.\n// ---------------------------------------------------------------------------\nimport { mkdirSync, copyFileSync, writeFileSync, existsSync } from 'node:fs';\nimport { join, dirname } from 'node:path';\nimport { fileURLToPath } from 'node:url';\n\nconst raiz = join(dirname(fileURLToPath(import.meta.url)), '..');\nconst salida = join(raiz, 'docs');\nmkdirSync(salida, { recursive: true });\n\nconst PAGINAS = [\n  { de: 'web/index.html',       a: 'index.html',       t: 'Web comercial' },\n  { de: 'doc/demo.html',        a: 'demo.html',        t: 'Demo Factory' },\n  { de: 'doc/dossier.html',     a: 'dossier.html',     t: 'Dossier de producto' },\n  { de: 'doc/explorador.html',  a: 'explorador.html',  t: 'Explorador del proyecto' },\n];\n\nconst faltan = [];\nfor (const p of PAGINAS) {\n  const origen = join(raiz, p.de);\n  if (!existsSync(origen)) { faltan.push(p.de); continue; }\n  copyFileSync(origen, join(salida, p.a));\n}\n\n// Pages sirve el fichero tal cual: las paginas se generaron para incrustarse en\n// el visor de artifacts, que aporta el esqueleto html/head/body. Aqui hay que\n// ponerselo, o el navegador las renderiza sin charset ni viewport.\nimport { readFileSync } from 'node:fs';\nfor (const p of PAGINAS) {\n  const f = join(salida, p.a);\n  if (!existsSync(f)) continue;\n  const cuerpo = readFileSync(f, 'utf8');\n  if (cuerpo.trimStart().toLowerCase().startsWith('\u003c!doctype')) continue;\n  const titulo = (cuerpo.match(/\u003ctitle>([^\u003c]*)\u003c\\/title>/i) || [, p.t])[1];\n  writeFileSync(f, `\u003c!doctype html>\n\u003chtml lang=\"es\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003cmeta name=\"robots\" content=\"noindex, nofollow\">\n\u003ctitle>${titulo}\u003c/title>\n\u003cstyle>\n  :root { color-scheme: light dark; }\n  html, body { margin: 0; }\n  body { font: 14px system-ui, sans-serif; background: #fff; }\n  img { max-width: 100%; }\n  [hidden] { display: none !important; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n${cuerpo}\n\u003c/body>\n\u003c/html>\n`);\n}\n\n// En Pages, la web enlaza a la demo del propio sitio, no al artifact privado.\n// El origen guarda la URL del artifact porque es donde vive mientras no haya\n// dominio; aqui se reescribe al publicar.\n{\n  const f = join(salida, 'index.html');\n  if (existsSync(f)) {\n    writeFileSync(f, readFileSync(f, 'utf8')\n      .replace(/https:\\/\\/claude\\.ai\\/code\\/artifact\\/[0-9a-f-]+/g, 'demo.html'));\n  }\n}\n\n// ---------------------------------------------------------------------------\n// Dominio propio.\n//\n// Si existe web/CNAME, se copia al sitio y GitHub Pages sirve el sitio en ese\n// dominio. IMPORTA EL ORDEN: en cuanto Pages ve un CNAME, deja de servir en\n// oscarindole.github.io y redirige al dominio propio. Si el DNS todavia no\n// resuelve, el resultado es que se cae la unica URL que funcionaba.\n//\n// Asi que primero el registro DNS, se comprueba que resuelve, y despues este\n// fichero. Nunca al reves.\n// ---------------------------------------------------------------------------\n{\n  const cn = join(raiz, 'web', 'CNAME');\n  if (existsSync(cn)) {\n    copyFileSync(cn, join(salida, 'CNAME'));\n    console.log(`  dominio propio: ${readFileSync(cn, 'utf8').trim()}`);\n  }\n}\n\n// Sin .nojekyll, Pages pasa todo por Jekyll y se salta lo que empieza por _\nwriteFileSync(join(salida, '.nojekyll'), '');\n\nconsole.log(`docs/ armado · ${PAGINAS.length - faltan.length} páginas`);\nif (faltan.length) console.log(`  faltan (no generadas todavía): ${faltan.join(', ')}`);\nconsole.log('  Pages: Settings → Pages → Deploy from a branch → main /docs');\n","bytes":3978,"lineas":100,"lenguaje":"javascript","para":"Arma docs/, que es lo que sirve GitHub Pages, y reescribe el enlace de la demo a relativo.","chip":null,"chipTono":null,"estado":null},"scripts/explorador.plantilla.html":{"texto":"\u003ctitle>Explorador de Radactory\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap\">\n\n\u003cstyle>\n/* Mismo sistema visual que el dossier: papel de ingenieria en claro,\n   instrumento en oscuro. Esto no es un documento, es una herramienta: se\n   escanea y se opera, asi que la jerarquia la lleva la informacion, no la\n   tipografia. */\n:root {\n  --paper:#F1F3F2; --paper-2:#E7EAE9; --card:#FBFCFB;\n  --ink:#141C1F; --ink-2:#56666C; --ink-3:#7E8D92;\n  --rule:#D2D9D7; --rule-2:#BFC8C6;\n  --signal:#B4560A; --signal-soft:#F5EBDF;\n  --teal:#0E6560; --teal-soft:#E0EDEB;\n  --ok:#17714A; --ok-soft:#E2EFE8;\n  --warn:#A9660A;\n  --code-bg:#F6F8F7;\n  --f-disp:\"Archivo\",\"Helvetica Neue\",Arial,sans-serif;\n  --f-body:\"Source Serif 4\",Georgia,\"Times New Roman\",serif;\n  --f-mono:\"IBM Plex Mono\",ui-monospace,\"SF Mono\",Menlo,monospace;\n  --rail:282px;\n}\n@media (prefers-color-scheme: dark) {\n  :root:not([data-theme=\"light\"]) {\n    --paper:#0F1417; --paper-2:#0A0E10; --card:#151C20;\n    --ink:#E6EDEB; --ink-2:#9AA9AF; --ink-3:#71828A;\n    --rule:#25323A; --rule-2:#33434B;\n    --signal:#F0A050; --signal-soft:#2A1D10;\n    --teal:#4FBDB2; --teal-soft:#0D2523;\n    --ok:#4FBE86; --ok-soft:#10241B;\n    --warn:#E0A03C;\n    --code-bg:#111719;\n  }\n}\n:root[data-theme=\"dark\"] {\n  --paper:#0F1417; --paper-2:#0A0E10; --card:#151C20;\n  --ink:#E6EDEB; --ink-2:#9AA9AF; --ink-3:#71828A;\n  --rule:#25323A; --rule-2:#33434B;\n  --signal:#F0A050; --signal-soft:#2A1D10;\n  --teal:#4FBDB2; --teal-soft:#0D2523;\n  --ok:#4FBE86; --ok-soft:#10241B;\n  --warn:#E0A03C;\n  --code-bg:#111719;\n}\n\n* { box-sizing:border-box; }\nbody { background:var(--paper); color:var(--ink); font-family:var(--f-disp);\n       font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased; }\n:focus-visible { outline:2px solid var(--signal); outline-offset:2px; }\n\n.app { display:grid; grid-template-columns:var(--rail) minmax(0,1fr); height:100vh; }\n\n/* ---- rail ---------------------------------------------------------------- */\n.rail { border-right:1px solid var(--rule); display:flex; flex-direction:column;\n        min-height:0; background:var(--paper-2); }\n.marca { padding:16px 18px 12px; border-bottom:1px solid var(--rule); }\n.marca .fila-marca { display:flex; align-items:center; gap:9px; }\n.marca .logo { width:22px; height:22px; flex:0 0 auto; border-radius:2px; }\n.marca { --mark-cut:var(--paper-2); }\n.marca b { font-size:.8rem; font-weight:800; letter-spacing:.1em; color:var(--ink); }\n.marca span { font-family:var(--f-mono); font-size:.62rem; color:var(--ink-3);\n              letter-spacing:.06em; display:block; margin-top:4px; }\n.buscar { padding:10px 14px; border-bottom:1px solid var(--rule); }\n.buscar input { width:100%; font-family:var(--f-mono); font-size:.72rem;\n  padding:6px 9px; border:1px solid var(--rule-2); border-radius:2px;\n  background:var(--card); color:var(--ink); }\n.buscar input::placeholder { color:var(--ink-3); }\n.arbol { overflow-y:auto; flex:1; padding:8px 0 24px; min-height:0; }\n.grupo { font-family:var(--f-mono); font-size:.6rem; letter-spacing:.14em;\n  text-transform:uppercase; color:var(--ink-3); padding:14px 18px 5px;\n  display:flex; justify-content:space-between; align-items:baseline; gap:8px; }\n.grupo em { font-style:normal; color:var(--rule-2); }\n.fila { display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center;\n  width:100%; text-align:left; background:none; border:0; cursor:pointer;\n  font-family:var(--f-mono); font-size:.72rem; color:var(--ink-2);\n  padding:4px 16px 4px 26px; border-left:2px solid transparent; }\n.fila:hover { color:var(--ink); background:var(--card); }\n.fila[aria-current=\"true\"] { color:var(--ink); border-left-color:var(--signal);\n  background:var(--card); font-weight:600; }\n.fila .n { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }\n.fila .b { font-size:.58rem; letter-spacing:.06em; padding:1px 5px; border-radius:2px;\n  white-space:nowrap; border:1px solid currentColor; }\n.b--ok { color:var(--ok); }\n.b--teal { color:var(--teal); }\n.b--warn { color:var(--warn); }\n\n/* ---- visor --------------------------------------------------------------- */\n.visor { overflow-y:auto; min-width:0; }\n.cab { position:sticky; top:0; z-index:5; background:var(--paper);\n  border-bottom:1px solid var(--rule); padding:14px clamp(18px,3vw,38px) 12px; }\n.cab .ruta { font-family:var(--f-mono); font-size:.78rem; font-weight:600; }\n.cab .ruta em { font-style:normal; color:var(--ink-3); font-weight:400; }\n.cab .para { font-size:.84rem; color:var(--ink-2); margin-top:5px; max-width:80ch; }\n.cab .meta { font-family:var(--f-mono); font-size:.62rem; color:var(--ink-3);\n  letter-spacing:.06em; margin-top:6px; display:flex; gap:14px; flex-wrap:wrap; }\n.cuerpo { padding:22px clamp(18px,3vw,38px) 90px; }\n\n/* prosa de los .md */\n.md { font-family:var(--f-body); font-size:16.5px; line-height:1.62; max-width:70ch; }\n.md h1 { font-family:var(--f-disp); font-size:1.75rem; font-weight:700; letter-spacing:-.02em;\n  margin:0 0 16px; text-wrap:balance; }\n.md h2 { font-family:var(--f-disp); font-size:1.28rem; font-weight:700; letter-spacing:-.015em;\n  margin:34px 0 10px; text-wrap:balance; }\n.md h3 { font-family:var(--f-disp); font-size:1rem; font-weight:700; margin:26px 0 6px; }\n.md p { margin:0 0 14px; }\n.md ul, .md ol { margin:0 0 14px; padding-left:22px; }\n.md li { margin-bottom:6px; }\n.md strong { font-weight:600; }\n.md a { color:var(--signal); }\n.md hr { border:0; border-top:1px solid var(--rule); margin:30px 0; }\n.md blockquote { border-left:3px solid var(--signal); background:var(--signal-soft);\n  margin:20px 0; padding:12px 16px; }\n.md blockquote p:last-child { margin:0; }\n.md code { font-family:var(--f-mono); font-size:.85em; background:var(--code-bg);\n  border:1px solid var(--rule); border-radius:2px; padding:.05em .32em; }\n.md pre { background:var(--code-bg); border:1px solid var(--rule);\n  border-left:3px solid var(--teal); border-radius:2px; padding:14px 16px;\n  overflow-x:auto; margin:18px 0; max-width:none; }\n.md pre code { background:none; border:0; padding:0; font-size:.78rem; line-height:1.6;\n  color:var(--ink-2); }\n.md table { border-collapse:collapse; width:100%; font-family:var(--f-disp);\n  font-size:.82rem; }\n.md .tw { overflow-x:auto; border:1px solid var(--rule); border-radius:2px; margin:18px 0;\n  max-width:none; }\n.md th, .md td { text-align:left; padding:8px 12px; border-bottom:1px solid var(--rule);\n  vertical-align:top; }\n.md thead th { font-family:var(--f-mono); font-size:.6rem; letter-spacing:.1em;\n  text-transform:uppercase; color:var(--ink-3); background:var(--paper-2); white-space:nowrap; }\n.md tbody tr:last-child td { border-bottom:0; }\n\n/* codigo con numeros de linea */\n.codigo { display:grid; grid-template-columns:auto minmax(0,1fr); font-family:var(--f-mono);\n  font-size:12.5px; line-height:1.62; border:1px solid var(--rule); border-radius:2px;\n  background:var(--code-bg); overflow-x:auto; }\n.codigo .ln { text-align:right; padding:14px 10px 14px 14px; color:var(--ink-3);\n  border-right:1px solid var(--rule); user-select:none; font-variant-numeric:tabular-nums;\n  white-space:pre; background:var(--paper-2); }\n.codigo pre { margin:0; padding:14px 16px; white-space:pre; }\n.codigo code { font-family:inherit; }\n\n/* Tema propio para highlight.js: su hoja de estilos no se puede cargar desde\n   CDN (la CSP solo admite scripts), asi que los colores van aqui. */\n.hljs-comment { color:var(--ink-3); font-style:italic; }\n.hljs-keyword, .hljs-built_in { color:var(--signal); }\n.hljs-string, .hljs-number { color:var(--teal); }\n.hljs-title, .hljs-title\\.function_, .hljs-attr, .hljs-attribute { color:var(--ink); font-weight:600; }\n.hljs-type, .hljs-literal { color:var(--warn); }\n\n/* resumen */\n.resumen { max-width:78ch; }\n.tarjetas { display:grid; grid-template-columns:repeat(auto-fit,minmax(158px,1fr));\n  gap:1px; background:var(--rule); border:1px solid var(--rule); margin:20px 0; }\n.tj { background:var(--card); padding:14px 16px; }\n.tj .k { font-family:var(--f-mono); font-size:.58rem; letter-spacing:.11em;\n  text-transform:uppercase; color:var(--ink-3); margin-bottom:6px; }\n.tj .v { font-size:1.5rem; font-weight:800; letter-spacing:-.03em;\n  font-variant-numeric:tabular-nums; line-height:1; }\n.tj .d { font-family:var(--f-mono); font-size:.63rem; color:var(--ink-2); margin-top:5px; }\n.tj .v.ok { color:var(--ok); }\n\n.aviso { border-left:3px solid var(--signal); background:var(--signal-soft);\n  padding:13px 16px; margin:20px 0; font-size:.88rem; max-width:76ch; }\n.aviso b { display:block; font-family:var(--f-mono); font-size:.6rem; letter-spacing:.13em;\n  text-transform:uppercase; color:var(--signal); margin-bottom:5px; }\n\n@media (max-width:820px) {\n  .app { grid-template-columns:1fr; height:auto; }\n  .rail { border-right:0; border-bottom:1px solid var(--rule); max-height:44vh; }\n  .visor { overflow:visible; }\n  .cab { position:static; }\n}\n\u003c/style>\n\n\u003cdiv class=\"app\">\n  \u003caside class=\"rail\">\n    \u003cdiv class=\"marca\">\n      \u003cdiv class=\"fila-marca\">\u003csvg class=\"logo\" viewBox=\"0 0 100 100\" role=\"img\" aria-label=\"RADACTORY\">\u003crect width=\"100\" height=\"100\" fill=\"currentColor\"/>\u003cpath fill=\"var(--mark-cut,#FFFFFF)\" d=\"M8 20 H86 V42 H30 V84 H8 Z\"/>\u003cpath fill=\"var(--mark-cut,#FFFFFF)\" d=\"M46 42 H68 L88 84 H64 Z\"/>\u003c/svg>\u003cb>RADACTORY\u003c/b>\u003c/div>\n      \u003cspan id=\"sello\">fases A y B · 9 sep 2026\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"buscar\">\n      \u003cinput id=\"q\" type=\"search\" placeholder=\"filtrar ficheros…\" aria-label=\"Filtrar ficheros\">\n    \u003c/div>\n    \u003cnav class=\"arbol\" id=\"arbol\" aria-label=\"Ficheros del proyecto\">\u003c/nav>\n  \u003c/aside>\n\n  \u003cmain class=\"visor\" id=\"visor\">\n    \u003cdiv class=\"cab\">\n      \u003cdiv class=\"ruta\" id=\"ruta\">\u003c/div>\n      \u003cdiv class=\"para\" id=\"para\">\u003c/div>\n      \u003cdiv class=\"meta\" id=\"meta\">\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"cuerpo\" id=\"cuerpo\">\u003c/div>\n  \u003c/main>\n\u003c/div>\n\n\u003cscript src=\"https://cdnjs.cloudflare.com/ajax/libs/marked/14.1.3/marked.min.js\">\u003c/script>\n\u003cscript src=\"https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/highlight.min.js\">\u003c/script>\n\u003cscript>/*__DATOS__*/\u003c/script>\n\u003cscript>\n(function () {\n  \"use strict\";\n  var A = window.__FR__;\n  var arbol = document.getElementById('arbol');\n  var visor = document.getElementById('visor');\n  var actual = null;\n\n  document.getElementById('sello').textContent = A.sello;\n\n  // --- arbol ---------------------------------------------------------------\n  function pintarArbol(filtro) {\n    arbol.textContent = '';\n    var f = (filtro || '').toLowerCase();\n\n    A.grupos.forEach(function (g) {\n      var hijos = g.ficheros.filter(function (r) {\n        return !f || r.toLowerCase().indexOf(f) > -1;\n      });\n      if (hijos.length === 0) return;\n\n      var h = document.createElement('div');\n      h.className = 'grupo';\n      h.innerHTML = '\u003cspan>\u003c/span>\u003cem>\u003c/em>';\n      h.firstChild.textContent = g.nombre;\n      h.lastChild.textContent = hijos.length;\n      arbol.appendChild(h);\n\n      hijos.forEach(function (ruta) {\n        var d = A.ficheros[ruta];\n        var b = document.createElement('button');\n        b.className = 'fila';\n        b.type = 'button';\n        b.dataset.ruta = ruta;\n        b.setAttribute('aria-current', ruta === actual ? 'true' : 'false');\n\n        var n = document.createElement('span');\n        n.className = 'n';\n        n.textContent = ruta === '@resumen' ? 'Resumen' : ruta.split('/').pop();\n        b.appendChild(n);\n\n        if (d.chip) {\n          var c = document.createElement('span');\n          c.className = 'b b--' + (d.chipTono || 'teal');\n          c.textContent = d.chip;\n          b.appendChild(c);\n        }\n        b.addEventListener('click', function () { abrir(ruta); });\n        arbol.appendChild(b);\n      });\n    });\n  }\n\n  // --- visor ---------------------------------------------------------------\n  function abrir(ruta) {\n    var d = A.ficheros[ruta];\n    if (!d) return;\n    actual = ruta;\n\n    document.getElementById('ruta').innerHTML = '';\n    var partes = ruta === '@resumen' ? ['Resumen del proyecto'] : ruta.split('/');\n    partes.forEach(function (p, i) {\n      var s = document.createElement(i === partes.length - 1 ? 'span' : 'em');\n      s.textContent = p + (i === partes.length - 1 ? '' : '/');\n      document.getElementById('ruta').appendChild(s);\n    });\n\n    document.getElementById('para').textContent = d.para || '';\n\n    var meta = [];\n    if (d.bytes) meta.push(d.bytes.toLocaleString('es-ES') + ' bytes');\n    if (d.lineas) meta.push(d.lineas + ' líneas');\n    if (d.estado) meta.push(d.estado);\n    document.getElementById('meta').textContent = meta.join('   ·   ');\n\n    var cuerpo = document.getElementById('cuerpo');\n    cuerpo.textContent = '';\n\n    if (ruta === '@resumen') {\n      cuerpo.innerHTML = A.resumen;\n    } else if (/\\.mde?$/.test(ruta) || ruta.endsWith('.md')) {\n      var div = document.createElement('div');\n      div.className = 'md';\n      div.innerHTML = marked.parse(d.texto);\n      // Las tablas anchas tienen que hacer scroll dentro de su caja; si no, el\n      // cuerpo entero se desplaza en horizontal y se pierde la columna izquierda.\n      div.querySelectorAll('table').forEach(function (t) {\n        var w = document.createElement('div');\n        w.className = 'tw';\n        t.parentNode.insertBefore(w, t);\n        w.appendChild(t);\n      });\n      cuerpo.appendChild(div);\n    } else {\n      cuerpo.appendChild(bloqueCodigo(d.texto, d.lenguaje));\n    }\n\n    visor.scrollTop = 0;\n    pintarArbol(document.getElementById('q').value);\n    try { history.replaceState(null, '', '#' + encodeURIComponent(ruta)); } catch (e) {}\n  }\n\n  function bloqueCodigo(texto, lenguaje) {\n    var wrap = document.createElement('div');\n    wrap.className = 'codigo';\n\n    var lineas = texto.replace(/\\n$/, '').split('\\n');\n    var ln = document.createElement('div');\n    ln.className = 'ln';\n    ln.textContent = lineas.map(function (_, i) { return i + 1; }).join('\\n');\n    wrap.appendChild(ln);\n\n    var pre = document.createElement('pre');\n    var code = document.createElement('code');\n    // textContent primero: el resaltado se aplica DESPUES, sobre texto ya\n    // escapado. Meter el fichero con innerHTML seria inyectar el repositorio\n    // entero en el DOM.\n    code.textContent = texto;\n    pre.appendChild(code);\n    wrap.appendChild(pre);\n\n    try {\n      if (window.hljs && lenguaje) {\n        var r = hljs.highlight(texto, { language: lenguaje, ignoreIllegals: true });\n        code.innerHTML = r.value;\n      }\n    } catch (e) { /* sin resaltado se lee igual */ }\n    return wrap;\n  }\n\n  // --- arranque ------------------------------------------------------------\n  document.getElementById('q').addEventListener('input', function (e) {\n    pintarArbol(e.target.value);\n  });\n\n  var inicial = '@resumen';\n  try {\n    var h = decodeURIComponent(location.hash.slice(1));\n    if (h && A.ficheros[h]) inicial = h;\n  } catch (e) {}\n\n  pintarArbol('');\n  abrir(inicial);\n})();\n\u003c/script>\n","bytes":15194,"lineas":346,"lenguaje":"xml","para":"El diseño de esta página, separado de sus datos.","chip":null,"chipTono":null,"estado":null},"scripts/migrar.mjs":{"texto":"#!/usr/bin/env node\n// Aplica db/*.sql en orden. Los ficheros son idempotentes (create if not\n// exists, create or replace, drop policy if exists), asi que volver a lanzarlo\n// sobre una base ya montada no rompe nada: es como se aplica una migracion.\n//\n// Se conecta con DATABASE_URL_JOBS porque crea extensiones, roles y politicas,\n// y eso fr_app no puede hacerlo — ni debe.\nimport { readdirSync, readFileSync } from 'node:fs';\nimport { join, dirname } from 'node:path';\nimport { fileURLToPath } from 'node:url';\nimport pg from 'pg';\n\nconst raiz = join(dirname(fileURLToPath(import.meta.url)), '..');\nconst dir  = join(raiz, 'db');\n\nconst url = process.env.DATABASE_URL_JOBS || process.env.DATABASE_URL;\nif (!url) {\n  console.error('Falta DATABASE_URL_JOBS. Copia .env.example a .env.');\n  process.exit(1);\n}\n\nconst ficheros = readdirSync(dir).filter((f) => /^\\d\\d-.*\\.sql$/.test(f)).sort();\nconst cliente = new pg.Client({ connectionString: url });\nawait cliente.connect();\n\nfor (const f of ficheros) {\n  try {\n    await cliente.query(readFileSync(join(dir, f), 'utf8'));\n    console.log(`  ok    ${f}`);\n  } catch (e) {\n    console.error(`  FALLO ${f}\\n        ${e.message}`);\n    await cliente.end();\n    process.exit(1);\n  }\n}\nawait cliente.end();\nconsole.log(`\\n${ficheros.length} ficheros aplicados.`);\n","bytes":1314,"lineas":38,"lenguaje":"javascript","para":"Aplica db/*.sql en orden. Idempotente: se puede relanzar sobre una base montada.","chip":null,"chipTono":null,"estado":null},"scripts/pruebas-fugas.mjs":{"texto":"#!/usr/bin/env node\n// ---------------------------------------------------------------------------\n// Bateria de fugas entre inquilinos. Barrera 3 de 3.\n//\n// Corre como fr_app A PROPOSITO. Ejecutarla con el usuario propietario o con un\n// superusuario no prueba nada: los dos saltan RLS y todas las pruebas pasarian\n// dando una falsa sensacion de seguridad.\n//\n// Si alguna falla, no se despliega. Sin excepciones y sin \"ya lo miramos\".\n// ---------------------------------------------------------------------------\nimport { readFileSync } from 'node:fs';\nimport { join, dirname } from 'node:path';\nimport { fileURLToPath } from 'node:url';\nimport pg from 'pg';\n\nconst dir = join(dirname(fileURLToPath(import.meta.url)), '..', 'db', 'pruebas');\n\nconst urlDueno = process.env.DATABASE_URL_JOBS;\nconst urlApp   = process.env.DATABASE_URL;\nif (!urlDueno || !urlApp) {\n  console.error('Hacen falta DATABASE_URL y DATABASE_URL_JOBS.');\n  process.exit(1);\n}\nif (urlApp === urlDueno) {\n  console.error(\n    'DATABASE_URL y DATABASE_URL_JOBS son la misma. La bateria no probaria nada:\\n' +\n    'el rol de los trabajos salta RLS. Usa fr_app en DATABASE_URL.');\n  process.exit(1);\n}\n\n// La semilla se carga como dueño: planta dos empresas rivales saltandose RLS,\n// que es justo lo que despues hay que comprobar que fr_app no puede hacer.\nconst dueno = new pg.Client({ connectionString: urlDueno });\nawait dueno.connect();\nawait dueno.query(readFileSync(join(dir, 'semilla-fugas.sql'), 'utf8'));\nawait dueno.query(\n  \"select fr_rollup('1h', '2026-09-09 00:00:00+02', '2026-09-10 00:00:00+02')\");\nawait dueno.end();\n\nconst app = new pg.Client({ connectionString: urlApp });\nawait app.connect();\napp.on('notice', (n) => console.log('  ' + n.message));\ntry {\n  await app.query(readFileSync(join(dir, 'fugas.sql'), 'utf8')\n    .replace(/^\\\\.*$/gm, ''));   // las meta-ordenes de psql no van por el driver\n  console.log('\\nBATERIA DE FUGAS SUPERADA');\n} catch (e) {\n  console.error(`\\nFUGA DETECTADA: ${e.message}`);\n  process.exitCode = 1;\n} finally {\n  await app.end();\n}\n","bytes":2062,"lineas":53,"lenguaje":"javascript","para":"Lanza la batería como fr_app, y se niega a correr si le das el rol equivocado.","chip":null,"chipTono":null,"estado":null},"scripts/publicar-sitio.sh":{"texto":"#!/usr/bin/env bash\n# ---------------------------------------------------------------------------\n# Publica docs/ en la rama gh-pages.\n#\n# Va en una rama aparte y no en main/docs porque GitHub activa Pages solo al ver\n# aparecer gh-pages, sin tocar Settings ni necesitar un token de API. Un\n# workflow de Actions haria lo mismo, pero necesita que el GITHUB_TOKEN del\n# repositorio tenga permiso de escritura, y por defecto no lo tiene.\n#\n# Se construye en un arbol de trabajo aparte para no tocar el principal: cambiar\n# de rama en el directorio de trabajo con cambios sin guardar es la forma\n# clasica de perder una tarde.\n# ---------------------------------------------------------------------------\nset -euo pipefail\ncd \"$(dirname \"$0\")/..\"\n\nnode scripts/construir-sitio.mjs\n\nTMP=\"$(mktemp -d)\"\ntrap 'git worktree remove \"$TMP\" --force 2>/dev/null || true; rm -rf \"$TMP\"' EXIT\n\ngit worktree add -q --detach \"$TMP\"\n(\n  cd \"$TMP\"\n  git checkout -q -B gh-pages\n  git rm -rq --cached . 2>/dev/null || true\n  find . -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} + 2>/dev/null || true\n  cp -R \"$OLDPWD/docs/.\" .\n  git add -A\n  if git diff --cached --quiet; then\n    echo \"el sitio no ha cambiado: nada que publicar\"\n  else\n    git commit -q -m \"Sitio publicado · $(date +%Y-%m-%d\\ %H:%M)\"\n    git push -q --force origin gh-pages\n    echo \"publicado en gh-pages\"\n  fi\n)\n","bytes":1379,"lineas":38,"lenguaje":"bash","para":"npm run publicar: arma el sitio y lo empuja a gh-pages desde un árbol de trabajo aparte.","chip":null,"chipTono":null,"estado":null},"package.json":{"texto":"{\n  \"name\": \"radactory\",\n  \"version\": \"0.1.0\",\n  \"private\": true,\n  \"type\": \"module\",\n  \"description\": \"RADACTORY · capa de inteligencia industrial sobre los sistemas que la fabrica ya tiene.\",\n  \"engines\": { \"node\": \">=22.6.0\" },\n  \"scripts\": {\n    \"migrar\": \"node scripts/migrar.mjs\",\n    \"explorador\": \"node scripts/construir-explorador.mjs\",\n    \"demo\": \"node scripts/demo-factory.mjs\",\n    \"demo-motor\": \"node scripts/demo-motor.mjs\",\n    \"demo-exportar\": \"node scripts/exportar-demo.mjs\",\n    \"demo-panel\": \"node scripts/construir-demo.mjs\",\n    \"sitio\": \"node scripts/construir-sitio.mjs\",\n    \"publicar\": \"bash scripts/publicar-sitio.sh\",\n    \"pruebas-fugas\": \"node scripts/pruebas-fugas.mjs\",\n    \"api\": \"node src/api/servidor.ts\",\n    \"test\": \"node --test tests/dominio.test.ts\",\n    \"test-api\": \"node --test tests/api.test.ts\"\n  },\n  \"dependencies\": {\n    \"fastify\": \"^5.2.0\",\n    \"pg\": \"^8.13.1\"\n  }\n}\n","bytes":915,"lineas":27,"lenguaje":"json","para":"Dos dependencias: fastify y pg. Nada más entra sin discutirlo.","chip":null,"chipTono":null,"estado":null},".env.example":{"texto":"# ---------------------------------------------------------------------------\n# La API se conecta SIEMPRE como fr_app: no es propietario de las tablas y no\n# es superusuario. Conectarse como propietario anula toda la RLS en silencio,\n# porque el propietario salta las politicas salvo FORCE (ver db/09-rls.sql).\n# ---------------------------------------------------------------------------\nDATABASE_URL=postgres://fr_app:cambiame@localhost:5432/factory_radar\n\n# Conexion aparte para los trabajos de fondo (rollup, motor de eventos). Necesita\n# mas permisos que la API porque fr_rollup() lee `measurement`, que fr_app no ve.\n# Separarlas es lo que evita que una inyeccion en la API alcance el dato crudo\n# de todos los inquilinos.\nDATABASE_URL_JOBS=postgres://postgres:cambiame@localhost:5432/factory_radar\n\nPUERTO=3001\nENTORNO=desarrollo\n\n# Clave de firma de las sesiones. Sin valor por defecto a proposito.\nJWT_SECRETO=\n\n# ---------------------------------------------------------------------------\n# IA. El proveedor se elige aqui, nunca en el codigo de negocio: precio y\n# modelos se mueven cada trimestre, y habra clientes que exijan que el dato no\n# salga de su infraestructura.\n# ---------------------------------------------------------------------------\nIA_PROVEEDOR=claude\nIA_MODELO_RAZONA=claude-opus-5\nIA_MODELO_RAPIDO=claude-haiku-4-5-20251001\nANTHROPIC_API_KEY=\n\n# Tope mensual por defecto, en euros. Se puede subir por empresa en la tabla\n# `company`. Al 80% se avisa; al 100% se degrada a modelo barato, nunca corte\n# seco: un Copilot que deja de contestar a mitad de mes es una baja.\nIA_PRESUPUESTO_EUR=30\n","bytes":1621,"lineas":34,"lenguaje":null,"para":"Dos cadenas de conexión distintas, y el porqué de que sean dos.","chip":null,"chipTono":null,"estado":null},".gitignore":{"texto":"node_modules\nvar/\n*.log\n*.pid\n\n# Credenciales: NUNCA salen de su maquina.\n.env\n.env.local\n\n.DS_Store\n\n# Copias que se dejan al editar a mano. Viven horas, no versiones: lo que hay\n# que poder recuperar es el commit anterior, no un fichero suelto en el disco.\n*.antes-*\n*.antes\n","bytes":277,"lineas":16,"lenguaje":null,"para":"Lo que nunca sale de esta máquina.","chip":null,"chipTono":null,"estado":null},"@resumen":{"texto":"","para":"Todo lo que hay construido, y qué está comprobado de verdad.","bytes":0,"lineas":0,"chip":null,"estado":null,"lenguaje":null}},"resumen":"\u003cdiv class=\"resumen\">\n  \u003cdiv class=\"md\">\n    \u003ch1>Radactory, de un vistazo\u003c/h1>\n    \u003cp>Capa de inteligencia industrial sobre los sistemas que la fábrica ya tiene.\n    Este explorador contiene el proyecto entero: la definición (fase A) y la\n    estructura real (fase B), fichero a fichero.\u003c/p>\n  \u003c/div>\n\n  \u003cdiv class=\"tarjetas\">\n    \u003cdiv class=\"tj\">\u003cdiv class=\"k\">Ficheros\u003c/div>\u003cdiv class=\"v\">72\u003c/div>\u003cdiv class=\"d\">sin dependencias\u003c/div>\u003c/div>\n    \u003cdiv class=\"tj\">\u003cdiv class=\"k\">Líneas\u003c/div>\u003cdiv class=\"v\">11.127\u003c/div>\u003cdiv class=\"d\">530 KB\u003c/div>\u003c/div>\n    \u003cdiv class=\"tj\">\u003cdiv class=\"k\">Esquema\u003c/div>\u003cdiv class=\"v ok\">10/10\u003c/div>\u003cdiv class=\"d\">aplican limpios\u003c/div>\u003c/div>\n    \u003cdiv class=\"tj\">\u003cdiv class=\"k\">Fugas\u003c/div>\u003cdiv class=\"v ok\">11/11\u003c/div>\u003cdiv class=\"d\">entre inquilinos\u003c/div>\u003c/div>\n    \u003cdiv class=\"tj\">\u003cdiv class=\"k\">Dominio\u003c/div>\u003cdiv class=\"v ok\">17/17\u003c/div>\u003cdiv class=\"d\">OEE, impacto…\u003c/div>\u003c/div>\n    \u003cdiv class=\"tj\">\u003cdiv class=\"k\">API\u003c/div>\u003cdiv class=\"v ok\">11/11\u003c/div>\u003cdiv class=\"d\">base real\u003c/div>\u003c/div>\n    \u003cdiv class=\"tj\">\u003cdiv class=\"k\">Demo\u003c/div>\u003cdiv class=\"v ok\">4/4\u003c/div>\u003cdiv class=\"d\">problemas detectados\u003c/div>\u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"aviso\">\n    \u003cb>Qué está comprobado y qué no\u003c/b>\n    Lo que lleva chip verde se ha ejecutado: el esquema contra PostgreSQL 16 con\n    TimescaleDB y pgvector, y las 39 pruebas contra esa misma base. El resto\n    —panel, conector, rutas de energía y calidad— es estructura y contrato, todavía\n    sin implementar. Está dicho fichero a fichero para que nadie confunda una cosa\n    con la otra.\n  \u003c/div>\n\n  \u003cdiv class=\"md\">\n    \u003ch2>Por dónde entrar\u003c/h2>\n    \u003cul>\n      \u003cli>\u003cstrong>Si vienes a entender el producto\u003c/strong> — \u003ccode>doc/00-producto.md\u003c/code>,\n      y luego \u003ccode>doc/01-modulos.md\u003c/code>.\u003c/li>\n      \u003cli>\u003cstrong>Si vienes a discutir una decisión\u003c/strong> — \u003ccode>doc/10-decisiones.md\u003c/code>.\n      Están las 29, cada una con la alternativa descartada.\u003c/li>\n      \u003cli>\u003cstrong>Si vienes a mirar el código\u003c/strong> — \u003ccode>db/09-rls.sql\u003c/code> y\n      \u003ccode>src/db.ts\u003c/code> primero: ahí está el aislamiento multiempresa, que es lo que\n      condiciona todo lo demás.\u003c/li>\n      \u003cli>\u003cstrong>Si vienes a vender\u003c/strong> — \u003ccode>doc/09-comercial.md\u003c/code>.\u003c/li>\n    \u003c/ul>\n\n    \u003ch2>Lo que aún no existe\u003c/h2>\n    \u003cp>La \u003cstrong>web comercial\u003c/strong> está definida en \u003ccode>doc/09-comercial.md\u003c/code>\n    pero no construida, y el \u003cstrong>panel\u003c/strong> tiene sistema visual y estructura pero\n    no pantallas: se llenan en la fase C, junto con la Demo Factory, que es cuando habrá\n    datos que enseñar.\u003c/p>\n  \u003c/div>\n\u003c/div>"};</script>
<script>
(function () {
  "use strict";
  var A = window.__FR__;
  var arbol = document.getElementById('arbol');
  var visor = document.getElementById('visor');
  var actual = null;

  document.getElementById('sello').textContent = A.sello;

  // --- arbol ---------------------------------------------------------------
  function pintarArbol(filtro) {
    arbol.textContent = '';
    var f = (filtro || '').toLowerCase();

    A.grupos.forEach(function (g) {
      var hijos = g.ficheros.filter(function (r) {
        return !f || r.toLowerCase().indexOf(f) > -1;
      });
      if (hijos.length === 0) return;

      var h = document.createElement('div');
      h.className = 'grupo';
      h.innerHTML = '<span></span><em></em>';
      h.firstChild.textContent = g.nombre;
      h.lastChild.textContent = hijos.length;
      arbol.appendChild(h);

      hijos.forEach(function (ruta) {
        var d = A.ficheros[ruta];
        var b = document.createElement('button');
        b.className = 'fila';
        b.type = 'button';
        b.dataset.ruta = ruta;
        b.setAttribute('aria-current', ruta === actual ? 'true' : 'false');

        var n = document.createElement('span');
        n.className = 'n';
        n.textContent = ruta === '@resumen' ? 'Resumen' : ruta.split('/').pop();
        b.appendChild(n);

        if (d.chip) {
          var c = document.createElement('span');
          c.className = 'b b--' + (d.chipTono || 'teal');
          c.textContent = d.chip;
          b.appendChild(c);
        }
        b.addEventListener('click', function () { abrir(ruta); });
        arbol.appendChild(b);
      });
    });
  }

  // --- visor ---------------------------------------------------------------
  function abrir(ruta) {
    var d = A.ficheros[ruta];
    if (!d) return;
    actual = ruta;

    document.getElementById('ruta').innerHTML = '';
    var partes = ruta === '@resumen' ? ['Resumen del proyecto'] : ruta.split('/');
    partes.forEach(function (p, i) {
      var s = document.createElement(i === partes.length - 1 ? 'span' : 'em');
      s.textContent = p + (i === partes.length - 1 ? '' : '/');
      document.getElementById('ruta').appendChild(s);
    });

    document.getElementById('para').textContent = d.para || '';

    var meta = [];
    if (d.bytes) meta.push(d.bytes.toLocaleString('es-ES') + ' bytes');
    if (d.lineas) meta.push(d.lineas + ' líneas');
    if (d.estado) meta.push(d.estado);
    document.getElementById('meta').textContent = meta.join('   ·   ');

    var cuerpo = document.getElementById('cuerpo');
    cuerpo.textContent = '';

    if (ruta === '@resumen') {
      cuerpo.innerHTML = A.resumen;
    } else if (/\.mde?$/.test(ruta) || ruta.endsWith('.md')) {
      var div = document.createElement('div');
      div.className = 'md';
      div.innerHTML = marked.parse(d.texto);
      // Las tablas anchas tienen que hacer scroll dentro de su caja; si no, el
      // cuerpo entero se desplaza en horizontal y se pierde la columna izquierda.
      div.querySelectorAll('table').forEach(function (t) {
        var w = document.createElement('div');
        w.className = 'tw';
        t.parentNode.insertBefore(w, t);
        w.appendChild(t);
      });
      cuerpo.appendChild(div);
    } else {
      cuerpo.appendChild(bloqueCodigo(d.texto, d.lenguaje));
    }

    visor.scrollTop = 0;
    pintarArbol(document.getElementById('q').value);
    try { history.replaceState(null, '', '#' + encodeURIComponent(ruta)); } catch (e) {}
  }

  function bloqueCodigo(texto, lenguaje) {
    var wrap = document.createElement('div');
    wrap.className = 'codigo';

    var lineas = texto.replace(/\n$/, '').split('\n');
    var ln = document.createElement('div');
    ln.className = 'ln';
    ln.textContent = lineas.map(function (_, i) { return i + 1; }).join('\n');
    wrap.appendChild(ln);

    var pre = document.createElement('pre');
    var code = document.createElement('code');
    // textContent primero: el resaltado se aplica DESPUES, sobre texto ya
    // escapado. Meter el fichero con innerHTML seria inyectar el repositorio
    // entero en el DOM.
    code.textContent = texto;
    pre.appendChild(code);
    wrap.appendChild(pre);

    try {
      if (window.hljs && lenguaje) {
        var r = hljs.highlight(texto, { language: lenguaje, ignoreIllegals: true });
        code.innerHTML = r.value;
      }
    } catch (e) { /* sin resaltado se lee igual */ }
    return wrap;
  }

  // --- arranque ------------------------------------------------------------
  document.getElementById('q').addEventListener('input', function (e) {
    pintarArbol(e.target.value);
  });

  var inicial = '@resumen';
  try {
    var h = decodeURIComponent(location.hash.slice(1));
    if (h && A.ficheros[h]) inicial = h;
  } catch (e) {}

  pintarArbol('');
  abrir(inicial);
})();
</script>
