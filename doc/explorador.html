uta;\n  end if;\n  return new;\nend\n$$;\n\ndrop trigger if exists asset_node_ruta_tg on asset_node;\ncreate trigger asset_node_ruta_tg\n  before insert or update of parent_id on asset_node\n  for each row execute function fr_asset_node_ruta();\n\n-- ---------------------------------------------------------------------------\n-- Una señal medible de un nodo.\n--\n-- `clase` decide como se agrega y como se lee: un contador acumulativo se lee\n-- por diferencia entre el primer y el ultimo valor del intervalo, y una\n-- temperatura por media. Confundir los dos es el fallo de mapeo clasico: tres\n-- semanas ingiriendo un contador como si fuera incremental, con una produccion\n-- absurda que nadie mira hasta que el cliente la discute.\n-- ---------------------------------------------------------------------------\ncreate table if not exists signal (\n  id            uuid primary key default gen_random_uuid(),\n  tenant_id     uuid        not null references company(id) on delete cascade,\n  asset_node_id uuid        not null references asset_node(id) on delete cascade,\n\n  codigo        text        not null,   -- 'L3.P4.contador'\n  nombre        text        not null,\n  clase         text        not null,   -- contador | contador_acumulado | estado | analogica | energia\n  unidad        text,                   -- 'uds' | 'kW' | 'kWh' | 'degC' | 'bar'\n  agregacion    text        not null default 'avg',  -- avg | sum | last | delta | max\n\n  -- Cadencia esperada en segundos. Sirve para detectar que una fuente se ha\n  -- callado: si no llega nada en 5 veces su cadencia, el conector o la fuente\n  -- estan caidos y eso se avisa en la cabecera, no enterrado en ajustes.\n  cadencia_s    integer,\n\n  -- Rango plausible. Un valor fuera se marca como `bad` y NO entra en ningun\n  -- calculo. Nunca se corrige en silencio.\n  min_valido    double precision,\n  max_valido    double precision,\n\n  activo        boolean     not null default true,\n  creado_en     timestamptz not null default now(),\n\n  unique (tenant_id, codigo),\n  constraint signal_clase_valida check (clase in\n    ('contador','contador_acumulado','estado','analogica','energia')),\n  constraint signal_agregacion_valida check (agregacion in\n    ('avg','sum','last','delta','max'))\n);\ncreate index if not exists signal_nodo on signal (tenant_id, asset_node_id);\n\n-- ---------------------------------------------------------------------------\n-- Fuentes de dato y su salud.\n--\n-- El estado de cada conector se ve en el panel del cliente Y en el de\n-- superadmin. Un conector caido del que solo se entera el cliente es una\n-- llamada de telefono; uno del que nos enteramos nosotros primero es soporte.\n-- ---------------------------------------------------------------------------\ncreate table if not exists connector (\n  id            uuid primary key default gen_random_uuid(),\n  tenant_id     uuid        not null references company(id) on delete cascade,\n  site_id       uuid        not null references site(id) on delete cascade,\n\n  nombre        text        not null,\n  tipo          text        not null,   -- csv | sql | rest | mqtt | opcua | modbus\n  nivel         smallint    not null default 0,   -- peldaño de la escalera de ingesta (0-4)\n\n  -- Credenciales de la fuente del cliente. Cifradas por columna: es lo unico\n  -- del esquema que, filtrado, da acceso a la red del cliente.\n  config_cifrada bytea,\n\n  -- Token de ingesta, guardado solo como hash. Si hay que reemitirlo, se emite\n  -- uno nuevo; no se puede \"recuperar\" el anterior, y eso es lo correcto.\n  token_hash    text,\n\n  estado        text        not null default 'alta',  -- alta | ok | degradado | caido\n  ultimo_lote_en timestamptz,\n  ultimo_error  text,\n  creado_en     timestamptz not null default now(),\n\n  unique (tenant_id, site_id, nombre),\n  constraint connector_tipo_valido check (tipo in\n    ('csv','sql','rest','mqtt','opcua','modbus'))\n);\n\n-- Idempotencia de la ingesta. El conector puede reenviar sin miedo tras un\n-- corte de linea: el duplicado se descarta AQUI, en el servidor, no en el\n-- conector, porque el conector puede haberse reiniciado y perdido su memoria.\ncreate table if not exists ingest_batch (\n  batch_id      uuid primary key,\n  tenant_id     uuid        not null references company(id) on delete cascade,\n  connector_id  uuid        not null references connector(id) on delete cascade,\n  recibido_en   timestamptz not null default now(),\n  n_medidas     integer     not null default 0,\n  n_eventos     integer     not null default 0\n);\ncreate index if not exists ingest_batch_conector on ingest_batch (connector_id, recibido_en desc);\n","bytes":7709,"lineas":169,"lenguaje":"sql","para":"El árbol de activos con su trigger de ruta, las señales y los conectores.","chip":"aplica","chipTono":"ok","estado":"aplicado contra TimescaleDB pg16"},"db/04-contexto.sql":{"texto":"-- ---------------------------------------------------------------------------\n-- RADACTORY :: 04 · contexto productivo\n--\n-- Esta es la capa 3 de la arquitectura y es EL producto. Sin ella, un contador\n-- es un numero sin significado y ninguna inteligencia posterior lo rescata.\n-- ---------------------------------------------------------------------------\n\ncreate table if not exists product (\n  id            uuid primary key default gen_random_uuid(),\n  tenant_id     uuid        not null references company(id) on delete cascade,\n  codigo        text        not null,   -- 'PROD-X', 'REF-2210'\n  nombre        text        not null,\n  unidad        text        not null default 'uds',\n\n  -- Ciclo nominal en segundos para ESTE producto. Manda sobre el del nodo:\n  -- la misma maquina va a distinta velocidad segun el formato, y no tenerlo en\n  -- cuenta convierte cada cambio de formato en una falsa caida de rendimiento.\n  ciclo_nominal_s numeric(10,3),\n\n  -- Margen unitario. Es el numero que traduce unidades perdidas a euros. Si\n  -- falta, la alerta se genera igual pero SIN impacto economico, y el panel\n  -- dice que falta el dato en vez de inventarse una cifra.\n  margen_unitario numeric(12,4),\n\n  activo        boolean     not null default true,\n  unique (tenant_id, codigo)\n);\n\ncreate table if not exists production_order (\n  id            uuid primary key default gen_random_uuid(),\n  tenant_id     uuid        not null references company(id) on delete cascade,\n  site_id       uuid        not null references site(id) on delete cascade,\n  asset_node_id uuid        references asset_node(id) on delete set null,\n  product_id    uuid        not null references product(id),\n  codigo        text        not null,\n  cantidad_obj  numeric(14,3),\n  inicio_prev   timestamptz,\n  fin_prev      timestamptz,\n  inicio_real   timestamptz,\n  fin_real      timestamptz,\n  estado        text        not null default 'planificada',\n  unique (tenant_id, codigo)\n);\ncreate index if not exists production_order_ventana\n  on production_order (tenant_id, asset_node_id, inicio_real, fin_real);\n\ncreate table if not exists batch (\n  id            uuid primary key default gen_random_uuid(),\n  tenant_id     uuid        not null references company(id) on delete cascade,\n  production_order_id uuid  references production_order(id) on delete set null,\n  product_id    uuid        not null references product(id),\n  codigo        text        not null,   -- 'L-4471'\n  fabricado_en  timestamptz,\n  cantidad      numeric(14,3),\n  unique (tenant_id, codigo)\n);\n\n-- Patron de turno. `inicio` puede ser mayor que `fin` (turno de noche): el\n-- calculo lo resuelve sumando un dia, no rechazando la fila.\ncreate table if not exists shift (\n  id            uuid primary key default gen_random_uuid(),\n  tenant_id     uuid        not null references company(id) on delete cascade,\n  site_id       uuid        not null references site(id) on delete cascade,\n  nombre        text        not null,   -- 'mañana' | 'tarde' | 'noche'\n  inicio        time        not null,\n  fin           time        not null,\n  dias          smallint[]  not null default '{1,2,3,4,5}',  -- ISO: 1=lunes\n  unique (tenant_id, site_id, nombre)\n);\n\n-- Un turno concreto en una fecha concreta, ya resuelto a timestamptz. Se\n-- materializa a proposito: resolver el huso y el cambio de hora en cada\n-- consulta del panel es caro y, sobre todo, es donde se cuelan los errores.\ncreate table if not exists shift_instance (\n  id            uuid primary key default gen_random_uuid(),\n  tenant_id     uuid        not null references company(id) on delete cascade,\n  site_id       uuid        not null references site(id) on delete cascade,\n  shift_id      uuid        not null references shift(id) on delete cascade,\n  fecha         date        not null,\n  inicio_ts     timestamptz not null,\n  fin_ts        timestamptz not null,\n  unique (tenant_id, shift_id, fecha)\n);\ncreate index if not exists shift_instance_ventana\n  on shift_instance (tenant_id, site_id, inicio_ts, fin_ts);\n\n-- ---------------------------------------------------------------------------\n-- Operario.\n--\n-- RGPD: cruzar productividad con nombre y apellidos es tratamiento de datos\n-- personales en contexto laboral. El identificador que viaja por el sistema es\n-- `seudonimo`; `nombre` esta cifrado por columna y solo se descifra con un\n-- permiso aparte, que deja rastro en audit_log.\n-- ---------------------------------------------------------------------------\ncreate table if not exists operator (\n  id            uuid primary key default gen_random_uuid(),\n  tenant_id     uuid        not null references company(id) on delete cascade,\n  seudonimo     text        not null,   -- 'OP-0142'\n  nombre_cifrado bytea,\n  activo        boolean     not null default true,\n  unique (tenant_id, seudonimo)\n);\n\ncreate table if not exists supplier (\n  id            uuid primary key default gen_random_uuid(),\n  tenant_id     uuid        not null references company(id) on delete cascade,\n  codigo        text        not null,\n  nombre        text        not null,\n  cif           text,\n  critico       boolean     not null default false,\n  unique (tenant_id, codigo)\n);\n\ncreate table if not exists material (\n  id            uuid primary key default gen_random_uuid(),\n  tenant_id     uuid        not null references company(id) on delete cascade,\n  codigo        text        not null,\n  nombre        text        not null,\n  unidad        text        not null default 'kg',\n  unique (tenant_id, codigo)\n);\n\n-- Entrega. Es el eslabon que permite la correlacion defecto -> lote ->\n-- proveedor de QUALITY RADAR. Sin el, el modulo de calidad solo sabe hacer un\n-- Pareto, que es lo que el cliente ya tiene en su Excel.\ncreate table if not exists delivery (\n  id            uuid primary key default gen_random_uuid(),\n  tenant_id     uuid        not null references company(id) on delete cascade,\n  supplier_id   uuid        not null references supplier(id) on delete cascade,\n  material_id   uuid        not null references material(id) on delete cascade,\n  lote          text,\n  albaran       text,\n  fecha_prevista date,\n  fecha_real    date,\n  cantidad      numeric(14,3),\n  precio_unit   numeric(12,4),\n  incidencia    boolean     not null default false\n);\ncreate index if not exists delivery_proveedor on delivery (tenant_id, supplier_id, fecha_real desc);\ncreate index if not exists delivery_lote on delivery (tenant_id, lote);\n","bytes":6454,"lineas":141,"lenguaje":"sql","para":"Productos, órdenes, lotes, turnos, operarios y proveedores. La capa que da significado al dato.","chip":"aplica","chipTono":"ok","estado":"aplicado contra TimescaleDB pg16"},"db/05-series.sql":{"texto":"-- ---------------------------------------------------------------------------\n-- RADACTORY :: 05 · serie temporal\n-- ---------------------------------------------------------------------------\n\n-- Serie densa. Append-only: nunca se corrige una lectura, se inserta la\n-- sustitucion con quality=3 y se conserva la original.\n--\n-- `quality` NO es decorativo. Un valor bad o sustituido no puede entrar en un\n-- calculo de OEE como si fuera bueno: se excluye, y el porcentaje de cobertura\n-- se muestra AL LADO del numero. Un OEE calculado sobre el 62% del turno es un\n-- dato distinto de un OEE calculado sobre el turno entero.\n--   0 good · 1 uncertain · 2 bad · 3 sustituido\ncreate table if not exists measurement (\n  tenant_id   uuid        not null,\n  signal_id   uuid        not null,\n  ts          timestamptz not null,\n  value       double precision,\n  quality     smallint    not null default 0,\n  primary key (tenant_id, signal_id, ts)\n);\n\nselect create_hypertable('measurement', 'ts',\n  chunk_time_interval => interval '1 day',\n  if_not_exists => true);\n\n-- Comprimir por (tenant, señal) mantiene juntas las filas que siempre se leen\n-- juntas. A partir de 7 dias nadie consulta la muestra de 5 s: consulta el\n-- agregado de minuto.\nalter table measurement set (\n  timescaledb.compress,\n  timescaledb.compress_segmentby = 'tenant_id, signal_id',\n  timescaledb.compress_orderby   = 'ts desc'\n);\n\n-- ---------------------------------------------------------------------------\n-- COMPROBADO CONTRA TIMESCALEDB, NO SUPUESTO:\n--\n--   alter table measurement enable row level security;\n--   -> ERROR: operation not supported on hypertables that have columnstore enabled\n--\n-- Y al reves tambien:\n--   alter table t set (timescaledb.compress ...);   -- con RLS ya activo\n--   -> ERROR: columnstore cannot be used on table with row security\n--\n-- Son mutuamente excluyentes. Hay que elegir, y la eleccion es esta:\n--\n--   `measurement` (crudo, ~8,6 M filas/dia en una planta de 500 señales)\n--        comprimida SIN RLS. Es donde esta el volumen: sin compresion son\n--        unos 39 GB por planta y 90 dias, y con ella unos 4.\n--\n--   `measurement_rollup` (lo que LEE el panel, 12 veces mas pequeño)\n--        con RLS y SIN comprimir.\n--\n-- El aislamiento del dato crudo no se pierde, se mueve: fr_app NO tiene\n-- permiso sobre `measurement` (ver 09-rls.sql) y solo llega a el por las dos\n-- funciones de abajo, que aplican el filtro de inquilino ellas mismas.\n--\n-- Esto NO deroga la decision 04: la deja como estaba en todo lo demas y\n-- documenta la unica tabla donde el motor no permite cumplirla.\n-- ---------------------------------------------------------------------------\n\nselect add_compression_policy('measurement', interval '7 days', if_not_exists => true);\n\n-- La muestra de 5 s no la mira nadie a los tres meses; el agregado de minuto,\n-- si. Guardarla tres años multiplica el coste de almacenamiento sin que nadie\n-- la abra jamas.\nselect add_retention_policy('measurement', interval '90 days', if_not_exists => true);\n\n-- ---------------------------------------------------------------------------\n-- Agregados.\n--\n-- DECISION: rollup propio en vez de continuous aggregate de Timescale.\n--\n-- Un continuous aggregate es una vista materializada que Timescale refresca\n-- sola, y seria lo natural aqui. No se usa por dos motivos, y el segundo es el\n-- que decide:\n--\n--   1. La agregacion que necesitamos depende de `signal.clase`: un contador\n--      acumulado se agrega por diferencia (last - first) y una analogica por\n--      media. Un cagg tendria que guardar los cuatro estadisticos igual, asi\n--      que no ahorra tanto como parece.\n--   2. Los caggs viven fuera del control de RLS y refrescan con permisos del\n--      trabajo de fondo. Mantener el aislamiento multiempresa (decision 04)\n--      sobre una vista materializada que refresca sola es exactamente el tipo\n--      de sitio por donde se escapa una fila de otro cliente.\n--\n-- El coste es un job de pg-boss cada minuto. Es barato y es auditable.\n-- ---------------------------------------------------------------------------\ncreate table if not exists measurement_rollup (\n  tenant_id   uuid        not null,\n  signal_id   uuid        not null,\n  span        text        not null,   -- '1m' | '1h'\n  bucket      timestamptz not null,\n\n  n           integer     not null,   -- muestras recibidas\n  n_good      integer     not null,   -- muestras utilizables (quality 0 o 3)\n\n  v_avg       double precision,\n  v_min       double precision,\n  v_max       double precision,\n  v_sum       double precision,\n\n  -- first y last existen para los contadores acumulados: la produccion del\n  -- intervalo es v_last - v_first. Sin ellos habria que volver a la tabla\n  -- cruda, que es justo lo que este rollup evita.\n  v_first     double precision,\n  v_last      double precision,\n\n  primary key (tenant_id, signal_id, span, bucket)\n);\n\nselect create_hypertable('measurement_rollup', 'bucket',\n  chunk_time_interval => interval '7 days',\n  if_not_exists => true);\n\n-- ---------------------------------------------------------------------------\n-- Recalcula el rollup de una ventana. Idempotente: se puede volver a lanzar\n-- sobre el mismo rango sin duplicar, que es imprescindible porque el conector\n-- reenvia datos atrasados despues de un corte de linea y hay que rehacer los\n-- intervalos que ya se habian cerrado.\n-- ---------------------------------------------------------------------------\ncreate or replace function fr_rollup(\n  p_span   text,\n  p_desde  timestamptz,\n  p_hasta  timestamptz\n)\nreturns integer\nlanguage plpgsql\n-- SECURITY DEFINER porque `measurement` no es legible por fr_app. La funcion\n-- no recibe ningun identificador de inquilino y agrega por tenant_id tal cual\n-- viene del dato: es un trabajo de sistema, no una consulta de usuario, y por\n-- eso 09-rls.sql NO se la concede a fr_app.\nsecurity definer\nset search_path = public, pg_temp\nas $$\ndeclare\n  v_ancho interval;\n  v_filas integer;\nbegin\n  v_ancho := case p_span\n    when '1m' then interval '1 minute'\n    when '1h' then interval '1 hour'\n    else null\n  end;\n  if v_ancho is null then\n    raise exception 'span no soportado: %', p_span;\n  end if;\n\n  insert into measurement_rollup\n    (tenant_id, signal_id, span, bucket, n, n_good,\n     v_avg, v_min, v_max, v_sum, v_first, v_last)\n  select\n    m.tenant_id,\n    m.signal_id,\n    p_span,\n    time_bucket(v_ancho, m.ts)                            as bucket,\n    count(*)                                              as n,\n    count(*) filter (where m.quality in (0, 3))           as n_good,\n    avg(m.value)    filter (where m.quality in (0, 3))    as v_avg,\n    min(m.value)    filter (where m.quality in (0, 3))    as v_min,\n    max(m.value)    filter (where m.quality in (0, 3))    as v_max,\n    sum(m.value)    filter (where m.quality in (0, 3))    as v_sum,\n    (array_agg(m.value order by m.ts asc)\n       filter (where m.quality in (0, 3)))[1]             as v_first,\n    (array_agg(m.value order by m.ts desc)\n       filter (where m.quality in (0, 3)))[1]             as v_last\n  from measurement m\n  where m.ts >= p_desde and m.ts \u003c p_hasta\n  group by m.tenant_id, m.signal_id, bucket\n  on conflict (tenant_id, signal_id, span, bucket) do update set\n    n       = excluded.n,\n    n_good  = excluded.n_good,\n    v_avg   = excluded.v_avg,\n    v_min   = excluded.v_min,\n    v_max   = excluded.v_max,\n    v_sum   = excluded.v_sum,\n    v_first = excluded.v_first,\n    v_last  = excluded.v_last;\n\n  get diagnostics v_filas = row_count;\n  return v_filas;\nend\n$$;\n\n\n-- ---------------------------------------------------------------------------\n-- La puerta controlada al dato crudo.\n--\n-- Existe porque el producto lo exige: toda cifra del panel es pinchable hasta\n-- el dato crudo, sin callejones sin salida (la ficha de alerta abre la cuenta\n-- entera). Como `measurement` no lleva RLS, el filtro de inquilino lo aplica\n-- ESTA funcion, comparando contra la señal, y devuelve cero filas si la señal\n-- es de otra empresa. Nunca lanza excepcion: una excepcion distinta de \"no hay\n-- datos\" ya confirmaria que la señal existe.\n-- ---------------------------------------------------------------------------\ncreate or replace function fr_measurements(\n  p_signal uuid,\n  p_desde  timestamptz,\n  p_hasta  timestamptz\n)\nreturns table (ts timestamptz, value double precision, quality smallint)\nlanguage sql\nstable\nsecurity definer\nset search_path = public, pg_temp\nas $$\n  select m.ts, m.value, m.quality\n  from measurement m\n  where m.signal_id = p_signal\n    and m.ts >= p_desde and m.ts \u003c p_hasta\n    and m.tenant_id = fr_tenant()\n    and exists (\n      select 1 from signal s\n      where s.id = p_signal and s.tenant_id = fr_tenant()\n    )\n  order by m.ts;\n$$;\n","bytes":8780,"lineas":218,"lenguaje":"sql","para":"La hypertable de medidas, el rollup propio y la puerta controlada al dato crudo.","chip":"aplica","chipTono":"ok","estado":"aplicado contra TimescaleDB pg16"},"db/06-eventos.sql":{"texto":"-- ---------------------------------------------------------------------------\n-- RADACTORY :: 06 · eventos y causas\n-- ---------------------------------------------------------------------------\n\n-- Catalogo de causas POR CLIENTE, jerarquico.\n--\n-- Es el activo mas valioso que construye el piloto. No se puede traer hecho de\n-- otra planta: \"atasco en entrada\" significa una cosa en una embotelladora y\n-- otra en una prensa, y una lista generica no la rellena nadie.\ncreate table if not exists reason_code (\n  id            uuid primary key default gen_random_uuid(),\n  tenant_id     uuid        not null references company(id) on delete cascade,\n  parent_id     uuid        references reason_code(id) on delete cascade,\n  codigo        text        not null,\n  nombre        text        not null,\n  categoria     text        not null,   -- averia | ajuste | falta_material | calidad | cambio | organizativa | externa\n  planificada   boolean     not null default false,\n  unique (tenant_id, codigo)\n);\n\n-- ---------------------------------------------------------------------------\n-- Evento: discreto y escaso. Separado de `measurement` a proposito (decision 3\n-- del modelo de datos): meter serie densa y evento discreto en la misma tabla\n-- arruina las consultas de las dos.\n-- ---------------------------------------------------------------------------\ncreate table if not exists event (\n  id             bigserial   primary key,\n  tenant_id      uuid        not null references company(id) on delete cascade,\n  asset_node_id  uuid        not null references asset_node(id) on delete cascade,\n\n  tipo           text        not null,\n  ts_start       timestamptz not null,\n  ts_end         timestamptz,\n  duracion_s     integer generated always as\n                   (extract(epoch from (ts_end - ts_start))::integer) stored,\n\n  -- Casi siempre NULL al principio, y ESO ES INFORMACION, no un fallo. El\n  -- porcentaje de paradas sin causa es la primera metrica de la auditoria de\n  -- la semana 1 y suele estar entre el 60% y el 90%. Sin causa no hay\n  -- diagnostico posible, ni con IA ni sin ella.\n  reason_code_id uuid        references reason_code(id) on delete set null,\n\n  -- 'derivado' marca lo que hemos calculado nosotros y no nos han dado. Las\n  -- microparadas casi nunca vienen dadas: se deducen de que el contador no\n  -- avanza con la maquina en marcha. Mezclarlas con las declaradas por el\n  -- SCADA sin distinguirlas hace imposible defender el numero.\n  source         text        not null,   -- plc | scada | mes | manual | derivado\n  confianza      smallint    not null default 100,\n\n  product_id     uuid        references product(id) on delete set null,\n  shift_instance_id uuid     references shift_instance(id) on delete set null,\n  operator_id    uuid        references operator(id) on delete set null,\n\n  payload        jsonb       not null default '{}',\n  creado_en      timestamptz not null default now(),\n\n  constraint event_tipo_valido check (tipo in (\n    'stop','microstop','alarm','changeover','reject',\n    'setup','speed_loss','manual_note'\n  )),\n  constraint event_orden check (ts_end is null or ts_end >= ts_start)\n);\ncreate index if not exists event_nodo_ts on event (tenant_id, asset_node_id, ts_start desc);\ncreate index if not exists event_tipo_ts on event (tenant_id, tipo, ts_start desc);\ncreate index if not exists event_sin_causa on event (tenant_id, ts_start desc)\n  where reason_code_id is null and tipo in ('stop','microstop');\n","bytes":3481,"lineas":67,"lenguaje":"sql","para":"Paradas, alarmas y el catálogo de causas. La columna que más dice de una planta.","chip":"aplica","chipTono":"ok","estado":"aplicado contra TimescaleDB pg16"},"db/07-calculo.sql":{"texto":"-- ---------------------------------------------------------------------------\n-- RADACTORY :: 07 · metricas calculadas\n--\n-- Regla que gobierna todas las tablas de este fichero: nada calculado se\n-- guarda sin su explicacion. `calc_version` y `entradas` permiten abrir\n-- cualquier numero hasta el dato crudo. El director de planta va a discutir un\n-- numero en la semana 3, y un numero indefendible destruye la confianza en\n-- toda la plataforma, no solo en ese numero.\n-- ---------------------------------------------------------------------------\n\ncreate table if not exists production_metric (\n  id            uuid primary key default gen_random_uuid(),\n  tenant_id     uuid        not null references company(id) on delete cascade,\n  asset_node_id uuid        not null references asset_node(id) on delete cascade,\n  product_id    uuid        references product(id) on delete set null,\n  shift_instance_id uuid    references shift_instance(id) on delete set null,\n\n  span          text        not null,   -- 1h | turno | dia\n  bucket        timestamptz not null,\n  fin           timestamptz not null,\n\n  -- Tiempos, en segundos.\n  t_calendario  integer     not null,\n  t_planificado integer     not null,   -- calendario menos paradas planificadas\n  t_marcha      integer     not null,\n  t_parada      integer     not null,\n  t_microparada integer     not null default 0,\n\n  uds_ok        numeric(14,3) not null default 0,\n  uds_nok       numeric(14,3) not null default 0,\n\n  -- OEE SIEMPRE desglosado. Un 78% no dice nada; un 78% que es 95 x 86 x 96\n  -- dice que el problema es rendimiento y que hay que mirar tiempos de ciclo,\n  -- no averias. El numero compuesto solo es el error clasico del sector.\n  disponibilidad numeric(6,4),\n  rendimiento    numeric(6,4),\n  calidad        numeric(6,4),\n  oee            numeric(6,4),\n\n  -- Porcentaje del intervalo con dato utilizable. Por debajo de un umbral, el\n  -- panel muestra el numero atenuado y dice sobre que parte se ha calculado.\n  cobertura     numeric(6,4) not null default 1,\n\n  calc_version  smallint    not null default 1,\n  entradas      jsonb       not null default '{}',\n  calculado_en  timestamptz not null default now(),\n\n  unique (tenant_id, asset_node_id, span, bucket, product_id)\n);\ncreate index if not exists production_metric_ventana\n  on production_metric (tenant_id, asset_node_id, span, bucket desc);\n\ncreate table if not exists energy_reading (\n  id            uuid primary key default gen_random_uuid(),\n  tenant_id     uuid        not null references company(id) on delete cascade,\n  asset_node_id uuid        not null references asset_node(id) on delete cascade,\n  span          text        not null,\n  bucket        timestamptz not null,\n\n  kwh           numeric(14,4) not null,\n  kw_pico       numeric(12,3),\n\n  -- La metrica que manda. El consumo absoluto sube y baja con la produccion y\n  -- no dice nada; el especifico es comparable entre turnos y contra uno mismo.\n  uds_producidas numeric(14,3),\n  kwh_por_ud    numeric(14,6),\n\n  -- Consumo con la planta parada: el hallazgo mas rentable y el mas facil.\n  fuera_horario boolean     not null default false,\n\n  coste_eur     numeric(12,2),\n  cobertura     numeric(6,4) not null default 1,\n  unique (tenant_id, asset_node_id, span, bucket)\n);\ncreate index if not exists energy_reading_ventana\n  on energy_reading (tenant_id, asset_node_id, span, bucket desc);\n\ncreate table if not exists quality_incident (\n  id            uuid primary key default gen_random_uuid(),\n  tenant_id     uuid        not null references company(id) on delete cascade,\n  site_id       uuid        not null references site(id) on delete cascade,\n  asset_node_id uuid        references asset_node(id) on delete set null,\n  product_id    uuid        references product(id) on delete set null,\n  batch_id      uuid        references batch(id) on delete set null,\n  delivery_id   uuid        references delivery(id) on delete set null,\n  shift_instance_id uuid    references shift_instance(id) on delete set null,\n  operator_id   uuid        references operator(id) on delete set null,\n\n  tipo          text        not null default 'rechazo',  -- rechazo | reproceso | reclamacion\n  defecto       text,\n  cantidad      numeric(14,3) not null default 0,\n  coste_eur     numeric(12,2),\n  detectado_en  timestamptz not null default now()\n);\ncreate index if not exists quality_incident_ventana\n  on quality_incident (tenant_id, detectado_en desc);\ncreate index if not exists quality_incident_lote on quality_incident (tenant_id, batch_id);\n\ncreate table if not exists maintenance_order (\n  id            uuid primary key default gen_random_uuid(),\n  tenant_id     uuid        not null references company(id) on delete cascade,\n  asset_node_id uuid        not null references asset_node(id) on delete cascade,\n  codigo        text,\n  clase         text        not null default 'correctiva',  -- preventiva | correctiva | predictiva\n  estado        text        not null default 'abierta',\n  descripcion   text,\n\n  -- De donde nacio. Si la creo el sistema a partir de una alerta, se guarda:\n  -- es la trazabilidad que demuestra el retorno de la plataforma cuando toca\n  -- renovar el contrato.\n  alert_id      uuid,\n  origen        text        not null default 'manual',  -- manual | alerta | plan | gmao\n\n  abierta_en    timestamptz not null default now(),\n  cerrada_en    timestamptz,\n  horas         numeric(8,2),\n  coste_eur     numeric(12,2),\n  tecnico       text,\n  unique (tenant_id, codigo)\n);\ncreate index if not exists maintenance_order_nodo\n  on maintenance_order (tenant_id, asset_node_id, abierta_en desc);\n\n-- ---------------------------------------------------------------------------\n-- Puntuaciones. Los componentes se guardan ABIERTOS, no solo el total: el\n-- panel enseña un enlace \"¿como?\" al lado de cada puntuacion y tiene que poder\n-- rellenarlo sin recalcular nada (decision 11).\n-- ---------------------------------------------------------------------------\ncreate table if not exists asset_score (\n  tenant_id     uuid        not null references company(id) on delete cascade,\n  asset_node_id uuid        not null references asset_node(id) on delete cascade,\n  fecha         date        not null,\n\n  score            smallint not null,\n  c_fiabilidad     smallint,\n  c_comportamiento smallint,\n  c_mantenimiento  smallint,\n  c_criticidad     smallint,\n\n  mtbf_h        numeric(10,2),\n  mttr_h        numeric(10,2),\n\n  -- Los pesos se guardan CON la fila. Son configurables por cliente, y un\n  -- score historico calculado con otros pesos tiene que seguir siendo legible.\n  pesos         jsonb       not null default '{}',\n  entradas      jsonb       not null default '{}',\n  calc_version  smallint    not null default 1,\n\n  primary key (tenant_id, asset_node_id, fecha),\n  constraint asset_score_rango check (score between 0 and 100)\n);\n\ncreate table if not exists supplier_score (\n  tenant_id     uuid        not null references company(id) on delete cascade,\n  supplier_id   uuid        not null references supplier(id) on delete cascade,\n  mes           date        not null,\n\n  score         smallint    not null,\n  c_calidad     smallint,\n  c_puntualidad smallint,\n  c_precio      smallint,\n  c_respuesta   smallint,\n  c_cumplimiento smallint,\n\n  pesos         jsonb       not null default '{}',\n  entradas      jsonb       not null default '{}',\n  primary key (tenant_id, supplier_id, mes),\n  constraint supplier_score_rango check (score between 0 and 100)\n);\n","bytes":7499,"lineas":170,"lenguaje":"sql","para":"OEE, energía, calidad, mantenimiento y puntuaciones. Nada se guarda sin su explicación.","chip":"aplica","chipTono":"ok","estado":"aplicado contra TimescaleDB pg16"},"db/08-inteligencia.sql":{"texto":"-- ---------------------------------------------------------------------------\n-- RADACTORY :: 08 · linea base, alertas, IA y documentos\n-- ---------------------------------------------------------------------------\n\n-- LA LINEA BASE ES POR CONTEXTO, NO GLOBAL (decision 09).\n--\n-- El consumo de la Linea 3 fabricando PROD-X en el turno de mañana no es\n-- comparable con esa misma linea fabricando PROD-Y de noche. Una linea base\n-- global dispara falsos positivos en CADA cambio de formato, y a las dos\n-- semanas nadie mira las alertas. Por eso la clave incluye producto y turno.\ncreate table if not exists baseline (\n  id            uuid primary key default gen_random_uuid(),\n  tenant_id     uuid        not null references company(id) on delete cascade,\n  signal_id     uuid        references signal(id) on delete cascade,\n  asset_node_id uuid        references asset_node(id) on delete cascade,\n  metrica       text        not null,   -- 'rendimiento' | 'kwh_por_ud' | 'valor' | ...\n  product_id    uuid        references product(id) on delete set null,\n  shift_id      uuid        references shift(id) on delete set null,\n  span          text        not null,\n\n  media         double precision,\n  desviacion    double precision,\n  p05           double precision,\n  p50           double precision,\n  p95           double precision,\n\n  -- Por debajo de este minimo NO se detecta nada sobre esta combinacion. Es lo\n  -- que evita que una linea base construida con cuatro turnos genere alertas.\n  n_muestras    integer     not null default 0,\n  suficiente    boolean     not null default false,\n\n  desde         timestamptz not null,\n  hasta         timestamptz not null,\n  calculado_en  timestamptz not null default now()\n);\n\n-- NULLS NOT DISTINCT es imprescindible aqui.\n--\n-- Existe la linea base generica, con product_id NULL, para el caso en que un\n-- producto sea demasiado nuevo para tener la suya (ver mas abajo). Con el\n-- comportamiento por defecto de Postgres —NULLS DISTINCT— dos filas con\n-- product_id NULL no chocan, el ON CONFLICT no casa nunca y la tabla acumula\n-- una linea base nueva en cada pasada del motor, para siempre.\ndo $$\nbegin\n  if not exists (select 1 from pg_constraint where conname = 'baseline_clave') then\n    alter table baseline add constraint baseline_clave\n      unique nulls not distinct\n      (tenant_id, metrica, span, signal_id, asset_node_id, product_id, shift_id);\n  end if;\nend\n$$;\n\n-- Desviacion detectada, antes de decidir si merece molestar a nadie. Se separa\n-- de `alert` porque la mayoria de anomalias NO deben generar alerta: el tope\n-- son cinco criticas por planta y semana (decision 10).\ncreate table if not exists anomaly (\n  id            uuid primary key default gen_random_uuid(),\n  tenant_id     uuid        not null references company(id) on delete cascade,\n  asset_node_id uuid        references asset_node(id) on delete cascade,\n  baseline_id   uuid        references baseline(id) on delete set null,\n  detector      text        not null,   -- umbral | desviacion | tendencia | cambio_regimen | correlacion | repeticion\n  metrica       text        not null,\n  ventana_ini   timestamptz not null,\n  ventana_fin   timestamptz not null,\n  valor         double precision,\n  esperado      double precision,\n  z             double precision,\n  confianza     smallint    not null default 50,\n  promovida     boolean     not null default false,\n  detectado_en  timestamptz not null default now()\n);\ncreate index if not exists anomaly_pendiente\n  on anomaly (tenant_id, detectado_en desc) where not promovida;\n\n-- ---------------------------------------------------------------------------\n-- ALERTA: el producto, en una tabla.\n-- ---------------------------------------------------------------------------\ncreate table if not exists alert (\n  id                 uuid primary key default gen_random_uuid(),\n  tenant_id          uuid        not null references company(id) on delete cascade,\n  site_id            uuid        not null references site(id) on delete cascade,\n  asset_node_id      uuid        references asset_node(id) on delete set null,\n  anomaly_id         uuid        references anomaly(id) on delete set null,\n\n  modulo             text        not null,   -- production | maintenance | energy | quality | supplier\n  severidad          text        not null,   -- critica | alta | media | baja\n  confianza          smallint    not null,   -- 0-100, y SE MUESTRA\n\n  titulo             text        not null,   -- una linea, sin jerga\n  que_cambio         text        not null,\n  por_que            text,                   -- causa probable; puede ser NULL y esta bien\n\n  impacto_eur_anual  numeric(12,2),\n\n  -- impact_basis y evidence son OBLIGATORIOS y no aceptan '{}'. Una alerta sin\n  -- la cuenta abierta y sin sus fuentes NO SE INSERTA. Es restriccion de\n  -- esquema, no buena intencion del equipo de frontend.\n  impacto_base       jsonb       not null,\n  evidencia          jsonb       not null,\n\n  accion_recomendada text,\n\n  estado             text        not null default 'abierta',  -- abierta | en_curso | resuelta | descartada\n  -- Cierra el bucle de aprendizaje. Sin esta columna no hay forma de reducir\n  -- los falsos positivos, y son la causa numero uno de abandono de este tipo\n  -- de producto (decision 22).\n  feedback           text,                   -- util | no_era_nada | ya_lo_sabia\n  feedback_por       uuid        references app_user(id) on delete set null,\n\n  detectado_en       timestamptz not null default now(),\n  cerrado_en         timestamptz,\n\n  constraint alert_severidad_valida check (severidad in ('critica','alta','media','baja')),\n  constraint alert_confianza check (confianza between 0 and 100),\n  constraint alert_feedback_valido check (feedback is null or feedback in\n    ('util','no_era_nada','ya_lo_sabia')),\n  constraint alert_cuenta_abierta check (impacto_base \u003c> '{}'::jsonb),\n  constraint alert_con_fuentes  check (evidencia   \u003c> '{}'::jsonb)\n);\ncreate index if not exists alert_bandeja\n  on alert (tenant_id, site_id, estado, severidad, detectado_en desc);\n\ncreate table if not exists recommendation (\n  id            uuid primary key default gen_random_uuid(),\n  tenant_id     uuid        not null references company(id) on delete cascade,\n  alert_id      uuid        references alert(id) on delete cascade,\n  texto         text        not null,\n  ahorro_eur    numeric(12,2),\n  coste_eur     numeric(12,2),\n  esfuerzo      text,       -- bajo | medio | alto\n  aceptada      boolean\n);\n\n-- Lo ejecutado por OPERATIONS AGENT. `nivel` es el modelo de autorizacion:\n--   0 informativo · 1 reversible interno · 2 sale fuera o cuesta dinero\n-- El nivel 3 (escribir en OT) NO EXISTE y no debe aparecer nunca aqui.\ncreate table if not exists action (\n  id            uuid primary key default gen_random_uuid(),\n  tenant_id     uuid        not null references company(id) on delete cascade,\n  alert_id      uuid        references alert(id) on delete set null,\n  tipo          text        not null,\n  nivel         smallint    not null,\n  propuesta_por text        not null,   -- 'ia' | user_id\n  autorizada_por uuid       references app_user(id) on delete set null,\n  ejecutada_en  timestamptz,\n  resultado     text,\n  payload       jsonb       not null default '{}',\n  creada_en     timestamptz not null default now(),\n  constraint action_nivel check (nivel between 0 and 2),\n  -- El nivel 2 sale de la empresa o cuesta dinero: exige confirmacion humana\n  -- explicita, SIEMPRE. La base lo impone; no se deja al criterio del codigo.\n  constraint action_nivel2_autorizada check (\n    nivel \u003c 2 or autorizada_por is not null or ejecutada_en is null\n  )\n);\n\n-- ---------------------------------------------------------------------------\n-- Registro de cada llamada al LLM. Sin esto no se puede depurar una respuesta\n-- mala, ni facturar el consumo, ni defenderse cuando un cliente pregunte por\n-- que la IA dijo lo que dijo.\n-- ---------------------------------------------------------------------------\ncreate table if not exists ai_analysis (\n  id            uuid primary key default gen_random_uuid(),\n  tenant_id     uuid        not null references company(id) on delete cascade,\n  user_id       uuid        references app_user(id) on delete set null,\n  tarea         text        not null,   -- diagnostico | copilot | clasificar | resumir | rag\n  alert_id      uuid        references alert(id) on delete set null,\n\n  prompt        text,\n  contexto      jsonb       not null default '{}',\n  respuesta     text,\n  fuentes       jsonb       not null default '[]',\n\n  proveedor     text,\n  modelo        text,\n  tokens_in     integer,\n  tokens_out    integer,\n  coste_eur     numeric(10,6),\n  latencia_ms   integer,\n  error         text,\n  ts            timestamptz not null default now()\n);\ncreate index if not exists ai_analysis_coste on ai_analysis (tenant_id, ts desc);\n\n-- ---------------------------------------------------------------------------\n-- FACTORY BRAIN\n-- ---------------------------------------------------------------------------\ncreate table if not exists document (\n  id            uuid primary key default gen_random_uuid(),\n  tenant_id     uuid        not null references company(id) on delete cascade,\n  site_id       uuid        references site(id) on delete cascade,\n  asset_node_id uuid        references asset_node(id) on delete set null,\n\n  titulo        text        not null,\n  tipo          text        not null,   -- manual | esquema | procedimiento | parte | ficha | foto | video\n  fabricante    text,\n  modelo        text,\n  version       text,\n  idioma        text        not null default 'es',\n\n  -- La revision obsoleta se CONSERVA (hace falta para leer partes antiguos)\n  -- pero se marca, y nunca se cita como vigente. Responder con el manual de\n  -- 2011 en vez de con el vigente puede ser la diferencia entre una reparacion\n  -- y un accidente.\n  vigente       boolean     not null default true,\n  vigente_desde date,\n  vigente_hasta date,\n\n  ruta_almacen  text        not null,\n  sha256        text,\n  paginas       integer,\n  subido_en     timestamptz not null default now()\n);\ncreate index if not exists document_filtro\n  on document (tenant_id, site_id, asset_node_id) where vigente;\n\ncreate table if not exists doc_chunk (\n  id            uuid primary key default gen_random_uuid(),\n  tenant_id     uuid        not null references company(id) on delete cascade,\n  document_id   uuid        not null references document(id) on delete cascade,\n  orden         integer     not null,\n  pagina        integer,\n  texto         text        not null,\n  embedding     vector(1536),\n\n  -- Busqueda lexica exacta ademas de la semantica. Hacen falta las dos: un\n  -- embedding difumina los codigos ('E42', 'S3', 'REF-2210') que son justo lo\n  -- que el tecnico teclea.\n  tsv           tsvector generated always as\n                  (to_tsvector('spanish', texto)) stored,\n\n  unique (document_id, orden)\n);\ncreate index if not exists doc_chunk_tsv on doc_chunk using gin (tsv);\n-- El filtro por inquilino va ANTES de la busqueda vectorial, nunca despues:\n-- filtrar despues es una fuga esperando su turno.\ncreate index if not exists doc_chunk_tenant on doc_chunk (tenant_id, document_id);\ncreate index if not exists doc_chunk_vec on doc_chunk\n  using hnsw (embedding vector_cosine_ops);\n","bytes":11341,"lineas":241,"lenguaje":"sql","para":"Línea base, anomalías, alertas, registro de IA y el índice vectorial.","chip":"aplica","chipTono":"ok","estado":"aplicado contra TimescaleDB pg16"},"db/09-rls.sql":{"texto":"-- ---------------------------------------------------------------------------\n-- RADACTORY :: 09 · aislamiento multiempresa\n--\n-- Barrera 1 de 3 (las otras dos son el repositorio de la aplicacion y la\n-- bateria de fugas en CI). Esta es la que sigue funcionando el dia que alguien\n-- escriba una consulta sin el WHERE, que es el dia que de verdad importa.\n--\n-- Se aplica EN BUCLE sobre todas las tablas que tengan tenant_id, no a mano\n-- tabla por tabla. El fallo real de este patron nunca es una politica mal\n-- escrita: es una tabla nueva a la que se olvidaron de ponersela. El bucle no\n-- se olvida, y ademas se puede volver a lanzar despues de cada migracion.\n-- ---------------------------------------------------------------------------\n\ndo $$\ndeclare\n  t record;\nbegin\n  for t in\n    select c.relname as tabla\n    from pg_class c\n    join pg_namespace n on n.oid = c.relnamespace\n    join pg_attribute a on a.attrelid = c.oid and a.attname = 'tenant_id'\n    where n.nspname = 'public'\n      and c.relkind = 'r'\n      and not a.attisdropped\n      -- `measurement` queda fuera a proposito: TimescaleDB no admite RLS y\n      -- compresion a la vez, y ahi gana la compresion. El motivo completo y la\n      -- comprobacion estan en 05-series.sql. Se llega a ella por\n      -- fr_measurements(), que aplica el filtro de inquilino por su cuenta.\n      and c.relname \u003c> 'measurement'\n    order by c.relname\n  loop\n    execute format('alter table public.%I enable row level security', t.tabla);\n    -- FORCE es imprescindible: sin el, el PROPIETARIO de la tabla salta las\n    -- politicas. Si algun script de mantenimiento se conecta como propietario\n    -- —y alguno acabara haciendolo— el aislamiento desaparece en silencio.\n    execute format('alter table public.%I force row level security', t.tabla);\n    execute format('drop policy if exists inquilino on public.%I', t.tabla);\n    execute format($p$\n      create policy inquilino on public.%I\n        using (tenant_id = fr_tenant() or fr_es_superadmin())\n        with check (tenant_id = fr_tenant() or fr_es_superadmin())\n    $p$, t.tabla);\n  end loop;\nend\n$$;\n\n-- `company` no tiene tenant_id porque su id ES el inquilino.\nalter table company enable row level security;\nalter table company force  row level security;\ndrop policy if exists inquilino on company;\ncreate policy inquilino on company\n  using (id = fr_tenant() or fr_es_superadmin())\n  with check (id = fr_tenant() or fr_es_superadmin());\n\n-- Una persona puede pertenecer a varias empresas, asi que `app_user` tampoco\n-- lleva tenant_id: se ve a traves de la membresia. Consecuencia buscada: desde\n-- la empresa A no se puede enumerar quien mas usa la plataforma.\nalter table app_user enable row level security;\nalter table app_user force  row level security;\ndrop policy if exists inquilino on app_user;\ncreate policy inquilino on app_user\n  using (\n    fr_es_superadmin()\n    or exists (\n      select 1 from membership m\n      where m.user_id = app_user.id and m.tenant_id = fr_tenant()\n    )\n  );\n\n-- `audit_log` es append-only. La politica concede SELECT e INSERT y nada mas:\n-- sin UPDATE ni DELETE no hay forma de borrar el rastro desde la aplicacion,\n-- que es justo lo que hace que el rastro valga para algo.\n-- Las tres se borran antes de crearse: los ficheros de db/ se relanzan enteros\n-- en cada migracion, y un `create policy` a secas rompe la segunda pasada.\n-- Costo una migracion a medias: 09 fallaba y las politicas de las tablas\n-- posteriores se quedaban sin aplicar, sin que nada lo dijera.\ndrop policy if exists inquilino      on audit_log;\ndrop policy if exists audit_lectura  on audit_log;\ndrop policy if exists audit_escritura on audit_log;\ncreate policy audit_lectura on audit_log for select\n  using (tenant_id = fr_tenant() or fr_es_superadmin());\ncreate policy audit_escritura on audit_log for insert\n  with check (tenant_id = fr_tenant() or fr_es_superadmin());\n\n-- ---------------------------------------------------------------------------\n-- Permisos del rol de aplicacion. No es propietario y no tiene DDL: la API no\n-- puede alterar el esquema aunque alguien consiga inyectar SQL.\n-- ---------------------------------------------------------------------------\ngrant usage on schema public to fr_app;\ngrant select, insert, update, delete on all tables in schema public to fr_app;\ngrant usage, select on all sequences in schema public to fr_app;\ngrant execute on all functions in schema public to fr_app;\n\nrevoke update, delete on audit_log from fr_app;\n\n-- Dato crudo: ni una sola operacion directa. La unica via es fr_measurements().\nrevoke all on measurement from fr_app;\n-- fr_rollup() es trabajo de sistema y corre con su propia conexion (ver\n-- DATABASE_URL_JOBS en .env.example). Si la API pudiera llamarla, tendria un\n-- SECURITY DEFINER que lee todos los inquilinos al alcance de la mano.\nrevoke execute on function fr_rollup(text, timestamptz, timestamptz) from fr_app;\ngrant  execute on function fr_measurements(uuid, timestamptz, timestamptz) to fr_app;\n\nalter default privileges in schema public\n  grant select, insert, update, delete on tables to fr_app;\nalter default privileges in schema public\n  grant usage, select on sequences to fr_app;\n","bytes":5211,"lineas":109,"lenguaje":"sql","para":"El aislamiento multiempresa, aplicado en bucle para que no se olvide ninguna tabla.","chip":"aplica","chipTono":"ok","estado":"aplicado contra TimescaleDB pg16"},"db/10-vistas.sql":{"texto":"-- ---------------------------------------------------------------------------\n-- RADACTORY :: 10 · vistas de consulta\n--\n-- Ninguna consulta del panel toca `measurement`. Siempre lee del agregado del\n-- nivel adecuado. Es la diferencia entre un panel que abre en 200 ms y uno que\n-- tarda 9 s, y esa diferencia decide si el usuario vuelve mañana.\n-- ---------------------------------------------------------------------------\n\n-- Las vistas heredan la RLS de las tablas de debajo. `security_invoker` es\n-- imprescindible en PG15+: sin el, la vista se ejecuta con los permisos de su\n-- propietario y se salta las politicas de quien consulta.\n\n-- Estado de planta: las seis cifras de la pantalla de los 30 segundos.\ncreate or replace view v_estado_planta\nwith (security_invoker = true) as\nselect\n  pm.tenant_id,\n  an.site_id,\n  pm.bucket::date                                        as fecha,\n  sum(pm.uds_ok)                                         as uds_ok,\n  sum(pm.uds_nok)                                        as uds_nok,\n  case when sum(pm.uds_ok + pm.uds_nok) > 0\n       then sum(pm.uds_ok) / sum(pm.uds_ok + pm.uds_nok)\n  end                                                    as calidad,\n  -- OEE de planta ponderado por tiempo planificado, no media aritmetica: una\n  -- media simple deja que una maquina auxiliar parada dos horas pese lo mismo\n  -- que la linea principal.\n  case when sum(pm.t_planificado) > 0\n       then sum(pm.oee * pm.t_planificado) / sum(pm.t_planificado)\n  end                                                    as oee,\n  min(pm.cobertura)                                      as cobertura_min\nfrom production_metric pm\njoin asset_node an on an.id = pm.asset_node_id\nwhere pm.span = 'dia'\ngroup by pm.tenant_id, an.site_id, pm.bucket::date;\n\n-- Bandeja \"Atencion hoy\". El tope de cinco NO se aplica aqui: se aplica en el\n-- motor, que es quien decide que merece ser critica. Si la bandeja trae mas de\n-- cinco criticas, el problema es de calibracion y hay que verlo, no ocultarlo.\ncreate or replace view v_atencion\nwith (security_invoker = true) as\nselect\n  a.id, a.tenant_id, a.site_id, a.asset_node_id,\n  an.codigo        as nodo_codigo,\n  an.nombre        as nodo_nombre,\n  a.modulo, a.severidad, a.confianza,\n  a.titulo, a.que_cambio, a.por_que,\n  a.impacto_eur_anual, a.accion_recomendada,\n  a.detectado_en,\n  case a.severidad\n    when 'critica' then 1 when 'alta' then 2\n    when 'media'   then 3 else 4\n  end              as orden_severidad\nfrom alert a\nleft join asset_node an on an.id = a.asset_node_id\nwhere a.estado = 'abierta';\n\n-- Cuantas paradas NO tienen causa. Es la primera metrica de la auditoria de la\n-- semana 1 del piloto y la que justifica media conversacion comercial.\ncreate or replace view v_cobertura_causas\nwith (security_invoker = true) as\nselect\n  e.tenant_id,\n  an.site_id,\n  date_trunc('week', e.ts_start)                         as semana,\n  count(*)                                               as paradas,\n  count(*) filter (where e.reason_code_id is null)       as sin_causa,\n  round(\n    100.0 * count(*) filter (where e.reason_code_id is null)\n    / nullif(count(*), 0)\n  , 1)                                                   as pct_sin_causa\nfrom event e\njoin asset_node an on an.id = e.asset_node_id\nwhere e.tipo in ('stop', 'microstop')\ngroup by e.tenant_id, an.site_id, date_trunc('week', e.ts_start);\n\n-- Consumo de IA por empresa y mes, para el panel de superadmin. La\n-- conversacion de precio con un cliente que usa mucho el Copilot se tiene con\n-- este numero delante, no a ojo.\ncreate or replace view v_consumo_ia\nwith (security_invoker = true) as\nselect\n  tenant_id,\n  date_trunc('month', ts)                                as mes,\n  count(*)                                               as llamadas,\n  sum(coste_eur)                                         as coste_eur,\n  round(avg(latencia_ms))                                as latencia_media_ms,\n  count(*) filter (where error is not null)              as errores\nfrom ai_analysis\ngroup by tenant_id, date_trunc('month', ts);\n","bytes":4070,"lineas":91,"lenguaje":"sql","para":"Las vistas que lee el panel. Ninguna consulta toca la tabla cruda.","chip":"aplica","chipTono":"ok","estado":"aplicado contra TimescaleDB pg16"},"db/pruebas/fugas.sql":{"texto":"-- ---------------------------------------------------------------------------\n-- RADACTORY :: bateria de fugas entre inquilinos\n--\n-- Se ejecuta COMO fr_app, que es el rol con el que se conecta la API. Ejecutarla\n-- como postgres no prueba nada: el superusuario salta RLS.\n--\n-- Cada prueba es un DO, y un DO es una sola transaccion: asi el\n-- `fr_set_tenant()` local vive exactamente lo que dura la prueba, igual que\n-- vive lo que dura una peticion HTTP en produccion.\n--\n-- Regla de la casa para el 404: pedir un recurso de otro inquilino devuelve\n-- CERO FILAS, no un error de permisos. Un 403 confirmaria que el recurso\n-- existe, y eso ya es informacion que no le corresponde.\n-- ---------------------------------------------------------------------------\n\\set ON_ERROR_STOP on\n\n-- Nota: psql NO sustituye sus variables (\\set) dentro de un bloque $$...$$,\n-- asi que los identificadores van literales. Es feo y es lo correcto: la\n-- alternativa era montar las pruebas por concatenacion, y una prueba de\n-- seguridad tiene que poder leerse tal cual, sin desenrollarla mentalmente.\n\n-- 1 · Con inquilino ALFA solo se ve la alerta de ALFA.\ndo $$\ndeclare n int; t text;\nbegin\n  perform fr_set_tenant('aaaaaaaa-0000-0000-0000-000000000001');\n  select count(*), min(titulo) into n, t from alert;\n  if n \u003c> 1 or t not like 'Linea 3%' then\n    raise exception 'FUGA 1: ALFA ve % alertas (%), esperaba 1 propia', n, t;\n  end if;\n  raise notice 'OK 1 · ALFA ve solo lo suyo';\nend $$;\n\n-- 2 · Pedir por id una alerta de BETA devuelve cero filas, no un error.\ndo $$\ndeclare n int;\nbegin\n  perform fr_set_tenant('aaaaaaaa-0000-0000-0000-000000000001');\n  select count(*) into n from alert\n   where id = 'bbbbbbbb-4444-0000-0000-000000000002';\n  if n \u003c> 0 then raise exception 'FUGA 2: ALFA lee la alerta de BETA por id'; end if;\n  raise notice 'OK 2 · el id ajeno devuelve 0 filas';\nend $$;\n\n-- 3 · Escribir con el tenant_id de otro tiene que rebotar (WITH CHECK).\ndo $$\ndeclare rebota boolean := false;\nbegin\n  perform fr_set_tenant('aaaaaaaa-0000-0000-0000-000000000001');\n  begin\n    insert into alert (tenant_id, site_id, modulo, severidad, confianza,\n                       titulo, que_cambio, impacto_base, evidencia)\n    values ('bbbbbbbb-0000-0000-0000-000000000002', 'bbbbbbbb-1111-0000-0000-000000000002', 'production', 'baja', 10,\n            'inyectada', 'x', '{\"a\":1}', '[\"b\"]');\n  exception when insufficient_privilege or check_violation then\n    rebota := true;\n  end;\n  if not rebota then raise exception 'FUGA 3: ALFA ha escrito una fila en BETA'; end if;\n  raise notice 'OK 3 · no se puede escribir en otro inquilino';\nend $$;\n\n-- 4 · Sin inquilino fijado no se ve NADA. Es el fallo seguro: una conexion que\n--     se olvida de fijar contexto no debe devolver la base entera.\ndo $$\ndeclare n int;\nbegin\n  perform set_config('fr.tenant_id', '', true);\n  select count(*) into n from alert;\n  if n \u003c> 0 then raise exception 'FUGA 4: sin contexto se ven % alertas', n; end if;\n  raise notice 'OK 4 · sin contexto no se ve nada';\nend $$;\n\n-- 5 · El dato crudo no es accesible directamente por la API.\ndo $$\ndeclare rebota boolean := false; n int;\nbegin\n  perform fr_set_tenant('aaaaaaaa-0000-0000-0000-000000000001');\n  begin\n    select count(*) into n from measurement;\n  exception when insufficient_privilege then\n    rebota := true;\n  end;\n  if not rebota then\n    raise exception 'FUGA 5: fr_app lee measurement directamente (% filas)', n;\n  end if;\n  raise notice 'OK 5 · measurement no es legible por fr_app';\nend $$;\n\n-- 6 · ...pero la puerta controlada sí devuelve el dato propio.\ndo $$\ndeclare n int;\nbegin\n  perform fr_set_tenant('aaaaaaaa-0000-0000-0000-000000000001');\n  select count(*) into n from fr_measurements(\n    'aaaaaaaa-3333-0000-0000-000000000001',\n    '2026-09-09 00:00:00+02', '2026-09-10 00:00:00+02');\n  if n \u003c> 21 then raise exception 'FUGA 6: fr_measurements devuelve % filas, esperaba 21', n; end if;\n  raise notice 'OK 6 · fr_measurements devuelve el dato propio';\nend $$;\n\n-- 7 · ...y cero para una señal ajena, sin decir si existe.\ndo $$\ndeclare n int;\nbegin\n  perform fr_set_tenant('aaaaaaaa-0000-0000-0000-000000000001');\n  select count(*) into n from fr_measurements(\n    'bbbbbbbb-3333-0000-0000-000000000002',\n    '2026-09-09 00:00:00+02', '2026-09-10 00:00:00+02');\n  if n \u003c> 0 then raise exception 'FUGA 7: fr_measurements devuelve dato de BETA'; end if;\n  raise notice 'OK 7 · señal ajena devuelve 0 filas';\nend $$;\n\n-- 8 · Una alerta sin la cuenta abierta no entra. Es restriccion de esquema.\ndo $$\ndeclare rebota boolean := false;\nbegin\n  perform fr_set_tenant('aaaaaaaa-0000-0000-0000-000000000001');\n  begin\n    insert into alert (tenant_id, site_id, modulo, severidad, confianza,\n                       titulo, que_cambio, impacto_base, evidencia)\n    values ('aaaaaaaa-0000-0000-0000-000000000001', 'aaaaaaaa-1111-0000-0000-000000000001', 'production', 'baja', 10,\n            'sin cuenta', 'x', '{}', '[]');\n  exception when check_violation then\n    rebota := true;\n  end;\n  if not rebota then raise exception 'FALLO 8: se ha colado una alerta sin impacto_base'; end if;\n  raise notice 'OK 8 · sin cuenta abierta no se inserta';\nend $$;\n\n-- 9 · El trigger del arbol deja la ruta de ancestros bien montada.\ndo $$\ndeclare r uuid[];\nbegin\n  perform fr_set_tenant('aaaaaaaa-0000-0000-0000-000000000001');\n  select ruta into r from asset_node where codigo = 'L3.P4';\n  if r is null or not ('aaaaaaaa-2222-0000-0000-000000000001' = any(r)) then\n    raise exception 'FALLO 9: la ruta de L3.P4 no contiene a L3 (%)', r;\n  end if;\n  raise notice 'OK 9 · el arbol materializa la ruta de ancestros';\nend $$;\n\n-- 10 · El log de auditoria es append-only tambien para la API.\ndo $$\ndeclare rebota boolean := false;\nbegin\n  perform fr_set_tenant('aaaaaaaa-0000-0000-0000-000000000001');\n  insert into audit_log (tenant_id, accion) values ('aaaaaaaa-0000-0000-0000-000000000001', 'prueba.fugas');\n  begin\n    delete from audit_log where accion = 'prueba.fugas';\n  exception when insufficient_privilege then\n    rebota := true;\n  end;\n  if not rebota then raise exception 'FALLO 10: fr_app puede borrar del log de auditoria'; end if;\n  raise notice 'OK 10 · el log de auditoria no se puede borrar';\nend $$;\n\n-- 11 · El rollup agrega el contador acumulado por diferencia (last - first).\n--      120 - 0 = 120 unidades en la ventana. Si esto sale mal, toda la\n--      produccion del panel sale mal.\ndo $$\ndeclare v numeric;\nbegin\n  perform fr_set_tenant('aaaaaaaa-0000-0000-0000-000000000001');\n  select v_last - v_first into v\n    from measurement_rollup\n   where signal_id = 'aaaaaaaa-3333-0000-0000-000000000001' and span = '1h';\n  if v is distinct from 120 then\n    raise exception 'FALLO 11: el rollup da % unidades, esperaba 120', v;\n  end if;\n  raise notice 'OK 11 · el contador acumulado se agrega por diferencia';\nend $$;\n\nselect 'BATERIA DE FUGAS: 11/11 SUPERADAS' as resultado;\n","bytes":6950,"lineas":174,"lenguaje":"sql","para":"Once pruebas de fuga entre inquilinos. Corren como el rol de la API, no como superusuario.","chip":"11/11","chipTono":"ok","estado":"batería superada como fr_app"},"db/pruebas/semilla-fugas.sql":{"texto":"-- Semilla de la bateria de fugas. Se carga como PROPIETARIO (superusuario),\n-- que salta RLS a proposito: aqui se trata de plantar dos empresas rivales\n-- para despues comprobar, ya como fr_app, que no se ven entre ellas.\nbegin;\n\ninsert into company (id, nombre) values\n  ('aaaaaaaa-0000-0000-0000-000000000001', 'Metalurgica ALFA'),\n  ('bbbbbbbb-0000-0000-0000-000000000002', 'Metalurgica BETA')\non conflict do nothing;\n\ninsert into site (id, tenant_id, nombre, precio_kwh) values\n  ('aaaaaaaa-1111-0000-0000-000000000001', 'aaaaaaaa-0000-0000-0000-000000000001', 'Torrelavega', 0.14200),\n  ('bbbbbbbb-1111-0000-0000-000000000002', 'bbbbbbbb-0000-0000-0000-000000000002', 'Reinosa',     0.13800)\non conflict do nothing;\n\n-- Arbol: linea 3 con la estacion P4 colgando. Sirve tambien para comprobar que\n-- el trigger de `ruta` deja el camino de ancestros bien montado.\ninsert into asset_node (id, tenant_id, site_id, parent_id, tipo, codigo, nombre, coste_parada_hora) values\n  ('aaaaaaaa-2222-0000-0000-000000000001', 'aaaaaaaa-0000-0000-0000-000000000001',\n   'aaaaaaaa-1111-0000-0000-000000000001', null, 'linea', 'L3', 'Linea 3', 3200),\n  ('aaaaaaaa-2222-0000-0000-000000000002', 'aaaaaaaa-0000-0000-0000-000000000001',\n   'aaaaaaaa-1111-0000-0000-000000000001', 'aaaaaaaa-2222-0000-0000-000000000001',\n   'maquina', 'L3.P4', 'Estacion P4', 3200),\n  ('bbbbbbbb-2222-0000-0000-000000000002', 'bbbbbbbb-0000-0000-0000-000000000002',\n   'bbbbbbbb-1111-0000-0000-000000000002', null, 'linea', 'L1', 'Linea 1', 1900)\non conflict do nothing;\n\ninsert into signal (id, tenant_id, asset_node_id, codigo, nombre, clase, unidad, agregacion) values\n  ('aaaaaaaa-3333-0000-0000-000000000001', 'aaaaaaaa-0000-0000-0000-000000000001',\n   'aaaaaaaa-2222-0000-0000-000000000002', 'L3.P4.contador', 'Contador P4',\n   'contador_acumulado', 'uds', 'delta'),\n  ('bbbbbbbb-3333-0000-0000-000000000002', 'bbbbbbbb-0000-0000-0000-000000000002',\n   'bbbbbbbb-2222-0000-0000-000000000002', 'L1.contador', 'Contador L1',\n   'contador_acumulado', 'uds', 'delta')\non conflict do nothing;\n\n-- Contador acumulado de ALFA: 0 -> 120 en diez minutos.\ninsert into measurement (tenant_id, signal_id, ts, value, quality)\nselect 'aaaaaaaa-0000-0000-0000-000000000001', 'aaaaaaaa-3333-0000-0000-000000000001',\n       timestamptz '2026-09-09 06:00:00+02' + (i * interval '30 seconds'),\n       i * 6, 0\nfrom generate_series(0, 20) i\non conflict do nothing;\n\ninsert into measurement (tenant_id, signal_id, ts, value, quality)\nselect 'bbbbbbbb-0000-0000-0000-000000000002', 'bbbbbbbb-3333-0000-0000-000000000002',\n       timestamptz '2026-09-09 06:00:00+02' + (i * interval '30 seconds'),\n       i * 2, 0\nfrom generate_series(0, 20) i\non conflict do nothing;\n\ninsert into alert (id, tenant_id, site_id, asset_node_id, modulo, severidad, confianza,\n                   titulo, que_cambio, impacto_eur_anual, impacto_base, evidencia)\nvalues\n  ('aaaaaaaa-4444-0000-0000-000000000001', 'aaaaaaaa-0000-0000-0000-000000000001',\n   'aaaaaaaa-1111-0000-0000-000000000001', 'aaaaaaaa-2222-0000-0000-000000000002',\n   'production', 'critica', 87,\n   'Linea 3 - rendimiento -14%', 'El rendimiento cayo del 88% al 74%', 462956,\n   '{\"uds_semana\": 1240, \"margen_unitario\": 7.18, \"formula\": \"uds * margen * 52\"}',\n   '[\"signal:L3.P4.contador\", \"event:2026-09-02..2026-09-09\"]'),\n  ('bbbbbbbb-4444-0000-0000-000000000002', 'bbbbbbbb-0000-0000-0000-000000000002',\n   'bbbbbbbb-1111-0000-0000-000000000002', 'bbbbbbbb-2222-0000-0000-000000000002',\n   'energy', 'alta', 71,\n   'SECRETO INDUSTRIAL DE BETA', 'Esto no lo puede ver ALFA jamas', 16055,\n   '{\"kw\": 38, \"horas\": 62}', '[\"signal:L1.kw\"]')\non conflict do nothing;\n\ncommit;\n","bytes":3674,"lineas":69,"lenguaje":"sql","para":"Planta dos empresas rivales, para después comprobar que no se ven.","chip":null,"chipTono":null,"estado":null},"src/api/contexto.ts":{"texto":"// ---------------------------------------------------------------------------\n// Autenticacion, inquilino y permisos.\n//\n// El token se firma con HMAC del propio Node: una dependencia menos que\n// auditar, y lo que necesitamos —firmar un identificador y una caducidad— no\n// justifica una libreria de JWT completa.\n// ---------------------------------------------------------------------------\nimport { createHmac, timingSafeEqual, randomUUID } from 'node:crypto';\nimport { env } from '../config.ts';\nimport { conInquilino } from '../db.ts';\n\nexport type Rol =\n  | 'company_admin' | 'plant_manager' | 'maintenance'\n  | 'production' | 'quality' | 'energy' | 'viewer';\n\nexport interface Sesion {\n  userId: string;\n  tenantId: string;\n  rol: Rol;\n  sites: string[];        // vacio = todas las plantas de la empresa\n  superadmin: boolean;\n}\n\n// ---------------------------------------------------------------------------\n// Permisos por rol.\n//\n// El rol se aplica TAMBIEN a las consultas del Copilot: un operario no puede\n// preguntarle a la IA algo que no veria en pantalla. La IA no es una puerta\n// trasera a los permisos.\n// ---------------------------------------------------------------------------\nconst PERMISOS: Record\u003cRol, string[]> = {\n  company_admin: ['*'],\n  plant_manager: [\n    'planta.ver', 'produccion.ver', 'mantenimiento.ver', 'energia.ver',\n    'calidad.ver', 'proveedores.ver', 'alerta.ver', 'alerta.cerrar',\n    'coste.ver', 'orden.crear', 'copilot.usar', 'informe.ver',\n  ],\n  production: ['planta.ver', 'produccion.ver', 'alerta.ver', 'alerta.cerrar',\n               'orden.crear', 'copilot.usar'],\n  maintenance: ['planta.ver', 'mantenimiento.ver', 'produccion.ver', 'alerta.ver',\n                'alerta.cerrar', 'orden.crear', 'orden.cerrar', 'copilot.usar',\n                'conocimiento.usar'],\n  quality:     ['planta.ver', 'calidad.ver', 'proveedores.ver', 'alerta.ver',\n                'alerta.cerrar', 'copilot.usar'],\n  energy:      ['planta.ver', 'energia.ver', 'coste.ver', 'alerta.ver', 'copilot.usar'],\n  viewer:      ['planta.ver', 'produccion.ver', 'alerta.ver'],\n};\n\n// Permisos que NUNCA se conceden por rol, solo uno a uno y con rastro. La\n// reidentificacion de un operario cruza productividad con una persona concreta\n// y es tratamiento de datos personales en contexto laboral.\nexport const PERMISOS_NOMINALES = ['operario.reidentificar'];\n\nexport function puede(s: Sesion, permiso: string): boolean {\n  if (s.superadmin) return true;\n  if (PERMISOS_NOMINALES.includes(permiso)) return false;\n  const p = PERMISOS[s.rol] ?? [];\n  return p.includes('*') || p.includes(permiso);\n}\n\n/** Una sesion solo alcanza las plantas de su membresia. Vacio = todas. */\nexport function alcanzaSite(s: Sesion, siteId: string): boolean {\n  return s.superadmin || s.sites.length === 0 || s.sites.includes(siteId);\n}\n\n/**\n * Resuelve una planta o devuelve null. Es la comprobacion que hay que hacer en\n * TODA ruta con :siteId, y `alcanzaSite()` sola no basta.\n *\n * El fallo que la trajo: con `sites: []` —el caso normal, \"todas las plantas de\n * mi empresa\"— `alcanzaSite()` decia que si a cualquier UUID. Las consultas\n * posteriores no filtraban nada porque la RLS ya devolvia cero filas, asi que\n * no habia fuga de datos... pero el endpoint contestaba 200 con todo a null\n * para la planta de otra empresa. Dos cosas mal a la vez: se distingue \"no\n * existe\" de \"no es tuya\" por el codigo de respuesta, y un 200 vacio se\n * confunde con \"esta planta no ha producido hoy\".\n *\n * Se consulta DENTRO del inquilino, asi que la RLS hace el trabajo: si la\n * planta es de otra empresa, aqui no llega.\n */\nexport async function resolverSite(\n  db: { query\u003cT = any>(t: string, v?: unknown[]): Promise\u003c{ rows: T[] }> },\n  s: Sesion,\n  siteId: string,\n): Promise\u003c{ id: string; nombre: string; huso: string; precio_kwh: number | null } | null> {\n  if (!alcanzaSite(s, siteId)) return null;\n  if (!/^[0-9a-f-]{36}$/i.test(siteId)) return null;   // un uuid mal formado no es un 500\n  const { rows } = await db.query(\n    `select id, nombre, huso, precio_kwh from site where id = $1`, [siteId]);\n  return rows[0] ?? null;\n}\n\n// --- token -----------------------------------------------------------------\n\nfunction firmar(payload: string): string {\n  return createHmac('sha256', env.jwtSecreto).update(payload).digest('base64url');\n}\n\nexport function emitirToken(s: Sesion, horas = 12): string {\n  if (!env.jwtSecreto) throw new Error('Falta JWT_SECRETO');\n  const cuerpo = Buffer.from(JSON.stringify({\n    ...s, exp: Date.now() + horas * 3600_000, jti: randomUUID(),\n  })).toString('base64url');\n  return `${cuerpo}.${firmar(cuerpo)}`;\n}\n\nexport function leerToken(token: string): Sesion | null {\n  const [cuerpo, firma] = token.split('.');\n  if (!cuerpo || !firma) return null;\n\n  // Comparacion en tiempo constante: comparar firmas con === filtra el secreto\n  // byte a byte a quien mida los tiempos de respuesta.\n  const esperada = Buffer.from(firmar(cuerpo));\n  const recibida = Buffer.from(firma);\n  if (esperada.length !== recibida.length) return null;\n  if (!timingSafeEqual(esperada, recibida)) return null;\n\n  try {\n    const d = JSON.parse(Buffer.from(cuerpo, 'base64url').toString());\n    if (typeof d.exp !== 'number' || d.exp \u003c Date.now()) return null;\n    return { userId: d.userId, tenantId: d.tenantId, rol: d.rol,\n             sites: d.sites ?? [], superadmin: !!d.superadmin };\n  } catch { return null; }\n}\n\n// --- auditoria -------------------------------------------------------------\n\nexport async function auditar(\n  s: Sesion, accion: string,\n  extra: { objeto?: string; objetoId?: string; detalle?: unknown; ip?: string } = {},\n): Promise\u003cvoid> {\n  await conInquilino(s.tenantId, (db) =>\n    db.query(\n      `insert into audit_log (tenant_id, user_id, accion, objeto, objeto_id, detalle, ip)\n       values ($1, $2, $3, $4, $5, $6, $7)`,\n      [s.tenantId, s.userId, accion, extra.objeto ?? null,\n       extra.objetoId ?? null, JSON.stringify(extra.detalle ?? {}), extra.ip ?? null],\n    ));\n}\n","bytes":6045,"lineas":140,"lenguaje":"typescript","para":"Sesión, permisos por rol, auditoría y resolverSite() — el arreglo de la decisión 29.","chip":null,"chipTono":null,"estado":null},"src/api/rutas/activos.ts":{"texto":"import type { FastifyInstance } from 'fastify';\nimport { conInquilino } from '../../db.ts';\nimport { puede, alcanzaSite, resolverSite } from '../contexto.ts';\n\nexport default async function (app: FastifyInstance) {\n  // El arbol de planta entero. Se devuelve plano con `ruta`, y lo monta el\n  // panel: mandar un arbol anidado por JSON obliga a rehacer la peticion cada\n  // vez que cambia un filtro.\n  app.get('/plantas/:siteId/activos', async (req: any, res) => {\n    const { sesion } = req;\n    if (!puede(sesion, 'planta.ver')) return res.code(403).send({ error: 'Sin permiso.' });\n\n    return conInquilino(sesion.tenantId, async (db) => {\n      if (!(await resolverSite(db, sesion, req.params.siteId))) {\n        return res.code(404).send({ error: 'No encontrada.' });\n      }\n      const { rows } = await db.query(\n        `select id, parent_id, ruta, tipo, codigo, nombre, fabricante, modelo,\n                criticidad, activo\n           from asset_node\n          where site_id = $1 and activo\n          order by array_length(ruta, 1) nulls first, codigo`, [req.params.siteId]);\n      return { activos: rows };\n    });\n  });\n\n  // Ficha de activo: el hub de una maquina.\n  app.get('/activos/:id', async (req: any, res) => {\n    const { sesion } = req;\n    if (!puede(sesion, 'planta.ver')) return res.code(403).send({ error: 'Sin permiso.' });\n\n    return conInquilino(sesion.tenantId, async (db) => {\n      const { rows: [n] } = await db.query(\n        `select * from asset_node where id = $1`, [req.params.id]);\n      if (!n || !alcanzaSite(sesion, n.site_id)) {\n        return res.code(404).send({ error: 'No encontrado.' });\n      }\n\n      // La puntuacion viaja SIEMPRE con sus componentes abiertos y con los\n      // pesos con que se calculo. El panel enseña un \"¿como?\" al lado y tiene\n      // que poder rellenarlo sin recalcular (decision 11).\n      const { rows: [score] } = await db.query(\n        `select score, c_fiabilidad, c_comportamiento, c_mantenimiento,\n                c_criticidad, mtbf_h, mttr_h, pesos, entradas, fecha\n           from asset_score where asset_node_id = $1\n          order by fecha desc limit 1`, [req.params.id]);\n\n      const { rows: [hace30] } = await db.query(\n        `select score from asset_score\n          where asset_node_id = $1 and fecha \u003c= current_date - 30\n          order by fecha desc limit 1`, [req.params.id]);\n\n      const { rows: senales } = await db.query(\n        `select id, codigo, nombre, clase, unidad, cadencia_s\n           from signal where asset_node_id = $1 and activo order by codigo`,\n        [req.params.id]);\n\n      const { rows: alertas } = await db.query(\n        `select id, severidad, titulo, impacto_eur_anual, detectado_en\n           from alert where asset_node_id = $1 and estado = 'abierta'\n          order by detectado_en desc limit 10`, [req.params.id]);\n\n      return {\n        activo: n,\n        salud: score ? {\n          ...score,\n          delta30: hace30 ? score.score - hace30.score : null,\n        } : null,\n        senales,\n        alertas,\n        // Sin senales no hay dato, y decirlo aqui evita que el panel pinte una\n        // grafica vacia que el usuario interpreta como \"la maquina esta parada\".\n        sinDato: senales.length === 0,\n      };\n    });\n  });\n\n  // El dato crudo, para poder abrir cualquier cifra hasta el fondo. Pasa por\n  // fr_measurements(), que aplica el filtro de inquilino por su cuenta porque\n  // `measurement` no lleva RLS (ver db/05-series.sql).\n  app.get('/senales/:id/muestras', async (req: any, res) => {\n    const { sesion } = req;\n    if (!puede(sesion, 'planta.ver')) return res.code(403).send({ error: 'Sin permiso.' });\n    const { desde, hasta } = req.query;\n    if (!desde || !hasta) return res.code(400).send({ error: 'Faltan desde y hasta.' });\n\n    return conInquilino(sesion.tenantId, async (db) => {\n      const { rows } = await db.query(\n        `select ts, value, quality from fr_measurements($1, $2, $3)`,\n        [req.params.id, desde, hasta]);\n      // Un hueco es un hueco: se devuelve tal cual, sin interpolar. El panel lo\n      // pinta como franja gris. Unir la linea por encima de un vacio es\n      // inventarse un dato, y un dato inventado en industria es un diagnostico\n      // equivocado (decision 14).\n      return { muestras: rows, huecos: true };\n    });\n  });\n}\n","bytes":4329,"lineas":99,"lenguaje":"typescript","para":"El árbol de planta, la ficha de máquina y el acceso controlado al dato crudo.","chip":null,"chipTono":null,"estado":null},"src/api/rutas/alertas.ts":{"texto":"import type { FastifyInstance } from 'fastify';\nimport { conInquilino } from '../../db.ts';\nimport { puede, alcanzaSite, auditar } from '../contexto.ts';\n\nexport default async function (app: FastifyInstance) {\n  app.get('/alertas', async (req: any, res) => {\n    const { sesion } = req;\n    if (!puede(sesion, 'alerta.ver')) return res.code(403).send({ error: 'Sin permiso.' });\n    const { siteId, estado = 'abierta', modulo, limite = 50 } = req.query;\n\n    return conInquilino(sesion.tenantId, async (db) => {\n      const { rows } = await db.query(\n        `select a.id, a.site_id, a.modulo, a.severidad, a.confianza, a.titulo,\n                a.que_cambio, a.por_que, a.impacto_eur_anual, a.accion_recomendada,\n                a.estado, a.detectado_en, an.codigo as nodo_codigo, an.nombre as nodo_nombre\n           from alert a\n           left join asset_node an on an.id = a.asset_node_id\n          where a.estado = $1\n            and ($2::uuid is null or a.site_id = $2)\n            and ($3::text is null or a.modulo = $3)\n            -- El alcance por planta se aplica tambien en SQL, no solo en el\n            -- codigo: es la unica forma de que un filtro olvidado en una ruta\n            -- nueva no acabe enseñando la planta que no toca.\n            and ($4::uuid[] = '{}' or a.site_id = any($4))\n          order by case a.severidad when 'critica' then 1 when 'alta' then 2\n                                    when 'media' then 3 else 4 end,\n                   a.impacto_eur_anual desc nulls last, a.detectado_en desc\n          limit $5`,\n        [estado, siteId ?? null, modulo ?? null, sesion.sites, Math.min(Number(limite), 200)]);\n      return { alertas: rows };\n    });\n  });\n\n  // Ficha completa. Es la pantalla que demuestra que no somos un cuadro de\n  // mando, asi que la cuenta abierta y las fuentes viajan SIEMPRE.\n  app.get('/alertas/:id', async (req: any, res) => {\n    const { sesion } = req;\n    if (!puede(sesion, 'alerta.ver')) return res.code(403).send({ error: 'Sin permiso.' });\n\n    return conInquilino(sesion.tenantId, async (db) => {\n      const { rows: [a] } = await db.query(\n        `select a.*, an.codigo as nodo_codigo, an.nombre as nodo_nombre\n           from alert a left join asset_node an on an.id = a.asset_node_id\n          where a.id = $1`, [req.params.id]);\n\n      // Ni existe ni es de otro inquilino: la respuesta es la misma. La RLS ya\n      // ha filtrado; aqui solo se evita distinguir los dos casos.\n      if (!a || !alcanzaSite(sesion, a.site_id)) {\n        return res.code(404).send({ error: 'No encontrada.' });\n      }\n\n      const { rows: recomendaciones } = await db.query(\n        `select id, texto, ahorro_eur, coste_eur, esfuerzo, aceptada\n           from recommendation where alert_id = $1`, [a.id]);\n\n      // El diagnostico se genero una vez, al crear la alerta. No se vuelve a\n      // pedir al LLM cada vez que alguien abre la ficha: eso multiplicaria el\n      // coste de IA por el numero de curiosos.\n      const { rows: [ia] } = await db.query(
