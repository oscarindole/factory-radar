etter-spacing:.05em; }\n.menu { padding:10px 0; flex:1; overflow-y:auto; }\n.menu a { display:flex; justify-content:space-between; align-items:center; gap:8px;\n  padding:7px 18px; color:var(--texto-2); text-decoration:none; font-size:.83rem;\n  border-left:2px solid transparent; }\n.menu a:hover { color:var(--texto); background:var(--fondo-3); }\n.menu a.on { color:var(--texto); border-left-color:var(--alta); background:var(--fondo-3);\n             font-weight:600; }\n.menu a .n { font-family:var(--m); font-size:.62rem; padding:1px 5px; border-radius:8px;\n             background:var(--critica); color:#fff; }\n.menu .sep { font-family:var(--m); font-size:.56rem; letter-spacing:.14em;\n  text-transform:uppercase; color:var(--texto-3); padding:14px 18px 5px; }\n.pie { border-top:1px solid var(--linea); padding:11px 18px; display:flex;\n       justify-content:space-between; align-items:center; }\n.pie button { background:none; border:1px solid var(--linea); color:var(--texto-2);\n  font-family:var(--m); font-size:.62rem; padding:4px 8px; border-radius:var(--r);\n  cursor:pointer; }\n.pie button:hover { color:var(--texto); border-color:var(--texto-3); }\n\nmain { padding:22px clamp(18px,3vw,34px) 80px; min-width:0; }\n.cab { display:flex; justify-content:space-between; align-items:flex-end; gap:16px;\n       flex-wrap:wrap; margin-bottom:20px; }\nh1 { font-size:1.42rem; font-weight:700; letter-spacing:-.02em; margin:0; }\nh2 { font-size:.96rem; font-weight:700; margin:30px 0 10px; letter-spacing:-.01em; }\nh2:first-child { margin-top:0; }\n.sub { font-family:var(--m); font-size:.66rem; color:var(--texto-3); letter-spacing:.06em; }\n\n/* --- cifras --------------------------------------------------------------- */\n.kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(132px,1fr));\n        gap:1px; background:var(--linea); border:1px solid var(--linea); }\n.kpi { background:var(--fondo-2); padding:13px 15px 12px; }\n.kpi .k { font-family:var(--m); font-size:.57rem; letter-spacing:.11em;\n          text-transform:uppercase; color:var(--texto-3); margin-bottom:8px; }\n.kpi .v { font-size:1.8rem; font-weight:700; letter-spacing:-.035em; line-height:1;\n          color:var(--dato); }\n.kpi .v small { font-size:.95rem; font-weight:600; }\n.kpi .d { font-family:var(--m); font-size:.64rem; margin-top:6px; color:var(--texto-2); }\n.kpi .d.bien { color:var(--bien); } .kpi .d.mal { color:var(--critica); }\n.kpi .d.ojo { color:var(--alta); }\n.kpi .vacio { color:var(--texto-3); font-size:1.4rem; }\n\n/* --- alertas -------------------------------------------------------------- */\n.lista { border:1px solid var(--linea); background:var(--fondo-2); }\n.fila { display:grid; grid-template-columns:3px 74px minmax(0,1fr) auto;\n  gap:0 14px; align-items:start; padding:13px 15px 13px 0; width:100%;\n  text-align:left; background:none; border:0; border-top:1px solid var(--linea);\n  cursor:pointer; color:inherit; font-family:inherit; }\n.fila:first-child { border-top:0; }\n.fila:hover { background:var(--fondo-3); }\n.fila .st { align-self:stretch; border-radius:0 2px 2px 0; }\n.fila.critica .st{background:var(--critica)} .fila.alta .st{background:var(--alta)}\n.fila.media .st{background:var(--media)} .fila.baja .st{background:var(--baja)}\n.sev { font-family:var(--m); font-size:.57rem; letter-spacing:.1em; text-transform:uppercase;\n       padding-top:3px; display:flex; align-items:center; gap:4px; }\n.fila.critica .sev{color:var(--critica)} .fila.alta .sev{color:var(--alta)}\n.fila.media .sev{color:var(--media)} .fila.baja .sev{color:var(--baja)}\n.fila .t { font-size:.9rem; font-weight:600; letter-spacing:-.005em; }\n.fila .s { font-family:var(--m); font-size:.69rem; color:var(--texto-2); line-height:1.5;\n           margin-top:4px; }\n.fila .eur { font-family:var(--m); font-size:.78rem; font-weight:600; color:var(--alta);\n             white-space:nowrap; text-align:right; padding-top:2px; }\n.fila .eur em { display:block; font-style:normal; font-size:.6rem; color:var(--texto-3);\n                font-weight:400; margin-top:2px; }\n\n/* --- bloques -------------------------------------------------------------- */\n.caja { border:1px solid var(--linea); background:var(--fondo-2); padding:16px 18px;\n        margin:16px 0; }\n.caja h3 { font-family:var(--m); font-size:.6rem; letter-spacing:.13em;\n  text-transform:uppercase; color:var(--texto-3); margin:0 0 9px; font-weight:600; }\n.caja p { margin:0 0 9px; font-size:.9rem; max-width:78ch; }\n.caja p:last-child { margin-bottom:0; }\n.cuenta { font-family:var(--m); font-size:.73rem; line-height:1.85; background:var(--fondo-3);\n  border-left:2px solid var(--alta); padding:11px 14px; overflow-x:auto; color:var(--texto-2); }\n.cuenta b { color:var(--dato); font-weight:600; }\n.cuenta i { color:var(--alta); font-style:normal; font-weight:600; }\n.fuentes { font-family:var(--m); font-size:.65rem; color:var(--texto-3); line-height:1.8;\n  border-top:1px solid var(--linea); margin-top:14px; padding-top:11px; }\n.fuentes em { font-style:normal; color:var(--media); }\n.btns { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }\n.btns button { font-family:var(--m); font-size:.68rem; padding:7px 12px;\n  border:1px solid var(--linea); background:none; color:var(--texto); border-radius:var(--r);\n  cursor:pointer; }\n.btns button.pri { border-color:var(--alta); color:var(--alta); }\n.btns button:hover { background:var(--fondo-3); }\n\n/* --- tablas --------------------------------------------------------------- */\n.tw { overflow-x:auto; border:1px solid var(--linea); margin:14px 0; }\ntable { border-collapse:collapse; width:100%; font-size:.82rem; }\nth,td { text-align:left; padding:8px 13px; border-bottom:1px solid var(--linea); }\nthead th { font-family:var(--m); font-size:.58rem; letter-spacing:.1em; text-transform:uppercase;\n  color:var(--texto-3); background:var(--fondo-3); white-space:nowrap; font-weight:600; }\ntbody tr:last-child td { border-bottom:0; }\ntbody tr { background:var(--fondo-2); }\ntd.n, th.n { text-align:right; font-family:var(--m); white-space:nowrap; }\ntd .barra { display:block; height:5px; background:var(--s1); border-radius:2px; margin-top:4px; }\ntd .barra.aviso { background:var(--alta); }\n\n/* --- salud ---------------------------------------------------------------- */\n.salud { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:6px 12px;\n         align-items:center; font-size:.8rem; }\n.salud .lab { font-family:var(--m); font-size:.63rem; color:var(--texto-2); }\n.salud .bar { height:6px; background:var(--fondo-3); border-radius:3px; overflow:hidden; }\n.salud .bar i { display:block; height:100%; background:var(--s1); border-radius:3px; }\n.salud .val { font-family:var(--m); font-size:.72rem; color:var(--dato); }\n.score { font-size:2.4rem; font-weight:800; letter-spacing:-.04em; line-height:1; }\n.score small { font-size:.9rem; font-weight:600; color:var(--texto-3); }\n\n/* --- graficas ------------------------------------------------------------- */\n.viz { border:1px solid var(--linea); background:var(--fondo-2); padding:14px 16px 10px;\n       margin:14px 0; position:relative; }\n.viz .titulo { font-size:.86rem; font-weight:600; margin-bottom:2px; }\n.viz .nota { font-family:var(--m); font-size:.63rem; color:var(--texto-3); margin-bottom:10px; }\n.viz svg { display:block; width:100%; overflow:visible; }\n.leyenda { display:flex; gap:14px; flex-wrap:wrap; font-family:var(--m); font-size:.65rem;\n           color:var(--texto-2); margin-top:8px; }\n.leyenda span { display:flex; align-items:center; gap:6px; }\n.leyenda i { width:11px; height:3px; border-radius:2px; display:block; }\n.leyenda i.disc { height:0; border-top:2px dashed var(--base-linea); }\n.tip { position:absolute; pointer-events:none; background:var(--fondo-3);\n  border:1px solid var(--linea); border-radius:var(--r); padding:7px 10px;\n  font-family:var(--m); font-size:.66rem; color:var(--texto); white-space:nowrap;\n  box-shadow:0 4px 14px rgba(0,0,0,.35); opacity:0; transition:opacity .1s; z-index:9; }\n.tip b { color:var(--dato); }\n.tip .sw { display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:5px; }\n\n/* --- copilot -------------------------------------------------------------- */\n.chat { max-width:76ch; }\n.pregunta { background:var(--fondo-3); border:1px solid var(--linea); padding:10px 14px;\n  border-radius:var(--r); font-size:.88rem; margin:14px 0 0; }\n.pregunta .q { font-family:var(--m); font-size:.6rem; letter-spacing:.11em;\n  text-transform:uppercase; color:var(--texto-3); margin-bottom:5px; }\n.sugerencias { display:flex; flex-wrap:wrap; gap:8px; margin:14px 0; }\n.sugerencias button { font-size:.78rem; padding:7px 12px; border:1px solid var(--linea);\n  background:var(--fondo-2); color:var(--texto-2); border-radius:14px; cursor:pointer;\n  font-family:inherit; text-align:left; }\n.sugerencias button:hover { color:var(--texto); border-color:var(--texto-3); }\n\n.vacio-est { border:1px dashed var(--linea); padding:22px; text-align:center;\n  color:var(--texto-3); font-size:.85rem; }\n.aviso-dato { border-left:3px solid var(--alta); background:var(--fondo-2);\n  padding:11px 14px; margin:14px 0; font-size:.84rem; }\n.aviso-dato b { display:block; font-family:var(--m); font-size:.58rem; letter-spacing:.12em;\n  text-transform:uppercase; color:var(--alta); margin-bottom:4px; }\n\n@media (max-width:860px) {\n  .app { grid-template-columns:1fr; }\n  .lat { position:static; height:auto; }\n  .menu { display:flex; flex-wrap:wrap; padding:8px; }\n  .menu .sep { display:none; }\n  .menu a { border-left:0; border-bottom:2px solid transparent; padding:6px 11px; }\n  .menu a.on { border-left:0; border-bottom-color:var(--alta); }\n  .fila { grid-template-columns:3px minmax(0,1fr); }\n  .fila .sev { grid-column:2; } .fila .eur { grid-column:2; text-align:left; padding-top:6px; }\n}\n\u003c/style>\n\n\u003cdiv class=\"app\">\n  \u003caside class=\"lat\">\n    \u003cdiv class=\"marca\">\u003cdiv class=\"fila-marca\">\u003csvg class=\"logo\" viewBox=\"0 0 100 100\" role=\"img\" aria-label=\"RADACTORY\">\u003crect width=\"100\" height=\"100\" fill=\"currentColor\"/>\u003cpath fill=\"var(--mark-cut,#FFFFFF)\" d=\"M8 20 H86 V42 H30 V84 H8 Z\"/>\u003cpath fill=\"var(--mark-cut,#FFFFFF)\" d=\"M46 42 H68 L88 84 H64 Z\"/>\u003c/svg>\u003cb>RADACTORY\u003c/b>\u003c/div>\u003cspan id=\"planta-nom\">\u003c/span>\u003c/div>\n    \u003cnav class=\"menu\" id=\"menu\">\u003c/nav>\n    \u003cdiv class=\"pie\">\n      \u003cspan class=\"m\" style=\"font-size:.6rem;color:var(--texto-3)\">DEMO\u003c/span>\n      \u003cbutton id=\"tema\" type=\"button\">tema\u003c/button>\n    \u003c/div>\n  \u003c/aside>\n  \u003cmain id=\"vista\">\u003c/main>\n\u003c/div>\n\n\u003cscript>/*__DATOS__*/\u003c/script>\n\u003cscript>\n(function () {\n  \"use strict\";\n  const D = window.__DEMO__;\n  const vista = document.getElementById('vista');\n  const menuEl = document.getElementById('menu');\n\n  // --- formato -------------------------------------------------------------\n  const nf = (n, d = 0) => n === null || n === undefined || Number.isNaN(+n)\n    ? '—' : (+n).toLocaleString('es-ES', { minimumFractionDigits: d, maximumFractionDigits: d });\n  const pct = (n, d = 1) => n === null || n === undefined ? '—' : nf(+n * 100, d) + '%';\n  const eur = (n, d = 0) => n === null || n === undefined ? null : nf(n, d) + ' €';\n  const fecha = (s) => new Date(s).toLocaleDateString('es-ES', { day: 'numeric', month: 'short' });\n  const esc = (s) => String(s ?? '').replace(/[&\u003c>\"]/g, (c) =>\n    ({ '&': '&amp;', '\u003c': '&lt;', '>': '&gt;', '\"': '&quot;' }[c]));\n\n  const SEVS = { critica: 'Crítica', alta: 'Alta', media: 'Media', baja: 'Baja' };\n  const ICONO = { critica: '■', alta: '▲', media: '●', baja: '–' };\n  const COLOR_LINEA = { L1: 'var(--s1)', L2: 'var(--s2)', L3: 'var(--s3)' };\n\n  // -------------------------------------------------------------------------\n  // GRAFICA DE LINEAS\n  //\n  // Reglas que se aplican aqui y no se negocian:\n  //  · el hueco se dibuja COMO HUECO. Si faltan dias (domingos, paradas), la\n  //    linea se parte. Unirla por encima de un vacio es inventarse un dato.\n  //  · la linea base siempre presente y discontinua.\n  //  · maximo cuatro series, con etiqueta directa ademas de leyenda: el color\n  //    nunca es el unico portador de identidad.\n  // -------------------------------------------------------------------------\n  function grafLineas(cfg) {\n    const W = 760, H = cfg.alto || 210, P = { t: 14, r: 54, b: 26, l: 40 };\n    const todos = cfg.series.flatMap((s) => s.puntos.map((p) => p.y)).filter((v) => v != null);\n    if (!todos.length) return `\u003cdiv class=\"vacio-est\">Sin datos para este periodo.\u003c/div>`;\n\n    let min = Math.min(...todos), max = Math.max(...todos);\n    if (cfg.base != null) { min = Math.min(min, cfg.base); max = Math.max(max, cfg.base); }\n    const pad = (max - min) * 0.18 || 0.05;\n    min = cfg.desdeCero ? 0 : min - pad; max = max + pad;\n\n    const xs = cfg.series[0].puntos.map((p) => p.x);\n    const X = (i) => P.l + (i / Math.max(1, xs.length - 1)) * (W - P.l - P.r);\n    const Y = (v) => P.t + (1 - (v - min) / (max - min || 1)) * (H - P.t - P.b);\n\n    let svg = `\u003csvg viewBox=\"0 0 ${W} ${H}\" role=\"img\" aria-label=\"${esc(cfg.alt || cfg.titulo)}\">`;\n    // rejilla recesiva\n    for (let k = 0; k \u003c= 3; k++) {\n      const v = min + (k / 3) * (max - min), y = Y(v);\n      svg += `\u003cline x1=\"${P.l}\" y1=\"${y}\" x2=\"${W - P.r}\" y2=\"${y}\" style=\"stroke:var(--linea)\" stroke-width=\"1\"/>`;\n      svg += `\u003ctext x=\"${P.l - 7}\" y=\"${y + 3.5}\" text-anchor=\"end\" font-size=\"9\"\n               style=\"font-family:var(--m);fill:var(--texto-3)\">${cfg.fmtY ? cfg.fmtY(v) : nf(v, 0)}\u003c/text>`;\n    }\n    if (cfg.base != null) {\n      svg += `\u003cline x1=\"${P.l}\" y1=\"${Y(cfg.base)}\" x2=\"${W - P.r}\" y2=\"${Y(cfg.base)}\"\n               style=\"stroke:var(--base-linea)\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\"/>\n              \u003ctext x=\"${W - P.r + 5}\" y=\"${Y(cfg.base) + 3}\" font-size=\"9\"\n               style=\"font-family:var(--m);fill:var(--base-linea)\">base\u003c/text>`;\n    }\n    if (cfg.marca != null) {\n      const mx = X(cfg.marca.i);\n      svg += `\u003cline x1=\"${mx}\" y1=\"${P.t - 6}\" x2=\"${mx}\" y2=\"${H - P.b}\" style=\"stroke:var(--alta)\"\n               stroke-width=\"1\" stroke-dasharray=\"2 3\"/>\n              \u003ctext x=\"${mx + 4}\" y=\"${P.t - 1}\" font-size=\"9\"\n               style=\"font-family:var(--m);fill:var(--alta)\">${esc(cfg.marca.texto)}\u003c/text>`;\n    }\n\n    cfg.series.forEach((s) => {\n      let d = '', abierto = false;\n      s.puntos.forEach((p, i) => {\n        if (p.y == null) { abierto = false; return; }   // hueco: se corta el trazo\n        d += (abierto ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.y).toFixed(1) + ' ';\n        abierto = true;\n      });\n      svg += `\u003cpath d=\"${d}\" fill=\"none\" style=\"stroke:${s.color}\" stroke-width=\"2\"\n               stroke-linejoin=\"round\" stroke-linecap=\"round\"/>`;\n      // etiqueta directa al final: identidad sin depender del color\n      const ult = [...s.puntos].reverse().find((p) => p.y != null);\n      if (ult) {\n        const i = s.puntos.lastIndexOf(ult);\n        svg += `\u003ccircle cx=\"${X(i)}\" cy=\"${Y(ult.y)}\" r=\"3.5\"\n                 style=\"fill:${s.color};stroke:var(--fondo-2)\" stroke-width=\"2\"/>\n                \u003ctext x=\"${X(i) + 7}\" y=\"${Y(ult.y) + 3.5}\" font-size=\"10\" font-weight=\"600\"\n                 style=\"font-family:var(--m);fill:${s.color}\">${esc(s.nombre)}\u003c/text>`;\n      }\n    });\n\n    // eje X: solo tres marcas, para no saturar\n    [0, Math.floor(xs.length / 2), xs.length - 1].forEach((i) => {\n      if (i \u003c 0 || i >= xs.length) return;\n      svg += `\u003ctext x=\"${X(i)}\" y=\"${H - 8}\" text-anchor=\"middle\" font-size=\"9\"\n               style=\"font-family:var(--m);fill:var(--texto-3)\">${esc(xs[i])}\u003c/text>`;\n    });\n    svg += `\u003cline class=\"cruz\" x1=\"0\" y1=\"${P.t}\" x2=\"0\" y2=\"${H - P.b}\" style=\"stroke:var(--texto-3)\"\n             stroke-width=\"1\" opacity=\"0\"/>`;\n    svg += `\u003crect class=\"captura\" x=\"${P.l}\" y=\"0\" width=\"${W - P.l - P.r}\" height=\"${H}\" fill=\"transparent\"/>`;\n    svg += '\u003c/svg>';\n\n    return { svg, X, Y, xs, P, W, H };\n  }\n\n  function pintarLineas(cont, cfg) {\n    const g = grafLineas(cfg);\n    if (typeof g === 'string') { cont.innerHTML = g; return; }\n    cont.innerHTML = g.svg + `\u003cdiv class=\"leyenda\">` +\n      cfg.series.map((s) => `\u003cspan>\u003ci style=\"background:${s.color}\">\u003c/i>${esc(s.nombre)}\u003c/span>`).join('') +\n      (cfg.base != null ? `\u003cspan>\u003ci class=\"disc\">\u003c/i>línea base\u003c/span>` : '') +\n      `\u003c/div>\u003cdiv class=\"tip\">\u003c/div>`;\n\n    // Capa de interaccion: cruz + tooltip. Una grafica HTML sin hover deja al\n    // usuario adivinando el valor exacto, que es justo lo que no queremos.\n    const svg = cont.querySelector('svg');\n    const cruz = svg.querySelector('.cruz');\n    const cap = svg.querySelector('.captura');\n    const tip = cont.querySelector('.tip');\n\n    cap.addEventListener('mousemove', (e) => {\n      const caja = svg.getBoundingClientRect();\n      const rel = ((e.clientX - caja.left) / caja.width) * g.W;\n      let i = Math.round(((rel - g.P.l) / (g.W - g.P.l - g.P.r)) * (g.xs.length - 1));\n      i = Math.max(0, Math.min(g.xs.length - 1, i));\n      cruz.setAttribute('x1', g.X(i)); cruz.setAttribute('x2', g.X(i));\n      cruz.setAttribute('opacity', '.55');\n      tip.innerHTML = `\u003cb>${esc(g.xs[i])}\u003c/b>\u003cbr>` + cfg.series.map((s) => {\n        const p = s.puntos[i];\n        return `\u003cspan class=\"sw\" style=\"background:${s.color}\">\u003c/span>${esc(s.nombre)} ` +\n               (p && p.y != null ? `\u003cb>${cfg.fmtTip ? cfg.fmtTip(p.y) : nf(p.y, 2)}\u003c/b>`\n                                 : '\u003cspan style=\"color:var(--texto-3)\">sin dato\u003c/span>');\n      }).join('\u003cbr>');\n      tip.style.opacity = '1';\n      const px = (g.X(i) / g.W) * caja.width;\n      tip.style.left = Math.min(caja.width - 170, Math.max(0, px + 12)) + 'px';\n      tip.style.top = '22px';\n    });\n    cap.addEventListener('mouseleave', () => {\n      cruz.setAttribute('opacity', '0'); tip.style.opacity = '0';\n    });\n  }\n\n  // --- barras horizontales (magnitud, categorias con nombre largo) ----------\n  function barras(filas, opts = {}) {\n    const max = Math.max(...filas.map((f) => f.valor), 1);\n    return `\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\n      \u003cth>${esc(opts.col || 'Concepto')}\u003c/th>\u003cth class=\"n\">${esc(opts.unidad || '')}\u003c/th>\n      \u003c/tr>\u003c/thead>\u003ctbody>` + filas.map((f) => `\n      \u003ctr>\u003ctd>${esc(f.etiqueta)}${f.nota ? ` \u003cspan class=\"m\" style=\"font-size:.62rem;color:var(--texto-3)\">${esc(f.nota)}\u003c/span>` : ''}\n        \u003cspan class=\"barra${f.destacar ? ' aviso' : ''}\" style=\"width:${(f.valor / max) * 100}%\">\u003c/span>\u003c/td>\n        \u003ctd class=\"n\">${esc(f.texto ?? nf(f.valor, 1))}\u003c/td>\u003c/tr>`).join('') +\n      `\u003c/tbody>\u003c/table>\u003c/div>`;\n  }\n\n  // -------------------------------------------------------------------------\n  // PANTALLAS\n  // -------------------------------------------------------------------------\n  const P = {};\n\n  P.estado = () => {\n    const I = D.indicadores;\n    const rechazo = I.uds_nok / (I.uds_ok + I.uds_nok);\n    const impacto = D.alertas.reduce((a, x) =>\n      a + (x.impacto_eur_anual ? x.impacto_eur_anual / 12 : 0)\n        + (+(x.impacto_base?.coste_incurrido_eur) || 0), 0);\n    const criticas = D.activos.filter((a) => a.score != null && a.score \u003c 55).length;\n    const top = D.alertas.slice(0, 5);\n\n    return `\n      \u003cdiv class=\"cab\">\n        \u003cdiv>\u003ch1>Estado de planta\u003c/h1>\n          \u003cdiv class=\"sub\">${esc(D.planta.nombre)} · miércoles 9 de septiembre · 07:41 · turno de mañana\u003c/div>\u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"kpis\">\n        ${kpi('Producción 7 d', nf(I.uds_ok, 0), '', 'uds conformes')}\n        ${kpi('OEE', pct(I.oee, 0), delta(I.oee, I.oee_prev, true, 'pts', 100), 'ponderado por tiempo')}\n        ${kpi('Calidad', pct(I.cal, 1), delta(I.cal, I.cal_prev, true, 'pts', 100), '')}\n        ${kpi('Rechazos', pct(rechazo, 1), delta(rechazo, I.rechazo_prev, false, 'pts', 100), '')}\n        ${kpi('Energía / ud', nf(I.kwh_ud, 3), delta(I.kwh_ud, I.kwh_ud_prev, false, '%', null, true), 'kWh por unidad')}\n        ${kpi('Activos en riesgo', criticas, '', 'salud \u003c 55')}\n      \u003c/div>\n\n      \u003ch2>Atención hoy \u003cspan class=\"sub\" style=\"font-weight:400\">\n        ${top.length} de ${D.alertas.length} · \u003ca href=\"#/alertas\" style=\"color:var(--media)\">ver todas\u003c/a>\u003c/span>\u003c/h2>\n      \u003cdiv class=\"lista\">${top.map(filaAlerta).join('')}\u003c/div>\n\n      \u003cdiv class=\"kpis\" style=\"margin-top:16px\">\n        \u003cdiv class=\"kpi\" style=\"grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:10px\">\n          \u003cdiv>\u003cdiv class=\"k\">Impacto detectado este mes\u003c/div>\n            \u003cdiv class=\"v\" style=\"color:var(--alta)\">${eur(impacto)}\u003c/div>\u003c/div>\n          \u003cdiv class=\"d\">suma de las pérdidas anuales prorrateadas más el coste ya incurrido.\n            Cada cifra abre su cuenta.\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"aviso-dato\">\n        \u003cb>Calidad del dato\u003c/b>\n        El \u003cstrong>${nf(I.pct_sin_causa, 1)}%\u003c/strong> de las paradas no tiene causa registrada.\n        Sin causa podemos medir cuánto se pierde, pero no diagnosticar por qué.\n        Es el primer trabajo del piloto, y se dice aquí en vez de disimularlo.\n      \u003c/div>`;\n  };\n\n  const kpi = (k, v, d, pie) => `\u003cdiv class=\"kpi\">\u003cdiv class=\"k\">${esc(k)}\u003c/div>\n    \u003cdiv class=\"v\">${v}\u003c/div>\u003cdiv class=\"d ${d ? d.clase : ''}\">${d ? d.txt : esc(pie)}\u003c/div>\u003c/div>`;\n\n  function delta(act, prev, subirBien, unidad, escala, relativo) {\n    if (act == null || prev == null) return { txt: '—', clase: '' };\n    const dif = relativo ? ((act - prev) / prev) * 100 : (act - prev) * (escala || 1);\n    if (Math.abs(dif) \u003c 0.05) return { txt: 'sin cambio', clase: '' };\n    const bien = (dif > 0) === subirBien;\n    return { txt: `${dif > 0 ? '▲' : '▼'} ${nf(Math.abs(dif), 1)} ${unidad} vs 30 d`,\n             clase: bien ? 'bien' : 'mal' };\n  }\n\n  function filaAlerta(a) {\n    const imp = a.impacto_eur_anual != null\n      ? `${eur(a.impacto_eur_anual)}\u003cem>al año\u003c/em>`\n      : (a.impacto_base?.coste_incurrido_eur != null\n          ? `${eur(a.impacto_base.coste_incurrido_eur)}\u003cem>ya incurridos\u003c/em>` : '—');\n    return `\u003cbutton class=\"fila ${a.severidad}\" onclick=\"location.hash='#/alerta/${a.id}'\">\n      \u003cspan class=\"st\">\u003c/span>\n      \u003cspan class=\"sev\">${ICONO[a.severidad]} ${SEVS[a.severidad]}\u003c/span>\n      \u003cspan>\u003cspan class=\"t\">${esc(a.titulo)}\u003c/span>\n        \u003cspan class=\"s\">${esc(a.por_que || a.que_cambio)}\u003c/span>\u003c/span>\n      \u003cspan class=\"eur\">${imp}\u003c/span>\u003c/button>`;\n  }\n\n  P.alertas = () => `\n    \u003cdiv class=\"cab\">\u003cdiv>\u003ch1>Alertas\u003c/h1>\n      \u003cdiv class=\"sub\">${D.alertas.length} abiertas · ordenadas por severidad e impacto\u003c/div>\u003c/div>\u003c/div>\n    \u003cdiv class=\"lista\">${D.alertas.map(filaAlerta).join('')}\u003c/div>\n    \u003cdiv class=\"caja\">\u003ch3>Por qué solo hay una crítica\u003c/h3>\n      \u003cp>El motor no puede emitir más de cinco críticas por planta y semana. Si genera más,\n      el problema es de calibración y se avisa en el panel interno, en vez de inundar la\n      bandeja. Una bandeja con cuarenta críticas es una bandeja cerrada.\u003c/p>\u003c/div>`;\n\n  P.alerta = (id) => {\n    const a = D.alertas.find((x) => x.id === id);\n    if (!a) return `\u003cdiv class=\"vacio-est\">Esa alerta no existe.\u003c/div>`;\n    const cuenta = a.impacto_base || {};\n    const ETQ = {\n      formula: 'Fórmula', nota: 'Nota', eur_semana: 'Pérdida por semana (€)',\n      turnos_afectados: 'Turnos afectados', detalle: null,\n      kw: 'Potencia media (kW)', horas_semana: 'Horas por semana',\n      semanas_anio: 'Semanas productivas al año', kwh_anio: 'kWh al año',\n      precio_kwh: 'Precio del kWh (contrato de la planta)',\n      coste_incurrido_eur: 'Coste ya incurrido (€)', uds_rechazadas: 'Unidades rechazadas',\n      pct_sobre_producto: '% sobre los rechazos del producto',\n      lotes_en_ventana: 'Lotes distintos en la ventana', dias_ventana: 'Días de la ventana',\n    };\n    const filas = Object.entries(cuenta)\n      .filter(([k]) => k !== 'detalle')\n      .map(([k, v]) => `${ETQ[k] || k} \u003cb>${esc(typeof v === 'number' ? nf(v, 2) : v)}\u003c/b>`);\n\n    const det = Array.isArray(cuenta.detalle) ? cuenta.detalle : [];\n\n    return `\n      \u003cdiv class=\"cab\">\u003cdiv>\n        \u003cdiv class=\"sub\">\u003ca href=\"#/alertas\" style=\"color:var(--media)\">← Alertas\u003c/a>\u003c/div>\n        \u003ch1>${esc(a.titulo)}\u003c/h1>\n        \u003cdiv class=\"sub\">${ICONO[a.severidad]} ${SEVS[a.severidad]} · confianza ${a.confianza}%\n          · detectado el ${fecha(a.detectado_en)} · módulo ${esc(a.modulo)}\u003c/div>\n      \u003c/div>\u003c/div>\n\n      \u003cdiv class=\"caja\">\u003ch3>Qué ha cambiado\u003c/h3>\u003cp>${esc(a.que_cambio)}\u003c/p>\u003c/div>\n      ${a.por_que ? `\u003cdiv class=\"caja\">\u003ch3>Por qué · causa probable\u003c/h3>\u003cp>${esc(a.por_que)}\u003c/p>\u003c/div>` : ''}\n      ${a.nodo_codigo === 'L3.P4' ? `\u003cdiv class=\"viz\" id=\"viz-alerta\">\u003c/div>` : ''}\n      ${a.nodo_codigo === 'COMP-02' ? `\u003cdiv class=\"viz\" id=\"viz-alerta\">\u003c/div>` : ''}\n\n      \u003cdiv class=\"caja\">\u003ch3>Cuánto cuesta ${a.impacto_eur_anual != null\n        ? '· ' + eur(a.impacto_eur_anual) + ' al año'\n        : (cuenta.coste_incurrido_eur ? '· ' + eur(cuenta.coste_incurrido_eur) + ' ya incurridos' : '')}\u003c/h3>\n        \u003cdiv class=\"cuenta\">${filas.join('\u003cbr>')}\u003c/div>\n        ${det.length ? `\u003cdiv style=\"margin-top:10px\" class=\"sub\">Desglose por turno\u003c/div>\n          \u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Turno\u003c/th>\u003cth>Producto\u003c/th>\n            \u003cth class=\"n\">Caída\u003c/th>\u003cth class=\"n\">Uds/semana\u003c/th>\u003cth class=\"n\">€/semana\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>${det.map((d) => `\u003ctr>\u003ctd>${esc(d.turno)}\u003c/td>\u003ctd>${esc(d.producto ?? '—')}\u003c/td>\n              \u003ctd class=\"n\">${pct(d.caida_rendimiento, 1)}\u003c/td>\n              \u003ctd class=\"n\">${nf(d.uds_perdidas_semana, 0)}\u003c/td>\n              \u003ctd class=\"n\">${eur(d.uds_perdidas_semana * d.margen_unitario)}\u003c/td>\u003c/tr>`).join('')}\n            \u003c/tbody>\u003c/table>\u003c/div>` : ''}\n      \u003c/div>\n\n      ${a.accion_recomendada ? `\u003cdiv class=\"caja\">\u003ch3>Qué hacer\u003c/h3>\n        \u003cp>${esc(a.accion_recomendada)}\u003c/p>\n        \u003cdiv class=\"btns\">\u003cbutton class=\"pri\" type=\"button\">Crear orden de mantenimiento\u003c/button>\n          \u003cbutton type=\"button\">Avisar a producción\u003c/button>\n          \u003cbutton type=\"button\">Descartar\u003c/button>\u003c/div>\n        \u003cdiv class=\"fuentes\">FUENTES · ${(a.evidencia || []).map((e) =>\n          `\u003cem>${esc(Object.entries(e).map(([k, v]) => k === 'tipo' ? v : `${k}=${v}`).join(' '))}\u003c/em>`\n          ).join(' · ')}\u003cbr>\n          ¿HA SIDO ÚTIL? &nbsp; Sí · No era nada · Ya lo sabía\u003c/div>\n      \u003c/div>` : ''}`;\n  };\n\n  P.produccion = () => `\n    \u003cdiv class=\"cab\">\u003cdiv>\u003ch1>Producción\u003c/h1>\n      \u003cdiv class=\"sub\">OEE desglosado · 45 días · ${D.planta.nombre}\u003c/div>\u003c/div>\u003c/div>\n\n    \u003cdiv class=\"kpis\">\n      ${kpi('Disponibilidad', pct(D.indicadores.disp, 0), '', 'tiempo en marcha')}\n      ${kpi('Rendimiento', pct(D.indicadores.rend, 0), '', 'frente a ciclo nominal')}\n      ${kpi('Calidad', pct(D.indicadores.cal, 1), '', 'a la primera')}\n      ${kpi('OEE', pct(D.indicadores.oee, 0), '', 'D × R × C')}\n    \u003c/div>\n    \u003cdiv class=\"caja\">\u003ch3>Por qué se enseña desglosado\u003c/h3>\n      \u003cp>Un OEE del ${pct(D.indicadores.oee, 0)} no dice nada. Ese mismo número abierto en\n      ${pct(D.indicadores.disp, 0)} × ${pct(D.indicadores.rend, 0)} × ${pct(D.indicadores.cal, 0)}\n      dice que el problema está en el rendimiento, y que hay que mirar tiempos de ciclo y\n      microparadas, no averías.\u003c/p>\u003c/div>\n\n    \u003cdiv class=\"viz\" id=\"viz-oee\">\u003c/div>\n    \u003ch2>Paradas por causa · 30 días\u003c/h2>\n    ${barras(D.paradas.map((p) => ({\n      etiqueta: p.causa, valor: +p.horas, texto: nf(p.horas, 1) + ' h',\n      nota: `${p.n} paradas${p.planificada ? ' · planificada' : ''}`,\n      destacar: p.causa === 'SIN CAUSA REGISTRADA',\n    })), { col: 'Causa', unidad: 'Horas' })}\n    \u003ch2>Comparativa entre turnos\u003c/h2>\n    \u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Línea\u003c/th>\u003cth>Turno\u003c/th>\u003cth class=\"n\">OEE\u003c/th>\n      \u003cth class=\"n\">Rendimiento\u003c/th>\u003cth class=\"n\">Turnos\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n      ${D.turnos.map((t) => `\u003ctr>\u003ctd>${esc(t.codigo)}\u003c/td>\u003ctd>${esc(t.turno)}\u003c/td>\n        \u003ctd class=\"n\">${pct(t.oee, 1)}\u003c/td>\u003ctd class=\"n\">${pct(t.rend, 1)}\u003c/td>\n        \u003ctd class=\"n\">${t.n}\u003c/td>\u003c/tr>`).join('')}\n    \u003c/tbody>\u003c/table>\u003c/div>`;\n\n  P.mantenimiento = () => {\n    const act = D.activos.filter((a) => a.score != null)\n      .sort((a, b) => (a.score - (a.score_prev ?? a.score)) - (b.score - (b.score_prev ?? b.score)));\n    return `\n      \u003cdiv class=\"cab\">\u003cdiv>\u003ch1>Mantenimiento\u003c/h1>\n        \u003cdiv class=\"sub\">salud de los activos · ordenados por caída, no por nivel\u003c/div>\u003c/div>\u003c/div>\n      \u003cdiv class=\"caja\">\u003ch3>Por qué se ordena por caída\u003c/h3>\n        \u003cp>Un activo con 74 puntos que hace treinta días tenía 82 es una llamada esta semana.\n        Uno con 49 estable es un hecho conocido, y probablemente ya presupuestado.\n        La señal es la derivada, no el nivel.\u003c/p>\u003c/div>\n      \u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Activo\u003c/th>\u003cth class=\"n\">Salud\u003c/th>\n        \u003cth class=\"n\">30 d\u003c/th>\u003cth class=\"n\">Fiabilidad\u003c/th>\u003cth class=\"n\">Comportamiento\u003c/th>\n        \u003cth>Por qué\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n        ${act.map((a) => {\n          const d = a.score_prev != null ? a.score - a.score_prev : null;\n          const e = a.entradas || {};\n          const motivo = e.deriva_consumo_pct > 5\n            ? `consumo +${nf(e.deriva_consumo_pct, 1)}%${e.alarmas_30d > 0 ? ` · ${e.alarmas_30d} alarmas` : ''}`\n            : (e.averias_30d > 0 ? `${e.averias_30d} averías en 30 d` : '—');\n          return `\u003ctr>\u003ctd>\u003ca href=\"#/activo/${a.id}\" style=\"color:var(--texto)\">${esc(a.nombre)}\u003c/a>\n            \u003cspan class=\"m\" style=\"font-size:.62rem;color:var(--texto-3)\"> ${esc(a.codigo)}\u003c/span>\u003c/td>\n            \u003ctd class=\"n\" style=\"color:var(--dato);font-weight:700\">${a.score}\u003c/td>\n            \u003ctd class=\"n\" style=\"color:${d \u003c 0 ? 'var(--critica)' : d > 0 ? 'var(--bien)' : 'var(--texto-3)'}\">\n              ${d == null ? '—' : (d > 0 ? '+' : '') + d}\u003c/td>\n            \u003ctd class=\"n\">${a.c_fiabilidad}\u003c/td>\u003ctd class=\"n\">${a.c_comportamiento}\u003c/td>\n            \u003ctd class=\"m\" style=\"font-size:.7rem;color:var(--texto-2)\">${esc(motivo)}\u003c/td>\u003c/tr>`;\n        }).join('')}\n      \u003c/tbody>\u003c/table>\u003c/div>`;\n  };\n\n  P.activo = (id) => {\n    const a = D.activos.find((x) => x.id === id);\n    if (!a) return `\u003cdiv class=\"vacio-est\">Ese activo no existe.\u003c/div>`;\n    if (a.score == null) return `\n      \u003cdiv class=\"cab\">\u003cdiv>\u003ch1>${esc(a.nombre)}\u003c/h1>\u003cdiv class=\"sub\">${esc(a.codigo)}\u003c/div>\u003c/div>\u003c/div>\n      \u003cdiv class=\"vacio-est\">Este nodo es una agrupación (${esc(a.tipo)}), no un activo con salud propia.\u003c/div>`;\n    const p = a.pesos || {}, e = a.entradas || {};\n    const comp = [\n      ['Fiabilidad', a.c_fiabilidad, p.fiabilidad, `${e.averias_30d} averías no planificadas en 30 d (media previa ${nf(e.averias_media_30d_previa, 1)})`],\n      ['Comportamiento', a.c_comportamiento, p.comportamiento,\n        e.deriva_consumo_pct != null ? `consumo ${e.deriva_consumo_pct > 0 ? '+' : ''}${nf(e.deriva_consumo_pct, 1)}% · ${e.alarmas_30d} alarmas`\n                                     : 'sin serie de consumo: se parte de 85'],\n      ['Mantenimiento', a.c_mantenimiento, p.mantenimiento, 'sin plan preventivo cargado'],\n      ['Criticidad', a.c_criticidad, p.criticidad, `criticidad ${a.criticidad}/5 declarada`],\n    ];\n    const d = a.score_prev != null ? a.score - a.score_prev : null;\n    return `\n      \u003cdiv class=\"cab\">\u003cdiv>\n        \u003cdiv class=\"sub\">\u003ca href=\"#/mantenimiento\" style=\"color:var(--media)\">← Mantenimiento\u003c/a>\u003c/div>\n        \u003ch1>${esc(a.nombre)}\u003c/h1>\n        \u003cdiv class=\"sub\">${esc(a.codigo)}${a.fabricante ? ' · ' + esc(a.fabricante) : ''}${a.modelo ? ' ' + esc(a.modelo) : ''}\n          · coste de parada ${eur(a.coste_parada_hora)}/h\u003c/div>\u003c/div>\u003c/div>\n\n      \u003cdiv class=\"caja\">\n        \u003cdiv style=\"display:flex;gap:26px;align-items:baseline;flex-wrap:wrap;margin-bottom:14px\">\n          \u003cdiv>\u003cdiv class=\"score\">${a.score}\u003csmall>/100\u003c/small>\u003c/div>\u003c/div>\n          \u003cdiv class=\"m\" style=\"font-size:.75rem;color:${d \u003c 0 ? 'var(--critica)' : 'var(--texto-2)'}\">\n            ${d == null ? 'sin histórico' : `${d > 0 ? '▲ +' : '▼ '}${d} puntos en 30 días`}\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"salud\">\n          ${comp.map(([n, v, w, por]) => `\n            \u003cspan class=\"lab\">${esc(n)} \u003cspan style=\"color:var(--texto-3)\">×${w ?? '—'}\u003c/span>\u003c/span>\n            \u003cspan class=\"bar\">\u003ci style=\"width:${v}%\">\u003c/i>\u003c/span>\n            \u003cspan class=\"val\">${v}\u003c/span>\n            \u003cspan>\u003c/span>\u003cspan class=\"m\" style=\"font-size:.65rem;color:var(--texto-3);grid-column:2/4\">${esc(por)}\u003c/span>\n          `).join('')}\n        \u003c/div>\n        \u003cdiv class=\"cuenta\" style=\"margin-top:14px\">SALUD = ${comp.map(([n, v, w]) =>\n          `\u003cb>${v}\u003c/b>×${w}`).join(' + ')} = \u003ci>${a.score}\u003c/i>\u003c/div>\n        \u003cp style=\"margin-top:10px;font-size:.82rem;color:var(--texto-2)\">\n          Nunca se muestra una puntuación sin poder abrir su fórmula con los valores de este\n          activo. Los pesos son configurables por cliente y viajan guardados con la fila,\n          para que un score antiguo siga siendo legible.\u003c/p>\n      \u003c/div>\n      ${a.codigo === 'COMP-02' ? `\u003cdiv class=\"viz\" id=\"viz-activo\">\u003c/div>` : ''}`;\n  };\n\n  P.energia = () => {\n    const nodos = [...new Set(D.energiaDia.map((e) => e.codigo))];\n    const resumen = nodos.map((c) => {\n      const f = D.energiaDia.filter((e) => e.codigo === c);\n      const kwh = f.reduce((a, x) => a + (+x.kwh || 0), 0);\n      return { codigo: c, kwh, eur: kwh * D.planta.precio_kwh,\n               fuera: f.some((x) => x.fuera_horario) };\n    }).sort((a, b) => b.kwh - a.kwh);\n    return `\n      \u003cdiv class=\"cab\">\u003cdiv>\u003ch1>Energía\u003c/h1>\n        \u003cdiv class=\"sub\">45 días · precio de contrato ${nf(D.planta.precio_kwh, 5)} €/kWh\u003c/div>\u003c/div>\u003c/div>\n      \u003cdiv class=\"caja\">\u003ch3>La métrica que manda\u003c/h3>\n        \u003cp>El consumo absoluto sube y baja con la producción y no dice nada.\n        El \u003cstrong>consumo por unidad producida\u003c/strong> es comparable entre turnos, entre meses\n        y contra uno mismo, y es el que detecta la máquina que se está degradando.\u003c/p>\u003c/div>\n      \u003cdiv class=\"viz\" id=\"viz-energia\">\u003c/div>\n      ${barras(resumen.map((r) => ({\n        etiqueta: r.codigo, valor: r.kwh, texto: nf(r.kwh, 0) + ' kWh',\n        nota: (r.fuera ? 'consume con la planta parada · ' : '') + eur(r.eur),\n        destacar: r.fuera,\n      })), { col: 'Nodo', unidad: 'kWh · 45 días' })}`;\n  };\n\n  P.calidad = () => `\n    \u003cdiv class=\"cab\">\u003cdiv>\u003ch1>Calidad\u003c/h1>\n      \u003cdiv class=\"sub\">rechazos por lote y proveedor · 45 días\u003c/div>\u003c/div>\u003c/div>\n    \u003cdiv class=\"caja\">\u003ch3>Correlación, nunca causa\u003c/h3>\n      \u003cp>El sistema aporta la evidencia y su fuerza estadística. Quien decide que es causa es\n      el responsable de calidad. Confundir las dos cosas destruye la confianza en cuanto haya\n      una coincidencia falsa, y la habrá.\u003c/p>\u003c/div>\n    \u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Producto\u003c/th>\u003cth>Proveedor\u003c/th>\u003cth>Lote\u003c/th>\n      \u003cth class=\"n\">Unidades\u003c/th>\u003cth class=\"n\">Incidencias\u003c/th>\u003cth class=\"n\">Coste\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>${D.calidad.map((c) => `\u003ctr>\n        \u003ctd>${esc(c.producto)}\u003c/td>\u003ctd>${esc(c.proveedor ?? '—')}\u003c/td>\n        \u003ctd class=\"m\">${esc(c.lote ?? '—')}\u003c/td>\n        \u003ctd class=\"n\">${nf(c.uds, 0)}\u003c/td>\u003ctd class=\"n\">${c.n}\u003c/td>\n        \u003ctd class=\"n\">${eur(c.eur)}\u003c/td>\u003c/tr>`).join('')}\n      \u003c/tbody>\u003c/table>\u003c/div>`;\n\n  // --- copilot: preguntas resueltas SOBRE EL DATO REAL de esta instantanea --\n  const COPILOT = [\n    { q: '¿Por qué ha bajado el OEE esta semana?', f: () => {\n        const a = D.alertas.find((x) => x.severidad === 'critica');\n        return a ? `El ${pct(D.indicadores.oee, 0)} de OEE de los últimos 7 días viene sobre todo de la\n          \u003cstrong>Estación P4\u003c/strong>: ${esc(a.por_que || a.que_cambio)}\n          El impacto estimado es de \u003cstrong>${eur(a.impacto_eur_anual)} al año\u003c/strong>.`\n          : 'No hay caída significativa esta semana.'; },\n      fuentes: 'métricas de turno 2–8 sep · eventos de L3.P4 · alerta crítica' },\n    { q: '¿Qué máquina debería revisar mantenimiento?', f: () => {\n        const c = D.activos.filter((a) => a.score != null && a.score_prev != null)\n          .sort((a, b) => (a.score - a.score_prev) - (b.score - b.score_prev))[0];\n        return `\u003cstrong>${esc(c.nombre)}\u003c/strong> (${esc(c.codigo)}): ha bajado de\n          ${c.score_prev} a ${c.score} en treinta días. Su consumo específico sube un\n          ${nf(c.entradas?.deriva_consumo_pct, 1)}% y acumula ${c.entradas?.alarmas_30d} alarmas\n          este mes. No ha dado ninguna avería todavía, y por eso no aparecería en un GMAO.`; },\n      fuentes: 'asset_score 9 sep y 10 ago · energy_reading · eventos de alarma' },\n    { q: '¿Qué proveedor genera más incidencias?', f: () => {\n        const a = D.alertas.find((x) => x.modulo === 'quality');\n        return a ? `${esc(a.que_cambio)} ${esc(a.por_que)}\n          El coste ya incurrido asciende a \u003cstrong>${eur(a.impacto_base.coste_incurrido_eur)}\u003c/strong>.`\n          : 'No hay correlación con fuerza suficiente.'; },\n      fuentes: 'incidencias de calidad · albaranes · lotes de entrega' },\n    { q: '¿Cuánto podría ahorrar apagando lo que no hace falta?', f: () => {\n        const e = D.alertas.filter((x) => x.modulo === 'energy');\n        const t = e.reduce((a, x) => a + (x.impacto_eur_anual || 0), 0);\n        return `${e.length} equipos siguen consumiendo con la planta parada. En conjunto,\n          \u003cstrong>${eur(t)} al año\u003c/strong>. El mayor es ${esc(e[0].nodo_nombre)}, con\n          ${eur(e[0].impacto_eur_anual)}. La acción es un temporizador, no una inversión.`; },\n      fuentes: 'potencia por nodo fuera de instancias de turno · precio de contrato' },\n    { q: '¿Cuántas paradas no tienen causa registrada?', f: () =>\n        `El \u003cstrong>${nf(D.indicadores.pct_sin_causa, 1)}%\u003c/strong>. Podemos medir cuánto se pierde,\n         pero no diagnosticar por qué. Bajarlo del 80% al 30% es, por sí solo, un resultado\n         del piloto: sin causa no hay diagnóstico posible, ni con IA ni sin ella.`,\n      fuentes: 'v_cobertura_causas · eventos de parada de 30 días' },\n    { q: '¿Cuánto margen se pierde por scrap?', f: () => {\n        const t = D.calidad.reduce((a, c) => a + (+c.eur || 0), 0);\n        return `\u003cstrong>${eur(t)}\u003c/strong> en 45 días, sobre ${D.calidad.length} combinaciones de\n          producto y lote. La mitad se concentra en un solo lote.`; },\n      fuentes: 'quality_incident · margen unitario de la ficha de producto' },\n  ];\n\n  P.copilot = () => `\n    \u003cdiv class=\"cab\">\u003cdiv>\u003ch1>Pregunta a tu fábrica\u003c/h1>\n      \u003cdiv class=\"sub\">consulta el dato real · no estima · cita siempre la fuente\u003c/div>\u003c/div>\u003c/div>\n    \u003cdiv class=\"chat\">\n      \u003cdiv class=\"sugerencias\">${COPILOT.map((c, i) =>\n        `\u003cbutton type=\"button\" onclick=\"window.__resp(${i})\">${esc(c.q)}\u003c/button>`).join('')}\u003c/div>\n      \u003cdiv id=\"respuesta\">\u003c/div>\n      \u003cdiv class=\"caja\">\u003ch3>Qué pasa cuando no sabe\u003c/h3>\n        \u003cp>Si la pregunta no encaja en ninguna consulta del catálogo, responde\n        «no sé contestar a eso todavía» y lo registra. Ese registro es el backlog del Copilot,\n        escrito por los propios usuarios. Nunca rellena el hueco con algo verosímil.\u003c/p>\n        \u003cp style=\"color:var(--texto-2);font-size:.84rem\">El modelo tampoco escribe SQL: elige\n        una plantilla parametrizada y se ejecuta con los permisos de quien pregunta. La IA no\n        es una puerta trasera a los permisos.\u003c/p>\u003c/div>\n    \u003c/div>`;\n\n  window.__resp = (i) => {\n    const c = COPILOT[i];\n    document.getElementById('respuesta').innerHTML = `\n      \u003cdiv class=\"pregunta\">\u003cdiv class=\"q\">Tú\u003c/div>${esc(c.q)}\u003c/div>\n      \u003cdiv class=\"caja\">\u003ch3>Radactory\u003c/h3>\u003cp>${c.f()}\u003c/p>\n        \u003cdiv class=\"fuentes\">FUENTES · \u003cem>${esc(c.fuentes)}\u003c/em>\u003c/div>\u003c/div>`;\n  };\n\n  // -------------------------------------------------------------------------\n  // GRAFICAS DE CADA PANTALLA\n  // -------------------------------------------------------------------------\n  function serieDias(filas, campo, codigos) {\n    const dias = [...new Set(filas.map((f) => String(f.fecha).slice(0, 10)))].sort();\n    return {\n      dias,\n      series: codigos.map((c, i) => ({\n        nombre: c,\n        color: `var(--s${i + 1})`,\n        // Un dia sin fila queda como null y la linea SE PARTE. No se interpola.\n        puntos: dias.map((d) => {\n          const f = filas.find((x) => x.codigo === c && String(x.fecha).slice(0, 10) === d);\n          return { x: fecha(d), y: f ? +f[campo] : null };\n        }),\n      })),\n    };\n  }\n\n  function pintarGraficas(ruta, id) {\n    const cont = (s) => document.getElementById(s);\n\n    if (ruta === 'produccion' && cont('viz-oee')) {\n      const codigos = [...new Set(D.oeeLinea.map((o) => o.codigo))].sort();\n      const { series } = serieDias(D.oeeLinea, 'oee', codigos);\n      cont('viz-oee').innerHTML = `\u003cdiv class=\"titulo\">OEE diario por línea\u003c/div>\n        \u003cdiv class=\"nota\">45 días · los domingos no hay producción y la línea se corta:\n        un hueco se dibuja como hueco\u003c/div>\u003cdiv class=\"lienzo\">\u003c/div>`;\n      pintarLineas(cont('viz-oee').querySelector('.lienzo'), {\n        series, titulo: 'OEE diario por línea', desdeCero: false,\n        fmtY: (v) => nf(v * 100, 0) + '%', fmtTip: (v) => nf(v * 100, 1) + '%',\n        alt: 'OEE diario de las tres líneas durante 45 días. La línea 3 cae en la última semana.',\n      });\n    }\n\n    if (cont('viz-alerta') || cont('viz-activo')) {\n      const a = D.alertas.find((x) => x.id === id);\n      const esP4 = a && a.nodo_codigo === 'L3.P4';\n      const el = cont('viz-alerta') || cont('viz-activo');\n\n      if (esP4) {\n        // Media diaria de rendimiento de P4 con su linea base y la marca del\n        // cambio de formato: es el grafico que cuenta la alerta entera.\n        const dias = [...new Set(D.rendP4.map((r) => String(r.bucket).slice(0, 10)))].sort();\n        const puntos = dias.map((d) => {\n          const f = D.rendP4.filter((r) => String(r.bucket).slice(0, 10) === d);\n          return { x: fecha(d), y: f.length ? f.reduce((s, r) => s + +r.rend, 0) / f.length : null };\n        });\n        const base = D.baseP4.filter((b) => b.producto === '(genérica)');\n        const media = base.length ? base.reduce((s, b) => s + +b.media, 0) / base.length : null;\n        const iCambio = dias.findIndex((d) =>\n          D.rendP4.some((r) => String(r.bucket).slice(0, 10) === d && r.producto === 'REF-2210'));\n\n        el.innerHTML = `\u003cdiv class=\"titulo\">Rendimiento de la Estación P4\u003c/div>\n          \u003cdiv class=\"nota\">media diaria de los tres turnos · 30 días\u003c/div>\u003cdiv class=\"lienzo\">\u003c/div>`;\n        pintarLineas(el.querySelector('.lienzo'), {\n          series: [{ nombre: 'L3.P4', color: 'var(--critica)', puntos }],\n          base: media, marca: iCambio > 0 ? { i: iCambio, texto: 'cambio a REF-2210' } : null,\n          fmtY: (v) => nf(v * 100, 0) + '%', fmtTip: (v) => nf(v * 100, 1) + '%',\n          alt: 'El rendimiento de P4 se mantiene en torno a la línea base hasta el cambio de formato y luego cae.',\n        });\n      } else {\n        const { series } = serieDias(D.energiaDia, 'kwh', ['COMP-01', 'COMP-02']);\n        el.innerHTML = `\u003cdiv class=\"titulo\">Consumo diario · COMP-01 frente a COMP-02\u003c/div>\n          \u003cdiv class=\"nota\">dos equipos equivalentes: uno para fuera de horario y el otro no\u003c/div>\n          \u003cdiv class=\"lienzo\">\u003c/div>`;\n        pintarLineas(el.querySelector('.lienzo'), {\n          series, desdeCero: true, fmtY: (v) => nf(v, 0), fmtTip: (v) => nf(v, 1) + ' kWh',\n          alt: 'El consumo diario de COMP-02 crece y se mantiene alto los fines de semana; COMP-01 baja.',\n        });\n      }\n    }\n\n    if (ruta === 'energia' && cont('viz-energia')) {\n      const { series } = serieDias(D.energiaDia, 'kwh', ['L3', 'COMP-02', 'CHILLER']);\n      cont('viz-energia').innerHTML = `\u003cdiv class=\"titulo\">Consumo diario por nodo\u003c/div>\n        \u003cdiv class=\"nota\">45 días · los valles son los domingos con la planta parada\u003c/div>\n        \u003cdiv class=\"lienzo\">\u003c/div>`;\n      pintarLineas(cont('viz-energia').querySelector('.lienzo'), {\n        series, desdeCero: true, fmtY: (v) => nf(v, 0), fmtTip: (v) => nf(v, 1) + ' kWh',\n        alt: 'Consumo diario de la línea 3, el compresor 02 y la enfriadora durante 45 días.',\n      });\n    }\n  }\n\n  // -------------------------------------------------------------------------\n  // MENU Y ENRUTADO\n  // -------------------------------------------------------------------------\n  const MENU = [\n    { grupo: 'Hoy' },\n    { r: 'estado', t: 'Estado de planta' },\n    { r: 'alertas', t: 'Alertas', n: () => D.alertas.filter((a) => a.severidad === 'critica').length },\n    { r: 'copilot', t: 'Pregunta a tu fábrica' },\n    { grupo: 'Radares' },\n    { r: 'produccion', t: 'Producción' },\n    { r: 'mantenimiento', t: 'Mantenimiento' },\n    { r: 'energia', t: 'Energía' },\n    { r: 'calidad', t: 'Calidad' },\n  ];\n\n  function pintarMenu(activa) {\n    menuEl.innerHTML = MENU.map((m) => {\n      if (m.grupo) return `\u003cdiv class=\"sep\">${esc(m.grupo)}\u003c/div>`;\n      const n = m.n ? m.n() : 0;\n      return `\u003ca href=\"#/${m.r}\" class=\"${activa === m.r ? 'on' : ''}\">${esc(m.t)}\n        ${n ? `\u003cspan class=\"n\">${n}\u003c/span>` : ''}\u003c/a>`;\n    }).join('');\n  }\n\n  function ir() {\n    const h = (location.hash || '#/estado').slice(2).split('/');\n    const ruta = h[0] || 'estado';\n    const id = h[1] ? decodeURIComponent(h[1]) : null;\n\n    const fn = P[ruta];\n    vista.innerHTML = fn ? fn(id) : `\u003cdiv class=\"vacio-est\">Esa pantalla no existe todavía.\u003c/div>`;\n    // 'alerta' y 'activo' son fichas: en el menu se marca su seccion padre.\n    pintarMenu(ruta === 'alerta' ? 'alertas' : ruta === 'activo' ? 'mantenimiento' : ruta);\n    pintarGraficas(ruta, id);\n    window.scrollTo(0, 0);\n  }\n\n  document.getElementById('planta-nom').textContent = D.planta.nombre.replace('Planta de ', '');\n  document.getElementById('tema').addEventListener('click', () => {\n    const claro = document.documentElement.getAttribute('data-tema') === 'claro';\n    document.documentElement.setAttribute('data-tema', claro ? 'oscuro' : 'claro');\n    ir();   // las graficas leen los colores del tema al dibujarse\n  });\n\n  window.addEventListener('hashchange', ir);\n  ir();\n})();\n\u003c/script>\n","bytes":49554,"lineas":868,"lenguaje":"xml","para":"El panel navegable: nueve pantallas, gráficas con hover y la paleta validada.","chip":null,"chipTono":null,"estado":null},"panel/README.md":{"texto":"# Panel\n\nReact + TypeScript + Vite. SPA: es una aplicación de estado, no un sitio de\ncontenido — SSR aquí solo añadiría complejidad.\n\n## Estructura\n\n```\nsrc/\n  main.tsx                 arranque y router\n  datos/\n    api.ts                 cliente HTTP; el único sitio que sabe de fetch\n    sesion.ts              token, rol y permisos en el cliente\n    permisos.ts            espejo de src/api/contexto.ts — el servidor manda\n  estilo/\n    tokens.css             el sistema visual entero\n    base.css               reset y tipografía\n  componentes/\n    Cifra.tsx              un número grande con su tendencia y su cobertura\n    ChipSeveridad.tsx      color + forma + icono, nunca solo color\n    FilaAlerta.tsx         las tres líneas que terminan en un euro y un verbo\n    CuentaAbierta.tsx      la fórmula con los valores reales\n    Puntuacion.tsx         score con sus componentes y el enlace \"¿cómo?\"\n    Serie.tsx              gráfica de serie sobre uPlot, con huecos como huecos\n    Vacio.tsx              estados vacíos, de error y de dato insuficiente\n  pantallas/\n    EstadoPlanta.tsx       la pantalla de los 30 segundos\n    Alertas.tsx            bandeja\n    FichaAlerta.tsx        qué, por qué, cuánto, qué hacer, de dónde sale\n    FichaActivo.tsx        el hub de una máquina\n    Copilot.tsx            \"Pregunta a tu fábrica\"\n    Ajustes*.tsx           planta, turnos, productos, causas, conectores…\n```\n\n## Reglas que no se negocian pantalla a pantalla\n\n- **Un número que no se puede accionar no ocupa espacio destacado.**\n- **Nunca más de cinco elementos en «Atención hoy».**\n- **Todo número es pinchable hasta el dato crudo.** Sin callejones sin salida.\n- **Ninguna puntuación sin su enlace «¿cómo?».**\n- **Un hueco de dato se pinta como hueco.** `Serie.tsx` no une la línea por\n  encima de un vacío, jamás.\n- **El color nunca es el único portador de significado.** La severidad lleva\n  color, forma e icono: en una plantilla de planta hay bastantes daltónicos.\n\n## Dos usos distintos, no dos tamaños\n\nEl escritorio es para analizar. El móvil es para el técnico delante de la\nmáquina: manda «Atención hoy», la ficha de activo y el Factory Brain, y las\ncomparativas amplias se degradan a tabla.\n","bytes":2260,"lineas":51,"lenguaje":null,"para":"Estructura del panel y las reglas que no se negocian pantalla a pantalla.","chip":null,"chipTono":null,"estado":null},"panel/src/componentes/ChipSeveridad.tsx":{"texto":"// El color NUNCA es el unico portador de significado: cada severidad lleva\n// color, forma e icono. En una plantilla de planta el 8% de los hombres es\n// daltonico, y eso es mucha gente.\ntype Severidad = 'critica' | 'alta' | 'media' | 'baja';\n\nconst FORMA: Record\u003cSeveridad, { icono: string; texto: string }> = {\n  critica: { icono: '■', texto: 'Crítica' },\n  alta:    { icono: '▲', texto: 'Alta' },\n  media:   { icono: '●', texto: 'Media' },\n  baja:    { icono: '–', texto: 'Baja' },\n};\n\nexport function ChipSeveridad({ severidad }: { severidad: Severidad }) {\n  const f = FORMA[severidad];\n  return (\n    \u003cspan className={`chip chip--${severidad}`} style={{ color: `var(--${severidad})` }}>\n      \u003cspan aria-hidden=\"true\">{f.icono}\u003c/span> {f.texto}\n    \u003c/span>\n  );\n}\n","bytes":780,"lineas":21,"lenguaje":"typescript","para":"Color, forma e icono. El color nunca va solo.","chip":null,"chipTono":null,"estado":null},"panel/src/componentes/Cifra.tsx":{"texto":"// Un numero grande con su tendencia y, si hace falta, su cobertura.\n//\n// Un nivel sin tendencia no es accionable: el 78% de OEE solo significa algo\n// cuando se sabe que la semana pasada era 82%.\ninterface Props {\n  etiqueta: string;\n  valor: number | null;\n  unidad?: string;\n  decimales?: number;\n  delta?: number | null;\n  /** Fraccion del intervalo con dato utilizable. */\n  cobertura?: number;\n  /** true si subir es bueno (produccion) y false si es malo (rechazos). */\n  subirEsBueno?: boolean;\n}\n\nexport function Cifra({\n  etiqueta, valor, unidad = '', decimales = 0,\n  delta = null, cobertura = 1, subirEsBueno = true,\n}: Props) {\n  // Sin dato no se pinta un cero: un cero es un dato, y \"no hay dato\" no lo es.\n  if (valor === null) {\n    return (\n      \u003cdiv className=\"cifra cifra--vacia\">\n        \u003cdiv className=\"cifra__etiqueta\">{etiqueta}\u003c/div>\n        \u003cdiv className=\"cifra__valor cifra__valor--vacio\">—\u003c/div>\n        \u003cdiv className=\"cifra__pie\">sin dato\u003c/div>\n      \u003c/div>\n    );\n  }\n\n  const parcial = cobertura \u003c 0.7;\n  const color = delta == null ? 'var(--texto-2)'\n    : (delta > 0) === subirEsBueno ? 'var(--bien)' : 'var(--critica)';\n\n  return (\n    \u003cdiv className=\"cifra\" data-parcial={parcial || undefined}>\n      \u003cdiv className=\"cifra__etiqueta\">{etiqueta}\u003c/div>\n      \u003cdiv className=\"cifra__valor\">\n        {valor.toLocaleString('es-ES', {\n          minimumFractionDigits: decimales, maximumFractionDigits: decimales,\n        })}{unidad}\n      \u003c/div>\n      {delta != null && (\n        \u003cdiv className=\"cifra__pie\" style={{ color }}>\n          {delta > 0 ? '▲' : '▼'} {Math.abs(delta).toLocaleString('es-ES', {\n            maximumFractionDigits: 1 })}\n        \u003c/div>\n      )}\n      {/* La cobertura se dice AL LADO del numero, no en un tooltip escondido:\n          un OEE calculado sobre el 62% del turno es un dato distinto. */}\n      {parcial && (\n        \u003cdiv className=\"cifra__aviso\">\n          calculado sobre el {Math.round(cobertura * 100)}% del periodo\n        \u003c/div>\n      )}\n    \u003c/div>\n  );\n}\n","bytes":2034,"lineas":60,"lenguaje":"typescript","para":"Un número con su tendencia y su cobertura. Sin dato no pinta un cero.","chip":null,"chipTono":null,"estado":null},"panel/src/componentes/CuentaAbierta.tsx":{"texto":"// La cuenta, abierta.\n//\n// Existe por la decision 11 y por la restriccion alert_cuenta_abierta del\n// esquema: si el director de planta no puede reproducir la multiplicacion con\n// un boligrafo, el numero no sirve. Este componente se renderiza SIEMPRE que\n// se enseña un euro.\ninterface Props {\n  base: Record\u003cstring, unknown>;\n  /** Que dato falto, si no se pudo calcular. */\n  falta?: string[];\n}\n\nconst ETIQUETAS: Record\u003cstring, string> = {\n  formula: 'Fórmula',\n  uds_perdidas_semana: 'Unidades perdidas por semana',\n  margen_unitario: 'Margen unitario (€)',\n  capacidad_semanal_uds: 'Capacidad semanal (uds)',\n  caida_rendimiento: 'Caída de rendimiento',\n  semanas_anio: 'Semanas productivas al año',\n  precio_kwh: 'Precio del kWh (contrato de la planta)',\n  coste_parada_hora: 'Coste de parada por hora (€)',\n};\n\nexport function CuentaAbierta({ base, falta = [] }: Props) {\n  if (falta.length > 0) {\n    return (\n      \u003cdiv className=\"cuenta cuenta--incompleta\">\n        \u003cp>No podemos poner cifra a esto todavía. Falta:\u003c/p>\n        \u003cul>{falta.map((f) => \u003cli key={f}>{f}\u003c/li>)}\u003c/ul>\n        {/* No se estima. Una cifra inventada que el cliente detecta —y la\n            detecta— cuesta mas que no dar cifra. */}\n      \u003c/div>\n    );\n  }\n  return (\n    \u003cdl className=\"cuenta\">\n      {Object.entries(base).map(([k, v]) => (\n        \u003cdiv key={k} className=\"cuenta__fila\">\n          \u003cdt>{ETIQUETAS[k] ?? k}\u003c/dt>\n          \u003cdd className=\"mono\">\n            {typeof v === 'number' ? v.toLocaleString('es-ES') : String(v)}\n          \u003c/dd>\n        \u003c/div>\n      ))}\n    \u003c/dl>\n  );\n}\n","bytes":1594,"lineas":48,"lenguaje":"typescript","para":"La fórmula con los valores reales. Se renderiza siempre que hay un euro.","chip":null,"chipTono":null,"estado":null},"panel/src/estilo/tokens.css":{"texto":"/* ---------------------------------------------------------------------------\n   Sistema visual.\n\n   El contexto manda: esto se mira en una oficina de planta con luz de nave, a\n   veces en una tablet con guantes y a veces en una pantalla de 55\" colgada en\n   el taller y vista a tres metros. Oscuro por defecto y contraste alto; nada\n   de gris claro sobre blanco.\n--------------------------------------------------------------------------- */\n:root {\n  --fondo:        #0E1116;\n  --fondo-2:      #161D22;\n  --fondo-3:      #1D262C;\n  --linea:        #27333A;\n\n  --texto:        #E8EDF2;\n  --texto-2:      #93A1B0;\n  --texto-3:      #6B7A85;\n\n  /* Severidad. Es informacion, no decoracion: no se usa para nada mas. */\n  --critica:      #E5484D;\n  --alta:         #F5A524;\n  --media:        #3E9EFF;\n  --baja:         #7C8794;\n  --bien:         #46C68A;\n\n  /* El dato es el elemento de mas contraste de la pantalla. La etiqueta es el\n     marco, la cifra es el contenido. */\n  --dato:         #FFFFFF;\n  --base-linea:   #93A1B0;   /* la linea base, siempre discontinua */\n\n  --r:            3px;\n  --gap:          16px;\n}\n\n/* Tema claro para quien lo prefiera. Mismo contraste, no una inversion ingenua. */\n:root[data-tema=\"claro\"] {\n  --fondo:        #F2F4F6;\n  --fondo-2:      #FFFFFF;\n  --fondo-3:      #E8ECEF;\n  --linea:        #D3DAE0;\n  --texto:        #10161B;\n  --texto-2:      #4A5A66;\n  --texto-3:      #74848F;\n  --critica:      #C0281D;\n  --alta:         #A2620A;\n  --media:        #14639E;\n  --baja:         #64717B;\n  --bien:         #12764C;\n  --dato:         #000000;\n}\n\n/* Los numeros tabulares son OBLIGATORIOS en tablas y cifras: si las cifras\n   bailan al actualizarse, la tabla se vuelve ilegible de un vistazo, que es\n   justo para lo que existe. */\n.cifra, table td, .mono {\n  font-variant-numeric: tabular-nums;\n}\n","bytes":1839,"lineas":58,"lenguaje":"css","para":"El sistema visual entero. Oscuro por defecto: se mira en una nave.","chip":null,"chipTono":null,"estado":null},"edge/README.md":{"texto":"# RADACTORY EDGE\n\nSe instala dentro de la red del cliente, en la **DMZ industrial** — nunca en la\nred OT plana, y nunca con doble tarjeta hacia OT e internet a la vez sin\ncortafuegos entre medias.\n\n## Las seis reglas que definen este componente\n\n1. **Solo lectura.** No hay código capaz de escribir en un PLC. No es una opción\n   desactivada: no está implementado, y este repositorio se puede enseñar en la\n   reunión con IT. Es la frase que desbloquea el proyecto.\n2. **Solo salida.** Abre él la conexión, TLS mutuo por el 443 contra\n   `ingest.\u003cdominio>`. **No escucha en ningún puerto.** El cortafuegos del\n   cliente no necesita ninguna regla de entrada.\n3. **Aguanta sin línea.** Buffer local de 7 días en SQLite. Al volver reenvía en\n   orden, sin duplicar y sin perder.\n4. **No decide nada.** Lee, normaliza, comprime, firma y envía. Toda la lógica\n   está en el cloud: cambiar el algoritmo no obliga a tocar la planta.\n5. **Se ve desde dentro.** Estado, latencia y última lectura por señal, visibles\n   en el panel del cliente y en el de superadmin.\n6. **Se cae hacia el lado seguro.** Si no puede leer, marca hueco de dato. Nunca\n   interpola en silencio, y **nunca reintenta de forma agresiva**: saturar un\n   PLC antiguo con peticiones puede afectar a su ciclo de scan.\n\n## Fuentes, por orden de implantación\n\n| Fase | Fuente | Estado |\n|---|---|---|\n| MVP | `sql` — consulta de solo lectura al historiador o al ERP | esqueleto |\n| MVP | `csv` — carpeta vigilada, SFTP o subida | esqueleto |\n| MVP | `rest` — API del ERP, GMAO o equipos | esqueleto |\n| Fase 2 | `mqtt` — sensórica IoT | pendiente |\n| Fase 2 | `opcua` — el estándar del SCADA moderno | pendiente |\n| Fase 3 | `modbus` — máquina antigua sin nada encima | pendiente |\n\n**OPC UA no está en el MVP aunque sea «lo correcto»**: exige certificados,\npermisos, un espacio de nombres que alguien tiene que mapear y a menudo una\nlicencia del fabricante del SCADA — entre dos y seis semanas de coordinación.\nSQL y CSV dan dato real en tres días y permiten enseñar valor mientras se\ntramita. Es una decisión comercial disfrazada de técnica, y es a propósito.\n\n## Despliegue\n\nMini PC industrial o VM del cliente. Docker o binario empaquetado. Configuración\nen `edge.yaml`; el token de ingesta se entrega aparte y **no se escribe en el\nfichero de configuración**.\n\n```yaml\nconector:\n  id: 00000000-0000-0000-0000-000000000000\n  destino: https://ingest.radactory.example\n  lote_s: 30            # cada cuanto se envia\n  buffer_dias: 7\n\nfuentes:\n  - tipo: sql\n    nombre: historiador\n    dsn_env: FR_DSN_HISTORIADOR      # la credencial viene del entorno, no del yaml\n    cadencia_s: 30\n    consulta: |\n      select tag, ts, valor from historico\n       where ts > :ultimo order by ts limit 5000\n    mapeo:\n      tag: signal\n      ts: ts\n      valor: value\n\n  - tipo: csv\n    nombre: partes-produccion\n    carpeta: /datos/partes\n    patron: \"parte_*.csv\"\n    cadencia_s: 300\n```\n","bytes":2985,"lineas":74,"lenguaje":null,"para":"Las seis reglas que definen el conector. La primera desbloquea el proyecto con IT.","chip":null,"chipTono":null,"estado":null},"edge/src/buffer.ts":{"texto":"// ---------------------------------------------------------------------------\n// Buffer local. Es lo que convierte un corte de internet en un retraso en vez\n// de en un agujero en el historico.\n//\n// SQLite del propio Node (node:sqlite, estable desde Node 22.5): una\n// dependencia menos que auditar en un equipo que vive dentro de la red de un\n// cliente industrial, que es justo donde menos apetece tener superficie.\n// ---------------------------------------------------------------------------\nimport { DatabaseSync } from 'node:sqlite';\n\nexport interface Pendiente {\n  batchId: string;\n  cuerpo: string;\n  intentos: number;\n}\n\nexport class Buffer {\n  private db: DatabaseSync;\n\n  constructor(ruta: string, private diasRetencion = 7) {\n    this.db = new DatabaseSync(ruta);\n    this.db.exec(`\n      create table if not exists lote (\n        batch_id text primary key,\n        cuerpo   text    not null,\n        creado   integer not null,\n        intentos integer not null default 0,\n        enviado  integer\n      );\n      create index if not exists lote_pendiente on lote (creado) where enviado is null;\n    `);\n  }\n\n  encolar(batchId: string, cuerpo: unknown): void {\n    this.db.prepare(\n      `insert or ignore into lote (batch_id, cuerpo, creado) values (?, ?, ?)`,\n    ).run(batchId, JSON.stringify(cuerpo), Date.now());\n  }\n\n  /** En orden de creacion: el historico tiene que reconstruirse en secuencia. */\n  pendientes(limite = 20): Pendiente[] {\n    return this.db.prepare(\n      `select batch_id as batchId, cuerpo, intentos from lote\n        where enviado is null order by creado limit ?`,\n    ).all(limite) as unknown as Pendiente[];\n  }\n\n  marcarEnviado(batchId: string): void {\n    this.db.prepare(`update lote set enviado = ? where batch_id = ?`)\n      .run(Date.now(), batchId);\n  }\n\n  // Un fallo NO borra el lote. Se cuenta el intento y se reintenta con espera\n  // creciente: si el cloud esta caido, insistir cada segundo no lo levanta y si\n  // llena el disco del conector, ademas se pierde el dato.\n  marcarFallo(batchId: string): void {\n    this.db.prepare(`update lote set intentos = intentos + 1 where batch_id = ?`)\n      .run(batchId);\n  }\n\n  esperaMs(intentos: number): number {\n    return Math.min(5 * 60_000, 2_000 * 2 ** Math.min(intentos, 8));\n  }\n\n  /** Solo se purga lo YA enviado. Lo pendiente se conserva aunque sea viejo. */\n  purgar(): number {\n    const limite = Date.now() - this.diasRetencion * 86_400_000;\n    const r = this.db.prepare(\n      `delete from lote where enviado is not null and creado \u003c ?`).run(limite);\n    return Number(r.changes);\n  }\n}\n","bytes":2599,"lineas":73,"lenguaje":"typescript","para":"Los siete días de buffer que convierten un corte de línea en un retraso.","chip":null,"chipTono":null,"estado":null},"edge/src/fuentes/tipos.ts":{"texto":"// Contrato que cumple toda fuente. Añadir OPC UA o Modbus en fase 2 no toca\n// nada mas que este directorio: el resto del conector no sabe de protocolos.\nexport interface Lectura {\n  signal: string;          // codigo de la señal, tal como esta dada de alta\n  ts: string;              // ISO 8601 con huso. Nunca hora local sin huso\n  value: number;\n  q?: 0 | 1 | 2 | 3;       // good | uncertain | bad | sustituido\n}\n\nexport interface EventoFuente {\n  asset: string;\n  type: string;\n  ts_start: string;\n  ts_end?: string;\n  reason?: string | null;\n  source: string;\n}\n\nexport interface Fuente {\n  nombre: string;\n  tipo: 'sql' | 'csv' | 'rest' | 'mqtt' | 'opcua' | 'modbus';\n  /**\n   * Lee lo nuevo desde la ultima marca. Devuelve tambien la marca nueva, que el\n   * conector persiste: si se reinicia, no repite ni se salta nada.\n   *\n   * Si no puede leer, LANZA. No devuelve vacio: un vacio silencioso se\n   * confunde con \"la planta no produjo\", y eso es un diagnostico equivocado.\n   */\n  leer(desde: string | null): Promise\u003c{\n    lecturas: Lectura[];\n    eventos: EventoFuente[];\n    marca: string | null;\n  }>;\n}\n","bytes":1123,"lineas":35,"lenguaje":"typescript","para":"El contrato de una fuente. Añadir OPC UA no toca nada más que ese directorio.","chip":null,"chipTono":null,"estado":null},"web/index.html":{"texto":"\u003ctitle>RADACTORY\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap\">\n\n\u003cstyle>\n/* ===========================================================================\n   RADACTORY · sistema visual\n   ---------------------------------------------------------------------------\n   Editorial antes que SaaS. Ante la duda: espacio vacio antes que adorno, un\n   elemento grande antes que cinco pequeños, solucion editorial antes que la\n   tipica de producto.\n\n   Tipografia   Newsreader (serif editorial, solo en display y frases grandes)\n                Archivo (interfaz y cuerpo) · IBM Plex Mono (etiquetas y dato)\n   Color        la marca se conserva; el entorno se reinterpreta en cremas\n   Forma        radios coherentes por familia, bordes finos, sombra casi nula\n   =========================================================================== */\n:root {\n  /* --- superficie ------------------------------------------------------- */\n  --bg-primary:   #F5F4EF;\n  --bg-secondary: #ECEEE8;\n  --bg-white:     #FFFFFF;\n  --bg-dark:      #171A18;\n\n  /* --- tinta ------------------------------------------------------------- */\n  --text-primary:   #151815;\n  --text-secondary: #555B55;\n  /* 4,5:1 sobre las tres superficies. #7C837C daba 3,33 sobre el fondo suave\n     y lo usan las etiquetas, los ejes de la grafica y el pie: texto pequeño. */\n  --text-tertiary:  #636A63;\n  --text-inverse:   #F2F1EC;\n  --text-inverse-2: #9EA49C;\n\n  /* --- marca. Se conserva; solo cambia como se usa ---------------------- */\n  --brand:        #E0115F;\n  --brand-dark:   #A80B47;   /* texto pequeño: 7,0:1 sobre crema */\n  --brand-soft:   #F7E4EA;\n  --brand-accent: #F59B00;\n\n  /* --- linea ------------------------------------------------------------- */\n  --border-light: rgba(21,24,21,.10);\n  --border-mid:   rgba(21,24,21,.18);\n  --border-dark:  rgba(242,241,236,.14);\n\n  /* --- radios: una familia por tipo de pieza ---------------------------- */\n  --radius-btn:   10px;\n  --radius-sm:    14px;\n  --radius-md:    20px;\n  --radius-lg:    26px;\n  --radius-img:   24px;\n\n  /* --- escala de espacio ------------------------------------------------- */\n  --s-1:4px; --s-2:8px;  --s-3:12px; --s-4:16px; --s-5:24px; --s-6:32px;\n  --s-7:48px; --s-8:64px; --s-9:80px; --s-10:96px; --s-11:120px; --s-12:160px;\n\n  /* --- contenedores ------------------------------------------------------ */\n  --page:    1440px;\n  --content: 1280px;\n  --text:    720px;\n  --pad:     clamp(20px, 5vw, 72px);\n\n  /* --- tipo -------------------------------------------------------------- */\n  --serif: \"Newsreader\", Georgia, \"Times New Roman\", serif;\n  --sans:  \"Archivo\", \"Helvetica Neue\", Arial, sans-serif;\n  --mono:  \"IBM Plex Mono\", ui-monospace, Menlo, monospace;\n\n  --ease: cubic-bezier(.22,1,.36,1);\n\n  /* El simbolo es monocromo: el cuadro toma el color del texto que lo rodea y\n     el monograma se cala con el color del fondo. Asi el mismo SVG funciona\n     sobre crema y sobre oscuro sin necesidad de dos versiones. */\n  --mark-cut: var(--bg-primary);\n}\n\n*, *::before, *::after { box-sizing:border-box; }\nhtml { scroll-behavior:smooth; }\nbody { margin:0; background:var(--bg-primary); color:var(--text-primary);\n  font-family:var(--sans); font-size:17px; line-height:1.62;\n  -webkit-font-smoothing:antialiased; overflow-x:hidden; }\n:focus-visible { outline:2px solid var(--brand); outline-offset:3px; border-radius:2px; }\nimg, svg { max-width:100%; display:block; }\np { margin:0 0 var(--s-5); }\nstrong { font-weight:600; }\n\n/* --- jerarquia: ocho niveles y ni uno mas ------------------------------- */\n.display, h1 { font-family:var(--serif); font-weight:400;\n  font-size:clamp(3.4rem, 6.5vw, 7rem); line-height:.96; letter-spacing:-.035em;\n  margin:0; text-wrap:balance; font-variation-settings:\"opsz\" 72; }\nh2 { font-family:var(--sans); font-weight:600;\n  font-size:clamp(2.1rem, 4.4vw, 3.4rem); line-height:1.04; letter-spacing:-.03em;\n  margin:0 0 var(--s-5); text-wrap:balance; }\nh3 { font-family:var(--sans); font-weight:600;\n  font-size:clamp(1.35rem, 2.2vw, 1.85rem); line-height:1.18; letter-spacing:-.022em;\n  margin:0 0 var(--s-3); text-wrap:balance; }\n.frase { font-family:var(--serif); font-weight:400;\n  font-size:clamp(2.4rem, 5.2vw, 4.6rem); line-height:1.02; letter-spacing:-.032em;\n  margin:0 0 var(--s-6); text-wrap:balance; }\n.lead { font-size:clamp(1.15rem, 1.5vw, 1.4rem); line-height:1.46;\n        color:var(--text-secondary); }\n.small { font-size:.94rem; color:var(--text-secondary); }\n.label { font-family:var(--mono); font-size:.75rem; font-weight:500;\n  letter-spacing:.11em; text-transform:uppercase; color:var(--text-tertiary);\n  margin:0 0 var(--s-5); }\n.label.marca { color:var(--brand-dark); }\n.mono { font-family:var(--mono); font-variant-numeric:tabular-nums; }\n\n/* --- retícula ----------------------------------------------------------- */\n.page { max-width:var(--page); margin-inline:auto; }\n.wrap { max-width:var(--content); margin-inline:auto; padding-inline:var(--pad); }\n.text { max-width:var(--text); }\nsection { padding-block:clamp(var(--s-9), 9vw, var(--s-12)); }\nsection.corta { padding-block:clamp(var(--s-8), 7vw, var(--s-11)); }\n.bg-soft  { background:var(--bg-secondary); }\n.bg-white { background:var(--bg-white); --mark-cut:var(--bg-white); }\n.bg-dark  { background:var(--bg-dark); color:var(--text-inverse); }\n.bg-dark .lead, .bg-dark p { color:var(--text-inverse-2); }\n.bg-dark .label { color:var(--text-inverse-2); }\n.bg-dark strong { color:var(--text-inverse); }\n\n/* --- cabecera: ligera, translucida, borde casi imperceptible ------------ */\n.header { position:sticky; top:0; z-index:80; height:84px;\n  background:rgba(245,244,239,.84); backdrop-filter:blur(14px) saturate(1.3);\n  border-bottom:1px solid transparent; transition:height .4s var(--ease),\n  border-color .4s var(--ease), background .4s var(--ease); }\n.header.scrolled { height:70px; border-bottom-color:var(--border-light);\n                   background:rgba(245,244,239,.94); }\n.header .wrap { display:flex; align-items:center; justify-content:space-between;\n                gap:var(--s-5); height:100%; }\n.logo { display:flex; align-items:center; gap:10px; text-decoration:none;\n        color:inherit; }\n.logo .mark { width:28px; height:28px; border-radius:7px; }\n.logo b { font-family:var(--sans); font-weight:700; font-size:1.02rem;\n          letter-spacing:-.01em; }\n.menu { display:flex; align-items:center; gap:var(--s-6); }\n.menu a { font-size:.95rem; color:var(--text-secondary); text-decoration:none;\n          position:relative; padding-block:4px; }\n.menu a::after { content:\"\"; position:absolute; inset:auto 0 0 0; height:1px;\n  background:currentColor; transform:scaleX(0); transform-origin:left;\n  transition:transform .35s var(--ease); }\n.menu a:hover { color:var(--text-primary); }\n.menu a:hover::after { transform:scaleX(1); }\n\n/* --- botones ------------------------------------------------------------ */\n.btn { display:inline-flex; align-items:center; gap:9px; height:54px;\n  padding-inline:28px; border-radius:var(--radius-btn); font-family:var(--sans);\n  font-size:1rem; font-weight:600; text-decoration:none; border:1px solid transparent;\n  background:var(--text-primary); color:var(--bg-primary);\n  transition:transform .3s var(--ease), background-color .3s var(--ease),\n             color .3s var(--ease), border-color .3s var(--ease); }\n.btn:hover { transform:translateY(-2px); background:var(--brand);\n             border-color:var(--brand); color:#fff; }\n.btn .arrow { transition:transform .3s var(--ease); }\n.btn:hover .arrow { transform:translateX(4px); }\n.btn.ghost { background:transparent; color:var(--text-primary);\n             border-color:var(--border-mid); }\n.btn.ghost:hover { background:transparent; color:var(--text-primary);\n                   border-color:var(--text-primary); }\n.btn.sm { height:44px; padding-inline:20px; font-size:.93rem; }\n.btn.inv { background:var(--bg-primary); color:var(--text-primary); }\n.btn.inv:hover { background:var(--brand); color:#fff; }\n.acciones { display:flex; gap:var(--s-3); flex-wrap:wrap;\n            margin-top:var(--s-7); }\n\n/* --- imagen: pieza editorial, no adorno --------------------------------- */\n.img { border-radius:var(--radius-img); overflow:hidden; background:var(--bg-secondary);\n       position:relative; }\n.img svg { width:100%; height:auto; transform:scale(1.03); opacity:.82;\n           transition:transform 1.2s var(--ease), opacity .9s var(--ease); }\n.img.on svg { transform:none; opacity:1; }\n.pie { font-family:var(--mono); font-size:.78rem; color:var(--text-tertiary);\n       margin-top:var(--s-4); }\n\n/* --- hero: un mensaje, aire, y una imagen con peso ---------------------- */\n.hero { padding-block:clamp(var(--s-9), 8vw, 150px) 0; }\n.hero h1 { max-width:15ch; }\n.hero .lead { max-width:46ch; margin-top:var(--s-6); }\n/* la imagen se sale del contenedor de texto y ocupa mas ancho que el */\n.hero-img { max-width:var(--page); margin-inline:auto;\n            padding-inline:clamp(12px, 2.4vw, 36px); margin-top:clamp(56px,6vw,104px); }\n\n/* --- bloques de texto e imagen, asimetricos ----------------------------- */\n.split { display:grid; grid-template-columns:41fr 59fr; gap:clamp(32px,5vw,88px);\n         align-items:center; }\n.split.flip { grid-template-columns:59fr 41fr; }\n.split.flip .col-txt { order:2; }\n@media (max-width:900px){ .split, .split.flip { grid-template-columns:1fr; }\n  .split.flip .col-txt { order:0; } }\n\n/* --- secuencia editorial numerada --------------------------------------- */\n.seq { margin-top:clamp(var(--s-8), 6vw, var(--s-10)); }\n.seq-item { display:grid; grid-template-columns:auto 1fr; gap:0 clamp(24px,4vw,64px);\n  padding-block:clamp(var(--s-6), 3.4vw, var(--s-7));\n  border-top:1px solid var(--border-light); align-items:start; }\n.seq-item:last-child { border-bottom:1px solid var(--border-light); }\n.seq-num { font-family:var(--mono); font-size:.82rem; color:var(--text-tertiary);\n           padding-top:6px; min-width:32px; }\n.seq-item.hot .seq-num { color:var(--brand-dark); }\n.seq-body { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);\n            gap:clamp(10px,3vw,56px); align-items:baseline; }\n@media (max-width:820px){ .seq-body { grid-template-columns:1fr; gap:10px; } }\n.seq-body p { margin:0; color:var(--text-secondary); }\n.bg-dark .seq-item { border-color:var(--border-dark); }\n\n/* --- comparativa editorial: sin caja, lineas finas, mucho aire ---------- */\n.tabla { width:100%; border-collapse:collapse; margin-top:clamp(40px,5vw,64px); }\n.tabla th, .tabla td { text-align:left; padding:clamp(18px,2.2vw,26px) var(--s-6)\n  clamp(18px,2.2vw,26px) 0; border-bottom:1px solid var(--border-light);\n  vertical-align:baseline; }\n.tabla th:last-child, .tabla td:last-child { padding-right:0; }\n.tabla thead th { font-family:var(--mono); font-size:.74rem; font-weight:500;\n  letter-spacing:.11em; text-transform:uppercase; color:var(--text-tertiary);\n  padding-top:0; }\n.tabla tbody tr:last-child td { border-bottom:0; }\n.tabla td { color:var(--text-secondary); }\n.tabla td.destacado { font-family:var(--sans); font-weight:600; font-size:1.12rem;\n                      color:var(--text-primary); }\n.tabla td.dato { text-align:right; font-family:var(--mono); white-space:nowrap;\n                 color:var(--text-primary); }\n.tabla .idx { font-family:var(--mono); color:var(--text-tertiary); font-size:.9rem; }\n.tw { overflow-x:auto; }\n\n/* --- cifras: grandes, editoriales --------------------------------------- */\n.cifras { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr));\n          gap:clamp(36px,4.5vw,72px); margin-top:clamp(var(--s-8),6vw,var(--s-10)); }\n.cifra .n {
