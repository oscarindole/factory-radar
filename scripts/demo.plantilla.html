<title>Demo Factory · Torrelavega</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
/* ---------------------------------------------------------------------------
   Panel de RADACTORY. El sistema visual sale de panel/src/estilo/tokens.css.

   OSCURO POR DEFECTO y a proposito: esto se mira en una oficina de planta con
   luz de nave y en una pantalla colgada en el taller. No sigue el tema del
   navegador; el interruptor esta en la propia aplicacion, como lo estara en el
   producto. Todo color se declara explicitamente para que la pagina se sostenga
   sobre cualquier fondo del anfitrion.
--------------------------------------------------------------------------- */
:root {
  --fondo:#0E1116; --fondo-2:#161D22; --fondo-3:#1D262C; --linea:#27333A;
  --texto:#E8EDF2; --texto-2:#93A1B0; --texto-3:#6B7A85;
  --critica:#E5484D; --alta:#F5A524; --media:#3E9EFF; --baja:#7C8794; --bien:#46C68A;
  --dato:#FFFFFF; --base-linea:#93A1B0;
  /* Series categoricas: azul · verde-agua · violeta. Validadas con el script de
     la guia (banda de luminosidad, croma, separacion para daltonismo y
     contraste sobre fondo oscuro). NO se reutiliza ningun color de severidad:
     esos estan reservados para el estado, no para la identidad de una serie. */
  --s1:#3987e5; --s2:#199e70; --s3:#9085e9;
  --r:3px;
  --f:"Archivo","Helvetica Neue",Arial,sans-serif;
  --m:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
:root[data-tema="claro"] {
  --fondo:#F2F4F6; --fondo-2:#FFFFFF; --fondo-3:#E8ECEF; --linea:#D3DAE0;
  --texto:#10161B; --texto-2:#4A5A66; --texto-3:#74848F;
  --critica:#C0281D; --alta:#A2620A; --media:#14639E; --baja:#64717B; --bien:#12764C;
  --dato:#000000; --base-linea:#74848F;
  --s1:#2a78d6; --s2:#1baf7a; --s3:#4a3aa7;
}
* { box-sizing:border-box; }
body { background:var(--fondo); color:var(--texto); font-family:var(--f);
       font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased; }
:focus-visible { outline:2px solid var(--alta); outline-offset:2px; }
.cifra, table td, .m, tspan { font-variant-numeric:tabular-nums; }
.m { font-family:var(--m); }

/* --- armazon -------------------------------------------------------------- */
.app { display:grid; grid-template-columns:212px minmax(0,1fr); min-height:100vh; }
.lat { background:var(--fondo-2); border-right:1px solid var(--linea);
       display:flex; flex-direction:column; position:sticky; top:0; height:100vh; }
.marca { padding:16px 18px 14px; border-bottom:1px solid var(--linea); }
/* El rosa de marca aparece SOLO aqui. En el resto del panel el color es
   informacion —critica, alta, media— y mezclarlo con el corporativo hace que
   una alarma y un logotipo se lean igual. */
.marca .fila-marca { display:flex; align-items:center; gap:9px; }
.marca .logo { width:22px; height:22px; flex:0 0 auto; border-radius:2px; }
/* Simbolo monocromo: el cuadro toma la tinta del panel y el monograma se cala
   con el fondo. En un panel donde el color ES informacion —critica, alta,
   media— el logotipo no debe aportar un color mas. */
.marca { --mark-cut:var(--fondo-2); }
.marca b { font-size:.78rem; font-weight:800; letter-spacing:.1em; color:var(--texto); }
.marca span { font-family:var(--m); font-size:.6rem; color:var(--texto-3);
              display:block; margin-top:5px; letter-spacing:.05em; }
.menu { padding:10px 0; flex:1; overflow-y:auto; }
.menu a { display:flex; justify-content:space-between; align-items:center; gap:8px;
  padding:7px 18px; color:var(--texto-2); text-decoration:none; font-size:.83rem;
  border-left:2px solid transparent; }
.menu a:hover { color:var(--texto); background:var(--fondo-3); }
.menu a.on { color:var(--texto); border-left-color:var(--alta); background:var(--fondo-3);
             font-weight:600; }
.menu a .n { font-family:var(--m); font-size:.62rem; padding:1px 5px; border-radius:8px;
             background:var(--critica); color:#fff; }
.menu .sep { font-family:var(--m); font-size:.56rem; letter-spacing:.14em;
  text-transform:uppercase; color:var(--texto-3); padding:14px 18px 5px; }
.pie { border-top:1px solid var(--linea); padding:11px 18px; display:flex;
       justify-content:space-between; align-items:center; }
.pie button { background:none; border:1px solid var(--linea); color:var(--texto-2);
  font-family:var(--m); font-size:.62rem; padding:4px 8px; border-radius:var(--r);
  cursor:pointer; }
.pie button:hover { color:var(--texto); border-color:var(--texto-3); }

main { padding:22px clamp(18px,3vw,34px) 80px; min-width:0; }
.cab { display:flex; justify-content:space-between; align-items:flex-end; gap:16px;
       flex-wrap:wrap; margin-bottom:20px; }
h1 { font-size:1.42rem; font-weight:700; letter-spacing:-.02em; margin:0; }
h2 { font-size:.96rem; font-weight:700; margin:30px 0 10px; letter-spacing:-.01em; }
h2:first-child { margin-top:0; }
.sub { font-family:var(--m); font-size:.66rem; color:var(--texto-3); letter-spacing:.06em; }

/* --- cifras --------------------------------------------------------------- */
.kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(132px,1fr));
        gap:1px; background:var(--linea); border:1px solid var(--linea); }
.kpi { background:var(--fondo-2); padding:13px 15px 12px; }
.kpi .k { font-family:var(--m); font-size:.57rem; letter-spacing:.11em;
          text-transform:uppercase; color:var(--texto-3); margin-bottom:8px; }
.kpi .v { font-size:1.8rem; font-weight:700; letter-spacing:-.035em; line-height:1;
          color:var(--dato); }
.kpi .v small { font-size:.95rem; font-weight:600; }
.kpi .d { font-family:var(--m); font-size:.64rem; margin-top:6px; color:var(--texto-2); }
.kpi .d.bien { color:var(--bien); } .kpi .d.mal { color:var(--critica); }
.kpi .d.ojo { color:var(--alta); }
.kpi .vacio { color:var(--texto-3); font-size:1.4rem; }

/* --- alertas -------------------------------------------------------------- */
.lista { border:1px solid var(--linea); background:var(--fondo-2); }
.fila { display:grid; grid-template-columns:3px 74px minmax(0,1fr) auto;
  gap:0 14px; align-items:start; padding:13px 15px 13px 0; width:100%;
  text-align:left; background:none; border:0; border-top:1px solid var(--linea);
  cursor:pointer; color:inherit; font-family:inherit; }
.fila:first-child { border-top:0; }
.fila:hover { background:var(--fondo-3); }
.fila .st { align-self:stretch; border-radius:0 2px 2px 0; }
.fila.critica .st{background:var(--critica)} .fila.alta .st{background:var(--alta)}
.fila.media .st{background:var(--media)} .fila.baja .st{background:var(--baja)}
.sev { font-family:var(--m); font-size:.57rem; letter-spacing:.1em; text-transform:uppercase;
       padding-top:3px; display:flex; align-items:center; gap:4px; }
.fila.critica .sev{color:var(--critica)} .fila.alta .sev{color:var(--alta)}
.fila.media .sev{color:var(--media)} .fila.baja .sev{color:var(--baja)}
.fila .t { font-size:.9rem; font-weight:600; letter-spacing:-.005em; }
.fila .s { font-family:var(--m); font-size:.69rem; color:var(--texto-2); line-height:1.5;
           margin-top:4px; }
.fila .eur { font-family:var(--m); font-size:.78rem; font-weight:600; color:var(--alta);
             white-space:nowrap; text-align:right; padding-top:2px; }
.fila .eur em { display:block; font-style:normal; font-size:.6rem; color:var(--texto-3);
                font-weight:400; margin-top:2px; }

/* --- bloques -------------------------------------------------------------- */
.caja { border:1px solid var(--linea); background:var(--fondo-2); padding:16px 18px;
        margin:16px 0; }
.caja h3 { font-family:var(--m); font-size:.6rem; letter-spacing:.13em;
  text-transform:uppercase; color:var(--texto-3); margin:0 0 9px; font-weight:600; }
.caja p { margin:0 0 9px; font-size:.9rem; max-width:78ch; }
.caja p:last-child { margin-bottom:0; }
.cuenta { font-family:var(--m); font-size:.73rem; line-height:1.85; background:var(--fondo-3);
  border-left:2px solid var(--alta); padding:11px 14px; overflow-x:auto; color:var(--texto-2); }
.cuenta b { color:var(--dato); font-weight:600; }
.cuenta i { color:var(--alta); font-style:normal; font-weight:600; }
.fuentes { font-family:var(--m); font-size:.65rem; color:var(--texto-3); line-height:1.8;
  border-top:1px solid var(--linea); margin-top:14px; padding-top:11px; }
.fuentes em { font-style:normal; color:var(--media); }
.btns { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
.btns button { font-family:var(--m); font-size:.68rem; padding:7px 12px;
  border:1px solid var(--linea); background:none; color:var(--texto); border-radius:var(--r);
  cursor:pointer; }
.btns button.pri { border-color:var(--alta); color:var(--alta); }
.btns button:hover { background:var(--fondo-3); }

/* Compartir. WhatsApp va el primero a proposito: en una planta española el
   jefe de turno avisa por WhatsApp, no por correo. Ponerlo detras de un menu
   es no haber pisado una nave. */
.compartir { display:flex; align-items:center; gap:8px; flex-wrap:wrap;
             margin-top:12px; padding-top:12px; border-top:1px solid var(--linea); }
.compartir .et { font-family:var(--m); font-size:.6rem; letter-spacing:.13em;
                 text-transform:uppercase; color:var(--texto-3); margin-right:2px; }
.compartir a, .compartir button { display:inline-flex; align-items:center; gap:7px;
  font-family:var(--m); font-size:.68rem; padding:7px 12px; border-radius:var(--r);
  border:1px solid var(--linea); background:none; color:var(--texto-2);
  text-decoration:none; cursor:pointer; }
.compartir a:hover, .compartir button:hover { color:var(--texto); border-color:var(--texto-3); }
.compartir svg { width:13px; height:13px; flex:0 0 auto; }
.compartir .wa:hover { color:#25D366; border-color:#25D366; }
.compartir .hecho { color:var(--bien); border-color:var(--bien); }

/* --- tablas --------------------------------------------------------------- */
.tw { overflow-x:auto; border:1px solid var(--linea); margin:14px 0; }
table { border-collapse:collapse; width:100%; font-size:.82rem; }
th,td { text-align:left; padding:8px 13px; border-bottom:1px solid var(--linea); }
thead th { font-family:var(--m); font-size:.58rem; letter-spacing:.1em; text-transform:uppercase;
  color:var(--texto-3); background:var(--fondo-3); white-space:nowrap; font-weight:600; }
tbody tr:last-child td { border-bottom:0; }
tbody tr { background:var(--fondo-2); }
td.n, th.n { text-align:right; font-family:var(--m); white-space:nowrap; }
td .barra { display:block; height:5px; background:var(--s1); border-radius:2px; margin-top:4px; }
td .barra.aviso { background:var(--alta); }

/* --- salud ---------------------------------------------------------------- */
.salud { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:6px 12px;
         align-items:center; font-size:.8rem; }
.salud .lab { font-family:var(--m); font-size:.63rem; color:var(--texto-2); }
.salud .bar { height:6px; background:var(--fondo-3); border-radius:3px; overflow:hidden; }
.salud .bar i { display:block; height:100%; background:var(--s1); border-radius:3px; }
.salud .val { font-family:var(--m); font-size:.72rem; color:var(--dato); }
.score { font-size:2.4rem; font-weight:800; letter-spacing:-.04em; line-height:1; }
.score small { font-size:.9rem; font-weight:600; color:var(--texto-3); }

/* --- graficas ------------------------------------------------------------- */
.viz { border:1px solid var(--linea); background:var(--fondo-2); padding:14px 16px 10px;
       margin:14px 0; position:relative; }
.viz .titulo { font-size:.86rem; font-weight:600; margin-bottom:2px; }
.viz .nota { font-family:var(--m); font-size:.63rem; color:var(--texto-3); margin-bottom:10px; }
.viz svg { display:block; width:100%; overflow:visible; }
.leyenda { display:flex; gap:14px; flex-wrap:wrap; font-family:var(--m); font-size:.65rem;
           color:var(--texto-2); margin-top:8px; }
.leyenda span { display:flex; align-items:center; gap:6px; }
.leyenda i { width:11px; height:3px; border-radius:2px; display:block; }
.leyenda i.disc { height:0; border-top:2px dashed var(--base-linea); }
.tip { position:absolute; pointer-events:none; background:var(--fondo-3);
  border:1px solid var(--linea); border-radius:var(--r); padding:7px 10px;
  font-family:var(--m); font-size:.66rem; color:var(--texto); white-space:nowrap;
  box-shadow:0 4px 14px rgba(0,0,0,.35); opacity:0; transition:opacity .1s; z-index:9; }
.tip b { color:var(--dato); }
.tip .sw { display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:5px; }

/* --- copilot -------------------------------------------------------------- */
.chat { max-width:76ch; }
.pregunta { background:var(--fondo-3); border:1px solid var(--linea); padding:10px 14px;
  border-radius:var(--r); font-size:.88rem; margin:14px 0 0; }
.pregunta .q { font-family:var(--m); font-size:.6rem; letter-spacing:.11em;
  text-transform:uppercase; color:var(--texto-3); margin-bottom:5px; }
.sugerencias { display:flex; flex-wrap:wrap; gap:8px; margin:14px 0; }
.sugerencias button { font-size:.78rem; padding:7px 12px; border:1px solid var(--linea);
  background:var(--fondo-2); color:var(--texto-2); border-radius:14px; cursor:pointer;
  font-family:inherit; text-align:left; }
.sugerencias button:hover { color:var(--texto); border-color:var(--texto-3); }

.vacio-est { border:1px dashed var(--linea); padding:22px; text-align:center;
  color:var(--texto-3); font-size:.85rem; }
.aviso-dato { border-left:3px solid var(--alta); background:var(--fondo-2);
  padding:11px 14px; margin:14px 0; font-size:.84rem; }
.aviso-dato b { display:block; font-family:var(--m); font-size:.58rem; letter-spacing:.12em;
  text-transform:uppercase; color:var(--alta); margin-bottom:4px; }

@media (max-width:860px) {
  .app { grid-template-columns:1fr; }
  .lat { position:static; height:auto; }
  .menu { display:flex; flex-wrap:wrap; padding:8px; }
  .menu .sep { display:none; }
  .menu a { border-left:0; border-bottom:2px solid transparent; padding:6px 11px; }
  .menu a.on { border-left:0; border-bottom-color:var(--alta); }
  .fila { grid-template-columns:3px minmax(0,1fr); }
  .fila .sev { grid-column:2; } .fila .eur { grid-column:2; text-align:left; padding-top:6px; }
}
</style>

<div class="app">
  <aside class="lat">
    <div class="marca"><div class="fila-marca"><svg class="logo" viewBox="0 0 100 100" role="img" aria-label="RADACTORY"><rect width="100" height="100" fill="currentColor"/><path fill="var(--mark-cut,#FFFFFF)" d="M8 20 H86 V42 H30 V84 H8 Z"/><path fill="var(--mark-cut,#FFFFFF)" d="M46 42 H68 L88 84 H64 Z"/></svg><b>RADACTORY</b></div><span id="planta-nom"></span></div>
    <nav class="menu" id="menu"></nav>
    <div class="pie">
      <span class="m" style="font-size:.6rem;color:var(--texto-3)">DEMO</span>
      <button id="tema" type="button">tema</button>
    </div>
  </aside>
  <main id="vista"></main>
</div>

<script>/*__DATOS__*/</script>
<script>
(function () {
  "use strict";
  const D = window.__DEMO__;
  const vista = document.getElementById('vista');
  const menuEl = document.getElementById('menu');

  // --- formato -------------------------------------------------------------
  const nf = (n, d = 0) => n === null || n === undefined || Number.isNaN(+n)
    ? '—' : (+n).toLocaleString('es-ES', { minimumFractionDigits: d, maximumFractionDigits: d });
  const pct = (n, d = 1) => n === null || n === undefined ? '—' : nf(+n * 100, d) + '%';
  const eur = (n, d = 0) => n === null || n === undefined ? null : nf(n, d) + ' €';
  const fecha = (s) => new Date(s).toLocaleDateString('es-ES', { day: 'numeric', month: 'short' });
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  const SEVS = { critica: 'Crítica', alta: 'Alta', media: 'Media', baja: 'Baja' };
  const ICONO = { critica: '■', alta: '▲', media: '●', baja: '–' };
  const COLOR_LINEA = { L1: 'var(--s1)', L2: 'var(--s2)', L3: 'var(--s3)' };

  // -------------------------------------------------------------------------
  // GRAFICA DE LINEAS
  //
  // Reglas que se aplican aqui y no se negocian:
  //  · el hueco se dibuja COMO HUECO. Si faltan dias (domingos, paradas), la
  //    linea se parte. Unirla por encima de un vacio es inventarse un dato.
  //  · la linea base siempre presente y discontinua.
  //  · maximo cuatro series, con etiqueta directa ademas de leyenda: el color
  //    nunca es el unico portador de identidad.
  // -------------------------------------------------------------------------
  function grafLineas(cfg) {
    const W = 760, H = cfg.alto || 210, P = { t: 14, r: 54, b: 26, l: 40 };
    const todos = cfg.series.flatMap((s) => s.puntos.map((p) => p.y)).filter((v) => v != null);
    if (!todos.length) return `<div class="vacio-est">Sin datos para este periodo.</div>`;

    let min = Math.min(...todos), max = Math.max(...todos);
    if (cfg.base != null) { min = Math.min(min, cfg.base); max = Math.max(max, cfg.base); }
    const pad = (max - min) * 0.18 || 0.05;
    min = cfg.desdeCero ? 0 : min - pad; max = max + pad;

    const xs = cfg.series[0].puntos.map((p) => p.x);
    const X = (i) => P.l + (i / Math.max(1, xs.length - 1)) * (W - P.l - P.r);
    const Y = (v) => P.t + (1 - (v - min) / (max - min || 1)) * (H - P.t - P.b);

    let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(cfg.alt || cfg.titulo)}">`;
    // rejilla recesiva
    for (let k = 0; k <= 3; k++) {
      const v = min + (k / 3) * (max - min), y = Y(v);
      svg += `<line x1="${P.l}" y1="${y}" x2="${W - P.r}" y2="${y}" style="stroke:var(--linea)" stroke-width="1"/>`;
      svg += `<text x="${P.l - 7}" y="${y + 3.5}" text-anchor="end" font-size="9"
               style="font-family:var(--m);fill:var(--texto-3)">${cfg.fmtY ? cfg.fmtY(v) : nf(v, 0)}</text>`;
    }
    if (cfg.base != null) {
      svg += `<line x1="${P.l}" y1="${Y(cfg.base)}" x2="${W - P.r}" y2="${Y(cfg.base)}"
               style="stroke:var(--base-linea)" stroke-width="1.5" stroke-dasharray="5 4"/>
              <text x="${W - P.r + 5}" y="${Y(cfg.base) + 3}" font-size="9"
               style="font-family:var(--m);fill:var(--base-linea)">base</text>`;
    }
    if (cfg.marca != null) {
      const mx = X(cfg.marca.i);
      svg += `<line x1="${mx}" y1="${P.t - 6}" x2="${mx}" y2="${H - P.b}" style="stroke:var(--alta)"
               stroke-width="1" stroke-dasharray="2 3"/>
              <text x="${mx + 4}" y="${P.t - 1}" font-size="9"
               style="font-family:var(--m);fill:var(--alta)">${esc(cfg.marca.texto)}</text>`;
    }

    cfg.series.forEach((s) => {
      let d = '', abierto = false;
      s.puntos.forEach((p, i) => {
        if (p.y == null) { abierto = false; return; }   // hueco: se corta el trazo
        d += (abierto ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.y).toFixed(1) + ' ';
        abierto = true;
      });
      svg += `<path d="${d}" fill="none" style="stroke:${s.color}" stroke-width="2"
               stroke-linejoin="round" stroke-linecap="round"/>`;
      // etiqueta directa al final: identidad sin depender del color
      const ult = [...s.puntos].reverse().find((p) => p.y != null);
      if (ult) {
        const i = s.puntos.lastIndexOf(ult);
        svg += `<circle cx="${X(i)}" cy="${Y(ult.y)}" r="3.5"
                 style="fill:${s.color};stroke:var(--fondo-2)" stroke-width="2"/>
                <text x="${X(i) + 7}" y="${Y(ult.y) + 3.5}" font-size="10" font-weight="600"
                 style="font-family:var(--m);fill:${s.color}">${esc(s.nombre)}</text>`;
      }
    });

    // eje X: solo tres marcas, para no saturar
    [0, Math.floor(xs.length / 2), xs.length - 1].forEach((i) => {
      if (i < 0 || i >= xs.length) return;
      svg += `<text x="${X(i)}" y="${H - 8}" text-anchor="middle" font-size="9"
               style="font-family:var(--m);fill:var(--texto-3)">${esc(xs[i])}</text>`;
    });
    svg += `<line class="cruz" x1="0" y1="${P.t}" x2="0" y2="${H - P.b}" style="stroke:var(--texto-3)"
             stroke-width="1" opacity="0"/>`;
    svg += `<rect class="captura" x="${P.l}" y="0" width="${W - P.l - P.r}" height="${H}" fill="transparent"/>`;
    svg += '</svg>';

    return { svg, X, Y, xs, P, W, H };
  }

  function pintarLineas(cont, cfg) {
    const g = grafLineas(cfg);
    if (typeof g === 'string') { cont.innerHTML = g; return; }
    cont.innerHTML = g.svg + `<div class="leyenda">` +
      cfg.series.map((s) => `<span><i style="background:${s.color}"></i>${esc(s.nombre)}</span>`).join('') +
      (cfg.base != null ? `<span><i class="disc"></i>línea base</span>` : '') +
      `</div><div class="tip"></div>`;

    // Capa de interaccion: cruz + tooltip. Una grafica HTML sin hover deja al
    // usuario adivinando el valor exacto, que es justo lo que no queremos.
    const svg = cont.querySelector('svg');
    const cruz = svg.querySelector('.cruz');
    const cap = svg.querySelector('.captura');
    const tip = cont.querySelector('.tip');

    cap.addEventListener('mousemove', (e) => {
      const caja = svg.getBoundingClientRect();
      const rel = ((e.clientX - caja.left) / caja.width) * g.W;
      let i = Math.round(((rel - g.P.l) / (g.W - g.P.l - g.P.r)) * (g.xs.length - 1));
      i = Math.max(0, Math.min(g.xs.length - 1, i));
      cruz.setAttribute('x1', g.X(i)); cruz.setAttribute('x2', g.X(i));
      cruz.setAttribute('opacity', '.55');
      tip.innerHTML = `<b>${esc(g.xs[i])}</b><br>` + cfg.series.map((s) => {
        const p = s.puntos[i];
        return `<span class="sw" style="background:${s.color}"></span>${esc(s.nombre)} ` +
               (p && p.y != null ? `<b>${cfg.fmtTip ? cfg.fmtTip(p.y) : nf(p.y, 2)}</b>`
                                 : '<span style="color:var(--texto-3)">sin dato</span>');
      }).join('<br>');
      tip.style.opacity = '1';
      const px = (g.X(i) / g.W) * caja.width;
      tip.style.left = Math.min(caja.width - 170, Math.max(0, px + 12)) + 'px';
      tip.style.top = '22px';
    });
    cap.addEventListener('mouseleave', () => {
      cruz.setAttribute('opacity', '0'); tip.style.opacity = '0';
    });
  }

  // --- barras horizontales (magnitud, categorias con nombre largo) ----------
  function barras(filas, opts = {}) {
    const max = Math.max(...filas.map((f) => f.valor), 1);
    return `<div class="tw"><table><thead><tr>
      <th>${esc(opts.col || 'Concepto')}</th><th class="n">${esc(opts.unidad || '')}</th>
      </tr></thead><tbody>` + filas.map((f) => `
      <tr><td>${esc(f.etiqueta)}${f.nota ? ` <span class="m" style="font-size:.62rem;color:var(--texto-3)">${esc(f.nota)}</span>` : ''}
        <span class="barra${f.destacar ? ' aviso' : ''}" style="width:${(f.valor / max) * 100}%"></span></td>
        <td class="n">${esc(f.texto ?? nf(f.valor, 1))}</td></tr>`).join('') +
      `</tbody></table></div>`;
  }

  // -------------------------------------------------------------------------
  // PANTALLAS
  // -------------------------------------------------------------------------
  const P = {};

  P.estado = () => {
    const I = D.indicadores;
    const rechazo = I.uds_nok / (I.uds_ok + I.uds_nok);
    const impacto = D.alertas.reduce((a, x) =>
      a + (x.impacto_eur_anual ? x.impacto_eur_anual / 12 : 0)
        + (+(x.impacto_base?.coste_incurrido_eur) || 0), 0);
    const criticas = D.activos.filter((a) => a.score != null && a.score < 55).length;
    const top = D.alertas.slice(0, 5);

    return `
      <div class="cab">
        <div><h1>Estado de planta</h1>
          <div class="sub">${esc(D.planta.nombre)} · miércoles 9 de septiembre · 07:41 · turno de mañana</div></div>
      </div>

      <div class="kpis">
        ${kpi('Producción 7 d', nf(I.uds_ok, 0), '', 'uds conformes')}
        ${kpi('OEE', pct(I.oee, 0), delta(I.oee, I.oee_prev, true, 'pts', 100), 'ponderado por tiempo')}
        ${kpi('Calidad', pct(I.cal, 1), delta(I.cal, I.cal_prev, true, 'pts', 100), '')}
        ${kpi('Rechazos', pct(rechazo, 1), delta(rechazo, I.rechazo_prev, false, 'pts', 100), '')}
        ${kpi('Energía / ud', nf(I.kwh_ud, 3), delta(I.kwh_ud, I.kwh_ud_prev, false, '%', null, true), 'kWh por unidad')}
        ${kpi('Activos en riesgo', criticas, '', 'salud < 55')}
      </div>

      <h2>Atención hoy <span class="sub" style="font-weight:400">
        ${top.length} de ${D.alertas.length} · <a href="#/alertas" style="color:var(--media)">ver todas</a></span></h2>
      <div class="lista">${top.map(filaAlerta).join('')}</div>

      <div class="kpis" style="margin-top:16px">
        <div class="kpi" style="grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:10px">
          <div><div class="k">Impacto detectado este mes</div>
            <div class="v" style="color:var(--alta)">${eur(impacto)}</div></div>
          <div class="d">suma de las pérdidas anuales prorrateadas más el coste ya incurrido.
            Cada cifra abre su cuenta.</div>
        </div>
      </div>

      <div class="aviso-dato">
        <b>Calidad del dato</b>
        El <strong>${nf(I.pct_sin_causa, 1)}%</strong> de las paradas no tiene causa registrada.
        Sin causa podemos medir cuánto se pierde, pero no diagnosticar por qué.
        Es el primer trabajo del piloto, y se dice aquí en vez de disimularlo.
      </div>`;
  };

  const kpi = (k, v, d, pie) => `<div class="kpi"><div class="k">${esc(k)}</div>
    <div class="v">${v}</div><div class="d ${d ? d.clase : ''}">${d ? d.txt : esc(pie)}</div></div>`;

  function delta(act, prev, subirBien, unidad, escala, relativo) {
    if (act == null || prev == null) return { txt: '—', clase: '' };
    const dif = relativo ? ((act - prev) / prev) * 100 : (act - prev) * (escala || 1);
    if (Math.abs(dif) < 0.05) return { txt: 'sin cambio', clase: '' };
    const bien = (dif > 0) === subirBien;
    return { txt: `${dif > 0 ? '▲' : '▼'} ${nf(Math.abs(dif), 1)} ${unidad} vs 30 d`,
             clase: bien ? 'bien' : 'mal' };
  }

  function filaAlerta(a) {
    const imp = a.impacto_eur_anual != null
      ? `${eur(a.impacto_eur_anual)}<em>al año</em>`
      : (a.impacto_base?.coste_incurrido_eur != null
          ? `${eur(a.impacto_base.coste_incurrido_eur)}<em>ya incurridos</em>` : '—');
    return `<button class="fila ${a.severidad}" onclick="location.hash='#/alerta/${a.id}'">
      <span class="st"></span>
      <span class="sev">${ICONO[a.severidad]} ${SEVS[a.severidad]}</span>
      <span><span class="t">${esc(a.titulo)}</span>
        <span class="s">${esc(a.por_que || a.que_cambio)}</span></span>
      <span class="eur">${imp}</span></button>`;
  }

  P.alertas = () => `
    <div class="cab"><div><h1>Alertas</h1>
      <div class="sub">${D.alertas.length} abiertas · ordenadas por severidad e impacto</div></div></div>
    <div class="lista">${D.alertas.map(filaAlerta).join('')}</div>
    <div class="caja"><h3>Por qué solo hay una crítica</h3>
      <p>El motor no puede emitir más de cinco críticas por planta y semana. Si genera más,
      el problema es de calibración y se avisa en el panel interno, en vez de inundar la
      bandeja. Una bandeja con cuarenta críticas es una bandeja cerrada.</p></div>`;

  P.alerta = (id) => {
    const a = D.alertas.find((x) => x.id === id);
    if (!a) return `<div class="vacio-est">Esa alerta no existe.</div>`;
    const cuenta = a.impacto_base || {};
    const ETQ = {
      formula: 'Fórmula', nota: 'Nota', eur_semana: 'Pérdida por semana (€)',
      turnos_afectados: 'Turnos afectados', detalle: null,
      kw: 'Potencia media (kW)', horas_semana: 'Horas por semana',
      semanas_anio: 'Semanas productivas al año', kwh_anio: 'kWh al año',
      precio_kwh: 'Precio del kWh (contrato de la planta)',
      coste_incurrido_eur: 'Coste ya incurrido (€)', uds_rechazadas: 'Unidades rechazadas',
      pct_sobre_producto: '% sobre los rechazos del producto',
      lotes_en_ventana: 'Lotes distintos en la ventana', dias_ventana: 'Días de la ventana',
    };
    const filas = Object.entries(cuenta)
      .filter(([k]) => k !== 'detalle')
      .map(([k, v]) => `${ETQ[k] || k} <b>${esc(typeof v === 'number' ? nf(v, 2) : v)}</b>`);

    const det = Array.isArray(cuenta.detalle) ? cuenta.detalle : [];

    return `
      <div class="cab"><div>
        <div class="sub"><a href="#/alertas" style="color:var(--media)">← Alertas</a></div>
        <h1>${esc(a.titulo)}</h1>
        <div class="sub">${ICONO[a.severidad]} ${SEVS[a.severidad]} · confianza ${a.confianza}%
          · detectado el ${fecha(a.detectado_en)} · módulo ${esc(a.modulo)}</div>
      </div></div>

      <div class="caja"><h3>Qué ha cambiado</h3><p>${esc(a.que_cambio)}</p></div>
      ${a.por_que ? `<div class="caja"><h3>Por qué · causa probable</h3><p>${esc(a.por_que)}</p></div>` : ''}
      ${a.nodo_codigo === 'L3.P4' ? `<div class="viz" id="viz-alerta"></div>` : ''}
      ${a.nodo_codigo === 'COMP-02' ? `<div class="viz" id="viz-alerta"></div>` : ''}

      <div class="caja"><h3>Cuánto cuesta ${a.impacto_eur_anual != null
        ? '· ' + eur(a.impacto_eur_anual) + ' al año'
        : (cuenta.coste_incurrido_eur ? '· ' + eur(cuenta.coste_incurrido_eur) + ' ya incurridos' : '')}</h3>
        <div class="cuenta">${filas.join('<br>')}</div>
        ${det.length ? `<div style="margin-top:10px" class="sub">Desglose por turno</div>
          <div class="tw"><table><thead><tr><th>Turno</th><th>Producto</th>
            <th class="n">Caída</th><th class="n">Uds/semana</th><th class="n">€/semana</th></tr></thead>
            <tbody>${det.map((d) => `<tr><td>${esc(d.turno)}</td><td>${esc(d.producto ?? '—')}</td>
              <td class="n">${pct(d.caida_rendimiento, 1)}</td>
              <td class="n">${nf(d.uds_perdidas_semana, 0)}</td>
              <td class="n">${eur(d.uds_perdidas_semana * d.margen_unitario)}</td></tr>`).join('')}
            </tbody></table></div>` : ''}
      </div>

      ${a.accion_recomendada ? `<div class="caja"><h3>Qué hacer</h3>
        <p>${esc(a.accion_recomendada)}</p>
        <div class="btns"><button class="pri" type="button">Crear orden de mantenimiento</button>
          <button type="button">Avisar a producción</button>
          <button type="button">Descartar</button></div>
        ${compartir(a)}
        <div class="fuentes">FUENTES · ${(a.evidencia || []).map((e) =>
          `<em>${esc(Object.entries(e).map(([k, v]) => k === 'tipo' ? v : `${k}=${v}`).join(' '))}</em>`
          ).join(' · ')}<br>
          ¿HA SIDO ÚTIL? &nbsp; Sí · No era nada · Ya lo sabía</div>
      </div>` : ''}`;
  };

  // -------------------------------------------------------------------------
  // COMPARTIR UNA ALERTA
  //
  // El mensaje se arma con lo que hace util a la alerta: que cambio, por que,
  // cuanto cuesta y que hacer. Sin eso, compartir una alerta es reenviar un
  // titular y obligar al que lo recibe a abrir el panel para enterarse.
  //
  // wa.me es el enlace universal de WhatsApp: funciona en movil y en escritorio
  // y no necesita SDK, ni cookie, ni script de terceros.
  // -------------------------------------------------------------------------
  function textoAlerta(a) {
    const imp = a.impacto_eur_anual != null
      ? `${eur(a.impacto_eur_anual)} al año`
      : (a.impacto_base?.coste_incurrido_eur != null
          ? `${eur(a.impacto_base.coste_incurrido_eur)} ya incurridos` : 'sin cifrar');
    return [
      `RADACTORY · ${D.planta.nombre}`,
      `${ICONO[a.severidad]} ${SEVS[a.severidad].toUpperCase()} — ${a.titulo}`,
      '',
      `Qué ha cambiado: ${a.que_cambio}`,
      a.por_que ? `Por qué: ${a.por_que}` : null,
      `Impacto: ${imp}`,
      a.accion_recomendada ? `Qué hacer: ${a.accion_recomendada}` : null,
      '',
      `Detalle: ${location.href}`,
    ].filter(Boolean).join('\n');
  }

  window.__copiar = async (id) => {
    const a = D.alertas.find((x) => x.id === id);
    const boton = document.getElementById('btn-copiar');
    try {
      await navigator.clipboard.writeText(textoAlerta(a));
    } catch (e) {
      // Sin permiso de portapapeles —o sin HTTPS— se cae al metodo de siempre.
      const ta = document.createElement('textarea');
      ta.value = textoAlerta(a); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (_) {}
      ta.remove();
    }
    if (!boton) return;
    const antes = boton.innerHTML;
    boton.innerHTML = '✓ Copiado';
    boton.classList.add('hecho');
    setTimeout(() => { boton.innerHTML = antes; boton.classList.remove('hecho'); }, 2200);
  };

  function compartir(a) {
    const t = encodeURIComponent(textoAlerta(a));
    const asunto = encodeURIComponent(`${SEVS[a.severidad]} · ${a.titulo}`);
    return `<div class="compartir">
      <span class="et">Compartir</span>
      <a class="wa" href="https://wa.me/?text=${t}" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.5 14.4c-.3-.2-1.7-.9-2-1-.3-.1-.5-.2-.7.1-.2.3-.7 1-.9 1.2-.2.2-.3.2-.6.1-.3-.2-1.2-.5-2.3-1.4-.9-.8-1.4-1.7-1.6-2-.2-.3 0-.5.1-.6l.5-.5c.1-.2.2-.3.3-.5 0-.2 0-.4 0-.5 0-.2-.7-1.6-.9-2.2-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.4s1.1 2.8 1.2 3c.2.2 2.1 3.2 5.1 4.5.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.7-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.1-.3-.2-.6-.4z"/><path d="M12 2a10 10 0 0 0-8.5 15.2L2 22l4.9-1.5A10 10 0 1 0 12 2zm0 18.2c-1.6 0-3.1-.4-4.4-1.2l-.3-.2-3 .9.9-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2z"/></svg>
        WhatsApp</a>
      <a href="mailto:?subject=${asunto}&body=${t}">Correo</a>
      <button id="btn-copiar" type="button" onclick="window.__copiar('${a.id}')">Copiar</button>
    </div>`;
  }

  P.produccion = () => `
    <div class="cab"><div><h1>Producción</h1>
      <div class="sub">OEE desglosado · 45 días · ${D.planta.nombre}</div></div></div>

    <div class="kpis">
      ${kpi('Disponibilidad', pct(D.indicadores.disp, 0), '', 'tiempo en marcha')}
      ${kpi('Rendimiento', pct(D.indicadores.rend, 0), '', 'frente a ciclo nominal')}
      ${kpi('Calidad', pct(D.indicadores.cal, 1), '', 'a la primera')}
      ${kpi('OEE', pct(D.indicadores.oee, 0), '', 'D × R × C')}
    </div>
    <div class="caja"><h3>Por qué se enseña desglosado</h3>
      <p>Un OEE del ${pct(D.indicadores.oee, 0)} no dice nada. Ese mismo número abierto en
      ${pct(D.indicadores.disp, 0)} × ${pct(D.indicadores.rend, 0)} × ${pct(D.indicadores.cal, 0)}
      dice que el problema está en el rendimiento, y que hay que mirar tiempos de ciclo y
      microparadas, no averías.</p></div>

    <div class="viz" id="viz-oee"></div>
    <h2>Paradas por causa · 30 días</h2>
    ${barras(D.paradas.map((p) => ({
      etiqueta: p.causa, valor: +p.horas, texto: nf(p.horas, 1) + ' h',
      nota: `${p.n} paradas${p.planificada ? ' · planificada' : ''}`,
      destacar: p.causa === 'SIN CAUSA REGISTRADA',
    })), { col: 'Causa', unidad: 'Horas' })}
    <h2>Comparativa entre turnos</h2>
    <div class="tw"><table><thead><tr><th>Línea</th><th>Turno</th><th class="n">OEE</th>
      <th class="n">Rendimiento</th><th class="n">Turnos</th></tr></thead><tbody>
      ${D.turnos.map((t) => `<tr><td>${esc(t.codigo)}</td><td>${esc(t.turno)}</td>
        <td class="n">${pct(t.oee, 1)}</td><td class="n">${pct(t.rend, 1)}</td>
        <td class="n">${t.n}</td></tr>`).join('')}
    </tbody></table></div>`;

  P.mantenimiento = () => {
    const act = D.activos.filter((a) => a.score != null)
      .sort((a, b) => (a.score - (a.score_prev ?? a.score)) - (b.score - (b.score_prev ?? b.score)));
    return `
      <div class="cab"><div><h1>Mantenimiento</h1>
        <div class="sub">salud de los activos · ordenados por caída, no por nivel</div></div></div>
      <div class="caja"><h3>Por qué se ordena por caída</h3>
        <p>Un activo con 74 puntos que hace treinta días tenía 82 es una llamada esta semana.
        Uno con 49 estable es un hecho conocido, y probablemente ya presupuestado.
        La señal es la derivada, no el nivel.</p></div>
      <div class="tw"><table><thead><tr><th>Activo</th><th class="n">Salud</th>
        <th class="n">30 d</th><th class="n">Fiabilidad</th><th class="n">Comportamiento</th>
        <th>Por qué</th></tr></thead><tbody>
        ${act.map((a) => {
          const d = a.score_prev != null ? a.score - a.score_prev : null;
          const e = a.entradas || {};
          const motivo = e.deriva_consumo_pct > 5
            ? `consumo +${nf(e.deriva_consumo_pct, 1)}%${e.alarmas_30d > 0 ? ` · ${e.alarmas_30d} alarmas` : ''}`
            : (e.averias_30d > 0 ? `${e.averias_30d} averías en 30 d` : '—');
          return `<tr><td><a href="#/activo/${a.id}" style="color:var(--texto)">${esc(a.nombre)}</a>
            <span class="m" style="font-size:.62rem;color:var(--texto-3)"> ${esc(a.codigo)}</span></td>
            <td class="n" style="color:var(--dato);font-weight:700">${a.score}</td>
            <td class="n" style="color:${d < 0 ? 'var(--critica)' : d > 0 ? 'var(--bien)' : 'var(--texto-3)'}">
              ${d == null ? '—' : (d > 0 ? '+' : '') + d}</td>
            <td class="n">${a.c_fiabilidad}</td><td class="n">${a.c_comportamiento}</td>
            <td class="m" style="font-size:.7rem;color:var(--texto-2)">${esc(motivo)}</td></tr>`;
        }).join('')}
      </tbody></table></div>`;
  };

  P.activo = (id) => {
    const a = D.activos.find((x) => x.id === id);
    if (!a) return `<div class="vacio-est">Ese activo no existe.</div>`;
    if (a.score == null) return `
      <div class="cab"><div><h1>${esc(a.nombre)}</h1><div class="sub">${esc(a.codigo)}</div></div></div>
      <div class="vacio-est">Este nodo es una agrupación (${esc(a.tipo)}), no un activo con salud propia.</div>`;
    const p = a.pesos || {}, e = a.entradas || {};
    const comp = [
      ['Fiabilidad', a.c_fiabilidad, p.fiabilidad, `${e.averias_30d} averías no planificadas en 30 d (media previa ${nf(e.averias_media_30d_previa, 1)})`],
      ['Comportamiento', a.c_comportamiento, p.comportamiento,
        e.deriva_consumo_pct != null ? `consumo ${e.deriva_consumo_pct > 0 ? '+' : ''}${nf(e.deriva_consumo_pct, 1)}% · ${e.alarmas_30d} alarmas`
                                     : 'sin serie de consumo: se parte de 85'],
      ['Mantenimiento', a.c_mantenimiento, p.mantenimiento, 'sin plan preventivo cargado'],
      ['Criticidad', a.c_criticidad, p.criticidad, `criticidad ${a.criticidad}/5 declarada`],
    ];
    const d = a.score_prev != null ? a.score - a.score_prev : null;
    return `
      <div class="cab"><div>
        <div class="sub"><a href="#/mantenimiento" style="color:var(--media)">← Mantenimiento</a></div>
        <h1>${esc(a.nombre)}</h1>
        <div class="sub">${esc(a.codigo)}${a.fabricante ? ' · ' + esc(a.fabricante) : ''}${a.modelo ? ' ' + esc(a.modelo) : ''}
          · coste de parada ${eur(a.coste_parada_hora)}/h</div></div></div>

      <div class="caja">
        <div style="display:flex;gap:26px;align-items:baseline;flex-wrap:wrap;margin-bottom:14px">
          <div><div class="score">${a.score}<small>/100</small></div></div>
          <div class="m" style="font-size:.75rem;color:${d < 0 ? 'var(--critica)' : 'var(--texto-2)'}">
            ${d == null ? 'sin histórico' : `${d > 0 ? '▲ +' : '▼ '}${d} puntos en 30 días`}</div>
        </div>
        <div class="salud">
          ${comp.map(([n, v, w, por]) => `
            <span class="lab">${esc(n)} <span style="color:var(--texto-3)">×${w ?? '—'}</span></span>
            <span class="bar"><i style="width:${v}%"></i></span>
            <span class="val">${v}</span>
            <span></span><span class="m" style="font-size:.65rem;color:var(--texto-3);grid-column:2/4">${esc(por)}</span>
          `).join('')}
        </div>
        <div class="cuenta" style="margin-top:14px">SALUD = ${comp.map(([n, v, w]) =>
          `<b>${v}</b>×${w}`).join(' + ')} = <i>${a.score}</i></div>
        <p style="margin-top:10px;font-size:.82rem;color:var(--texto-2)">
          Nunca se muestra una puntuación sin poder abrir su fórmula con los valores de este
          activo. Los pesos son configurables por cliente y viajan guardados con la fila,
          para que un score antiguo siga siendo legible.</p>
      </div>
      ${a.codigo === 'COMP-02' ? `<div class="viz" id="viz-activo"></div>` : ''}`;
  };

  P.energia = () => {
    const nodos = [...new Set(D.energiaDia.map((e) => e.codigo))];
    const resumen = nodos.map((c) => {
      const f = D.energiaDia.filter((e) => e.codigo === c);
      const kwh = f.reduce((a, x) => a + (+x.kwh || 0), 0);
      return { codigo: c, kwh, eur: kwh * D.planta.precio_kwh,
               fuera: f.some((x) => x.fuera_horario) };
    }).sort((a, b) => b.kwh - a.kwh);
    return `
      <div class="cab"><div><h1>Energía</h1>
        <div class="sub">45 días · precio de contrato ${nf(D.planta.precio_kwh, 5)} €/kWh</div></div></div>
      <div class="caja"><h3>La métrica que manda</h3>
        <p>El consumo absoluto sube y baja con la producción y no dice nada.
        El <strong>consumo por unidad producida</strong> es comparable entre turnos, entre meses
        y contra uno mismo, y es el que detecta la máquina que se está degradando.</p></div>
      <div class="viz" id="viz-energia"></div>
      ${barras(resumen.map((r) => ({
        etiqueta: r.codigo, valor: r.kwh, texto: nf(r.kwh, 0) + ' kWh',
        nota: (r.fuera ? 'consume con la planta parada · ' : '') + eur(r.eur),
        destacar: r.fuera,
      })), { col: 'Nodo', unidad: 'kWh · 45 días' })}`;
  };

  P.calidad = () => `
    <div class="cab"><div><h1>Calidad</h1>
      <div class="sub">rechazos por lote y proveedor · 45 días</div></div></div>
    <div class="caja"><h3>Correlación, nunca causa</h3>
      <p>El sistema aporta la evidencia y su fuerza estadística. Quien decide que es causa es
      el responsable de calidad. Confundir las dos cosas destruye la confianza en cuanto haya
      una coincidencia falsa, y la habrá.</p></div>
    <div class="tw"><table><thead><tr><th>Producto</th><th>Proveedor</th><th>Lote</th>
      <th class="n">Unidades</th><th class="n">Incidencias</th><th class="n">Coste</th></tr></thead>
      <tbody>${D.calidad.map((c) => `<tr>
        <td>${esc(c.producto)}</td><td>${esc(c.proveedor ?? '—')}</td>
        <td class="m">${esc(c.lote ?? '—')}</td>
        <td class="n">${nf(c.uds, 0)}</td><td class="n">${c.n}</td>
        <td class="n">${eur(c.eur)}</td></tr>`).join('')}
      </tbody></table></div>`;

  // --- copilot: preguntas resueltas SOBRE EL DATO REAL de esta instantanea --
  const COPILOT = [
    { q: '¿Por qué ha bajado el OEE esta semana?', f: () => {
        const a = D.alertas.find((x) => x.severidad === 'critica');
        return a ? `El ${pct(D.indicadores.oee, 0)} de OEE de los últimos 7 días viene sobre todo de la
          <strong>Estación P4</strong>: ${esc(a.por_que || a.que_cambio)}
          El impacto estimado es de <strong>${eur(a.impacto_eur_anual)} al año</strong>.`
          : 'No hay caída significativa esta semana.'; },
      fuentes: 'métricas de turno 2–8 sep · eventos de L3.P4 · alerta crítica' },
    { q: '¿Qué máquina debería revisar mantenimiento?', f: () => {
        const c = D.activos.filter((a) => a.score != null && a.score_prev != null)
          .sort((a, b) => (a.score - a.score_prev) - (b.score - b.score_prev))[0];
        return `<strong>${esc(c.nombre)}</strong> (${esc(c.codigo)}): ha bajado de
          ${c.score_prev} a ${c.score} en treinta días. Su consumo específico sube un
          ${nf(c.entradas?.deriva_consumo_pct, 1)}% y acumula ${c.entradas?.alarmas_30d} alarmas
          este mes. No ha dado ninguna avería todavía, y por eso no aparecería en un GMAO.`; },
      fuentes: 'asset_score 9 sep y 10 ago · energy_reading · eventos de alarma' },
    { q: '¿Qué proveedor genera más incidencias?', f: () => {
        const a = D.alertas.find((x) => x.modulo === 'quality');
        return a ? `${esc(a.que_cambio)} ${esc(a.por_que)}
          El coste ya incurrido asciende a <strong>${eur(a.impacto_base.coste_incurrido_eur)}</strong>.`
          : 'No hay correlación con fuerza suficiente.'; },
      fuentes: 'incidencias de calidad · albaranes · lotes de entrega' },
    { q: '¿Cuánto podría ahorrar apagando lo que no hace falta?', f: () => {
        const e = D.alertas.filter((x) => x.modulo === 'energy');
        const t = e.reduce((a, x) => a + (x.impacto_eur_anual || 0), 0);
        return `${e.length} equipos siguen consumiendo con la planta parada. En conjunto,
          <strong>${eur(t)} al año</strong>. El mayor es ${esc(e[0].nodo_nombre)}, con
          ${eur(e[0].impacto_eur_anual)}. La acción es un temporizador, no una inversión.`; },
      fuentes: 'potencia por nodo fuera de instancias de turno · precio de contrato' },
    { q: '¿Cuántas paradas no tienen causa registrada?', f: () =>
        `El <strong>${nf(D.indicadores.pct_sin_causa, 1)}%</strong>. Podemos medir cuánto se pierde,
         pero no diagnosticar por qué. Bajarlo del 80% al 30% es, por sí solo, un resultado
         del piloto: sin causa no hay diagnóstico posible, ni con IA ni sin ella.`,
      fuentes: 'v_cobertura_causas · eventos de parada de 30 días' },
    { q: '¿Cuánto margen se pierde por scrap?', f: () => {
        const t = D.calidad.reduce((a, c) => a + (+c.eur || 0), 0);
        return `<strong>${eur(t)}</strong> en 45 días, sobre ${D.calidad.length} combinaciones de
          producto y lote. La mitad se concentra en un solo lote.`; },
      fuentes: 'quality_incident · margen unitario de la ficha de producto' },
  ];

  P.copilot = () => `
    <div class="cab"><div><h1>Pregunta a tu fábrica</h1>
      <div class="sub">consulta el dato real · no estima · cita siempre la fuente</div></div></div>
    <div class="chat">
      <div class="sugerencias">${COPILOT.map((c, i) =>
        `<button type="button" onclick="window.__resp(${i})">${esc(c.q)}</button>`).join('')}</div>
      <div id="respuesta"></div>
      <div class="caja"><h3>Qué pasa cuando no sabe</h3>
        <p>Si la pregunta no encaja en ninguna consulta del catálogo, responde
        «no sé contestar a eso todavía» y lo registra. Ese registro es el backlog del Copilot,
        escrito por los propios usuarios. Nunca rellena el hueco con algo verosímil.</p>
        <p style="color:var(--texto-2);font-size:.84rem">El modelo tampoco escribe SQL: elige
        una plantilla parametrizada y se ejecuta con los permisos de quien pregunta. La IA no
        es una puerta trasera a los permisos.</p></div>
    </div>`;

  window.__resp = (i) => {
    const c = COPILOT[i];
    document.getElementById('respuesta').innerHTML = `
      <div class="pregunta"><div class="q">Tú</div>${esc(c.q)}</div>
      <div class="caja"><h3>Radactory</h3><p>${c.f()}</p>
        <div class="fuentes">FUENTES · <em>${esc(c.fuentes)}</em></div></div>`;
  };

  // -------------------------------------------------------------------------
  // GRAFICAS DE CADA PANTALLA
  // -------------------------------------------------------------------------
  function serieDias(filas, campo, codigos) {
    const dias = [...new Set(filas.map((f) => String(f.fecha).slice(0, 10)))].sort();
    return {
      dias,
      series: codigos.map((c, i) => ({
        nombre: c,
        color: `var(--s${i + 1})`,
        // Un dia sin fila queda como null y la linea SE PARTE. No se interpola.
        puntos: dias.map((d) => {
          const f = filas.find((x) => x.codigo === c && String(x.fecha).slice(0, 10) === d);
          return { x: fecha(d), y: f ? +f[campo] : null };
        }),
      })),
    };
  }

  function pintarGraficas(ruta, id) {
    const cont = (s) => document.getElementById(s);

    if (ruta === 'produccion' && cont('viz-oee')) {
      const codigos = [...new Set(D.oeeLinea.map((o) => o.codigo))].sort();
      const { series } = serieDias(D.oeeLinea, 'oee', codigos);
      cont('viz-oee').innerHTML = `<div class="titulo">OEE diario por línea</div>
        <div class="nota">45 días · los domingos no hay producción y la línea se corta:
        un hueco se dibuja como hueco</div><div class="lienzo"></div>`;
      pintarLineas(cont('viz-oee').querySelector('.lienzo'), {
        series, titulo: 'OEE diario por línea', desdeCero: false,
        fmtY: (v) => nf(v * 100, 0) + '%', fmtTip: (v) => nf(v * 100, 1) + '%',
        alt: 'OEE diario de las tres líneas durante 45 días. La línea 3 cae en la última semana.',
      });
    }

    if (cont('viz-alerta') || cont('viz-activo')) {
      const a = D.alertas.find((x) => x.id === id);
      const esP4 = a && a.nodo_codigo === 'L3.P4';
      const el = cont('viz-alerta') || cont('viz-activo');

      if (esP4) {
        // Media diaria de rendimiento de P4 con su linea base y la marca del
        // cambio de formato: es el grafico que cuenta la alerta entera.
        const dias = [...new Set(D.rendP4.map((r) => String(r.bucket).slice(0, 10)))].sort();
        const puntos = dias.map((d) => {
          const f = D.rendP4.filter((r) => String(r.bucket).slice(0, 10) === d);
          return { x: fecha(d), y: f.length ? f.reduce((s, r) => s + +r.rend, 0) / f.length : null };
        });
        const base = D.baseP4.filter((b) => b.producto === '(genérica)');
        const media = base.length ? base.reduce((s, b) => s + +b.media, 0) / base.length : null;
        const iCambio = dias.findIndex((d) =>
          D.rendP4.some((r) => String(r.bucket).slice(0, 10) === d && r.producto === 'REF-2210'));

        el.innerHTML = `<div class="titulo">Rendimiento de la Estación P4</div>
          <div class="nota">media diaria de los tres turnos · 30 días</div><div class="lienzo"></div>`;
        pintarLineas(el.querySelector('.lienzo'), {
          series: [{ nombre: 'L3.P4', color: 'var(--critica)', puntos }],
          base: media, marca: iCambio > 0 ? { i: iCambio, texto: 'cambio a REF-2210' } : null,
          fmtY: (v) => nf(v * 100, 0) + '%', fmtTip: (v) => nf(v * 100, 1) + '%',
          alt: 'El rendimiento de P4 se mantiene en torno a la línea base hasta el cambio de formato y luego cae.',
        });
      } else {
        const { series } = serieDias(D.energiaDia, 'kwh', ['COMP-01', 'COMP-02']);
        el.innerHTML = `<div class="titulo">Consumo diario · COMP-01 frente a COMP-02</div>
          <div class="nota">dos equipos equivalentes: uno para fuera de horario y el otro no</div>
          <div class="lienzo"></div>`;
        pintarLineas(el.querySelector('.lienzo'), {
          series, desdeCero: true, fmtY: (v) => nf(v, 0), fmtTip: (v) => nf(v, 1) + ' kWh',
          alt: 'El consumo diario de COMP-02 crece y se mantiene alto los fines de semana; COMP-01 baja.',
        });
      }
    }

    if (ruta === 'energia' && cont('viz-energia')) {
      const { series } = serieDias(D.energiaDia, 'kwh', ['L3', 'COMP-02', 'CHILLER']);
      cont('viz-energia').innerHTML = `<div class="titulo">Consumo diario por nodo</div>
        <div class="nota">45 días · los valles son los domingos con la planta parada</div>
        <div class="lienzo"></div>`;
      pintarLineas(cont('viz-energia').querySelector('.lienzo'), {
        series, desdeCero: true, fmtY: (v) => nf(v, 0), fmtTip: (v) => nf(v, 1) + ' kWh',
        alt: 'Consumo diario de la línea 3, el compresor 02 y la enfriadora durante 45 días.',
      });
    }
  }

  // -------------------------------------------------------------------------
  // MENU Y ENRUTADO
  // -------------------------------------------------------------------------
  const MENU = [
    { grupo: 'Hoy' },
    { r: 'estado', t: 'Estado de planta' },
    { r: 'alertas', t: 'Alertas', n: () => D.alertas.filter((a) => a.severidad === 'critica').length },
    { r: 'copilot', t: 'Pregunta a tu fábrica' },
    { grupo: 'Radares' },
    { r: 'produccion', t: 'Producción' },
    { r: 'mantenimiento', t: 'Mantenimiento' },
    { r: 'energia', t: 'Energía' },
    { r: 'calidad', t: 'Calidad' },
  ];

  function pintarMenu(activa) {
    menuEl.innerHTML = MENU.map((m) => {
      if (m.grupo) return `<div class="sep">${esc(m.grupo)}</div>`;
      const n = m.n ? m.n() : 0;
      return `<a href="#/${m.r}" class="${activa === m.r ? 'on' : ''}">${esc(m.t)}
        ${n ? `<span class="n">${n}</span>` : ''}</a>`;
    }).join('');
  }

  function ir() {
    const h = (location.hash || '#/estado').slice(2).split('/');
    const ruta = h[0] || 'estado';
    const id = h[1] ? decodeURIComponent(h[1]) : null;

    const fn = P[ruta];
    vista.innerHTML = fn ? fn(id) : `<div class="vacio-est">Esa pantalla no existe todavía.</div>`;
    // 'alerta' y 'activo' son fichas: en el menu se marca su seccion padre.
    pintarMenu(ruta === 'alerta' ? 'alertas' : ruta === 'activo' ? 'mantenimiento' : ruta);
    pintarGraficas(ruta, id);
    window.scrollTo(0, 0);
  }

  document.getElementById('planta-nom').textContent = D.planta.nombre.replace('Planta de ', '');
  document.getElementById('tema').addEventListener('click', () => {
    const claro = document.documentElement.getAttribute('data-tema') === 'claro';
    document.documentElement.setAttribute('data-tema', claro ? 'oscuro' : 'claro');
    ir();   // las graficas leen los colores del tema al dibujarse
  });

  window.addEventListener('hashchange', ir);
  ir();
})();
</script>
