<title>Explorador de Ractory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:opsz,wght@6..72,200;6..72,300;6..72,400;6..72,500&display=swap">

<style>
/* Mismo sistema visual que el dossier: papel de ingenieria en claro,
   instrumento en oscuro. Esto no es un documento, es una herramienta: se
   escanea y se opera, asi que la jerarquia la lleva la informacion, no la
   tipografia. */
:root {
  --paper:#FFFFFF; --paper-2:#E8E8E8; --card:#FAFAFA;
  --ink:#141414; --ink-2:#525252; --ink-3:#666666;
  --rule:#E5E5E5; --rule-2:#D4D4D4;
  --signal:#A80B47; --signal-soft:#FDF1F5;
  --teal:#1D6CA8; --teal-soft:#EAF2F8;
  --ok:#17714A; --ok-soft:#E2EFE8;
  --warn:#A9660A;
  --code-bg:#F5F5F5;
  --f-disp:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-titular:"Newsreader",Georgia,"Times New Roman",serif;
    --f-body:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --rail:282px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:#0F1417; --paper-2:#0A0E10; --card:#151C20;
    --ink:#E6EDEB; --ink-2:#9AA9AF; --ink-3:#71828A;
    --rule:#25323A; --rule-2:#33434B;
    --signal:#F0A050; --signal-soft:#2A1D10;
    --teal:#4FBDB2; --teal-soft:#0D2523;
    --ok:#4FBE86; --ok-soft:#10241B;
    --warn:#E0A03C;
    --code-bg:#111719;
  }
}
:root[data-theme="dark"] {
  --paper:#0F1417; --paper-2:#0A0E10; --card:#151C20;
  --ink:#E6EDEB; --ink-2:#9AA9AF; --ink-3:#71828A;
  --rule:#25323A; --rule-2:#33434B;
  --signal:#F0A050; --signal-soft:#2A1D10;
  --teal:#4FBDB2; --teal-soft:#0D2523;
  --ok:#4FBE86; --ok-soft:#10241B;
  --warn:#E0A03C;
  --code-bg:#111719;
}

* { box-sizing:border-box; }
body { background:var(--paper); color:var(--ink); font-family:var(--f-disp);
       font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased; }
:focus-visible { outline:2px solid var(--signal); outline-offset:2px; }

.app { display:grid; grid-template-columns:var(--rail) minmax(0,1fr); height:100vh; }

/* ---- rail ---------------------------------------------------------------- */
.rail { border-right:1px solid var(--rule); display:flex; flex-direction:column;
        min-height:0; background:var(--paper-2); }
.marca { padding:16px 18px 12px; border-bottom:1px solid var(--rule); }
.marca .fila-marca { display:flex; align-items:center; gap:9px; }
.marca .logo { width:22px; height:22px; flex:0 0 auto; border-radius:8px; }
.marca { --mark-cut:var(--paper-2); }
.marca b { font-size:1.02rem; font-weight:600; letter-spacing:-.03em;
           text-transform:lowercase; color:var(--ink); }
.marca span { font-family:var(--f-mono); font-size:.62rem; color:var(--ink-3);
              letter-spacing:.06em; display:block; margin-top:4px; }
.buscar { padding:10px 14px; border-bottom:1px solid var(--rule); }
.buscar input { width:100%; font-family:var(--f-mono); font-size:.72rem;
  padding:6px 9px; border:1px solid var(--rule-2); border-radius:8px;
  background:var(--card); color:var(--ink); }
.buscar input::placeholder { color:var(--ink-3); }
.arbol { overflow-y:auto; flex:1; padding:8px 0 24px; min-height:0; }
.grupo { font-family:var(--f-mono); font-size:.6rem; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); padding:14px 18px 5px;
  display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
.grupo em { font-style:normal; color:var(--rule-2); }
.fila { display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center;
  width:100%; text-align:left; background:none; border:0; cursor:pointer;
  font-family:var(--f-mono); font-size:.72rem; color:var(--ink-2);
  padding:4px 16px 4px 26px; border-left:2px solid transparent; }
.fila:hover { color:var(--ink); background:var(--card); }
.fila[aria-current="true"] { color:var(--ink); border-left-color:var(--signal);
  background:var(--card); font-weight:600; }
.fila .n { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.fila .b { font-size:.58rem; letter-spacing:.06em; padding:1px 5px; border-radius:8px;
  white-space:nowrap; border:1px solid currentColor; }
.b--ok { color:var(--ok); }
.b--teal { color:var(--teal); }
.b--warn { color:var(--warn); }

/* ---- visor --------------------------------------------------------------- */
.visor { overflow-y:auto; min-width:0; }
.cab { position:sticky; top:0; z-index:5; background:var(--paper);
  border-bottom:1px solid var(--rule); padding:14px clamp(18px,3vw,38px) 12px; }
.cab .ruta { font-family:var(--f-mono); font-size:.78rem; font-weight:600; }
.cab .ruta em { font-style:normal; color:var(--ink-3); font-weight:400; }
.cab .para { font-size:.84rem; color:var(--ink-2); margin-top:5px; max-width:80ch; }
.cab .meta { font-family:var(--f-mono); font-size:.62rem; color:var(--ink-3);
  letter-spacing:.06em; margin-top:6px; display:flex; gap:14px; flex-wrap:wrap; }
.cuerpo { padding:22px clamp(18px,3vw,38px) 90px; }

/* prosa de los .md */
.md { font-family:var(--f-body); font-size:16.5px; line-height:1.62; max-width:70ch; }
.md h1 { font-family:var(--f-titular); font-size:2.1rem; font-weight:300; letter-spacing:-.02em;
  margin:0 0 16px; text-wrap:balance; }
.md h2 { font-family:var(--f-titular); font-size:1.5rem; font-weight:300; letter-spacing:-.015em;
  margin:34px 0 10px; text-wrap:balance; }
.md h3 { font-family:var(--f-disp); font-size:1rem; font-weight:700; margin:26px 0 6px; }
.md p { margin:0 0 14px; }
.md ul, .md ol { margin:0 0 14px; padding-left:22px; }
.md li { margin-bottom:6px; }
.md strong { font-weight:600; }
.md a { color:var(--signal); }
.md hr { border:0; border-top:1px solid var(--rule); margin:30px 0; }
.md blockquote { border-left:3px solid var(--signal); background:var(--signal-soft);
  margin:20px 0; padding:12px 16px; }
.md blockquote p:last-child { margin:0; }
.md code { font-family:var(--f-mono); font-size:.85em; background:var(--code-bg);
  border:1px solid var(--rule); border-radius:8px; padding:.05em .32em; }
.md pre { background:var(--code-bg); border:1px solid var(--rule);
  border-left:3px solid var(--teal); border-radius:8px; padding:14px 16px;
  overflow-x:auto; margin:18px 0; max-width:none; }
.md pre code { background:none; border:0; padding:0; font-size:.78rem; line-height:1.6;
  color:var(--ink-2); }
.md table { border-collapse:collapse; width:100%; font-family:var(--f-disp);
  font-size:.82rem; }
.md .tw { overflow-x:auto; border:1px solid var(--rule); border-radius:8px; margin:18px 0;
  max-width:none; }
.md th, .md td { text-align:left; padding:8px 12px; border-bottom:1px solid var(--rule);
  vertical-align:top; }
.md thead th { font-family:var(--f-mono); font-size:.6rem; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3); background:var(--paper-2); white-space:nowrap; }
.md tbody tr:last-child td { border-bottom:0; }

/* codigo con numeros de linea */
.codigo { display:grid; grid-template-columns:auto minmax(0,1fr); font-family:var(--f-mono);
  font-size:12.5px; line-height:1.62; border:1px solid var(--rule); border-radius:8px;
  background:var(--code-bg); overflow-x:auto; }
.codigo .ln { text-align:right; padding:14px 10px 14px 14px; color:var(--ink-3);
  border-right:1px solid var(--rule); user-select:none; font-variant-numeric:tabular-nums;
  white-space:pre; background:var(--paper-2); }
.codigo pre { margin:0; padding:14px 16px; white-space:pre; }
.codigo code { font-family:inherit; }

/* Tema propio para highlight.js: su hoja de estilos no se puede cargar desde
   CDN (la CSP solo admite scripts), asi que los colores van aqui. */
.hljs-comment { color:var(--ink-3); font-style:italic; }
.hljs-keyword, .hljs-built_in { color:var(--signal); }
.hljs-string, .hljs-number { color:var(--teal); }
.hljs-title, .hljs-title\.function_, .hljs-attr, .hljs-attribute { color:var(--ink); font-weight:600; }
.hljs-type, .hljs-literal { color:var(--warn); }

/* resumen */
.resumen { max-width:78ch; }
.tarjetas { display:grid; grid-template-columns:repeat(auto-fit,minmax(158px,1fr));
  gap:1px; background:var(--rule); border:1px solid var(--rule); margin:20px 0; }
.tj { background:var(--card); padding:14px 16px; }
.tj .k { font-family:var(--f-mono); font-size:.58rem; letter-spacing:.11em;
  text-transform:uppercase; color:var(--ink-3); margin-bottom:6px; }
.tj .v { font-size:1.5rem; font-weight:800; letter-spacing:-.03em;
  font-variant-numeric:tabular-nums; line-height:1; }
.tj .d { font-family:var(--f-mono); font-size:.63rem; color:var(--ink-2); margin-top:5px; }
.tj .v.ok { color:var(--ok); }

.aviso { border-left:3px solid var(--signal); background:var(--signal-soft);
  padding:13px 16px; margin:20px 0; font-size:.88rem; max-width:76ch; }
.aviso b { display:block; font-family:var(--f-mono); font-size:.6rem; letter-spacing:.13em;
  text-transform:uppercase; color:var(--signal); margin-bottom:5px; }

@media (max-width:820px) {
  .app { grid-template-columns:1fr; height:auto; }
  .rail { border-right:0; border-bottom:1px solid var(--rule); max-height:44vh; }
  .visor { overflow:visible; }
  .cab { position:static; }
}
</style>

<div class="app">
  <aside class="rail">
    <div class="marca">
      <div class="fila-marca"><svg class="logo" viewBox="0 0 100 100" role="img" aria-label="RACTORY"><rect width="100" height="100" fill="currentColor"/><path fill="var(--mark-cut,#FFFFFF)" d="M9 21 H85 V37 H24 V68 H9 Z"/><path fill="var(--mark-cut,#FFFFFF)" d="M35 48 H68 L97 77 H76 L55 64 H35 Z"/></svg><b>ractory</b></div>
      <span id="sello">fases A y B · 9 sep 2026</span>
    </div>
    <div class="buscar">
      <input id="q" type="search" placeholder="filtrar ficheros…" aria-label="Filtrar ficheros">
    </div>
    <nav class="arbol" id="arbol" aria-label="Ficheros del proyecto"></nav>
  </aside>

  <main class="visor" id="visor">
    <div class="cab">
      <div class="ruta" id="ruta"></div>
      <div class="para" id="para"></div>
      <div class="meta" id="meta"></div>
    </div>
    <div class="cuerpo" id="cuerpo"></div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/14.1.3/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/highlight.min.js"></script>
<script>/*__DATOS__*/</script>
<script>
(function () {
  "use strict";
  var A = window.__FR__;
  var arbol = document.getElementById('arbol');
  var visor = document.getElementById('visor');
  var actual = null;

  document.getElementById('sello').textContent = A.sello;

  // --- arbol ---------------------------------------------------------------
  function pintarArbol(filtro) {
    arbol.textContent = '';
    var f = (filtro || '').toLowerCase();

    A.grupos.forEach(function (g) {
      var hijos = g.ficheros.filter(function (r) {
        return !f || r.toLowerCase().indexOf(f) > -1;
      });
      if (hijos.length === 0) return;

      var h = document.createElement('div');
      h.className = 'grupo';
      h.innerHTML = '<span></span><em></em>';
      h.firstChild.textContent = g.nombre;
      h.lastChild.textContent = hijos.length;
      arbol.appendChild(h);

      hijos.forEach(function (ruta) {
        var d = A.ficheros[ruta];
        var b = document.createElement('button');
        b.className = 'fila';
        b.type = 'button';
        b.dataset.ruta = ruta;
        b.setAttribute('aria-current', ruta === actual ? 'true' : 'false');

        var n = document.createElement('span');
        n.className = 'n';
        n.textContent = ruta === '@resumen' ? 'Resumen' : ruta.split('/').pop();
        b.appendChild(n);

        if (d.chip) {
          var c = document.createElement('span');
          c.className = 'b b--' + (d.chipTono || 'teal');
          c.textContent = d.chip;
          b.appendChild(c);
        }
        b.addEventListener('click', function () { abrir(ruta); });
        arbol.appendChild(b);
      });
    });
  }

  // --- visor ---------------------------------------------------------------
  function abrir(ruta) {
    var d = A.ficheros[ruta];
    if (!d) return;
    actual = ruta;

    document.getElementById('ruta').innerHTML = '';
    var partes = ruta === '@resumen' ? ['Resumen del proyecto'] : ruta.split('/');
    partes.forEach(function (p, i) {
      var s = document.createElement(i === partes.length - 1 ? 'span' : 'em');
      s.textContent = p + (i === partes.length - 1 ? '' : '/');
      document.getElementById('ruta').appendChild(s);
    });

    document.getElementById('para').textContent = d.para || '';

    var meta = [];
    if (d.bytes) meta.push(d.bytes.toLocaleString('es-ES') + ' bytes');
    if (d.lineas) meta.push(d.lineas + ' líneas');
    if (d.estado) meta.push(d.estado);
    document.getElementById('meta').textContent = meta.join('   ·   ');

    var cuerpo = document.getElementById('cuerpo');
    cuerpo.textContent = '';

    if (ruta === '@resumen') {
      cuerpo.innerHTML = A.resumen;
    } else if (/\.mde?$/.test(ruta) || ruta.endsWith('.md')) {
      var div = document.createElement('div');
      div.className = 'md';
      div.innerHTML = marked.parse(d.texto);
      // Las tablas anchas tienen que hacer scroll dentro de su caja; si no, el
      // cuerpo entero se desplaza en horizontal y se pierde la columna izquierda.
      div.querySelectorAll('table').forEach(function (t) {
        var w = document.createElement('div');
        w.className = 'tw';
        t.parentNode.insertBefore(w, t);
        w.appendChild(t);
      });
      cuerpo.appendChild(div);
    } else {
      cuerpo.appendChild(bloqueCodigo(d.texto, d.lenguaje));
    }

    visor.scrollTop = 0;
    pintarArbol(document.getElementById('q').value);
    try { history.replaceState(null, '', '#' + encodeURIComponent(ruta)); } catch (e) {}
  }

  function bloqueCodigo(texto, lenguaje) {
    var wrap = document.createElement('div');
    wrap.className = 'codigo';

    var lineas = texto.replace(/\n$/, '').split('\n');
    var ln = document.createElement('div');
    ln.className = 'ln';
    ln.textContent = lineas.map(function (_, i) { return i + 1; }).join('\n');
    wrap.appendChild(ln);

    var pre = document.createElement('pre');
    var code = document.createElement('code');
    // textContent primero: el resaltado se aplica DESPUES, sobre texto ya
    // escapado. Meter el fichero con innerHTML seria inyectar el repositorio
    // entero en el DOM.
    code.textContent = texto;
    pre.appendChild(code);
    wrap.appendChild(pre);

    try {
      if (window.hljs && lenguaje) {
        var r = hljs.highlight(texto, { language: lenguaje, ignoreIllegals: true });
        code.innerHTML = r.value;
      }
    } catch (e) { /* sin resaltado se lee igual */ }
    return wrap;
  }

  // --- arranque ------------------------------------------------------------
  document.getElementById('q').addEventListener('input', function (e) {
    pintarArbol(e.target.value);
  });

  var inicial = '@resumen';
  try {
    var h = decodeURIComponent(location.hash.slice(1));
    if (h && A.ficheros[h]) inicial = h;
  } catch (e) {}

  pintarArbol('');
  abrir(inicial);
})();
</script>
